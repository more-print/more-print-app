function css(str){
  const o = {};
  String(str).split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if (i < 0) return;
    const prop = decl.slice(0, i).trim();
    if (!prop) return;
    o[prop.startsWith('--') ? prop : prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = decl.slice(i + 1).trim();
  });
  return o;
}
const fmtTime = (d) => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
const fmtWhen = (iso) => {
  const d = new Date(iso), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return (sameDay ? 'วันนี้ ' : d.getDate() + '/' + (d.getMonth()+1) + ' ') + fmtTime(d);
};

const ZONES = [
  { name: 'กังสดาล', lat: 16.4585, lng: 102.8150, bg: '#f3e8ff', fg: '#7c3aed' },
  { name: 'โคลัมโบ', lat: 16.4796, lng: 102.8039, bg: '#e0f2fe', fg: '#0369a1' },
  { name: 'หลังมอ', lat: 16.4883, lng: 102.8145, bg: '#dcfce7', fg: '#15803d' },
];
const ZONE_IN_CAMPUS = { name: 'ในมอ', bg: '#fef9c3', fg: '#a16207' };
const ZONE_OUT = { name: 'นอกเขต', bg: '#f1f5f9', fg: '#64748b' };
function zoneOf(lat, lng){
  if (lat == null || lng == null) return null;
  // ขอบเขตรั้ว มข. โดยประมาณ
  if (lat >= 16.4645 && lat <= 16.4825 && lng >= 102.8145 && lng <= 102.8390) return ZONE_IN_CAMPUS;
  let best = null, bd = Infinity;
  for (const z of ZONES) {
    const d = Math.hypot((lat - z.lat) * 111, (lng - z.lng) * 105); // ระยะ กม. โดยประมาณ
    if (d < bd) { bd = d; best = z; }
  }
  return bd > 3.5 ? ZONE_OUT : best;
}
const ZONE_NAMES = ['ในมอ', 'กังสดาล', 'หลังมอ', 'โคลัมโบ', 'นอกเขต'];
const zoneStyleByName = (n) => n === 'ในมอ' ? ZONE_IN_CAMPUS : n === 'นอกเขต' ? ZONE_OUT : (ZONES.find(z => z.name === n) || ZONE_OUT);
const optionsLabel = (o) => [

].filter(Boolean).join(' · ');

function AdminLogin({ onOk }){
  const [email, setEmail] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [uuid, setUuid] = React.useState('');

  const verifyAdmin = async () => {
    // เช็คสิทธิ์เจ้าของ — ถ้ายังไม่มีเจ้าของในระบบ คนแรกที่ล็อกอินจะได้สิทธิ์ (ครั้งแรกครั้งเดียว)
    let r = await DB.rpc('is_admin');
    let ok = !!r.data;
    if (!ok && !r.error) { const c = await DB.rpc('claim_admin'); ok = !!c.data; }
    if (ok) { onOk(); return; }
    const { data } = await DB.auth.getUser();
    setUuid((data && data.user && data.user.id) || '');
    setMsg(r.error ? 'ระบบสิทธิ์ยังไม่พร้อม (ยังไม่ได้รัน SQL อัปเกรด)' : 'บัญชีนี้ไม่ใช่เจ้าของร้าน');
    setBusy(false);
  };

  React.useEffect(() => {
    if (!DB) { onOk(); return; }
    DB.auth.getSession().then(({ data }) => { if (data.session) { setBusy(true); verifyAdmin(); } });
  }, []);

  const submit = async () => {
    if (!DB) return onOk();
    if (!email.trim() || !pass) return setMsg('กรอกอีเมลและรหัสผ่านก่อนครับ');
    setBusy(true); setMsg('');
    const { error } = await DB.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: pass });
    if (error) {
      setBusy(false);
      return setMsg('อีเมลหรือรหัสผ่านไม่ถูกต้อง ❌');
    }
    await verifyAdmin();
  };

  return (
    <div style={css("min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px")}>
      <div style={css("background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:320px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:center")}>
        <img src="assets/logo-icon.png" alt="" style={css("width:56px;height:auto")}/>
        <div style={css("font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px;letter-spacing:1px")}><span style={css("color:var(--acc)")}>MORE</span> PRINT</div>
        <div style={css("font-size:13px;color:var(--sub)")}>🔐 หลังบ้าน — เข้าสู่ระบบเจ้าของร้าน</div>
        <input value={email} onChange={e => setEmail(e.target.value)} placeholder="อีเมลเจ้าของร้าน" inputMode="email" autoComplete="email"
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>
        <input type="password" value={pass} onChange={e => setPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} placeholder="รหัสผ่าน" autoComplete="current-password"
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>
        {msg && <div style={css("font-size:12px;color:#d9480f;text-align:center;line-height:1.5")}>{msg}</div>}
        {uuid && <div style={css("font-size:10.5px;color:var(--sub);word-break:break-all;text-align:center")}>รหัสบัญชี (สำหรับผู้ดูแลระบบ): <span style={css("font-family:'IBM Plex Mono',monospace")}>{uuid}</span></div>}
        <button onClick={submit} disabled={busy} style={css("width:100%;height:46px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:14px;font-weight:700;cursor:pointer" + (busy ? ";opacity:.6" : ""))}>{busy ? 'กำลังตรวจสอบ…' : 'เข้าสู่หลังบ้าน →'}</button>
      </div>
    </div>
  );
}

// ── กล่องแชทกับลูกค้า (ตาราง messages · ลูกค้าคุยผ่าน RPC ที่ต้องรู้รหัสออเดอร์) ──
function Chat({ o, onSeen }){
  const [msgs, setMsgs] = React.useState(null);
  const [text, setText] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [missing, setMissing] = React.useState(false);
  const [upBusy, setUpBusy] = React.useState(false);
  const boxRef = React.useRef(null);
  const camRef = React.useRef(null);
  const load = React.useCallback(async () => {
    if (!DB) { setMsgs(DEMO_MSGS); return; }
    const { data, error } = await DB.from('messages').select('*').eq('order_id', o.id).order('id');
    if (error) { setMissing(true); return; }
    setMsgs(data || []);
    // ทำเครื่องหมายว่าร้านอ่านข้อความลูกค้าแล้ว
    const unseen = (data || []).filter(m => m.sender === 'customer' && !m.seen_by_shop);
    if (unseen.length) {
      await DB.from('messages').update({ seen_by_shop: true }).eq('order_id', o.id).eq('sender', 'customer');
      if (onSeen) onSeen(o.id);
    }
  }, [o.id]);
  React.useEffect(() => { load(); const t = setInterval(load, 8000); return () => clearInterval(t); }, [load]);
  React.useEffect(() => { if (boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; }, [msgs]);
  // ส่งรูป (ใช้ถ่ายรูปหลักฐานตอนส่งของถึงมือลูกค้า แบบ Grab/LINE MAN)
  const sendPhoto = async (file) => {
    if (!file || upBusy) return;
    setUpBusy(true);
    const caption = text.trim() || '📸 รูปหลักฐานการจัดส่ง';
    if (!DB) {
      setMsgs(l => [...(l || []), { id: Date.now(), sender: 'shop', body: caption, img_url: URL.createObjectURL(file), created_at: new Date().toISOString() }]);
      setText(''); setUpBusy(false); return;
    }
    const ext = (file.name.split('.').pop() || 'jpg').replace(/[^a-zA-Z0-9]/g, '').slice(0, 5) || 'jpg';
    const path = 'chat/' + o.id.replace(/[^A-Za-z0-9-]/g, '') + '/' + Date.now() + '.' + ext;
    const up = await DB.storage.from('uploads').upload(path, file);
    if (up.error) { setUpBusy(false); return alert('อัปโหลดรูปไม่สำเร็จ: ' + up.error.message); }
    const { error } = await DB.from('messages').insert({ order_id: o.id, sender: 'shop', body: caption, img: path, seen_by_shop: true });
    setUpBusy(false);
    if (error) return alert(/img/.test(error.message) ? 'ยังไม่ได้เพิ่มคอลัมน์ img — รัน SQL เพิ่มก่อนครับ' : 'ส่งรูปไม่สำเร็จ: ' + error.message);
    setText(''); load();
  };
  const send = async () => {
    const body = text.trim();
    if (!body || busy) return;
    setBusy(true);
    if (!DB) { setMsgs(l => [...(l || []), { id: Date.now(), sender: 'shop', body, created_at: new Date().toISOString() }]); setText(''); setBusy(false); return; }
    const { error } = await DB.from('messages').insert({ order_id: o.id, sender: 'shop', body, seen_by_shop: true });
    setBusy(false);
    if (error) return alert('ส่งไม่สำเร็จ: ' + error.message);
    setText(''); load();
  };
  if (missing) return (
    <div style={css("background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:11.5px;color:var(--sub);line-height:1.6")}>
      💬 ระบบแชทยังไม่เปิด — ต้องรัน SQL สร้างตาราง messages ก่อนครับ
    </div>
  );
  return (
    <div style={css("background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px")}>
      <div style={css("font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.5px")}>💬 แชทกับลูกค้า</div>
      <div ref={boxRef} style={css("margin-top:8px;max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:7px")}>
        {msgs === null && <div style={css("font-size:12px;color:var(--sub)")}>กำลังโหลด…</div>}
        {msgs !== null && msgs.length === 0 && <div style={css("font-size:11.5px;color:var(--sub);line-height:1.6")}>ยังไม่มีข้อความ — ทักลูกค้าได้เลย เช่น แจ้งราคา งานเสร็จ หรือขอรายละเอียดเพิ่ม</div>}
        {(msgs || []).map(m => {
          const mine = m.sender === 'shop';
          return (
            <div key={m.id} style={{ display: 'flex', justifyContent: mine ? 'flex-end' : 'flex-start' }}>
              <div style={{ maxWidth: '78%', background: mine ? 'var(--acc)' : 'var(--card)', color: mine ? '#fff' : 'var(--ink)',
                border: mine ? 'none' : '1px solid var(--line)', borderRadius: '12px', padding: '7px 11px', fontSize: '12.5px', lineHeight: 1.5, whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                {(m.img || m.img_url) && (
                  <a href={m.img_url || fileUrl(m.img)} target="_blank" rel="noreferrer" style={{ display: 'block', marginBottom: '5px' }}>
                    <img src={m.img_url || fileUrl(m.img)} alt="" style={{ maxWidth: '190px', maxHeight: '230px', borderRadius: '9px', display: 'block', background: 'var(--soft)' }}/>
                  </a>
                )}
                {m.body}
                <div style={{ marginTop: '3px', fontSize: '9.5px', opacity: .7, fontFamily: "'IBM Plex Mono',monospace" }}>{fmtWhen(m.created_at)}</div>
              </div>
            </div>
          );
        })}
      </div>
      <input ref={camRef} type="file" accept="image/*" capture="environment" onChange={e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; sendPhoto(f); }} style={css("display:none")}/>
      <button onClick={() => camRef.current && camRef.current.click()} disabled={upBusy}
        style={css("margin-top:8px;width:100%;height:38px;border:1.5px solid var(--acc);border-radius:10px;background:var(--accSoft);color:var(--acc);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit" + (upBusy ? ";opacity:.6" : ""))}>
        {upBusy ? 'กำลังส่งรูป…' : '📸 ถ่ายรูป/แนบรูปหลักฐานการจัดส่ง'}
      </button>
      <div style={css("margin-top:8px;display:flex;gap:6px")}>
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} maxLength={500} placeholder="พิมพ์ข้อความถึงลูกค้า…"
          style={css("flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 12px;font-size:12.5px;outline:none;font-family:inherit")}/>
        <button onClick={send} disabled={busy || !text.trim()} style={css("flex:none;height:40px;padding:0 16px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer" + (busy || !text.trim() ? ";opacity:.5" : ""))}>ส่ง</button>
      </div>
    </div>
  );
}
const DEMO_MSGS = [
  { id: 1, sender: 'customer', body: 'พี่ครับ ขอปริ้นหน้า-หลังนะครับ', created_at: new Date(Date.now() - 9*60000).toISOString() },
  { id: 2, sender: 'shop', body: 'รับทราบครับ กำลังจัดให้เลย 🙏', created_at: new Date(Date.now() - 7*60000).toISOString() }
];

function OrderCard({ o, onAdvance, onCancel, onRemove, busy, unread, onSeen }){
  const cancelled = o.status === 0;
  const [open, setOpen] = React.useState(!cancelled && o.status < 4);
  const [cancelOpen, setCancelOpen] = React.useState(false);
  const [reason, setReason] = React.useState('');
  const [confirmDel, setConfirmDel] = React.useState(false);
  const askDelete = () => {
    if (!confirmDel) {
      setConfirmDel(true);
      setTimeout(() => setConfirmDel(false), 4000);
      return;
    }
    setConfirmDel(false);
    onRemove(o);
  };
  const canAdvance = !cancelled && o.status < 4;
  return (

          )}

                style={css("width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:8px 10px;font-size:12.5px;outline:none;resize:vertical;font-family:'IBM Plex Sans Thai',sans-serif")}></textarea>

                  style={{ flex: 1, height: '40px', border: 'none', borderRadius: '10px', background: reason.trim() ? '#c92a2a' : '#e9a1a1', color: '#fff', fontSize: '13px', fontWeight: 700, cursor: 'pointer' }}>

function AdminApp(){
  const [authed, setAuthed] = React.useState(!DB);
  const [tab, setTab] = React.useState('orders');
  const [orders, setOrders] = React.useState(DB ? [] : DEMO_ORDERS);
  const [loading, setLoading] = React.useState(!!DB);
  const [busyId, setBusyId] = React.useState(null);
  const [lastSync, setLastSync] = React.useState(null);
  const [filter, setFilter] = React.useState('all');
  const [zoneFilter, setZoneFilter] = React.useState('all');
  const [banners, setBanners] = React.useState(DB ? [] : [{ id: 1, title: 'ตัวอย่างแบนเนอร์ — เปิด 24 ชม.', subtitle: 'สั่งได้ทุกเวลา ส่งทั่ว มข.', emoji: '🌙', color: 'dark', active: true }]);
  const [bnTitle, setBnTitle] = React.useState('');
  const [bnSub, setBnSub] = React.useState('');
  const [bnEmoji, setBnEmoji] = React.useState('🎉');
  const [bnColor, setBnColor] = React.useState('green');
  const [bnFile, setBnFile] = React.useState(null);
  const [bnBusy, setBnBusy] = React.useState(false);

  const [histRows, setHistRows] = React.useState(null);
  const [unreadMap, setUnreadMap] = React.useState({}); // {order_id: จำนวนข้อความใหม่จากลูกค้า}
  const clearUnread = React.useCallback((oid) => setUnreadMap(m => { const n = { ...m }; delete n[oid]; return n; }), []);
  // นับข้อความใหม่จากลูกค้าทุก 10 วิ (เงียบ ๆ ถ้ายังไม่ได้สร้างตาราง messages)
  React.useEffect(() => {
    if (!DB || !authed) return;
    const tick = async () => {
      const { data, error } = await DB.from('messages').select('order_id').eq('sender', 'customer').eq('seen_by_shop', false).limit(500);
      if (error || !data) return;
      const m = {}; data.forEach(r => { m[r.order_id] = (m[r.order_id] || 0) + 1; });
      setUnreadMap(m);
    };
    tick(); const t = setInterval(tick, 10000); return () => clearInterval(t);
  }, [authed]);

  const [custRows, setCustRows] = React.useState(null); // ประวัติทั้งหมดสำหรับแท็บลูกค้า (รวม Pro)
  const [custSort, setCustSort] = React.useState('count');
  const [custQ, setCustQ] = React.useState('');
  const [purgeBusy, setPurgeBusy] = React.useState(false);
  const [purgeConfirm, setPurgeConfirm] = React.useState(false);
  const [purgeResult, setPurgeResult] = React.useState('');

  // โหลดประวัติทั้งหมดแบบเบา (เฉพาะคอลัมน์สถิติ) เมื่อเปิดแท็บสถิติ
  React.useEffect(() => {
    if (tab !== 'stats' || !authed) return;
    if (!DB) { setHistRows(orders); return; }
    DB.from('orders').select('created_at,total,status,customer_phone,phone,ptype')
      .order('created_at', { ascending: false }).limit(10000)
      .then(({ data }) => { if (data) setHistRows(data.filter(o => o.ptype !== 'pro')); });
  }, [tab, authed]);

  // โหลดประวัติทั้งหมดสำหรับแท็บลูกค้า — เฉพาะงาน Standard (ลูกค้างาน Pro แยกไปดูใน commission.html)
  React.useEffect(() => {
    if ((tab !== 'customers' && tab !== 'stats') || !authed || !DB) return;
    DB.from('orders').select('created_at,total,status,customer_phone,phone,customer_fname,customer_lname,ptype,paper,color')
      .order('created_at', { ascending: false }).limit(10000)
      .then(({ data }) => { if (data) setCustRows(data.filter(o => o.ptype !== 'pro')); });
  }, [tab, authed]);

  // สรุปรายเดือน + รายปี (ไม่นับออเดอร์ที่ยกเลิก)
  const history = React.useMemo(() => {
    const rows = histRows || [];
    const byMonth = {};
    rows.filter(o => o.status !== 0).forEach(o => {
      const d = new Date(o.created_at);
      const k = d.getFullYear() * 100 + d.getMonth();
      if (!byMonth[k]) byMonth[k] = { y: d.getFullYear(), m: d.getMonth(), orders: 0, revenue: 0, phones: new Set() };
      byMonth[k].orders++; byMonth[k].revenue += o.total || 0;
      byMonth[k].phones.add(o.customer_phone || o.phone || '?');
    });
    const months = Object.values(byMonth).sort((a, b) => (b.y * 100 + b.m) - (a.y * 100 + a.m));
    const thisYear = new Date().getFullYear();
    const yr = { orders: 0, revenue: 0, phones: new Set() };
    rows.filter(o => o.status !== 0 && new Date(o.created_at).getFullYear() === thisYear).forEach(o => {
      yr.orders++; yr.revenue += o.total || 0; yr.phones.add(o.customer_phone || o.phone || '?');
    });
    return { months, thisYear, yearOrders: yr.orders, yearRevenue: yr.revenue, yearCustomers: yr.phones.size };
  }, [histRows]);

  const loadBanners = React.useCallback(async () => {
    if (!DB) return;
    try {
      const { data } = await DB.from('banners').select('*').order('created_at', { ascending: false });
      if (data) setBanners(data);
    } catch (e) { console.error(e); }
  }, []);
  React.useEffect(() => { if (authed && DB) loadBanners(); }, [authed, loadBanners]);

  // ── รีวิวลูกค้า (ลบรีวิวไม่เหมาะสมได้) ──
  const [reviews, setReviews] = React.useState([]);
  const [revDelId, setRevDelId] = React.useState(null);
  const loadReviews = React.useCallback(async () => {
    if (!DB) return;
    try {
      const { data, error } = await DB.from('reviews').select('*').order('id', { ascending: false }).limit(100);
      if (!error && data) setReviews(data);
    } catch (e) { console.error(e); }
  }, []);
  React.useEffect(() => { if (authed && DB) loadReviews(); }, [authed, loadReviews]);
  const delReview = async (r) => {
    if (revDelId !== r.id) { setRevDelId(r.id); return; } // กดครั้งแรก = ขอยืนยันก่อน กันกดพลาด
    if (DB) { await DB.from('reviews').delete().eq('id', r.id); await loadReviews(); }
    setRevDelId(null);
  };

  const addBanner = async () => {
    if (!bnTitle.trim()) return;
    setBnBusy(true);
    let image_path = null;
    if (bnFile && DB) {
      const safe = bnFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      image_path = 'banners/' + Date.now() + '_' + safe;
      const { error } = await DB.storage.from('uploads').upload(image_path, bnFile);
      if (error) { console.error(error); image_path = null; }
    }
    if (DB) {
      await DB.from('banners').insert({ title: bnTitle.trim(), subtitle: bnSub.trim(), emoji: (bnEmoji || '🎉').trim(), color: bnColor, image_path });
      await loadBanners();
    } else {
      setBanners(l => [{ id: Date.now(), title: bnTitle.trim(), subtitle: bnSub.trim(), emoji: bnEmoji, color: bnColor, active: true }, ...l]);
    }
    setBnTitle(''); setBnSub(''); setBnFile(null); setBnBusy(false);
  };
  const toggleBanner = async (b) => {
    if (DB) { await DB.from('banners').update({ active: !b.active }).eq('id', b.id); await loadBanners(); }
    else setBanners(l => l.map(x => x.id === b.id ? { ...x, active: !x.active } : x));
  };
  const delBanner = async (b) => {
    if (DB) { await DB.from('banners').delete().eq('id', b.id); await loadBanners(); }
    else setBanners(l => l.filter(x => x.id !== b.id));
  };

  // ── ประกาศแจ้งปัญหา/งานล่าช้า (แบนเนอร์ชนิด alert: ลูกค้าเจอป๊อปอัพเตือนก่อนสั่ง + แถบแดงบนเว็บ) ──
  const [alOpen, setAlOpen] = React.useState(false);
  const [alMsg, setAlMsg] = React.useState('');
  const alertActive = banners.find(b => b.color === 'alert' && b.active !== false);
  const AL_PRESETS = [
    'เครื่องพิมพ์ขัดข้อง กำลังเร่งซ่อม — งานอาจล่าช้ากว่าปกติ 2-3 ชั่วโมง',
    'ออเดอร์เยอะมาก คิวยาว — งานอาจล่าช้ากว่าปกติ'
  ];
  const openAlert = async () => {
    const m = alMsg.trim(); if (!m) return;
    if (DB) {
      await DB.from('banners').update({ active: false }).eq('color', 'alert'); // ปิดประกาศเก่าก่อน มีได้ทีละอัน
      await DB.from('banners').insert({ title: m, subtitle: 'ขออภัยในความไม่สะดวก ร้านจะรีบจัดการให้เร็วที่สุดครับ 🙏', emoji: '⚠️', color: 'alert' });
      await loadBanners();
    } else setBanners(l => [{ id: Date.now(), title: m, subtitle: 'ขออภัยในความไม่สะดวกครับ', emoji: '⚠️', color: 'alert', active: true }, ...l.map(x => x.color === 'alert' ? { ...x, active: false } : x)]);
    setAlMsg(''); setAlOpen(false);
  };
  const closeAlert = async () => {
    if (DB) { await DB.from('banners').update({ active: false }).eq('color', 'alert'); await loadBanners(); }
    else setBanners(l => l.map(x => x.color === 'alert' ? { ...x, active: false } : x));
  };
  const deleteAlert = async () => {
    if (DB) { await DB.from('banners').delete().eq('color', 'alert'); await loadBanners(); }
    else setBanners(l => l.filter(x => x.color !== 'alert'));
  };

  const refresh = React.useCallback(async () => {
    if (!DB) return;
    try {
      const { data, error } = await DB.from('orders').select('*').order('created_at', { ascending: false }).limit(1000);
      // งาน Pro แยกไปบริหารที่ pro.html (ของร้านพาร์ทเนอร์) — หลังบ้านหลักเห็นเฉพาะงาน Standard ของเรา
      if (!error && data) { setOrders(data.filter(o => o.ptype !== 'pro')); setLastSync(new Date()); }
    } catch (e) { console.error(e); }
    setLoading(false);
  }, []);

  React.useEffect(() => {
    if (!authed || !DB) return;
    refresh();
    const t = setInterval(refresh, 15000);
    return () => clearInterval(t);
  }, [authed, refresh]);

  if (!authed) return <AdminLogin onOk={() => setAuthed(true)}/>;

  const advance = async (o) => {
    const next = Math.min(o.status + 1, 4);
    const times = (o.times || ['', '', '', '']).slice();
    times[next - 1] = fmtTime(new Date());
    if (DB) {
      setBusyId(o.id);
      try { await DB.from('orders').update({ status: next, times }).eq('id', o.id); await refresh(); }
      catch (e) { console.error(e); }
      setBusyId(null);
    } else {
      setOrders(list => list.map(x => x.id === o.id ? { ...x, status: next, times } : x));
    }
  };

  const cancel = async (o, reason) => {
    if (DB) {
      setBusyId(o.id);
      try {
        await DB.from('orders').update({ status: 0, cancel_reason: reason }).eq('id', o.id);
        // แจ้งลูกค้าทาง LINE (เฉพาะคนที่ล็อกอินด้วย LINE — ล้มเหลวไม่กระทบการยกเลิก)
        try { fetch(CFG.SUPABASE_URL + '/functions/v1/notify-order?action=cancelled', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id }) }); } catch (e) {}
        await refresh();
      }
      catch (e) { console.error(e); }
      setBusyId(null);
    } else {
      setOrders(list => list.map(x => x.id === o.id ? { ...x, status: 0, cancel_reason: reason } : x));
    }
  };

  // ดาวน์โหลดข้อมูลออเดอร์ทั้งหมดเป็นไฟล์ CSV (เปิดใน Excel ได้ ภาษาไทยไม่เพี้ยน)
  const exportCsv = () => {
    const esc = (v) => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const STL = ['ยกเลิก', 'รับออเดอร์', 'กำลังปริ้น', 'กำลังจัดส่ง', 'ส่งแล้ว'];
    const head = ['รหัสออเดอร์', 'วันที่สั่ง', 'สถานะ', 'ชื่อลูกค้า', 'เบอร์ลูกค้า', 'อีเมล', 'ประเภทงาน', 'ขนาด', 'ด้านที่พิมพ์', 'เข้าเล่ม', 'จำนวนชุด', 'จำนวนหน้า', 'รายชื่อไฟล์', 'จุดส่ง', 'ที่อยู่', 'เบอร์ผู้รับ', 'เวลารับ', 'ส่งด่วน', 'กลางคืน', 'ค่าปริ้น', 'ค่าเข้าเล่ม', 'ค่าส่ง', 'ค่ากลางคืน', 'ยอดรวม', 'เหตุผลที่ยกเลิก'];
    const rows = orders.map(o => [
      o.id, new Date(o.created_at).toLocaleString('th-TH'), STL[o.status] != null ? STL[o.status] : o.status,
      ((o.customer_fname || '') + ' ' + (o.customer_lname || '')).trim(), o.customer_phone || '', o.customer_email || '',
      o.ptype ? (PTYPE_LABELS[o.ptype] || o.ptype) : (o.color ? 'ปริ้นสี' : 'ปริ้นขาวดำ'), o.paper || '',
      o.sides === 2 ? 'หน้า-หลัง' : 'หน้าเดียว',
      o.bind === 'book' ? 'เข้าเล่ม' : o.bind === 'corner' ? 'เย็บมุม' : o.bind === 'landscape' ? 'เล่มแนวนอน' : 'ไม่เข้าเล่ม',
      o.copies || 1, (o.files || []).reduce((a, f) => a + (f.pages || 0), 0),
      (o.files || []).map(f => f.name).join(' | '), o.point || '', o.addr || '', o.phone || '', o.time || '',
      o.express ? 'ใช่' : '', o.night ? 'ใช่' : '',
      o.print_cost || 0, o.bind_cost || 0, o.delivery_cost || 0, o.night_fee || 0, o.total || 0, o.cancel_reason || ''
    ]);
    const csv = '\ufeff' + [head].concat(rows).map(r => r.map(esc).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date();
    a.download = 'moreprint-orders-' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
  };

  // ลบออเดอร์ที่ยกเลิกแล้วแบบถาวร (ลบไฟล์เอกสาร+สลิปในคลังด้วย เพื่อคืนพื้นที่)
  const removeOrder = async (o) => {
    if (DB) {
      setBusyId(o.id);
      try {
        const paths = [];
        (o.files || []).forEach(f => { if (f.path) paths.push(f.path); });
        if (o.slip_path) paths.push(o.slip_path);
        if (paths.length) await DB.storage.from('uploads').remove(paths);
        await DB.from('orders').delete().eq('id', o.id);
        await refresh();
      } catch (e) { console.error(e); }
      setBusyId(null);
    } else {
      setOrders(list => list.filter(x => x.id !== o.id));
    }
  };

  // ล้างเฉพาะ "ไฟล์" ของออเดอร์ที่จบงานแล้ว (ส่งสำเร็จ/ยกเลิก) เกิน 30 วัน — ข้อมูลตัวเลข/สถิติอยู่ครบ
  const purgeOldFiles = async () => {
    if (!purgeConfirm) {
      setPurgeConfirm(true);
      setTimeout(() => setPurgeConfirm(false), 5000);
      return;
    }
    setPurgeConfirm(false);
    if (!DB) { setPurgeResult('โหมดตัวอย่าง — ไม่มีไฟล์จริงให้ล้าง'); return; }
    setPurgeBusy(true); setPurgeResult('');
    try {
      const cutoff = new Date(Date.now() - 30 * 24 * 3600 * 1000).toISOString();
      const { data } = await DB.from('orders').select('id,files,slip_path')
        .in('status', [0, 4]).lt('created_at', cutoff).limit(500);
      let nFiles = 0, nOrders = 0;
      for (const o of (data || [])) {
        const paths = [];
        (o.files || []).forEach(f => { if (f.path) paths.push(f.path); });
        if (o.slip_path) paths.push(o.slip_path);
        if (!paths.length) continue;
        const { error } = await DB.storage.from('uploads').remove(paths);
        if (!error) {
          nFiles += paths.length; nOrders++;
          await DB.from('orders').update({
            files: (o.files || []).map(f => ({ name: f.name, pages: f.pages, path: null })),
            slip_path: null
          }).eq('id', o.id);
        }
      }
      setPurgeResult(nOrders ? '✓ ล้างแล้ว ' + nFiles + ' ไฟล์ จาก ' + nOrders + ' ออเดอร์ — ข้อมูลยอดขายอยู่ครบทุกรายการ' : 'ยังไม่มีไฟล์เก่าเกิน 30 วันให้ล้างครับ');
      await refresh();
    } catch (e) { console.error(e); setPurgeResult('เกิดข้อผิดพลาด ลองอีกครั้งครับ'); }
    setPurgeBusy(false);
  };

  // สถิติ (ไม่นับออเดอร์ที่ยกเลิก)
  const today = new Date().toDateString();
  const todayOrders = orders.filter(o => new Date(o.created_at).toDateString() === today);
  const todayActive = todayOrders.filter(o => o.status !== 0);
  const revenue = todayActive.reduce((a, o) => a + (o.total || 0), 0);
  const pending = orders.filter(o => o.status >= 1 && o.status < 4).length;

  // ── ลูกค้าประจำ (เฉพาะงาน Standard): จัดกลุ่มตามเบอร์โทร ไม่นับออเดอร์ที่ยกเลิก ──
  // custRows = ประวัติเต็ม (โหลดตอนเปิดแท็บลูกค้า/สถิติ) — ยังไม่มาก็ใช้ orders ในหน้าไปก่อน
  const jobLabelOf = (o) => o.ptype === 'pro' ? ('✨ ' + (o.paper || 'PRO')) : (o.ptype ? (PTYPE_LABELS[o.ptype] || o.ptype) : (o.color ? 'ปริ้นสี' : 'ปริ้นขาวดำ'));
  const custMap = {};
  (custRows || orders).forEach(o => {
    if (o.status === 0) return;
    const k = o.customer_phone || o.phone || '?';
    if (!custMap[k]) custMap[k] = { name: ('คุณ' + (o.customer_fname || '') + ' ' + (o.customer_lname || '')).trim(), phone: k, count: 0, total: 0, last: o.created_at, jobs: {} };
    const c = custMap[k];
    c.count++; c.total += o.total || 0;
    const jl = jobLabelOf(o);
    c.jobs[jl] = (c.jobs[jl] || 0) + 1;
    if (o.created_at > c.last) c.last = o.created_at;
  });
  const customers = Object.values(custMap).map(c => ({
    ...c,
    topJobs: Object.entries(c.jobs).sort((a, b) => b[1] - a[1]).slice(0, 2), // งานที่สั่งบ่อยสุด 2 อันดับ
    tier: c.count >= 5 ? 2 : c.count >= 2 ? 1 : 0
  })).sort((a, b) => custSort === 'total' ? b.total - a.total
    : custSort === 'last' ? (b.last > a.last ? 1 : -1)
    : (b.count - a.count || b.total - a.total));
  const custShown = customers.filter(c => !custQ.trim() || (c.name + ' ' + c.phone).toLowerCase().includes(custQ.trim().toLowerCase()));

  // ── สถิติแดชบอร์ด ──
  const now = new Date();
  const THAI_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const THAI_DAYS = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
  const isToday = (iso) => new Date(iso).toDateString() === now.toDateString();
  const isThisMonth = (iso) => { const d = new Date(iso); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); };
  const valid = orders.filter(o => o.status !== 0);
  const vToday = valid.filter(o => isToday(o.created_at));
  const vMonth = valid.filter(o => isThisMonth(o.created_at));
  const revToday = vToday.reduce((a, o) => a + (o.total || 0), 0);
  const revMonth = vMonth.reduce((a, o) => a + (o.total || 0), 0);
  const avgOrder = vMonth.length ? Math.round(revMonth / vMonth.length) : 0;
  const pagesMonth = vMonth.reduce((a, o) => a + ((o.files || []).reduce((x, f) => x + (f.pages || 0), 0) * (o.copies || 1)), 0);
  const colorMonth = vMonth.filter(o => o.color).length;
  const bwMonth = vMonth.length - colorMonth;
  const expressMonth = vMonth.filter(o => o.express).length;
  const nightMonth = vMonth.filter(o => o.night).length;
  const doneMonth = vMonth.filter(o => o.status === 4).length;
  const cancMonthList = orders.filter(o => o.status === 0 && isThisMonth(o.created_at));
  const cancValue = cancMonthList.reduce((a, o) => a + (o.total || 0), 0);
  const chartDays = [...Array(7)].map((_, i) => { const d = new Date(now); d.setDate(now.getDate() - (6 - i)); return d; });
  const chart = chartDays.map(d => ({
    label: THAI_DAYS[d.getDay()], date: d.getDate(),
    value: valid.filter(o => new Date(o.created_at).toDateString() === d.toDateString()).reduce((a, o) => a + (o.total || 0), 0),
    isToday: d.toDateString() === now.toDateString()
  }));
  const chartMax = Math.max(...chart.map(c => c.value), 1);
  const ptMap = {};
  vMonth.forEach(o => { if (o.point) ptMap[o.point] = (ptMap[o.point] || 0) + 1; });
  const topPoints = Object.entries(ptMap).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const repeatCust = Object.values(custMap).filter(c => c.count >= 2).length;
  const monthLabel = THAI_MONTHS[now.getMonth()];

  const statusShown = filter === 'all' ? orders
    : filter === 'pending' ? orders.filter(o => o.status >= 1 && o.status < 4)
    : filter === 'cancelled' ? orders.filter(o => o.status === 0)
    : orders.filter(o => o.status === 4);
  // กรองตามโซนไรเดอร์
  const zoneCounts = {};
  statusShown.forEach(o => { const z = zoneOf(o.lat, o.lng); if (z) zoneCounts[z.name] = (zoneCounts[z.name] || 0) + 1; });
  const shown = zoneFilter === 'all' ? statusShown
    : statusShown.filter(o => { const z = zoneOf(o.lat, o.lng); return z && z.name === zoneFilter; });

  return (
    <div style={css("max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;color:var(--ink)")}>
      <div style={css("background:var(--head);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10")}>
        <div style={css("display:flex;align-items:center;gap:10px")}>
          <div style={css("width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.15)")}><img src="assets/logo-icon.png" alt="" style={css("width:29px;height:auto;display:block")}/></div>
          <div>
            <div style={css("font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;letter-spacing:1.2px;line-height:1")}><span style={css("color:var(--accBright)")}>MORE</span> <span style={css("color:#fff")}>PRINT</span></div>
            <div style={css("font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--accBright);margin-top:3px;letter-spacing:1.5px")}>OWNER DASHBOARD</div>
          </div>
        </div>
        <div style={css("display:flex;align-items:center;gap:10px")}>
          <a href="commission.html" style={css("background:#a16207;color:#fff;height:32px;padding:0 12px;border-radius:9px;font-size:11.5px;font-weight:700;text-decoration:none;display:flex;align-items:center")}>💰 งาน PRO</a>
          {DB && <button onClick={refresh} style={css("background:#2a2a2a;border:none;color:#fff;height:32px;padding:0 12px;border-radius:9px;font-size:12px;cursor:pointer")}>⟳ รีเฟรช</button>}
          {DB && <button onClick={() => DB.auth.signOut().then(() => location.reload())} style={css("background:none;border:1px solid #444;color:#bbb;height:32px;padding:0 10px;border-radius:9px;font-size:11px;cursor:pointer")}>ออก</button>}
          <div style={css("font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accBright);display:flex;align-items:center;gap:5px")}>
            <span style={css("animation:mpPulse 2s infinite")}>●</span>{DB ? (lastSync ? 'SYNC ' + fmtTime(lastSync) : 'ONLINE') : 'DEMO'}
          </div>
        </div>
      </div>

      {!DB && (
        <div style={css("margin:14px 16px 0;background:var(--warnBg);border:1px solid var(--warnLine);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--warnInk);line-height:1.5")}>
          ⚠️ <b>โหมดตัวอย่าง</b> — ยังไม่ได้เชื่อมฐานข้อมูล ข้อมูลด้านล่างเป็นเพียงตัวอย่าง เชื่อม Supabase ใน <span style={css("font-family:'IBM Plex Mono',monospace")}>config.js</span> เพื่อเห็นออเดอร์จริงจากลูกค้า
        </div>
      )}

      <div style={css("padding:16px 16px 0;display:flex;gap:10px")}>
        <div style={css("flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px")}>
          <div style={css("font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--acc)")}>{todayActive.length}</div>
          <div style={css("font-size:11px;color:var(--sub);margin-top:2px")}>ออเดอร์วันนี้</div>
        </div>
        <div style={css("flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px")}>
          <div style={css("font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--acc)")}>฿{revenue}</div>
          <div style={css("font-size:11px;color:var(--sub);margin-top:2px")}>ยอดขายวันนี้</div>
        </div>
        <div style={css("flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px")}>
          <div style={css("font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:" + (pending ? "#c92a2a" : "var(--acc)"))}>{pending}</div>
          <div style={css("font-size:11px;color:var(--sub);margin-top:2px")}>ยังไม่ส่ง</div>
        </div>

            <div>
              <div style={css("font-size:11px;font-weight:600;color:var(--sub)")}>ข้อความรอง (ไม่บังคับ)</div>
              <input value={bnSub} onChange={e => setBnSub(e.target.value)} placeholder="เช่น เมื่อปริ้นครบ 100 หน้าขึ้นไป ถึงสิ้นเดือนนี้" style={css("margin-top:4px;width:100%;box-sizing:border-box;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:13px;outline:none")}/>
            </div>
            <div style={css("display:flex;gap:6px;align-items:center;flex-wrap:wrap")}>
              <span style={css("font-size:11px;font-weight:600;color:var(--sub)")}>สีพื้น:</span>
              {BANNER_COLORS.map(([k, label]) => (
                <button key={k} onClick={() => setBnColor(k)} style={{ padding: '5px 12px', borderRadius: '99px', fontSize: '11.5px', fontWeight: 600, cursor: 'pointer', color: '#fff',
                  background: BANNER_THEMES[k], border: bnColor === k ? '2.5px solid var(--ink)' : '2.5px solid transparent' }}>{label}</button>
              ))}
            </div>
            <div>
              <div style={css("font-size:11px;font-weight:600;color:var(--sub)")}>หรือใช้รูปภาพแทน (แนวนอน ~3:1)</div>
              <input type="file" accept="image/*" onChange={e => setBnFile((e.target.files || [])[0] || null)} style={css("margin-top:4px;font-size:12px;width:100%")}/>
              {bnFile && <div style={css("margin-top:2px;font-size:11px;color:var(--acc);font-weight:600")}>✓ {bnFile.name}</div>}
            </div>
            <div style={css("border-radius:12px;overflow:hidden")}>
              <div style={{ background: BANNER_THEMES[bnColor], color: '#fff', padding: '14px 16px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                <div style={{ fontSize: '28px', flex: 'none' }}>{bnEmoji || '🎉'}</div>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: '14px', fontWeight: 700 }}>{bnTitle || 'ตัวอย่างข้อความหลัก'}</div>
                  {bnSub && <div style={{ fontSize: '11px', opacity: .88, marginTop: '2px' }}>{bnSub}</div>}
                </div>
              </div>
            </div>
            <button onClick={addBanner} disabled={bnBusy || !bnTitle.trim()}
              style={{ height: '44px', border: 'none', borderRadius: '12px', background: bnTitle.trim() ? 'var(--acc)' : '#9fd8bd', color: '#fff', fontSize: '14px', fontWeight: 700, cursor: 'pointer' }}>
              {bnBusy ? 'กำลังบันทึก…' : '＋ เพิ่มแบนเนอร์'}
            </button>
          </div>

          <div style={css("font-size:12px;font-weight:700;color:var(--sub)")}>แบนเนอร์ทั้งหมด ({banners.length})</div>
          {banners.length === 0 && <div style={css("text-align:center;color:var(--sub);font-size:13px;padding:20px 0")}>ยังไม่มีแบนเนอร์ — เพิ่มอันแรกด้านบนเลยครับ</div>}
          {banners.map(b => (
            <div key={b.id} style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)" + (b.active ? "" : ";opacity:.5"))}>
              {b.image_path && fileUrl(b.image_path)
                ? <img src={fileUrl(b.image_path)} alt="" style={css("width:100%;height:100px;object-fit:cover;display:block")}/>
                : <div style={{ background: BANNER_THEMES[b.color] || BANNER_THEMES.green, color: '#fff', padding: '13px 16px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <div style={{ fontSize: '26px', flex: 'none' }}>{b.emoji || '🎉'}</div>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontSize: '13.5px', fontWeight: 700 }}>{b.title}</div>
                      {b.subtitle && <div style={{ fontSize: '11px', opacity: .88, marginTop: '2px' }}>{b.subtitle}</div>}
                    </div>
                  </div>}
              <div style={css("display:flex;gap:8px;padding:8px 12px;align-items:center")}>
                <span style={css("flex:1;font-size:11px;color:" + (b.active ? "var(--acc)" : "var(--sub)"))}>{b.active ? '● กำลังแสดงบนหน้าแรก' : '○ ซ่อนอยู่'}</span>
                <button onClick={() => toggleBanner(b)} style={css("height:32px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);font-size:11.5px;font-weight:600;cursor:pointer")}>{b.active ? 'ซ่อน' : 'แสดง'}</button>
                <button onClick={() => delBanner(b)} style={css("height:32px;padding:0 12px;border:1px solid #ffa8a8;border-radius:9px;background:none;color:#c92a2a;font-size:11.5px;font-weight:600;cursor:pointer")}>ลบ</button>
              </div>
            </div>
          ))}

          <div style={css("font-size:12px;font-weight:700;color:var(--sub);margin-top:8px")}>⭐ รีวิวจากลูกค้า ({reviews.length})</div>
          {reviews.length === 0 && <div style={css("text-align:center;color:var(--sub);font-size:13px;padding:14px 0")}>ยังไม่มีรีวิว</div>}
          {reviews.map(r => (
            <div key={r.id} style={css("background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)")}>
              <div style={css("display:flex;align-items:center;gap:8px")}>
                <span style={css("color:#f5a623;font-size:13px;letter-spacing:1px")}>{'★'.repeat(Math.max(1, Math.min(5, r.stars || 5)))}</span>
                {r.auto && <span style={css("font-size:10px;font-weight:700;background:var(--soft);color:var(--sub);padding:2px 8px;border-radius:99px")}>5 ดาวอัตโนมัติ</span>}
                <span style={css("flex:1")}></span>
                <button onClick={() => delReview(r)} style={css("height:28px;padding:0 10px;border:1px solid #ffa8a8;border-radius:8px;background:" + (revDelId === r.id ? "#c92a2a" : "none") + ";color:" + (revDelId === r.id ? "#fff" : "#c92a2a") + ";font-size:11px;font-weight:700;cursor:pointer")}>{revDelId === r.id ? 'ยืนยันลบ?' : 'ลบ'}</button>
              </div>
              {r.comment && <div style={css("margin-top:4px;font-size:12.5px;line-height:1.5")}>{r.comment}</div>}
              <div style={css("margin-top:4px;font-size:11px;color:var(--sub)")}>คุณ{r.name || 'ลูกค้า'}{r.ptype ? ' · งาน' + r.ptype : ''}{r.order_id ? ' · ' + r.order_id : ''} · {fmtWhen(r.created_at)}</div>
            </div>
          ))}
        </div>
      )}

      {tab === 'customers' && (
        <div style={css("padding:14px 16px 40px;display:flex;flex-direction:column;gap:10px")}>
          {/* สรุปภาพรวม */}
          <div style={css("display:flex;gap:8px")}>
            <div style={css("flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center")}>
              <div style={css("font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600")}>{customers.length}</div>
              <div style={css("font-size:10.5px;color:var(--sub)")}>👥 ลูกค้าทั้งหมด</div>
            </div>
            <div style={css("flex:1;background:#fff3bf;border:1px solid #ffd43b;border-radius:12px;padding:10px 12px;text-align:center")}>
              <div style={css("font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:#e8590c")}>{customers.filter(c => c.tier === 2).length}</div>
              <div style={css("font-size:10.5px;color:#e8590c")}>⭐ ลูกค้าประจำ (5 ครั้งขึ้น)</div>
            </div>
            <div style={css("flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center")}>
              <div style={css("font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:#1971c2")}>{customers.filter(c => c.tier === 1).length}</div>
              <div style={css("font-size:10.5px;color:var(--sub)")}>🔁 กลับมาซ้ำ (2-4 ครั้ง)</div>
            </div>
          </div>
          <input value={custQ} onChange={e => setCustQ(e.target.value)} placeholder="🔍 ค้นหาชื่อหรือเบอร์โทร"
            style={css("height:42px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:13px;outline:none;font-family:inherit")}/>
          <div style={css("display:flex;gap:6px")}>
            {[['count', '🔥 สั่งบ่อยสุด'], ['total', '💰 ยอดสูงสุด'], ['last', '🕐 มาล่าสุด']].map(([k, label]) => (
              <button key={k} onClick={() => setCustSort(k)} style={{ flex: 1, height: '36px', borderRadius: '10px', fontSize: '11.5px', fontWeight: 700, cursor: 'pointer',
                border: custSort === k ? '1.5px solid var(--acc)' : '1px solid var(--line)',
                background: custSort === k ? 'var(--accSoft)' : 'var(--card)', color: custSort === k ? 'var(--acc)' : 'var(--sub)' }}>{label}</button>
            ))}
          </div>
          {custShown.length === 0 && <div style={css("text-align:center;color:var(--sub);font-size:14px;padding:40px 0")}>ยังไม่มีข้อมูลลูกค้า</div>}
          {custShown.map((cst, i) => (
            <div key={i} style={css("background:var(--card);border:1px solid " + (cst.tier === 2 ? "#ffd43b" : "var(--line)") + ";border-radius:14px;padding:13px 16px;box-shadow:var(--shadow)")}>
              <div style={css("display:flex;align-items:center;gap:12px")}>
                <div style={css("width:40px;height:40px;border-radius:50%;background:var(--accSoft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:" + (i < 3 && custSort !== 'last' && !custQ.trim() ? "20px" : "15px") + ";flex:none")}>
                  {i < 3 && custSort !== 'last' && !custQ.trim() ? ['🥇', '🥈', '🥉'][i] : (cst.name.replace('คุณ', '') || '?').trim().charAt(0)}
                </div>
                <div style={css("flex:1;min-width:0")}>
                  <div style={css("display:flex;align-items:center;gap:6px;min-width:0")}>
                    <div style={css("font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap")}>{cst.name || 'ไม่ระบุชื่อ'}</div>
                    {cst.tier === 2 && <span style={css("flex:none;font-size:9.5px;font-weight:700;background:#fff3bf;color:#e8590c;border-radius:99px;padding:2px 8px")}>⭐ ลูกค้าประจำ</span>}
                    {cst.tier === 1 && <span style={css("flex:none;font-size:9.5px;font-weight:700;background:#e7f5ff;color:#1971c2;border-radius:99px;padding:2px 8px")}>🔁 กลับมาซ้ำ</span>}
                    {cst.tier === 0 && <span style={css("flex:none;font-size:9.5px;font-weight:700;background:var(--soft);color:var(--sub);border-radius:99px;padding:2px 8px")}>🆕 ใหม่</span>}
                  </div>
                  <div style={css("margin-top:2px;font-size:11.5px;color:var(--sub)")}><a href={'tel:' + cst.phone.replace(/[^0-9+]/g,'')} style={css("font-family:'IBM Plex Mono',monospace")}>{cst.phone}</a> · ล่าสุด {fmtWhen(cst.last)}</div>
                </div>
                <div style={css("text-align:right;flex:none")}>
                  <div style={css("font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--acc)")}>฿{cst.total}</div>
                  <div style={css("font-size:10.5px;color:var(--sub)")}>{cst.count} ออเดอร์</div>
                </div>
              </div>
              {/* งานที่ลูกค้าคนนี้สั่งบ่อยสุด */}
              {cst.topJobs.length > 0 && (
                <div style={css("margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:6px;flex-wrap:wrap")}>
                  <span style={css("font-size:10px;color:var(--sub)")}>สั่งบ่อย:</span>
                  {cst.topJobs.map(([label, n], j) => (
                    <span key={j} style={css("font-size:10.5px;font-weight:600;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 9px")}>{label} ×{n}</span>
                  ))}
                </div>
              )}
            </div>
          ))}
          <div style={css("font-size:10.5px;color:var(--sub);text-align:center;line-height:1.6")}>เฉพาะงาน Standard ไม่นับออเดอร์ที่ยกเลิก · จัดกลุ่มตามเบอร์โทรลูกค้า · ลูกค้าประจำงาน Pro ดูที่ 💰 งาน PRO</div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp/>);
</script>
</body>
</html>
