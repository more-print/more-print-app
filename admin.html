function css(str){
  const o = {};
  String(str).split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if (i < 0) return;
    const prop = decl.slice(0, i).trim();
    if (!prop) return;
    o[prop.startsWith('--') ? prop : prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = decl.slice(i + 1).trim();
  });
  return o;
}

function zoneOf(lat, lng){
  if (lat == null || lng == null) return null;
  // ขอบเขตรั้ว มข. โดยประมาณ
  if (lat >= 16.4645 && lat <= 16.4825 && lng >= 102.8145 && lng <= 102.8390) return ZONE_IN_CAMPUS;
  let best = null, bd = Infinity;
  for (const z of ZONES) {
    const d = Math.hypot((lat - z.lat) * 111, (lng - z.lng) * 105); // ระยะ กม. โดยประมาณ
    if (d < bd) { bd = d; best = z; }
  }
  return bd > 3.5 ? ZONE_OUT : best;
}

const zoneStyleByName = (n) => n === 'ในมอ' ? ZONE_IN_CAMPUS : n === 'นอกเขต' ? ZONE_OUT : (ZONES.find(z => z.name === n) || ZONE_OUT);
// ป้ายการเข้าเล่ม — key ตรงกับ orders.bind ที่ index.html บันทึก (coil/tape/glue เพิ่ม 2026-09-08 ฿20/ชุด · book/landscape = ออเดอร์เก่า)
const BIND_LABELS = { book: 'เข้าเล่ม', corner: 'เย็บมุม', landscape: 'เล่มแนวนอน', coil: 'เข้าเล่มสันห่วง/สันเกลียว', tape: 'เข้าเล่มเทปผ้า (แลคซีน)', glue: 'เข้าเล่มสันกาว' };
// สเปกงาน Standard เป็นหัวข้อเรียงลงมา (เจ้าของสั่ง 2026-10-12 — แทนบรรทัดสเปกยาวต่อกัน)
// เย็บมุมกับเข้าเล่มแยกกัน: ไม่ได้เลือกเข้าเล่ม = โชว์แค่สถานะเย็บมุม ไม่ขึ้นคำว่าไม่เข้าเล่ม (เจ้าของย้ำ 2026-09-27)
// ประเภทรายไฟล์ของงานปริ้นผสม (files[].cmode/cpages จาก index.html): หน้าสีตามที่ลูกค้าระบุ ที่เหลือเป็นขาวดำ
const pagesToRanges = (arr) => {
  const a = [...arr].sort((x, y) => x - y), out = [];
  for (let i = 0; i < a.length; i++) { let j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(i === j ? '' + a[i] : a[i] + '-' + a[j]); i = j; }
  return out.join(', ');
};
const fileTypeLabel = (o, f) => {
  if (!f || !f.cmode) return o.ptype ? (PTYPE_LABELS[o.ptype] || o.ptype) : (o.color ? 'ปริ้นสี' : 'ปริ้นขาวดำ');
  if (f.cmode === 'color') return 'ปริ้นสี';
  if (f.cmode !== 'pages' || !f.cpages) return 'ปริ้นขาวดำ';
  const cs = new Set();
  String(f.cpages).split(',').forEach(part => { const m = part.trim().match(/^(\d+)(?:-(\d+))?$/); if (m) for (let p = +m[1]; p <= +(m[2] || m[1]) && p - m[1] < 5000; p++) cs.add(p); });
  const bw = []; for (let p = 1; p <= (f.pages || 0); p++) if (!cs.has(p)) bw.push(p);
  return 'ปริ้นสี หน้าที่ ' + f.cpages + (bw.length ? ' , ปริ้นขาวดำ หน้าที่ ' + pagesToRanges(bw) : '');
};
// f = ไฟล์ (สั่งหลายไฟล์ = กล่องละไฟล์) — ออเดอร์ที่ลูกค้าตั้งค่ารายไฟล์ใช้ files[].orient/nup/bind · ออเดอร์เก่าใช้ค่าทั้งออเดอร์
// เย็บมุมขึ้นทุกครั้ง · เข้าเล่มขึ้นเป็นแถวสุดท้ายเฉพาะเมื่อลูกค้าเลือก (เจ้าของสั่ง 2026-10-12)
const bindShort = (b) => (BIND_LABELS[b] || b).replace(/^เข้าเล่ม/, '').trim() || 'เข้าเล่ม';
const stdSpecRows = (o, f) => {
  const orient = (f && f.orient) || o.orient, nup = (f && f.nup) || o.nup, bind = (f && f.bind) || o.bind, sides = (f && f.sides) || o.sides;
  return [
    ['ขนาดกระดาษ', o.paper || 'A4'],
    ['ประเภท', fileTypeLabel(o, f)],
    o.ptype === 'poster' ? null : ['ด้านที่พิมพ์', sides === 2 ? 'หน้า-หลัง' : 'หน้าเดียว'],
    orient ? ['แนวกระดาษ', orient === 'landscape' ? 'แนวนอน' : 'แนวตั้ง'] : null,
    nup ? ['หน้า/แผ่น', nup + ' หน้า/แผ่น'] : null,
    ['จำนวน', (o.copies || 1) + ' ชุด'],
    ['เย็บมุม', bind === 'corner' ? 'ต้องเย็บมุม' : 'ไม่เย็บมุม'],
    bind && bind !== 'none' && bind !== 'corner' ? ['เข้าเล่ม', bindShort(bind)] : null
  ].filter(Boolean);
};
// กล่องสเปก: หัวข้อสีเขียว · ค่าที่ลูกค้าเลือกสีดำ · กรอบเขียวแบบกล่องราคา — ใช้แบบเดียวกันทั้ง admin/pro/commission (แก้ต้องแก้ทั้ง 3 ไฟล์)
// title/sub = หัวกล่องรายไฟล์ (ไฟล์ 1 · ชื่อไฟล์) · grow = กล่องเรียงต่อกันไปทางขวา

function AdminLogin({ onOk }){
  const [email, setEmail] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [uuid, setUuid] = React.useState('');

  const verifyAdmin = async () => {
    // เช็คสิทธิ์เจ้าของ — ถ้ายังไม่มีเจ้าของในระบบ คนแรกที่ล็อกอินจะได้สิทธิ์ (ครั้งแรกครั้งเดียว)
    let r = await DB.rpc('is_admin');
    let ok = !!r.data;
    if (!ok && !r.error) { const c = await DB.rpc('claim_admin'); ok = !!c.data; }
    if (ok) { onOk(); return; }
    const { data } = await DB.auth.getUser();
    setUuid((data && data.user && data.user.id) || '');
    setMsg(r.error ? 'ระบบสิทธิ์ยังไม่พร้อม (ยังไม่ได้รัน SQL อัปเกรด)' : 'บัญชีนี้ไม่ใช่เจ้าของร้าน');
    setBusy(false);
  };

  React.useEffect(() => {
    if (!DB) { onOk(); return; }
    DB.auth.getSession().then(({ data }) => { if (data.session) { setBusy(true); verifyAdmin(); } });
  }, []);

  const submit = async () => {
    if (!DB) return onOk();
    if (!email.trim() || !pass) return setMsg('กรอกอีเมลและรหัสผ่านก่อนครับ');
    setBusy(true); setMsg('');
    const { error } = await DB.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: pass });
    if (error) {
      setBusy(false);
      return setMsg('อีเมลหรือรหัสผ่านไม่ถูกต้อง ❌');
    }
    await verifyAdmin();
  };

  return (
    <div style={css("min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px")}>
      <div style={css("background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:320px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:center")}>
        <img src="assets/logo-icon.png" alt="" style={css("width:56px;height:auto")}/>
        <div style={css("font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px;letter-spacing:1px")}><span style={css("color:var(--acc)")}>MORE</span> PRINT</div>
        <div style={css("font-size:13px;color:var(--sub)")}>หลังบ้าน — เข้าสู่ระบบเจ้าของร้าน</div>
        <input value={email} onChange={e => setEmail(e.target.value)} placeholder="อีเมลเจ้าของร้าน" inputMode="email" autoComplete="email"
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>
        <input type="password" value={pass} onChange={e => setPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} placeholder="รหัสผ่าน" autoComplete="current-password"
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>
        {msg && <div style={css("font-size:12px;color:#d9480f;text-align:center;line-height:1.5")}>{msg}</div>}
        {uuid && <div style={css("font-size:10.5px;color:var(--sub);word-break:break-all;text-align:center")}>รหัสบัญชี (สำหรับผู้ดูแลระบบ): <span style={css("font-family:'IBM Plex Mono',monospace")}>{uuid}</span></div>}
        <button onClick={submit} disabled={busy} style={css("width:100%;height:46px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:14px;font-weight:700;cursor:pointer" + (busy ? ";opacity:.6" : ""))}>{busy ? 'กำลังตรวจสอบ…' : 'เข้าสู่หลังบ้าน →'}</button>
      </div>
    </div>
  );
}

// ── กล่องแชทกับลูกค้า (ตาราง messages · ลูกค้าคุยผ่าน RPC ที่ต้องรู้รหัสออเดอร์) ──
function Chat({ o, onSeen, tall }){
  const [msgs, setMsgs] = React.useState(null);
  const [text, setText] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [missing, setMissing] = React.useState(false);
  const [upBusy, setUpBusy] = React.useState(false);
  const [unsendFor, setUnsendFor] = React.useState(null); // ข้อความร้านที่กำลังจะ unsend (กดค้าง/คลิกขวา — เจ้าของสั่ง 2026-10-05)
  const [unsendBusy, setUnsendBusy] = React.useState(false);
  const lpT = React.useRef(null);
  const boxRef = React.useRef(null);
  const stickRef = React.useRef(true); // ติดก้นจออยู่ไหม — เลื่อนตามเฉพาะตอนผู้ใช้อยู่ล่างสุด (เจ้าของสั่ง 2026-10-07: ห้ามเด้งลงเองตอนไล่อ่านของเก่า)
  const camRef = React.useRef(null);
  const chatSeq = React.useRef(0);
  const load = React.useCallback(async () => {
    if (!DB) { setMsgs(DEMO_MSGS); return; }
    const seq = ++chatSeq.current; // ผลรอบเก่าที่มาช้า = ทิ้ง (กันข้อความที่เพิ่งส่งหายวูบ)
    const { data, error } = await DB.from('messages').select('*').eq('order_id', o.id).order('id');
    if (error) { if (/42P01|does not exist/i.test(String(error.message || '') + String(error.code || ''))) setMissing(true); return; } // ปิดถาวรเฉพาะยังไม่สร้างตาราง — เน็ตสะดุดแค่ข้ามรอบ
    if (seq !== chatSeq.current) return;
    setMissing(false);
    setMsgs(data || []);
    // ทำเครื่องหมายว่าร้านอ่านข้อความลูกค้าแล้ว
    const unseen = (data || []).filter(m => m.sender === 'customer' && !m.seen_by_shop);
    if (unseen.length) {
      await DB.from('messages').update({ seen_by_shop: true }).eq('order_id', o.id).eq('sender', 'customer');
      if (onSeen) onSeen(o.id);
    }
  }, [o.id]);
  React.useEffect(() => { load(); const t = setInterval(load, 8000); return () => clearInterval(t); }, [load]);
  // unsend ข้อความฝั่งร้าน: แทนด้วยป้าย UNSENT_MSG (สิทธิ์ UPDATE ของแอดมินมีอยู่แล้ว — ลูกค้าเห็นป้ายในรอบโหลดถัดไป)
  const doUnsend = async () => {
    const m = unsendFor; if (!m) return;
    if (!DB) { setMsgs(list => (list || []).map(x => x.id === m.id ? { ...x, body: UNSENT_MSG, img: null, img_url: null } : x)); setUnsendFor(null); return; }
    setUnsendBusy(true);
    const { error } = await DB.from('messages').update({ body: UNSENT_MSG, img: null }).eq('id', m.id).eq('sender', 'shop');
    setUnsendBusy(false); setUnsendFor(null);
    if (error) return alert('ยกเลิกข้อความไม่สำเร็จ ลองอีกครั้งครับ: ' + error.message);
    load();
  };
  // เลื่อนลงล่างสุดเฉพาะตอนผู้ใช้อยู่ก้นจอ/เพิ่งส่งเอง — กำลังไล่อ่านข้อความเก่าห้ามดึงลง (โพลทุก 8 วิเคยดึงลงตลอด)
  React.useEffect(() => { const el = boxRef.current; if (el && stickRef.current) el.scrollTop = el.scrollHeight; }, [msgs]);
  // ส่งรูป (ใช้ถ่ายรูปหลักฐานตอนส่งของถึงมือลูกค้า แบบ Grab/LINE MAN)
  const sendPhoto = async (file) => {
    if (!file || upBusy) return;
    stickRef.current = true; // ส่งเอง = พากลับลงล่างสุด
    setUpBusy(true);
    const caption = text.trim() || 'รูปหลักฐานการจัดส่ง';
    if (!DB) {
      setMsgs(l => [...(l || []), { id: Date.now(), sender: 'shop', body: caption, img_url: URL.createObjectURL(file), created_at: new Date().toISOString() }]);
      setText(''); setUpBusy(false); return;
    }
    const ext = (file.name.split('.').pop() || 'jpg').replace(/[^a-zA-Z0-9]/g, '').slice(0, 5) || 'jpg';
    const path = 'chat/' + o.id.replace(/[^A-Za-z0-9-]/g, '') + '/' + Date.now() + '.' + ext;
    const up = await DB.storage.from('uploads').upload(path, file);
    if (up.error) { setUpBusy(false); return alert('อัปโหลดรูปไม่สำเร็จ: ' + up.error.message); }
    const { error } = await DB.from('messages').insert({ order_id: o.id, sender: 'shop', body: caption, img: path, seen_by_shop: true });
    setUpBusy(false);
    if (error) return alert(/img/.test(error.message) ? 'ยังไม่ได้เพิ่มคอลัมน์ img — รัน SQL เพิ่มก่อนครับ' : 'ส่งรูปไม่สำเร็จ: ' + error.message);
    setText(''); load();
  };
  const send = async () => {
    const body = text.trim();
    if (!body || busy) return;
    stickRef.current = true; // ส่งเอง = พากลับลงล่างสุด
    setBusy(true);
    if (!DB) { setMsgs(l => [...(l || []), { id: Date.now(), sender: 'shop', body, created_at: new Date().toISOString() }]); setText(''); setBusy(false); return; }
    const { error } = await DB.from('messages').insert({ order_id: o.id, sender: 'shop', body, seen_by_shop: true });
    setBusy(false);
    if (error) return alert('ส่งไม่สำเร็จ: ' + error.message);
    setText(''); load();
  };
  // ส่งลง Live Chat + เด้งแจ้งเตือนเข้า LINE ลูกค้าผ่าน OA (ใช้ได้เฉพาะลูกค้าที่ล็อกอินด้วย LINE — EF ตรวจ line_uid ให้เอง)
  const sendLine = async () => {
    const body = text.trim();
    if (!body || busy) return;
    stickRef.current = true; // ส่งเอง = พากลับลงล่างสุด
    if (!DB) { setMsgs(l => [...(l || []), { id: Date.now(), sender: 'shop', body, created_at: new Date().toISOString() }]); setText(''); return; } // โหมดตัวอย่าง
    setBusy(true);
    try {
      if (DB) {
        const { error } = await DB.from('messages').insert({ order_id: o.id, sender: 'shop', body, seen_by_shop: true });
        if (error) { setBusy(false); return alert('ส่งไม่สำเร็จ: ' + error.message); }
      }
      const res = await fetch(CFG.SUPABASE_URL + '/functions/v1/notify-order?action=msg', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id, text: body }) });
      const d = await res.json().catch(() => ({}));
      if (d.ok) alert('✓ ส่งข้อความลง Live Chat และเด้งเข้า LINE ลูกค้าแล้วครับ');
      else if (d.reason === 'no-line-uid') alert('ข้อความลง Live Chat แล้ว — แต่ลูกค้าคนนี้ไม่ได้ล็อกอินด้วย LINE เลยเด้ง LINE ให้ไม่ได้ครับ');
      else if (d.reason === 'quota') alert('ข้อความลง Live Chat แล้ว — แต่โควตาส่ง LINE เดือนนี้หมด (รีเซ็ตวันที่ 1) ลูกค้าจะเห็นเมื่อเปิดเว็บครับ');
      else alert('ข้อความลง Live Chat แล้ว — แต่เด้ง LINE ไม่สำเร็จ (' + (d.reason || d.error || 'ระบบ LINE ยังไม่อัปเดตเวอร์ชันใหม่') + ')');
    } catch (e) { alert('เด้ง LINE ไม่สำเร็จ: ' + e.message + ' (ข้อความอาจลงแชทแล้ว)'); }
    setBusy(false); setText(''); load();
  };
  if (missing) return (
    <div style={css("background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:11.5px;color:var(--sub);line-height:1.6")}>
      ระบบแชทยังไม่เปิด — ต้องรัน SQL สร้างตาราง messages ก่อนครับ
    </div>
  );
  return (
    <div style={css("background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px")}>
      <div style={css("font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.5px")}>{FI.chat(12)} แชทกับลูกค้า</div>
      <div ref={boxRef} onScroll={() => { const el = boxRef.current; if (el) stickRef.current = el.scrollHeight - el.scrollTop - el.clientHeight < 70; }}
        style={css("margin-top:8px;" + (tall ? "height:52vh;" : "max-height:230px;") + "overflow-y:auto;display:flex;flex-direction:column;gap:7px")}>
        {msgs === null && <div style={css("font-size:12px;color:var(--sub)")}>กำลังโหลด…</div>}
        {msgs !== null && msgs.length === 0 && <div style={css("font-size:11.5px;color:var(--sub);line-height:1.6")}>ยังไม่มีข้อความ — ทักลูกค้าได้เลย เช่น แจ้งราคา งานเสร็จ หรือขอรายละเอียดเพิ่ม</div>}
        {(msgs || []).map(m => {
          const mine = m.sender === 'shop';
          const unsent = m.body === UNSENT_MSG;
          const canUnsend = mine && !unsent && m.id;
          return (
            <div key={m.id} style={{ display: 'flex', justifyContent: mine ? 'flex-end' : 'flex-start' }}>
              <div onContextMenu={canUnsend ? (e) => { e.preventDefault(); setUnsendFor(m); } : undefined}
                onTouchStart={canUnsend ? () => { clearTimeout(lpT.current); lpT.current = setTimeout(() => setUnsendFor(m), 550); } : undefined}

const jobLabelOf = (o) => o.ptype === 'pro' ? ((o.paper || 'PRO')) : (o.ptype ? (PTYPE_LABELS[o.ptype] || o.ptype) : (o.color ? 'ปริ้นสี' : 'ปริ้นขาวดำ'));
const DASH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const DASH_DAYS = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
const DASH_PERIODS = [['today', 'วันนี้'], ['7d', '7 วัน'], ['30d', '30 วัน'], ['month', 'เดือนนี้'], ['year', 'ปีนี้'], ['custom', 'กำหนดเอง']];
const baht = (n) => '฿' + Math.round(n || 0).toLocaleString();
const isPickup = (o) => !!o.pickup || String(o.addr || '').indexOf('🏪') === 0; // ออเดอร์เก่าบางใบไม่มีธง pickup แต่ที่อยู่ขึ้นต้น 🏪
const custKey = (o) => o.customer_phone || o.phone || '?';
const pagesOf = (o) => (o.files || []).reduce((x, f) => x + (f.pages || 0), 0) * (o.copies || 1);
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

// ช่วงเวลาที่เลือก + ช่วงก่อนหน้าความยาวเท่ากัน (ไว้เทียบ ▲▼) + ขนาดแท่งกราฟ
function dashRange(key, from, to){
  const now = new Date();
  const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  let start, end = now, prevStart, bucket = 'day';
  if (key === 'today') { start = d0; prevStart = addD(d0, -1); bucket = 'hour'; }
  else if (key === '7d') { start = addD(d0, -6); prevStart = addD(start, -7); }
  else if (key === '30d') { start = addD(d0, -29); prevStart = addD(start, -30); }
  else if (key === 'month') { start = new Date(now.getFullYear(), now.getMonth(), 1); prevStart = new Date(now.getFullYear(), now.getMonth() - 1, 1); }
  else if (key === 'year') { start = new Date(now.getFullYear(), 0, 1); prevStart = new Date(now.getFullYear() - 1, 0, 1); bucket = 'month'; }
  else {
    const a = from ? new Date(from + 'T00:00:00') : addD(d0, -6);
    const b = to ? new Date(to + 'T00:00:00') : d0;
    start = a <= b ? a : b; end = addD(a <= b ? b : a, 1);
    const days = Math.round((end - start) / 86400000);
    prevStart = addD(start, -days);
    bucket = days <= 1 ? 'hour' : days <= 62 ? 'day' : 'month';
  }
  const prevEnd = new Date(prevStart.getTime() + (end - start)); // เทียบ "ช่วงเวลาที่ผ่านไปเท่ากัน" เช่น วันนี้ถึงตอนนี้ vs เมื่อวานถึงเวลาเดียวกัน
  return { start, end, prevStart, prevEnd, bucket };
}

// นาทีตั้งแต่ลูกค้าสั่ง → ส่งถึง (times[3] เก็บเป็น HH:MM) — ข้ามค่าที่ผิดปกติ
function leadMinutes(o){
  const t = o.times && o.times[3];
  if (o.status !== 4 || !t || !/^\d{1,2}:\d{2}$/.test(t)) return null;
  const c = new Date(o.created_at);
  const [h, m] = t.split(':').map(Number);
  let mins = (h * 60 + m) - (c.getHours() * 60 + c.getMinutes());
  if (mins < 0) mins += 1440; // ส่งข้ามเที่ยงคืน
  return mins <= 1440 ? mins : null;
}

function dashSummary(rows, start, end){
  const inR = rows.filter(o => { const t = new Date(o.created_at); return t >= start && t < end; });
  const valid = inR.filter(o => o.status !== 0);
  const cancelled = inR.filter(o => o.status === 0);
  const revenue = valid.reduce((a, o) => a + (o.total || 0), 0);
  const custs = new Set(valid.map(custKey));
  return { inR, valid, cancelled, revenue, orders: valid.length, avg: valid.length ? revenue / valid.length : 0,
    customers: custs.size, pages: valid.reduce((a, o) => a + pagesOf(o), 0),
    cancelValue: cancelled.reduce((a, o) => a + (o.total || 0), 0) };
}

function Delta({ cur, prev, invert }){
  if (!prev && !cur) return <span style={css("font-size:10.5px;color:var(--sub)")}>—</span>;
  if (!prev) return <span style={css("font-size:10.5px;font-weight:700;color:var(--acc)")}>ใหม่</span>;
  const pct = Math.round((cur - prev) / prev * 100);
  const good = invert ? pct <= 0 : pct >= 0;
  return <span style={css("font-size:10.5px;font-weight:700;color:" + (pct === 0 ? "var(--sub)" : good ? "var(--acc)" : "#c92a2a"))}>{pct > 0 ? '▲' : pct < 0 ? '▼' : '•'} {Math.abs(pct)}%</span>;
}

// แท่งแนวนอน — ประเภทงาน/โซน/จุดส่ง (ค่าเดียว สีเดียว ป้ายกำกับเป็นตัวหนังสือ)
function HBars({ items, fmt }){
  if (!items.length) return <div style={css("font-size:12px;color:var(--sub)")}>ยังไม่มีข้อมูลในช่วงนี้</div>;
  const max = Math.max(...items.map(x => x.v), 1);
  return (
    <div style={css("display:flex;flex-direction:column;gap:9px")}>
      {items.map((x, i) => (
        <div key={i} title={x.label + ' · ' + fmt(x)}>
          <div style={css("display:flex;justify-content:space-between;gap:8px;font-size:12px")}><span style={css("font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap")}>{x.label}</span><span style={css("font-family:'IBM Plex Mono',monospace;color:var(--sub);white-space:nowrap")}>{fmt(x)}</span></div>
          <div style={css("margin-top:4px;height:6px;background:var(--soft);border-radius:99px;overflow:hidden")}><div style={{ height: '100%', borderRadius: '99px', background: 'var(--acc)', width: Math.max(2, Math.round(x.v / max * 100)) + '%' }}></div></div>
        </div>
      ))}
    </div>
  );
}

function OrderDashboard({ rows, loading, loadedAt, onReload }){
  const [pkey, setPkey] = React.useState('7d');
  const [from, setFrom] = React.useState(() => ymd(new Date(Date.now() - 6 * 86400000)));
  const [to, setTo] = React.useState(() => ymd(new Date()));
  const [hover, setHover] = React.useState(null); // แท่งกราฟที่ชี้อยู่
  const [jobBy, setJobBy] = React.useState('revenue');

  const d = React.useMemo(() => {
    const all = rows || [];
    const R = dashRange(pkey, from, to);
    const cur = dashSummary(all, R.start, R.end);
    const prev = dashSummary(all, R.prevStart, R.prevEnd);

    // กราฟแนวโน้ม: รายชั่วโมง / รายวัน / รายเดือน
    const buckets = [];
    if (R.bucket === 'hour') {
      for (let h = 0; h < 24; h++) buckets.push({ s: new Date(R.start.getFullYear(), R.start.getMonth(), R.start.getDate(), h), label: String(h).padStart(2, '0'), long: String(h).padStart(2, '0') + ':00–' + String(h).padStart(2, '0') + ':59' });
    } else if (R.bucket === 'day') {
      for (let t = new Date(R.start); t < R.end; t = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1)) buckets.push({ s: t, label: String(t.getDate()), long: DASH_DAYS[t.getDay()] + ' ' + t.getDate() + ' ' + DASH_MONTHS[t.getMonth()] });
    } else {
      for (let t = new Date(R.start.getFullYear(), R.start.getMonth(), 1); t < R.end; t = new Date(t.getFullYear(), t.getMonth() + 1, 1)) buckets.push({ s: t, label: DASH_MONTHS[t.getMonth()], long: DASH_MONTHS[t.getMonth()] + ' ' + (t.getFullYear() + 543) });
    }
    const keyOf = (t) => R.bucket === 'hour' ? t.getHours() : R.bucket === 'day' ? t.toDateString() : t.getFullYear() * 100 + t.getMonth();
    const idx = {}; buckets.forEach((b, i) => { b.v = 0; b.n = 0; idx[keyOf(b.s)] = i; });
    cur.valid.forEach(o => { const i = idx[keyOf(new Date(o.created_at))]; if (i != null) { buckets[i].v += o.total || 0; buckets[i].n++; } });
    const nowK = keyOf(new Date());
    buckets.forEach(b => { b.isNow = keyOf(b.s) === nowK && R.end > new Date(Date.now() - 60000); });
    const bMax = Math.max(1, ...buckets.map(b => b.v));
    const best = buckets.reduce((a, b) => (b.v > (a ? a.v : 0) ? b : a), null);

    // สถานะออเดอร์ในช่วงนี้
    const status = [1, 2, 3, 4].map(s => cur.inR.filter(o => o.status === s).length);

    // ประเภทงาน
    const jm = {};
    cur.valid.forEach(o => { const k = jobLabelOf(o); if (!jm[k]) jm[k] = { label: k, n: 0, rev: 0 }; jm[k].n++; jm[k].rev += o.total || 0; });
    const jobs = Object.values(jm);

    // องค์ประกอบรายได้ (ค่าส่งในฐานข้อมูลรวมค่างานด่วนไว้ — แตกออกมาให้เห็นแยก)
    const comp = { print: 0, bind: 0, ship: 0, express: 0, night: 0 };
    cur.valid.forEach(o => {
      const ex = o.express ? EXPRESS_FEE : 0;
      comp.print += Number(o.print_cost) || 0; comp.bind += Number(o.bind_cost) || 0;
      comp.express += ex; comp.ship += Math.max(0, (Number(o.delivery_cost) || 0) - ex); comp.night += Number(o.night_fee) || 0;
    });
    const compSum = comp.print + comp.bind + comp.ship + comp.express + comp.night;
    const other = cur.revenue - compSum; // ส่วนลด/ปรับราคา

    // ช่องทางรับงาน + โซน + จุดส่ง
    const pick = cur.valid.filter(isPickup);
    const zm = {}, pm = {};
    cur.valid.forEach(o => {
      if (isPickup(o)) return;
      const z = zoneOf(o.lat, o.lng); const zn = z ? z.name : 'ไม่ระบุ';
      zm[zn] = (zm[zn] || 0) + 1;
      if (o.point) pm[o.point] = (pm[o.point] || 0) + 1;
    });

    // ช่วงเวลาขายดี (วัน × ชั่วโมง) — นับจำนวนออเดอร์
    const heat = [...Array(7)].map(() => Array(24).fill(0));
    cur.valid.forEach(o => { const t = new Date(o.created_at); heat[t.getDay()][t.getHours()]++; });
    const heatMax = Math.max(1, ...heat.flat());
    const hourTot = Array(24).fill(0); heat.forEach(r => r.forEach((n, h) => { hourTot[h] += n; }));
    const peakH = hourTot.indexOf(Math.max(...hourTot));

    // ลูกค้า: ใหม่ vs กลับมาซื้อซ้ำ (เทียบกับออเดอร์แรกสุดในประวัติทั้งหมด)
    const first = {};
    all.forEach(o => { if (o.status === 0) return; const k = custKey(o); if (!first[k] || o.created_at < first[k]) first[k] = o.created_at; });
    const cm = {};
    cur.valid.forEach(o => {
      const k = custKey(o);
      if (!cm[k]) cm[k] = { name: ('คุณ' + (o.customer_fname || '') + ' ' + (o.customer_lname || '')).trim(), phone: k, n: 0, rev: 0 };
      cm[k].n++; cm[k].rev += o.total || 0;
    });
    const custList = Object.values(cm);
    const newCust = custList.filter(c => new Date(first[c.phone]) >= R.start).length;

    const leads = cur.valid.map(leadMinutes).filter(x => x != null);
    const leadAvg = leads.length ? Math.round(leads.reduce((a, x) => a + x, 0) / leads.length) : null;

    return { R, cur, prev, buckets, bMax, best, status, jobs, comp, compSum, other, pick, zm, pm, heat, heatMax, peakH, hourTot,
      custList, newCust, leadAvg,
      express: cur.valid.filter(o => o.express).length, night: cur.valid.filter(o => o.night).length, color: cur.valid.filter(o => o.color).length };
  }, [rows, pkey, from, to]);

  const exportCsv = () => {
    const STAT = ['ยกเลิก', ...STEPS];
    const head = ['รหัสออเดอร์', 'วันที่', 'เวลา', 'ลูกค้า', 'เบอร์โทร', 'ประเภทงาน', 'จำนวนหน้า', 'สถานะ', 'รับงาน', 'ค่าปริ้น', 'ค่าเข้าเล่ม', 'ค่าส่ง(รวมด่วน)', 'ค่ากลางคืน', 'ยอดรวม'];
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [...d.cur.inR].sort((a, b) => (a.created_at > b.created_at ? 1 : -1)).map(o => {
      const t = new Date(o.created_at);
      return [o.id, ymd(t), t.toTimeString().slice(0, 5), ((o.customer_fname || '') + ' ' + (o.customer_lname || '')).trim(), custKey(o), jobLabelOf(o), pagesOf(o),
        STAT[o.status] || o.status, isPickup(o) ? 'มารับเอง' : 'จัดส่ง', o.print_cost || 0, o.bind_cost || 0, o.delivery_cost || 0, o.night_fee || 0, o.total || 0].map(q).join(',');
    });
    const blob = new Blob(['﻿' + [head.map(q).join(','), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' }); // BOM ให้ Excel อ่านภาษาไทยถูก
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'moreprint-orders_' + ymd(d.R.start) + '_' + ymd(new Date(d.R.end.getTime() - 1)) + '.csv';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  const { cur, prev } = d;
  const mono = "font-family:'IBM Plex Mono',monospace;";
  const rangeText = (() => {
    const e = new Date(d.R.end.getTime() - 1);
    const f = (t) => t.getDate() + ' ' + DASH_MONTHS[t.getMonth()] + ' ' + ((t.getFullYear() + 543) % 100);
    return d.R.start.toDateString() === e.toDateString() ? f(d.R.start) : f(d.R.start) + ' – ' + f(e);
  })();
  const KPIS = [
    [FI.baht(11), 'รายได้', baht(cur.revenue), cur.revenue, prev.revenue, true],
    [FI.receipt(11), 'ออเดอร์', cur.orders.toLocaleString(), cur.orders, prev.orders],
    [FI.chart(11), 'เฉลี่ย/ออเดอร์', baht(cur.avg), cur.avg, prev.avg],
    [FI.users(11), 'ลูกค้า (ไม่ซ้ำ)', cur.customers.toLocaleString(), cur.customers, prev.customers],
    [FI.file(11), 'หน้าที่ปริ้น', cur.pages.toLocaleString(), cur.pages, prev.pages],
    [FI.x(11), 'ยกเลิก', cur.cancelled.length + ' (' + baht(cur.cancelValue) + ')', cur.cancelled.length, prev.cancelled.length, false, true]
  ];
  const jobsSorted = [...d.jobs].sort((a, b) => jobBy === 'revenue' ? b.rev - a.rev : b.n - a.n);
  const chip = (on) => ({ height: '30px', padding: '0 12px', borderRadius: '99px', border: '1px solid ' + (on ? 'var(--acc)' : 'var(--line)'), background: on ? 'var(--acc)' : 'var(--card)', color: on ? '#fff' : 'var(--ink)', fontSize: '12px', fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap', flexShrink: 0 });
  const hb = hover != null ? d.buckets[hover] : null;
  const labelEvery = Math.ceil(d.buckets.length / 12);

  return (
    <React.Fragment>
      {/* ตัวกรองช่วงเวลา */}
      <div style={css("display:flex;flex-direction:column;gap:8px")}>
        <div style={css("display:flex;align-items:center;gap:8px")}>
          <div style={css("flex:1;min-width:0")}>
            <div style={css("font-size:16px;font-weight:700")}>สรุปออเดอร์</div>
            <div style={css("font-size:11px;color:var(--sub)")}>{rangeText} · เทียบช่วงก่อนหน้าเท่ากัน{loadedAt ? ' · อัปเดต ' + loadedAt.toTimeString().slice(0, 5) : ''}</div>
          </div>
          <button onClick={onReload} disabled={loading} title="โหลดข้อมูลล่าสุด" style={chip(false)}>{loading ? '⏳' : '↻'} รีเฟรช</button>
          <button onClick={exportCsv} disabled={!cur.inR.length} title="ดาวน์โหลดรายการออเดอร์ในช่วงนี้ (เปิดด้วย Excel/Google Sheets)" style={{ ...chip(false), display: 'flex', alignItems: 'center', gap: '5px', opacity: cur.inR.length ? 1 : .5 }}>{FI.download(13)} CSV</button>
        </div>
        <div style={css("display:flex;gap:6px;overflow-x:auto;padding-bottom:2px")}>
          {DASH_PERIODS.map(([k, l]) => <button key={k} onClick={() => setPkey(k)} style={chip(pkey === k)}>{l}</button>)}
        </div>
        {pkey === 'custom' && (
          <div style={css("display:flex;align-items:center;gap:8px;font-size:12px")}>
            <input type="date" value={from} max={to} onChange={e => setFrom(e.target.value)} style={css("flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 8px;background:var(--card);color:var(--ink)")}/>
            <span style={css("color:var(--sub)")}>ถึง</span>
            <input type="date" value={to} min={from} onChange={e => setTo(e.target.value)} style={css("flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 8px;background:var(--card);color:var(--ink)")}/>
          </div>
        )}
      </div>

      {loading && !rows && <div style={css("padding:30px 0;text-align:center;font-size:12.5px;color:var(--sub)")}>⏳ กำลังโหลดประวัติออเดอร์ทั้งหมด…</div>}

      {/* ตัวเลขหลัก */}
      <div className="mp-kpis" style={css("display:grid;gap:10px")}>
        {KPIS.map(([ic, label, val, c, p, hero, inv], i) => (
          <div key={i} style={css("background:var(--card);border:" + (hero ? "1.5px solid var(--acc)" : "1px solid var(--line)") + ";border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0")}>
            <div style={css("font-size:11px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:5px")}>{ic} {label}</div>
            <div style={css(mono + "margin-top:4px;font-size:" + (hero ? "22px" : "18px") + ";font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:" + (hero ? "var(--acc)" : "var(--ink)"))}>{val}</div>
            <div style={css("margin-top:2px;display:flex;align-items:center;gap:5px")}><Delta cur={c} prev={p} invert={inv}/><span style={css("font-size:10px;color:var(--sub)")}>เทียบช่วงก่อน</span></div>
          </div>
        ))}
      </div>

      {/* แนวโน้มรายได้ */}
      <DashCard title={<React.Fragment>{FI.chart(13)} รายได้{d.R.bucket === 'hour' ? 'รายชั่วโมง' : d.R.bucket === 'day' ? 'รายวัน' : 'รายเดือน'}</React.Fragment>}
        right={d.best && d.best.v > 0 && <span style={css("font-size:10.5px;color:var(--sub)")}>สูงสุด <b style={css("color:var(--ink)")}>{d.best.long}</b> {baht(d.best.v)}</span>}>
        <div style={css("height:16px;font-size:11px;color:var(--sub);margin-bottom:4px")}>
          {hb ? <span><b style={css("color:var(--ink)")}>{hb.long}</b> · <span style={css(mono + "color:var(--acc);font-weight:600")}>{baht(hb.v)}</span> · {hb.n} ออเดอร์</span> : 'ชี้/แตะที่แท่งเพื่อดูรายละเอียด'}
        </div>
        <div onMouseLeave={() => setHover(null)} style={css("display:flex;align-items:flex-end;gap:2px;height:130px;border-bottom:1px solid var(--line)")}>
          {d.buckets.map((b, i) => (
            <div key={i} onMouseEnter={() => setHover(i)} onClick={() => setHover(i)} title={b.long + ' · ' + baht(b.v) + ' · ' + b.n + ' ออเดอร์'}
              style={css("flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:pointer")}>
              <div style={{ width: '78%', maxWidth: '30px', borderRadius: '4px 4px 0 0', height: (b.v > 0 ? Math.max(4, Math.round(b.v / d.bMax * 100)) : 1) + '%',
                background: hover === i || b.isNow ? 'var(--acc)' : '#8fd6b2', opacity: hover != null && hover !== i ? .55 : 1 }}></div>
            </div>
          ))}
        </div>
        <div style={css("display:flex;gap:2px;margin-top:5px")}>
          {d.buckets.map((b, i) => (
            <div key={i} style={{ flex: 1, minWidth: 0, textAlign: 'center', fontSize: '9.5px', fontWeight: b.isNow ? 700 : 500, color: b.isNow ? 'var(--acc)' : 'var(--sub)', overflow: 'visible', whiteSpace: 'nowrap' }}>
              {i % labelEvery === 0 || b.isNow ? b.label : ''}
            </div>
          ))}
        </div>
      </DashCard>

      {/* สถานะออเดอร์ */}
      <DashCard title={<React.Fragment>{FI.clipboard(13)} สถานะออเดอร์ในช่วงนี้</React.Fragment>} right={<span style={css("font-size:10.5px;color:var(--sub)")}>{cur.inR.length} ใบ</span>}>
        <div style={css("display:grid;grid-template-columns:repeat(5,1fr);gap:6px")}>
          {[...STEPS.map((s, i) => [s, d.status[i], STEP_COLORS[i], STEP_BG[i]]), ['ยกเลิก', cur.cancelled.length, '#c92a2a', '#fff0f0']].map(([l, n, fg, bg], i) => (
            <div key={i} style={{ background: bg, borderRadius: '10px', padding: '8px 4px', textAlign: 'center', minWidth: 0 }}>
              <div style={css(mono + "font-size:18px;font-weight:600;color:" + fg)}>{n}</div>
              <div style={{ fontSize: '10px', fontWeight: 700, color: fg, lineHeight: 1.25 }}>{l}</div>
            </div>
          ))}
        </div>
        <div style={css("margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--sub)")}>
          <span>อัตรายกเลิก <b style={css("color:var(--ink)")}>{cur.inR.length ? Math.round(cur.cancelled.length / cur.inR.length * 100) : 0}%</b></span>
          <span>{FI.clock(11)} สั่ง→ส่งถึง เฉลี่ย <b style={css("color:var(--ink)")}>{d.leadAvg == null ? '—' : d.leadAvg >= 60 ? Math.floor(d.leadAvg / 60) + ' ชม. ' + (d.leadAvg % 60) + ' นาที' : d.leadAvg + ' นาที'}</b></span>
        </div>
      </DashCard>

      <div style={css("display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px")}>
        {/* ประเภทงาน */}
        <DashCard title={<React.Fragment>{FI.printer(13)} ประเภทงาน</React.Fragment>}
          right={<div style={css("display:flex;gap:4px")}>{[['revenue', 'รายได้'], ['count', 'จำนวน']].map(([k, l]) => <button key={k} onClick={() => setJobBy(k)} style={{ ...chip(jobBy === k), height: '24px', padding: '0 9px', fontSize: '10.5px' }}>{l}</button>)}</div>}>
          <HBars items={jobsSorted.map(j => ({ label: j.label, v: jobBy === 'revenue' ? j.rev : j.n, n: j.n, rev: j.rev }))}
            fmt={(x) => jobBy === 'revenue' ? baht(x.rev) + ' · ' + (cur.revenue ? Math.round(x.rev / cur.revenue * 100) : 0) + '%' : x.n + ' ใบ · ' + (cur.orders ? Math.round(x.n / cur.orders * 100) : 0) + '%'}/>
        </DashCard>

        {/* องค์ประกอบรายได้ */}
        <DashCard title={<React.Fragment>{FI.baht(13)} รายได้มาจากไหน</React.Fragment>}>
          <div style={css("display:flex;flex-direction:column;gap:7px;font-size:12.5px")}>
            {[['ค่าปริ้น', d.comp.print], ['ค่าเข้าเล่ม/เย็บ', d.comp.bind], ['ค่าจัดส่ง', d.comp.ship], ['ค่างานด่วน', d.comp.express], ['ค่าบริการกลางคืน', d.comp.night], ...(Math.round(d.other) !== 0 ? [['ส่วนลด/ปรับราคา', d.other]] : [])].map(([l, v], i) => (
              <div key={i} style={css("display:flex;justify-content:space-between;gap:8px")}>
                <span style={css("color:var(--sub)")}>{l}</span>
                <span style={css(mono + "font-weight:600")}>{v < 0 ? '−' + baht(-v) : baht(v)} <span style={css("color:var(--sub);font-weight:400;font-size:10.5px")}>{cur.revenue ? Math.round(v / cur.revenue * 100) : 0}%</span></span>
              </div>
            ))}
            <div style={css("display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:7px;font-weight:700")}><span>รวม</span><span style={css(mono + "color:var(--acc)")}>{baht(cur.revenue)}</span></div>
          </div>
          <div style={css("margin-top:10px;display:flex;flex-wrap:wrap;gap:6px")}>
            {[[FI.drop(11), 'ปริ้นสี', d.color], [FI.zap(11), 'ส่งด่วน', d.express], [FI.moon(11), 'กลางคืน', d.night]].map(([ic, l, n], i) => (
              <span key={i} style={css("display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--soft);border-radius:8px;padding:3px 9px")}>{ic} {l} <b style={css(mono)}>{n}</b></span>
            ))}
          </div>
        </DashCard>

        {/* ช่องทางรับงาน */}
        <DashCard title={<React.Fragment>{FI.truck(13)} รับงาน & พื้นที่ส่ง</React.Fragment>}>
          <div style={css("display:flex;gap:8px;margin-bottom:12px")}>

// ═══ เสียงเรียกออเดอร์ใหม่แบบแอปร้านค้า (เจ้าของขอ 2026-10-12 "เหมือนร้านในแอป Grab") ═══
// ดังวนจนกว่าจะกด "รับทราบ" · Android สั่นด้วย · เปิดเสียงแล้วจอไม่ดับเอง (Wake Lock) ตราบที่หน้านี้เปิดอยู่
// ข้อจำกัดของเว็บ: ต้องเปิดหน้านี้ค้างไว้บนจอ — ล็อกจอ/สลับไปแอปอื่น เบราว์เซอร์จะพักหน้าเว็บ (ช่วงนั้นพึ่งแจ้งเตือน LINE)
const OrderAlarm = {
  audio: null, ctx: null, buf: null, src: null, vib: null, wake: null, ringing: false,
  // สังเคราะห์ริงโทนในเครื่อง ไม่ต้องโหลดไฟล์เสียง: ติ๊ง-ต่อง-ติ๊ง 2 ชุด แล้วเว้น วนทุก 2 วินาที
  pcm() {
    if (this._pcm) return this._pcm;
    const sr = 22050, len = sr * 2, d = new Float32Array(len);
    [[0, 1319], [0.16, 1047], [0.32, 1568], [0.8, 1319], [0.96, 1047], [1.12, 1568]].forEach(([t0, f]) => {
      const s0 = Math.floor(t0 * sr);
      for (let i = 0; i < sr * 0.6 && s0 + i < len; i++) {
        const t = i / sr, env = Math.min(1, t / 0.005) * Math.exp(-t / 0.18);
        d[s0 + i] += env * (Math.sin(2 * Math.PI * f * t) + 0.35 * Math.sin(4 * Math.PI * f * t));
      }
    });
    let pk = 0; for (let i = 0; i < len; i++) pk = Math.max(pk, Math.abs(d[i]));
    for (let i = 0; i < len; i++) d[i] = d[i] / pk * 0.95;
    return (this._pcm = { sr, d });
  },
  wavUrl() {
    const { sr, d } = this.pcm(), n = d.length, b = new DataView(new ArrayBuffer(44 + n * 2));
    const w = (o, s) => { for (let i = 0; i < s.length; i++) b.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); b.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); b.setUint32(16, 16, true);
    b.setUint16(20, 1, true); b.setUint16(22, 1, true); b.setUint32(24, sr, true); b.setUint32(28, sr * 2, true);
    b.setUint16(32, 2, true); b.setUint16(34, 16, true); w(36, 'data'); b.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) b.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 32767, true);
    return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
  },
  el() { if (!this.audio) { const a = new Audio(this.wavUrl()); a.loop = true; a.preload = 'auto'; this.audio = a; } return this.audio; },
  // ปลดล็อกเสียง — เรียกตอนผู้ใช้แตะจอเท่านั้น (iPhone/Chrome ห้ามเว็บเล่นเสียงเองจนกว่าจะมีการแตะ 1 ครั้ง)
  arm() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {} // iPhone: ดังแม้เปิดสวิตช์โหมดเงียบ
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (C && !this.ctx) this.ctx = new C();
      if (this.ctx && this.ctx.state !== 'running') this.ctx.resume();
    } catch (e) {}
    const a = this.el();
    if (this.ringing) return Promise.resolve(true);
    // เล่นช่วงเงียบท้ายริงโทน (1.8-2 วิ) แล้วหยุด = ปลดล็อกโดยไม่มีเสียงออก — ห้ามใช้ muted: Chrome หยุดสื่อที่ปิดเสียงเองเพื่อประหยัดไฟ ปลดล็อกไม่ติด
    try { if (a.readyState >= 1) a.currentTime = 1.8; } catch (e) {}
    return Promise.resolve(a.play()).then(() => { if (!this.ringing) { a.pause(); a.currentTime = 0; } return true; })
      .catch(() => false);
  },
  start() {
    if (this.ringing) return;
    this.ringing = true;
    const a = this.el(); a.currentTime = 0;
    Promise.resolve(a.play()).catch(() => this.startCtx()); // เล่นแบบไฟล์ไม่ได้ → ใช้ Web Audio สำรอง
    try { if (navigator.vibrate) { navigator.vibrate([600, 250, 600]); this.vib = setInterval(() => navigator.vibrate([600, 250, 600]), 2000); } } catch (e) {}
  },
  startCtx() {
    try {
      if (!this.ctx || !this.ringing) return;
      if (!this.buf) { const { sr, d } = this.pcm(); this.buf = this.ctx.createBuffer(1, d.length, sr); this.buf.getChannelData(0).set(d); }
      const s = this.ctx.createBufferSource(); s.buffer = this.buf; s.loop = true; s.connect(this.ctx.destination); s.start(); this.src = s;
    } catch (e) {}
  },
  stop() {
    this.ringing = false;
    if (this.audio) { this.audio.pause(); this.audio.currentTime = 0; }
    try { if (this.src) this.src.stop(); } catch (e) {}
    this.src = null;
    if (this.vib) { clearInterval(this.vib); this.vib = null; }
    try { if (navigator.vibrate) navigator.vibrate(0); } catch (e) {}
  },
  // จอไม่ดับเองระหว่างเปิดหน้านี้ — เบราว์เซอร์ปล่อยล็อกเองเมื่อสลับแอป จึงต้องขอใหม่ทุกครั้งที่กลับมา
  wakeOn() {
    try {
      if (!navigator.wakeLock || this.wake || document.visibilityState !== 'visible') return;
      navigator.wakeLock.request('screen').then(w => { this.wake = w; w.addEventListener('release', () => { this.wake = null; }); }).catch(() => {});
    } catch (e) {}
  },
  wakeOff() { try { if (this.wake) this.wake.release(); } catch (e) {} this.wake = null; },
};
// คืนออเดอร์ใหม่ที่ยังไม่เคยเห็น — จำรหัสที่เห็นแล้วไว้ในเครื่อง หน้ารีโหลด/มือถือปลุกจากจอดับก็ยังรู้ว่าใบไหนเข้ามาระหว่างนั้น
// เปิดครั้งแรกในเครื่อง = จำของเดิมไว้เฉย ๆ ไม่ดัง · ดังเฉพาะใบสถานะ "รับออเดอร์" ที่สั่งมาไม่เกิน 6 ชม.
const ALARM_SEEN = {};
function takeNewOrders(list, key) {
  const now = Date.now(), recent = (o) => now - new Date(o.created_at).getTime() < 6 * 3600 * 1000;
  let seen = ALARM_SEEN[key] || null;
  if (!seen) { try { const s = localStorage.getItem(key); if (s) seen = JSON.parse(s); } catch (e) {} }
  const fresh = seen ? list.filter(o => o.status === 1 && recent(o) && seen.indexOf(o.id) < 0) : [];
  const ids = list.filter(recent).map(o => o.id);
  ALARM_SEEN[key] = ids;
  try { localStorage.setItem(key, JSON.stringify(ids)); } catch (e) {}
  return fresh;
}

      const k = d.getFullYear() * 100 + d.getMonth();

      byMonth[k].orders++; byMonth[k].revenue += o.total || 0;
      byMonth[k].phones.add(o.customer_phone || o.phone || '?');
    });

  const [spots, setSpots] = React.useState([]);
  const [spName, setSpName] = React.useState('');

  const [spBusy, setSpBusy] = React.useState(false);

  const loadSpots = React.useCallback(async () => {

    if (error) { const r2 = await DB.from('pop_spots').select('*').order('created_at'); data = r2.data; error = r2.error; } // ยังไม่มีคอลัมน์ ord
    if (error) { if (/42P01|does not exist/i.test(String(error.message || ''))) setSpotsMissing(true); return; }
    setSpotsMissing(false); setSpots(data || []);

  React.useEffect(() => { if (authed) loadSpots(); }, [authed, loadSpots]);
  const spotLatLng = (t) => { // แกะพิกัดจากลิงก์ Google Maps (แบบเดียวกับหน้าบ้าน)
    let m = t.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/);
    if (!m) m = t.match(/[?&]q=(-?\d{1,2}\.\d+)(?:,|%2C)(-?\d{1,3}\.\d+)/);
    if (!m) m = t.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);
    return m ? { lat: +m[1], lng: +m[2] } : null;
  };
  const addSpot = async () => {
    const name = spName.trim(), url = spUrl.trim();
    if (!name || !url) return alert('กรอกชื่อสถานที่ และวางลิงก์ Google Maps ให้ครบก่อนครับ');
    setSpBusy(true);
    let pt = spotLatLng(url);
    if (!pt && /goo\.gl|maps\.app|share\.google|g\.co/.test(url)) {
      try { // ลิงก์สั้น — ให้ตัวแกะลิงก์ของระบบตามไปอ่านปลายทาง
        const r = await fetch(CFG.SUPABASE_URL + '/functions/v1/smart-handler?u=' + encodeURIComponent(url));
        if (r.ok) { const j = await r.json(); if (j.final) pt = spotLatLng(j.final); }
      } catch (e) {}
    }
    if (!pt) { setSpBusy(false); return alert('อ่านพิกัดจากลิงก์นี้ไม่ได้ครับ 🙏\n\nวิธีเอาลิงก์ที่ใช้ได้: เปิด Google Maps → "กดค้าง" บนแผนที่ตรงจุดนั้นให้เกิดหมุดแดง → กดแชร์ → คัดลอกลิงก์ (ลิงก์แบบแชร์ชื่อสถานที่เฉยๆ ใช้ไม่ได้ เพราะไม่มีพิกัดแนบมา)'); }
    if (!DB) { setSpots(l => [...l, { id: Date.now(), name, lat: pt.lat, lng: pt.lng }]); setSpName(''); setSpUrl(''); setSpBusy(false); return; }
    const maxOrd = spots.reduce((a, x) => Math.max(a, x.ord || 0), 0);
    let { error } = await DB.from('pop_spots').insert({ name, lat: pt.lat, lng: pt.lng, url, ord: maxOrd + 1 });
    if (error && /ord/.test(String(error.message || ''))) ({ error } = await DB.from('pop_spots').insert({ name, lat: pt.lat, lng: pt.lng, url })); // ยังไม่มีคอลัมน์ ord
    setSpBusy(false);
    if (error) return alert(/42P01|does not exist/i.test(String(error.message || '')) ? 'ต้องรัน SQL สร้างตาราง pop_spots ก่อนครับ' : 'เพิ่มไม่สำเร็จ: ' + error.message);
    setSpName(''); setSpUrl(''); await loadSpots();

  const moveSpot = async (sp, dir) => { // เลื่อนขึ้น/ลง — สลับค่า ord กับเพื่อนบ้าน (จุดบนสุด = ลูกค้าเห็นก่อน)
    const i = spots.findIndex(x => x.id === sp.id);
    const j = i + dir;
    if (j < 0 || j >= spots.length) return;
    const a = spots[i], b = spots[j];
    const ordA = a.ord != null ? a.ord : i + 1, ordB = b.ord != null ? b.ord : j + 1;
    if (!DB) { const l = spots.slice(); l[i] = b; l[j] = a; setSpots(l); return; }
    const r1 = await DB.from('pop_spots').update({ ord: ordB }).eq('id', a.id);
    const r2 = await DB.from('pop_spots').update({ ord: ordA }).eq('id', b.id);
    if ((r1 && r1.error) || (r2 && r2.error)) return alert('เลื่อนลำดับไม่สำเร็จ — ต้องรัน SQL เพิ่มคอลัมน์ ord ก่อนครับ');

      if (!error && data && stamp === shopStamp.current) { setShopOpen(!!data.open); setShopRain(data.rain == null ? null : !!data.rain); setShopNightOff(data.night_off == null ? null : !!data.night_off); }

  const shopStamp = React.useRef(0);

  const bnOnly = banners.filter(b => b.color !== 'showcase' && b.color !== 'clip'); // แบนเนอร์จริง (ลิสต์ล่างห้ามโชว์แถวรูปงาน/คลิป)

  };
  const closeAlert = async () => {
    if (DB) { await DB.from('banners').update({ active: false }).eq('color', 'alert'); await loadBanners(); }
    else setBanners(l => l.map(x => x.color === 'alert' ? { ...x, active: false } : x));
  };
  const deleteAlert = async () => {
    if (DB) { await DB.from('banners').delete().eq('color', 'alert'); await loadBanners(); }
    else setBanners(l => l.filter(x => x.color !== 'alert'));
  };

  // ออเดอร์ที่ยกเลิกเกิน 2 ชั่วโมง = ลบถาวรอัตโนมัติจากทุกที่ (นโยบายร้าน) — ต้องมีคอลัมน์ cancelled_at (trigger ในฐานข้อมูลตีเวลาให้)
  const cancelledExpired = (o) => o.status === 0 && o.cancelled_at && (Date.now() - new Date(o.cancelled_at).getTime() > 2 * 60 * 60 * 1000);
  const purgeCancelled = (rows) => {
    rows.filter(cancelledExpired).slice(0, 6).forEach(async (o) => {
      try {
        const paths = (o.files || []).map(f => f.path).filter(Boolean);
        if (o.slip_path) paths.push(o.slip_path);
        if (paths.length) { const { error: se } = await DB.storage.from('uploads').remove(paths); if (se) return; } // ลบไฟล์ไม่สำเร็จ = ข้ามรอบนี้ กันไฟล์กำพร้า (แชทถูก trigger ฐานข้อมูลลบตามเอง)
        await DB.from('orders').delete().eq('id', o.id);
      } catch (e) {}
    });
  };

  // ── ลบไฟล์ของออเดอร์ที่ส่งสำเร็จเกิน 7 วัน (นโยบายเจ้าของ 2026-10-09) — กันคลังไฟล์ 1GB เต็มจนอัปโหลดพังทั้งเว็บ ──
  // ลบเฉพาะตัวไฟล์ PDF+สลิปในคลัง: แถวออเดอร์/ยอดเงิน/ประวัติอยู่ครบ แล้วตีตรา files_purged_at ให้หลังบ้านขึ้นป้าย 🧹 แทนปุ่มเปิดไฟล์
  // (ไฟล์ใหญ่บน B2 ไม่แตะ — คลังแยก 10GB) ทำงานเงียบ ๆ ตอนเปิดหลังบ้าน ครั้งละ ≤5 ใบ เหมือนระบบลบออเดอร์ยกเลิก
  const FILE_KEEP_MS = 7 * 24 * 60 * 60 * 1000;
  const autoPurgeFiles = async (rows) => {
    if (window.__purgeFilesOff) return;
    if (!window.__purgeColOk) {
      const { error } = await DB.from('orders').select('files_purged_at').limit(1);
      if (error) { window.__purgeFilesOff = true; return; } // คอลัมน์ยังไม่ถูกเพิ่ม (รอ SQL เจ้าของ) — ห้ามลบไฟล์ก่อนตีตราได้ เดี๋ยวป้ายเพี้ยนเป็น "อัปไม่สำเร็จ"
      window.__purgeColOk = true;
    }
    const due = rows.filter(o => o.status === 4 && !o.files_purged_at && o.created_at && (Date.now() - new Date(o.created_at).getTime() > FILE_KEEP_MS));
    for (const o of due.slice(0, 5)) {
      try {
        const paths = (o.files || []).map(f => f.path).filter(Boolean);
        if (o.slip_path) paths.push(o.slip_path);
        paths.push(o.id.replace('#', '') + '/slip-re.jpg'); // สลิปที่ลูกค้าส่งใหม่ path ตายตัว ไม่อยู่ในแถว — ลบเผื่อไว้ (ไม่มีไฟล์ = ระบบข้ามเอง)
        const { error: se } = await DB.storage.from('uploads').remove(paths);
        if (se) continue; // ลบไฟล์ไม่สำเร็จ = ข้ามใบนี้รอบนี้ กันตีตราทั้งที่ไฟล์ยังอยู่
        await DB.from('orders').update({ files_purged_at: new Date().toISOString() }).eq('id', o.id);
      } catch (e) {}
    }
  };
  // ── เสียงเรียกออเดอร์ใหม่ (OrderAlarm) — เปิด/ปิดที่ปุ่มกระดิ่งบนแถบหัว จำค่าไว้ในเครื่องนี้ ──
  const [alarmOn, setAlarmOn] = React.useState(() => { try { return localStorage.getItem('mp_alarm') === '1'; } catch (e) { return false; } });
  const [alarmArmed, setAlarmArmed] = React.useState(false); // ปลดล็อกเสียงแล้วรอบนี้ (เปิดหน้าใหม่ต้องแตะจอ 1 ครั้ง)
  const [ringList, setRingList] = React.useState([]);
  const ringListRef = React.useRef([]);
  ringListRef.current = ringList;
  const ringRef = React.useRef(null);
  ringRef.current = (fresh) => {
    if (!alarmOn) return;
    setRingList(l => l.concat(fresh.filter(o => !l.some(x => x.id === o.id))));
    OrderAlarm.start();
  };
  const refresh = React.useCallback(async () => {
    if (!DB) return;
    try {
      const { data, error } = await DB.from('orders').select('*').order('created_at', { ascending: false }).limit(1000);
      // งาน Pro แยกไปบริหารที่ pro.html (ของร้านพาร์ทเนอร์) — หลังบ้านหลักเห็นเฉพาะงาน Standard ของเรา
      if (!error && data) {
        const meta = {};
        data.forEach(o => { meta[o.id] = { ptype: o.ptype, fname: o.customer_fname, lname: o.customer_lname, phone: o.customer_phone, addr: o.addr, aphone: o.phone, total: o.total, status: o.status }; });
        setOrderMeta(meta);
        setOrders(data.filter(o => o.ptype !== 'pro' && !cancelledExpired(o)));
        setLastSync(new Date());
        const fresh = takeNewOrders(data.filter(o => o.ptype !== 'pro'), 'mp_alarm_std'); // ออเดอร์ Standard ใหม่ → เสียงเรียก (งาน Pro ดังที่ pro.html)
        if (fresh.length) ringRef.current(fresh);
        purgeCancelled(data); // แอดมินเก็บกวาดให้ทุกประเภทงาน รวมงาน Pro ด้วย
        autoPurgeFiles(data); // ลบไฟล์ออเดอร์ส่งสำเร็จเกิน 7 วัน (ไม่ await — ทำเบื้องหลัง)
      }
    } catch (e) { console.error(e); }
    setLoading(false);
  }, []);

  React.useEffect(() => {
    if (!authed || !DB) return;
    refresh();
    const t = setInterval(refresh, 15000);
    return () => clearInterval(t);
  }, [authed, refresh]);
  React.useEffect(() => { // เปิดหน้าใหม่ทั้งที่เปิดเสียงค้างไว้ → แตะตรงไหนก็ได้ 1 ครั้ง = ปลดล็อกเสียง + ขอจอไม่ดับ
    if (!alarmOn || alarmArmed) return;
    OrderAlarm.el(); // โหลดเสียงรอไว้ก่อน — ตอนแตะจะได้ข้ามไปช่วงเงียบได้ทันที
    const go = () => { OrderAlarm.arm().then(ok => { if (ok) setAlarmArmed(true); }); OrderAlarm.wakeOn(); };
    ['touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, go));
    return () => ['touchend', 'click', 'keydown'].forEach(ev => document.removeEventListener(ev, go));
  }, [alarmOn, alarmArmed]);
  React.useEffect(() => { // กลับมาที่หน้านี้ (ปลดล็อกจอ/สลับแอปกลับ) → ขอจอไม่ดับใหม่ + ดึงออเดอร์ทันที ไม่ต้องรอรอบ 15 วิ
    if (!alarmOn) return;
    OrderAlarm.wakeOn();
    const vis = () => { if (document.visibilityState === 'visible') { OrderAlarm.wakeOn(); if (authed) refresh(); } };
    document.addEventListener('visibilitychange', vis);
    return () => document.removeEventListener('visibilitychange', vis);
  }, [alarmOn, authed, refresh]);
  React.useEffect(() => { // ชื่อแท็บกะพริบระหว่างเสียงดัง
    if (!ringList.length) return;
    const orig = document.title; let n = 0;
    const iv = setInterval(() => { document.title = (n++ % 2 === 0) ? '🔔 ออเดอร์ใหม่! (' + ringList.length + ')' : orig; }, 900);
    return () => { clearInterval(iv); document.title = orig; };
  }, [ringList.length]);
  const toggleAlarm = () => {
    if (alarmOn) {
      OrderAlarm.stop(); OrderAlarm.wakeOff(); setRingList([]); setAlarmOn(false); setAlarmArmed(false);
      try { localStorage.setItem('mp_alarm', '0'); } catch (e) {}
      return;
    }
    try { localStorage.setItem('mp_alarm', '1'); } catch (e) {}
    setAlarmOn(true); setAlarmArmed(true);
    OrderAlarm.arm(); OrderAlarm.wakeOn();
    OrderAlarm.start(); // ดังตัวอย่าง 2 วิ ให้รู้ว่าเสียงดังพอไหม
    setTimeout(() => { if (!ringListRef.current.length) OrderAlarm.stop(); }, 2200);
    // โหมดตัวอย่าง (ไม่มีฐานข้อมูล): จำลองออเดอร์ใหม่เข้าใน 4 วิ ให้เห็นหน้าตาตอนเสียงเรียกจริง
    if (!DB) setTimeout(() => ringRef.current([{ id: '#MP-DEMO' + String(Date.now()).slice(-4), created_at: new Date().toISOString(), status: 1, ptype: 'bw', total: 45, customer_fname: 'ตัวอย่าง', addr: '🏍️ หอพักใน มข.', express: true }]), 4000);
  };
  const ackAlarm = () => { OrderAlarm.stop(); setRingList([]); setTab('orders'); setFilter('pending'); };

  if (!authed) return <AdminLogin onOk={() => setAuthed(true)}/>;

  const advance = async (o) => {
    const next = Math.min(o.status + 1, 4);
    const times = (o.times || ['', '', '', '']).slice();
    times[next - 1] = fmtTime(new Date());
    if (DB) {
      setBusyId(o.id);
      try {
        await DB.from('orders').update({ status: next, times }).eq('id', o.id);
        // งานเสร็จ/ส่งสำเร็จ → แจ้งกลุ่ม LINE ทีมงาน (ยิงแบบไม่รอผล — EF เช็คสถานะจริงเอง)
        // ปิดชั่วคราวเพื่อประหยัดโควตาไลน์ 300 ข้อความ/เดือน (นโยบายเจ้าของ 2026-08-24) — เปิดกลับได้โดยลบเครื่องหมายคอมเมนต์
        // if (next >= 3) { try { fetch(CFG.SUPABASE_URL + '/functions/v1/notify-order?action=done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id }) }); } catch (e) {} }
        await refresh();
      }
      catch (e) { console.error(e); }
      setBusyId(null);
    } else {
      setOrders(list => list.map(x => x.id === o.id ? { ...x, status: next, times } : x));
    }
  };

  // ย้อนสถานะกลับ 1 ขั้น (เผื่อกดผิด) — ล้างเวลาของขั้นที่ถอยออกด้วย หน้าติดตามลูกค้าจะกลับไปตรงตามจริง
  const retreat = async (o) => {
    if (!o.status || o.status < 2 || o.status > 4) return; // ต่ำสุดคือ "รับออเดอร์" · ใบยกเลิกห้ามแตะ
    const prev = o.status - 1;
    const times = (o.times || ['', '', '', '']).slice();
    times[o.status - 1] = '';
    if (DB) {
      setBusyId(o.id);
      try { await DB.from('orders').update({ status: prev, times }).eq('id', o.id); await refresh(); }
      catch (e) { console.error(e); }
      setBusyId(null);
    } else setOrders(list => list.map(x => x.id === o.id ? { ...x, status: prev, times } : x));
  };

  // บิลแก้ไขรวม (เจ้าของสั่ง 2026-09-15): เพิ่ม/ลดหลายรายการ + เปลี่ยนการรับงาน/จุดส่ง พร้อมกันได้ → อัปเดตฐานข้อมูลครั้งเดียว + แชทแจ้งยอดสุทธิ (พร้อม QR ถ้าต้องโอนเพิ่ม) ครั้งเดียว
  const applyEdits = async (o, items, sd) => {
    const now = new Date().toISOString();
    const adjs = [...(o.adjustments || []), ...items.map(it => ({ label: it.label, amt: it.amt, at: now }))];
    const lines = items.map(it => it.amt > 0 ? '• เพิ่ม "' + it.label + '" +฿' + it.amt : '• ลด "' + it.label + '" −฿' + (-it.amt));
    let upd = {}, sdDiff = 0;
    if (sd) {
      const oldFee = Number(o.delivery_cost) || 0;
      const toPickup = sd.mode === 'pickup';
      sdDiff = toPickup ? -oldFee : sd.fee - oldFee;
      const adjLabel = toPickup ? 'เปลี่ยนเป็นมารับเองที่ร้าน — คืนค่าส่ง' : (o.pickup ? 'เปลี่ยนเป็นจัดส่งถึงที่ — ค่าส่ง' : 'แก้จุดส่ง/ค่าส่งใหม่');
      if (sdDiff !== 0) adjs.push({ label: adjLabel, amt: sdDiff, at: now, kind: 'ship' }); // kind:'ship' = ค่าส่ง ไม่เข้าฐานแบ่ง 80/20
      upd = { pickup: toPickup, addr: toPickup ? '🏪 มารับเองที่ร้าน (เปลี่ยนตามที่ลูกค้าแจ้ง)' : (sd.veh === 'car' ? '🚗 ' : '🏍️ ') + sd.addr, delivery_cost: toPickup ? 0 : sd.fee };
      lines.push(toPickup ? '• เปลี่ยนเป็นมารับเองที่ร้าน' + (oldFee > 0 ? ' — คืนค่าส่ง −฿' + oldFee : '')
        : '• ' + adjLabel + ' (' + (sd.veh === 'car' ? '🚗 รถยนต์' : '🏍️ มอเตอร์ไซค์') + ') ' + (sdDiff > 0 ? '+฿' + sdDiff : sdDiff < 0 ? '−฿' + (-sdDiff) : 'ค่าส่ง ฿' + sd.fee + ' เท่าเดิม') + '\n   จุดส่ง: ' + sd.addr);
    }
    const net = items.reduce((s, it) => s + it.amt, 0) + sdDiff;
    // ฐาน = บิลปัจจุบัน (o.total); เผื่อออเดอร์เก่าไม่มี total ค่อยคำนวณจากส่วนประกอบ
    const base = Number(o.total) || Math.max(0, (o.print_cost || 0) + (o.bind_cost || 0) + (o.delivery_cost || 0) + (o.night_fee || 0) + (o.adjustments || []).reduce((s, a) => s + (Number(a.amt) || 0), 0) - (o.discount || 0));
    const newTotal = Math.max(0, Math.round(base + net));
    upd = { ...upd, total: newTotal, adjustments: adjs };
    if (!DB) { setOrders(list => list.map(x => x.id === o.id ? { ...x, ...upd } : x)); return; }
    setBusyId(o.id);
    try {
      const { error } = await DB.from('orders').update(upd).eq('id', o.id);
      if (error) { alert(/adjustments/.test(String(error.message || '')) ? 'ยังไม่ได้รัน SQL เพิ่มคอลัมน์ adjustments ครับ' : 'บันทึกไม่สำเร็จ: ' + error.message); setBusyId(null); return; }
      const tail = net > 0 ? '\nยอดรวมล่าสุด ฿' + newTotal + '\nรบกวนสแกน QR นี้ชำระเพิ่ม ฿' + net + ' แล้วแนบสลิปในแชทนี้ได้เลยครับ 🙏'
      : net < 0 ? '\nยอดรวมล่าสุด ฿' + newTotal + ' — ร้านจะโอนคืน ฿' + (-net) + ' ครับ\nรบกวนพิมพ์เลขพร้อมเพย์/เลขบัญชี หรือส่งรูป QR ธนาคารของคุณในแชทนี้ เดี๋ยวร้านโอนคืนให้เร็วที่สุดครับ 🙏'
      : '\nยอดรวมเท่าเดิม ฿' + newTotal + ' — ไม่ต้องโอนเพิ่มครับ ✓';
      const text = '🛠️ ร้านแก้ไขออเดอร์ตามที่คุยกันครับ\n' + lines.join('\n') + tail;
      await DB.from('messages').insert({ order_id: o.id, sender: 'shop', body: text, seen_by_shop: true, ...(net > 0 ? { img: 'chat/shop/promptpay-qr.jpg' } : {}) });
      try { fetch(CFG.SUPABASE_URL + '/functions/v1/notify-order?action=msg', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id, text }) }); } catch (e) {}
      await refresh();
    } catch (e) { console.error(e); alert('บันทึกไม่สำเร็จ ลองใหม่ครับ'); }
    setBusyId(null);
  };

  const cancel = async (o, reason) => {
    if (DB) {
      setBusyId(o.id);
      try {
        await DB.from('orders').update({ status: 0, cancel_reason: reason }).eq('id', o.id);
        // แจ้งลูกค้าทาง LINE (เฉพาะคนที่ล็อกอินด้วย LINE — ล้มเหลวไม่กระทบการยกเลิก)
        try { fetch(CFG.SUPABASE_URL + '/functions/v1/notify-order?action=cancelled', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id }) }); } catch (e) {}
        await refresh();
      }
      catch (e) { console.error(e); }
      setBusyId(null);
    } else {
      setOrders(list => list.map(x => x.id === o.id ? { ...x, status: 0, cancel_reason: reason } : x));
    }
  };

  // ดาวน์โหลดข้อมูลออเดอร์ทั้งหมดเป็นไฟล์ CSV (เปิดใน Excel ได้ ภาษาไทยไม่เพี้ยน)
  const exportCsv = () => {
    const esc = (v) => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const STL = ['ยกเลิก', 'รับออเดอร์', 'กำลังปริ้น', 'กำลังจัดส่ง', 'ส่งแล้ว'];
    const head = ['รหัสออเดอร์', 'วันที่สั่ง', 'สถานะ', 'ชื่อลูกค้า', 'เบอร์ลูกค้า', 'อีเมล', 'ประเภทงาน', 'ขนาด', 'ด้านที่พิมพ์', 'ทิศทางกระดาษ', 'หน้าต่อแผ่น', 'เข้าเล่ม', 'จำนวนชุด', 'จำนวนหน้า', 'รายชื่อไฟล์', 'จุดส่ง', 'ที่อยู่', 'เบอร์ผู้รับ', 'เวลารับ', 'ส่งด่วน', 'กลางคืน', 'ค่าปริ้น', 'ค่าเข้าเล่ม', 'ค่าส่ง', 'ค่างานด่วน', 'ค่ากลางคืน', 'โค้ดส่วนลด', 'ส่วนลด', 'ยอดรวม', 'เหตุผลที่ยกเลิก'];
    const rows = orders.map(o => [
      o.id, new Date(o.created_at).toLocaleString('th-TH'), STL[o.status] != null ? STL[o.status] : o.status,
      ((o.customer_fname || '') + ' ' + (o.customer_lname || '')).trim(), o.customer_phone || '', o.customer_email || '',
      o.ptype ? (PTYPE_LABELS[o.ptype] || o.ptype) : (o.color ? 'ปริ้นสี' : 'ปริ้นขาวดำ'), o.paper || '',
      o.sides === 2 ? 'หน้า-หลัง' : 'หน้าเดียว',
      o.orient ? (o.orient === 'landscape' ? 'แนวนอน' : 'แนวตั้ง') : '',
      o.nup ? o.nup + ' หน้า/แผ่น' : '',
      BIND_LABELS[o.bind] || (o.bind && o.bind !== 'none' ? 'เข้าเล่ม ' + o.bind : (o.ptype === 'pro' ? '' : 'ไม่เย็บมุม')),
      o.copies || 1, (o.files || []).reduce((a, f) => a + (f.pages || 0), 0),
      (o.files || []).map(f => f.name).join(' | '), o.point || '', o.addr || '', o.phone || '', o.time || '',
      o.express ? 'ใช่' : '', o.night ? 'ใช่' : '',
      o.print_cost || 0, o.bind_cost || 0, o.express ? Math.max(0, (o.delivery_cost || 0) - EXPRESS_FEE) : (o.delivery_cost || 0), o.express ? EXPRESS_FEE : 0, o.night_fee || 0, o.coupon || '', o.discount || 0, o.total || 0, o.cancel_reason || ''
    ]);
    const csv = '\ufeff' + [head].concat(rows).map(r => r.map(esc).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date();
    a.download = 'moreprint-orders-' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
  };

  // ลบออเดอร์ที่ยกเลิกแล้วแบบถาวร (ลบไฟล์เอกสาร+สลิปในคลังด้วย เพื่อคืนพื้นที่)
  const removeOrder = async (o) => {
    if (DB) {
      setBusyId(o.id);
      try {
        const paths = [];
        (o.files || []).forEach(f => { if (f.path) paths.push(f.path); });
        if (o.slip_path) paths.push(o.slip_path);
        if (paths.length) { const { error: se } = await DB.storage.from('uploads').remove(paths); if (se) { alert('ลบไฟล์แนบไม่สำเร็จ ลองใหม่อีกครั้งครับ'); setBusyId(null); return; } }
        await DB.from('orders').delete().eq('id', o.id);
        await refresh();
      } catch (e) { console.error(e); }
      setBusyId(null);
    } else {
      setOrders(list => list.filter(x => x.id !== o.id));
    }
  };

  // ล้างเฉพาะ "ไฟล์" ของออเดอร์ที่จบงานแล้ว (ส่งสำเร็จ/ยกเลิก) เกิน 7 วัน — ข้อมูลตัวเลข/สถิติอยู่ครบ
  // (2026-10-09 ลด 30→7 วันตามนโยบายเจ้าของ + เปลี่ยนมาตีตรา files_purged_at แทนการล้าง path — ป้ายขึ้น 🧹 ไม่ปนกับ "ไฟล์อัปไม่สำเร็จ";
  //  ระบบอัตโนมัติ autoPurgeFiles ทำงานเองทุกครั้งที่เปิดหลังบ้านอยู่แล้ว ปุ่มนี้ไว้กดกวาดทั้งหมดทันที)
  const purgeOldFiles = async () => {
    if (!purgeConfirm) {
      setPurgeConfirm(true);
      setTimeout(() => setPurgeConfirm(false), 5000);
      return;
    }
    setPurgeConfirm(false);
    if (!DB) { setPurgeResult('โหมดตัวอย่าง — ไม่มีไฟล์จริงให้ล้าง'); return; }
    setPurgeBusy(true); setPurgeResult('');
    try {
      const probe = await DB.from('orders').select('files_purged_at').limit(1);
      if (probe.error) { setPurgeResult('ยังใช้ไม่ได้ — ต้องรัน SQL เพิ่มคอลัมน์ files_purged_at ก่อนครับ'); setPurgeBusy(false); return; }
      const cutoff = new Date(Date.now() - FILE_KEEP_MS).toISOString();
      const { data } = await DB.from('orders').select('id,files,slip_path')
        .in('status', [0, 4]).is('files_purged_at', null).lt('created_at', cutoff).limit(500);
      let nFiles = 0, nOrders = 0;
      for (const o of (data || [])) {
        const paths = [];
        (o.files || []).forEach(f => { if (f.path) paths.push(f.path); });
        if (o.slip_path) paths.push(o.slip_path);
        const real = paths.length;
        paths.push(o.id.replace('#', '') + '/slip-re.jpg'); // สลิปส่งใหม่ path ตายตัว — ลบเผื่อ (ไม่มี = ระบบข้ามเอง)
        const { error } = await DB.storage.from('uploads').remove(paths);
        if (!error) {
          nFiles += real; nOrders++;
          await DB.from('orders').update({ files_purged_at: new Date().toISOString() }).eq('id', o.id);
        }
      }
      setPurgeResult(nOrders ? '✓ ล้างแล้ว ' + nFiles + ' ไฟล์ จาก ' + nOrders + ' ออเดอร์ — ข้อมูลยอดขายอยู่ครบทุกรายการ' : 'ยังไม่มีไฟล์เก่าเกิน 7 วันให้ล้างครับ');
      await refresh();
    } catch (e) { console.error(e); setPurgeResult('เกิดข้อผิดพลาด ลองอีกครั้งครับ'); }
    setPurgeBusy(false);
  };

  // สถิติ (ไม่นับออเดอร์ที่ยกเลิก)
  const today = new Date().toDateString();
  const todayOrders = orders.filter(o => new Date(o.created_at).toDateString() === today);
  const todayActive = todayOrders.filter(o => o.status !== 0);
  const revenue = todayActive.reduce((a, o) => a + (o.total || 0), 0);
  const pending = orders.filter(o => o.status >= 1 && o.status < 4).length;

  // ── ตัวเลขหน้าหลัก (ภาพรวมร้านค้า) ──
  const doneToday = todayOrders.filter(o => o.status === 4).length;
  const recent5 = orders.slice(0, 5);
  const week7 = (() => { // ยอดขาย 7 วันล่าสุด (ไม่นับที่ยกเลิก)
    const out = [];
    const n0 = new Date();
    for (let i = 6; i >= 0; i--) {
      const d0 = new Date(n0.getFullYear(), n0.getMonth(), n0.getDate() - i);
      const d1 = new Date(n0.getFullYear(), n0.getMonth(), n0.getDate() - i + 1);
      const sum = orders.filter(o => { if (o.status === 0) return false; const t = new Date(o.created_at); return t >= d0 && t < d1; })
        .reduce((a, o) => a + (o.total || 0), 0);
      out.push({ label: i === 0 ? 'วันนี้' : d0.getDate() + '/' + (d0.getMonth() + 1), v: sum });
    }
    const max = Math.max(1, ...out.map(b => b.v));
    return out.map(b => ({ ...b, h: Math.round(b.v / max * 100) }));
  })();
  const popular = (() => { // งานยอดนิยม (นับจากออเดอร์ที่โหลดอยู่ ไม่นับที่ยกเลิก)
    const m = {};
    orders.forEach(o => { if (o.status === 0) return; const k = jobLabelOf(o); m[k] = (m[k] || 0) + 1; });
    const total = Object.values(m).reduce((a, n) => a + n, 0) || 1;
    return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, n]) => ({ label: k, n, pct: Math.round(n / total * 100) }));
  })();

  // ── ลูกค้าประจำ (เฉพาะงาน Standard): จัดกลุ่มตามเบอร์โทร ไม่นับออเดอร์ที่ยกเลิก ──
  // custRows = ประวัติเต็ม (โหลดตอนเปิดแท็บลูกค้า/สถิติ) — ยังไม่มาก็ใช้ orders ในหน้าไปก่อน
  const custMap = {};
  (custRows || orders).forEach(o => {
    if (o.status === 0) return;
    const k = o.customer_phone || o.phone || '?';
    if (!custMap[k]) custMap[k] = { name: ('คุณ' + (o.customer_fname || '') + ' ' + (o.customer_lname || '')).trim(), phone: k, count: 0, total: 0, last: o.created_at, jobs: {} };
    const c = custMap[k];
    c.count++; c.total += o.total || 0;
    const jl = jobLabelOf(o);
    c.jobs[jl] = (c.jobs[jl] || 0) + 1;
    if (o.created_at > c.last) c.last = o.created_at;

  const customers = Object.values(custMap).map(c => ({
    ...c,
    topJobs: Object.entries(c.jobs).sort((a, b) => b[1] - a[1]).slice(0, 2), // งานที่สั่งบ่อยสุด 2 อันดับ
    tier: c.count >= 5 ? 2 : c.count >= 2 ? 1 : 0
  })).sort((a, b) => custSort === 'total' ? b.total - a.total
    : custSort === 'last' ? (b.last > a.last ? 1 : -1)
    : (b.count - a.count || b.total - a.total));
  const custShown = customers.filter(c => !custQ.trim() || (c.name + ' ' + c.phone).toLowerCase().includes(custQ.trim().toLowerCase()));

  // ── สถิติแดชบอร์ด ──
  const now = new Date();

  const pToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const pWeek = new Date(pToday); pWeek.setDate(pToday.getDate() - ((pToday.getDay() + 6) % 7)); // จันทร์ต้นสัปดาห์นี้
  const PERIODS = [['day', 'วันนี้', pToday], ['week', 'สัปดาห์นี้', pWeek], ['month', 'เดือนนี้', new Date(now.getFullYear(), now.getMonth(), 1)], ['year', 'ปีนี้', new Date(now.getFullYear(), 0, 1)]];
  const curP = PERIODS.find(x => x[0] === period) || PERIODS[0];
  const inPeriod = (o) => new Date(o.created_at) >= curP[2];
  const ordActive = orders.filter(o => o.status >= 1 && o.status < 4);
  const ordDone = orders.filter(o => o.status === 4 && inPeriod(o)).sort((a, b) => new Date(b.created_at) - new Date(a.created_at)); // งานเพิ่งเสร็จอยู่บนสุด แต่เลขลำดับนับจากเก่าสุด=1 ที่ล่างสุด (เจ้าของปรับ 2026-09-27 — ดูเลข idx ตอนเรนเดอร์)
  const ordCancel = orders.filter(o => o.status === 0 && inPeriod(o));
  const statusShown = filter === 'done' ? ordDone : filter === 'cancelled' ? ordCancel : ordActive;
  // กรองตามโซนไรเดอร์
  const zoneCounts = {};
  statusShown.forEach(o => { const z = zoneOf(o.lat, o.lng); if (z) zoneCounts[z.name] = (zoneCounts[z.name] || 0) + 1; });
  const shown = zoneFilter === 'all' ? statusShown
    : statusShown.filter(o => { const z = zoneOf(o.lat, o.lng); return z && z.name === zoneFilter; });

  const NAV = [
    ['home', FI.home(17), 'ภาพรวม'], ['orders', FI.clipboard(17), 'ออเดอร์'], ['chats', FI.chat(17), 'ข้อความ'],
    ['stats', FI.chart(17), 'ยอดขาย'], ['customers', FI.users(17), 'ลูกค้า'], ['banners', FI.volume(17), 'โปรโมชั่น']
  ];
  const unreadTotal = Object.values(unreadMap).reduce((a, n) => a + n, 0);
  return (
    <div>
      {/* ── แถบเมนูซ้าย (ตามเรฟ) ── */}

        <div style={css("display:flex;align-items:center;gap:10px;padding:2px 8px 14px;border-bottom:1px solid #2b2b27")}>
          <div style={css("width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none")}><img src="assets/logo-icon.png" alt="" style={css("width:27px;height:auto;display:block")}/></div>
          <div style={css("min-width:0")}>
            <div style={css("font-family:'Montserrat',sans-serif;font-weight:800;font-size:13.5px;letter-spacing:1px;color:#fff")}><span style={css("color:var(--accBright)")}>MORE</span> PRINT</div>
            <div style={css("font-size:9.5px;color:#96968c;margin-top:2px")}>หลังบ้านร้าน (Standard)</div>
          </div>
          <button className="mp-close" onClick={() => setNavOpen(false)} style={css("margin-left:auto;background:none;border:none;color:#96968c;font-size:16px;cursor:pointer;flex:none")}>✕</button>
        </div>
        <div style={css("margin-top:12px;display:flex;flex-direction:column;gap:4px;flex:1")}>
          {NAV.map(([k, ic, label]) => (
            <button key={k} onClick={() => { setTab(k); setNavOpen(false); }} style={{ display: 'flex', alignItems: 'center', gap: '10px', height: '42px', padding: '0 12px', borderRadius: '11px', border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: '13px', fontWeight: 700, textAlign: 'left', position: 'relative',
              background: tab === k ? 'var(--acc)' : 'transparent', color: tab === k ? '#fff' : '#c9c9c2' }}>
              <span style={css("font-size:16px")}>{ic}</span>{label}
              {k === 'chats' && unreadTotal > 0 && <span style={css("margin-left:auto;min-width:17px;height:17px;border-radius:99px;background:#c92a2a;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px")}>{unreadTotal}</span>}
            </button>
          ))}
          <a href="commission.html" style={css("display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:11px;font-size:13px;font-weight:700;color:#e6c366;text-decoration:none")}><span style={css("line-height:0")}>{FI.baht(16)}</span>งาน PRO / ค่าคอม</a>
        </div>
        {DB && <button onClick={() => DB.auth.signOut().then(() => location.reload())} style={css("display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:11px;border:1px solid #2b2b27;background:none;color:#96968c;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700")}>⎋ ออกจากระบบ</button>}
      </div>
      <div className={"mp-scrim" + (navOpen ? " show" : "")} onClick={() => setNavOpen(false)}></div>

      <div className="mp-main">
    <div className="mp-content" style={css("max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;color:var(--ink)")}>
      <div style={css("background:var(--head);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10")}>

          <div style={css("width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.15)")}><img src="assets/logo-icon.png" alt="" style={css("width:29px;height:auto;display:block")}/></div>
          <div>
            <div style={css("font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;letter-spacing:1.2px;line-height:1")}><span style={css("color:var(--accBright)")}>MORE</span> <span style={css("color:#fff")}>PRINT</span></div>
            <div style={css("font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--accBright);margin-top:3px;letter-spacing:1.5px")}>OWNER DASHBOARD</div>

        <div style={css("display:flex;align-items:center;gap:10px")}>
          {DB && <button onClick={refresh} style={css("background:#2a2a2a;border:none;color:#fff;height:32px;padding:0 12px;border-radius:9px;font-size:12px;cursor:pointer")}>⟳ รีเฟรช</button>}

        </div>

          <span style={css("color:var(--acc);line-height:0")}>{FI.bell(16)}</span><span style={css("flex:1;min-width:0;line-height:1.45")}><b>เสียงเรียกออเดอร์ใหม่เปิดอยู่</b> <span style={css("color:var(--sub)")}>· เปิดหน้านี้ค้างไว้ จอจะไม่ดับเอง</span></span>
          <button onClick={toggleAlarm} style={css("flex:none;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--sub);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit")}>ปิดเสียง</button>
        </div>
      )}
      {ringList.length > 0 && <AlarmPopup list={ringList} onAck={ackAlarm} line={(o) => (
        <React.Fragment>
          <div style={css("display:flex;justify-content:space-between;gap:8px;font-weight:800")}><span>{o.id}</span><span style={css("color:var(--acc)")}>{baht(o.total)}</span></div>
          <div style={css("color:var(--sub)")}>คุณ{o.customer_fname || '-'} · {PTYPE_LABELS[o.ptype] || o.ptype || 'งานปริ้น'} · {(o.pickup || (o.addr || '').indexOf('🏪') === 0) ? 'มารับเองที่ร้าน' : 'จัดส่ง'}{o.express ? <b style={css("color:#c92a2a")}> · งานด่วน</b> : null}</div>
        </React.Fragment>

          ⚠️ <b>โหมดตัวอย่าง</b> — ยังไม่ได้เชื่อมฐานข้อมูล ข้อมูลด้านล่างเป็นเพียงตัวอย่าง เชื่อม Supabase ใน <span style={css("font-family:'IBM Plex Mono',monospace")}>config.js</span> เพื่อเห็นออเดอร์จริงจากลูกค้า
        </div>
      )}

      {tab === 'home' && (
        <div style={css("padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px")}>
          <div>
            <div style={css("font-size:17px;font-weight:800")}>ภาพรวมร้านค้า</div>
            <div style={css("font-size:11px;color:var(--sub);margin-top:2px")}>{new Date().toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
          </div>

          {/* สวิตช์เปิด/ปิดรับออเดอร์หน้าเว็บลูกค้า */}
          <div style={css("background:var(--card);border:1.5px solid " + (shopOpen === false ? "#ffa8a8" : "var(--line)") + ";border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px")}>
            <div style={css("width:12px;height:12px;border-radius:50%;flex:none;background:" + (shopOpen === false ? "#e03131" : shopOpen ? "#2f9e44" : "var(--line)") + (shopOpen !== false ? ";animation:mpPulse 2s infinite" : ""))}></div>
            <div style={css("flex:1;min-width:0")}>
              <div style={css("font-size:13.5px;font-weight:800")}>หน้าเว็บลูกค้า: {shopOpen === false ? 'ปิดรับออเดอร์อยู่' : shopOpen ? 'เปิดรับออเดอร์ปกติ' : 'กำลังเช็คสถานะ…'}</div>
              <div style={css("margin-top:1px;font-size:10.5px;color:var(--sub)")}>{shopOpen === false ? 'ลูกค้าเห็นป้ายปิดรับชั่วคราว สั่งงานไม่ได้ — กดเปิดเมื่อพร้อมรับงาน' : 'ไม่พร้อมรับงานเมื่อไหร่ กดปิดได้เลย ลูกค้าจะสั่งไม่ได้จนกว่าจะเปิดใหม่'}</div>
            </div>
            <button onClick={toggleShop} disabled={shopBusy || shopOpen === null}
              style={css("flex:none;height:40px;padding:0 18px;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;background:" + (shopOpen === false ? "#2f9e44" : "#e03131") + ((shopBusy || shopOpen === null) ? ";opacity:.5" : ""))}>
