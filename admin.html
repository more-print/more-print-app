            </div>
            <div>
              <div style={css("font-size:11px;font-weight:600;color:var(--sub)")}>หรือใช้รูปที่ออกแบบเอง — ขนาดแนะนำ <b>1200 × 400 px (แนวนอน 3:1)</b> ไฟล์ JPG/PNG</div>
              <input type="file" accept="image/*" onChange={e => setBnFile((e.target.files || [])[0] || null)} style={css("margin-top:4px;font-size:12px;width:100%")}/>
              {bnFile && <div style={css("margin-top:2px;font-size:11px;color:var(--acc);font-weight:600")}>✓ {bnFile.name} — พรีวิวด้านล่างคือหน้าตาที่ลูกค้าจะเห็นจริง</div>}
            </div>
            <div style={css("border-radius:12px;overflow:hidden")}>
              {bnPreview
                ? <img src={bnPreview} alt="" style={css("width:100%;aspect-ratio:3/1;object-fit:cover;display:block")}/>
                : <div style={{ background: BANNER_THEMES[bnColor], color: '#fff', padding: '14px 16px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <div style={{ fontSize: '28px', flex: 'none' }}>{bnEmoji || '🎉'}</div>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontSize: '14px', fontWeight: 700 }}>{bnTitle || 'ตัวอย่างข้อความหลัก'}</div>
                      {bnSub && <div style={{ fontSize: '11px', opacity: .88, marginTop: '2px' }}>{bnSub}</div>}
                    </div>
                  </div>}
            </div>
            <button onClick={addBanner} disabled={bnBusy || (!bnTitle.trim() && !bnFile)}
              style={{ height: '44px', border: 'none', borderRadius: '12px', background: (bnTitle.trim() || bnFile) ? 'var(--acc)' : '#9fd8bd', color: '#fff', fontSize: '14px', fontWeight: 700, cursor: 'pointer' }}>
              {bnBusy ? 'กำลังบันทึก…' : '＋ เพิ่มแบนเนอร์'}
            </button>
          </div>

          <div style={css("font-size:12px;font-weight:700;color:var(--sub)")}>แบนเนอร์ทั้งหมด ({bnOnly.length})</div>
          {bnOnly.length === 0 && <div style={css("text-align:center;color:var(--sub);font-size:13px;padding:20px 0")}>ยังไม่มีแบนเนอร์ — เพิ่มอันแรกด้านบนเลยครับ</div>}
          {bnOnly.map(b => (
            <div key={b.id} style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)" + (b.active ? "" : ";opacity:.5"))}>
              {b.image_path && fileUrl(b.image_path)
                ? <img src={fileUrl(b.image_path)} alt="" style={css("width:100%;aspect-ratio:3/1;object-fit:cover;display:block")}/>
                : <div style={{ background: BANNER_THEMES[b.color] || BANNER_THEMES.green, color: '#fff', padding: '13px 16px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                    <div style={{ fontSize: '26px', flex: 'none' }}>{b.emoji || '🎉'}</div>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontSize: '13.5px', fontWeight: 700 }}>{b.title}</div>
                      {b.subtitle && <div style={{ fontSize: '11px', opacity: .88, marginTop: '2px' }}>{b.subtitle}</div>}
                    </div>
                  </div>}
              <div style={css("display:flex;gap:8px;padding:8px 12px;align-items:center")}>
                <span style={css("flex:1;font-size:11px;color:" + (b.active ? "var(--acc)" : "var(--sub)"))}>{b.active ? '● กำลังแสดงบนหน้าแรก' : '○ ซ่อนอยู่'}</span>
                <button onClick={() => toggleBanner(b)} style={css("height:32px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);font-size:11.5px;font-weight:600;cursor:pointer")}>{b.active ? 'ซ่อน' : 'แสดง'}</button>
                <button onClick={() => delBanner(b)} style={css("height:32px;padding:0 12px;border:1px solid #ffa8a8;border-radius:9px;background:none;color:#c92a2a;font-size:11.5px;font-weight:600;cursor:pointer")}>ลบ</button>
              </div>
            </div>
          ))}

          {/* ── รูปงานจริง: อัปโหลดแล้วขึ้นแถบรูปใต้ปุ่ม "เริ่มสั่งปริ้น" หน้าแรกลูกค้าทันที ── */}
          <div style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;margin-top:8px")}>
            <div style={css("font-size:13px;font-weight:700")}>📸 รูปงานจริง (โชว์หน้าแรกลูกค้า ใต้ปุ่มเริ่มสั่งปริ้น)</div>
            <div style={css("font-size:11px;color:var(--sub);line-height:1.6")}>ถ่ายรูปงานสวย ๆ จากร้านมาอัปโหลด ลูกค้าใหม่เห็นแล้วกล้าสั่งขึ้น · รูป<b>แนวตั้ง</b>สวยสุด · ⚠️ ระวังอย่าให้เห็นชื่อ/ข้อมูลส่วนตัวของลูกค้าในรูป</div>
            <input type="file" accept="image/*" onChange={e => setShFile((e.target.files || [])[0] || null)} style={css("font-size:12px;width:100%")}/>
            {shPreview && (
              <div style={css("width:132px;aspect-ratio:4/5;border-radius:14px;overflow:hidden;position:relative;background:var(--soft)")}>
                <img src={shPreview} alt="" style={css("position:absolute;inset:0;width:100%;height:100%;object-fit:cover")}/>
                {shCap.trim() && <div style={css("position:absolute;left:0;right:0;bottom:0;padding:22px 9px 8px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:10.5px;font-weight:600;line-height:1.4")}>{shCap.trim()}</div>}
              </div>
            )}
            <input value={shCap} onChange={e => setShCap(e.target.value)} maxLength={60} placeholder="คำบรรยายสั้น ๆ เช่น เข้าเล่มรายงาน 40 เล่ม (ไม่บังคับ)" style={css("width:100%;box-sizing:border-box;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:13px;outline:none;font-family:inherit")}/>
            <button onClick={addShot} disabled={shBusy || !shFile}
              style={{ height: '44px', border: 'none', borderRadius: '12px', background: shFile ? 'var(--acc)' : '#9fd8bd', color: '#fff', fontSize: '14px', fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>
              {shBusy ? 'กำลังอัปโหลด…' : '＋ เพิ่มรูปงาน'}
            </button>
            {shots.length > 0
              ? <div style={css("display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch")}>
                  {shots.map(b => (
                    <div key={b.id} style={css("flex:none;width:132px;aspect-ratio:4/5;border-radius:14px;overflow:hidden;position:relative;background:var(--soft)")}>
                      <img src={fileUrl(b.image_path) || b.image_path} alt="" style={css("position:absolute;inset:0;width:100%;height:100%;object-fit:cover")}/>
                      {b.title && <div style={css("position:absolute;left:0;right:0;bottom:0;padding:22px 9px 8px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:10.5px;font-weight:600;line-height:1.4")}>{b.title}</div>}
                      <span onClick={() => delShot(b)} style={css("position:absolute;top:6px;right:6px;font-size:10.5px;font-weight:800;cursor:pointer;border-radius:99px;padding:4px 10px;" + (shDelId === b.id ? "background:#c92a2a;color:#fff" : "background:rgba(0,0,0,.55);color:#ffa8a8"))}>{shDelId === b.id ? 'ยืนยันลบ?' : 'ลบ'}</span>
                    </div>
                  ))}
                </div>
              : <div style={css("font-size:12px;color:var(--sub)")}>ยังไม่มีรูปงาน — เพิ่มรูปแรกเลยครับ</div>}
          </div>

          {/* ── คลิปคอนเทนต์ร้าน: อัปโหลดแล้วขึ้นแถบ "🎬 คลิปจากร้าน" หน้าแรกลูกค้า — กดดูเต็มจอปัดขึ้นลงแบบ TikTok ── */}
          <div style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;margin-top:8px")}>
            <div style={css("font-size:13px;font-weight:700")}>🎬 คลิปจากร้าน (ฟีดสไตล์ TikTok บนหน้าแรกลูกค้า)</div>
            <div style={css("font-size:11px;color:var(--sub);line-height:1.6")}>อัปโหลดคลิปโฆษณา/คอนเทนต์ของร้าน ลูกค้าแตะดูเต็มจอ ปัดขึ้น-ลงเปลี่ยนคลิปได้เหมือน TikTok · <b>คลิปแนวตั้ง 15-60 วิ ไฟล์ MP4 ไม่เกิน {CLIP_MAX_MB}MB</b> (export 720p จากแอปตัดต่อ ไฟล์จะเล็กพอ) · เอาคลิปที่ลงติ๊กต่อกอยู่แล้วมาลงซ้ำได้เลย</div>
            <input type="file" accept="video/mp4,video/quicktime,video/webm" onChange={e => setClFile((e.target.files || [])[0] || null)} style={css("font-size:12px;width:100%")}/>
            {clFile && <div style={css("font-size:11px;color:" + (clFile.size > CLIP_MAX_MB * 1024 * 1024 ? "#c92a2a" : "var(--acc)") + ";font-weight:600")}>{clFile.size > CLIP_MAX_MB * 1024 * 1024 ? '✕' : '✓'} {clFile.name} — {(clFile.size / 1024 / 1024).toFixed(1)}MB{clFile.size > CLIP_MAX_MB * 1024 * 1024 ? ' (ใหญ่เกิน ' + CLIP_MAX_MB + 'MB)' : ''}</div>}
            {clPreview && (
              <video src={clPreview} controls playsInline style={css("width:150px;aspect-ratio:9/16;border-radius:14px;background:#000;object-fit:contain")}/>
            )}
            <input value={clCap} onChange={e => setClCap(e.target.value)} maxLength={80} placeholder="คำบรรยายใต้คลิป เช่น ปริ้นด่วนส่งไวใน 45 นาที (ไม่บังคับ)" style={css("width:100%;box-sizing:border-box;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:13px;outline:none;font-family:inherit")}/>
            <button onClick={addClip} disabled={clBusy || !clFile}
              style={{ height: '44px', border: 'none', borderRadius: '12px', background: clFile ? 'var(--acc)' : '#9fd8bd', color: '#fff', fontSize: '14px', fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>
              {clBusy ? 'กำลังอัปโหลดคลิป… (ไฟล์วิดีโอใช้เวลาหน่อยครับ)' : '＋ เพิ่มคลิป'}
            </button>
            {clips.length > 0
              ? <div style={css("display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch")}>
                  {clips.map(b => (
                    <div key={b.id} style={css("flex:none;width:118px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;position:relative;background:#000")}>
                      <video src={(fileUrl(b.image_path) || b.image_path) + '#t=0.1'} preload="metadata" muted playsInline style={css("position:absolute;inset:0;width:100%;height:100%;object-fit:cover")}/>
                      {b.title && <div style={css("position:absolute;left:0;right:0;bottom:0;padding:20px 8px 7px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:10px;font-weight:600;line-height:1.4")}>{b.title}</div>}
                      <span onClick={() => delClip(b)} style={css("position:absolute;top:6px;right:6px;font-size:10.5px;font-weight:800;cursor:pointer;border-radius:99px;padding:4px 10px;" + (clDelId === b.id ? "background:#c92a2a;color:#fff" : "background:rgba(0,0,0,.55);color:#ffa8a8"))}>{clDelId === b.id ? 'ยืนยันลบ?' : 'ลบ'}</span>
                    </div>
                  ))}
                </div>
              : <div style={css("font-size:12px;color:var(--sub)")}>ยังไม่มีคลิป — เพิ่มคลิปแรกเลยครับ</div>}
          </div>

          <div style={css("font-size:12px;font-weight:700;color:var(--sub);margin-top:8px")}>{FI.star(12)} รีวิวจากลูกค้า ({reviews.length})</div>
          {reviews.length === 0 && <div style={css("text-align:center;color:var(--sub);font-size:13px;padding:14px 0")}>ยังไม่มีรีวิว</div>}
          {reviews.map(r => (
            <div key={r.id} style={css("background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)")}>
              <div style={css("display:flex;align-items:center;gap:8px")}>
                <span style={css("color:#f5a623;font-size:13px;letter-spacing:1px")}>{'★'.repeat(Math.max(1, Math.min(5, r.stars || 5)))}</span>
                {r.auto && <span style={css("font-size:10px;font-weight:700;background:var(--soft);color:var(--sub);padding:2px 8px;border-radius:99px")}>5 ดาวอัตโนมัติ</span>}
                {r.order_id
                  ? <span style={css("font-size:10px;font-weight:700;background:var(--accSoft);color:var(--acc);padding:2px 8px;border-radius:99px")}>✓ ออเดอร์จริง</span>
                  : <span style={css("font-size:10px;font-weight:700;background:#fff4e6;color:#d9480f;padding:2px 8px;border-radius:99px")}>รีวิวทั่วไป (ไม่ได้สั่ง)</span>}
                <span style={css("flex:1")}></span>
                <button onClick={() => delReview(r)} style={css("height:28px;padding:0 10px;border:1px solid #ffa8a8;border-radius:8px;background:" + (revDelId === r.id ? "#c92a2a" : "none") + ";color:" + (revDelId === r.id ? "#fff" : "#c92a2a") + ";font-size:11px;font-weight:700;cursor:pointer")}>{revDelId === r.id ? 'ยืนยันลบ?' : 'ลบ'}</button>
              </div>
              {r.comment && <div style={css("margin-top:4px;font-size:12.5px;line-height:1.5")}>{r.comment}</div>}
              <div style={css("margin-top:4px;font-size:11px;color:var(--sub)")}>คุณ{r.name || 'ลูกค้า'}{r.ptype ? ' · งาน' + r.ptype : ''}{r.order_id ? ' · ' + r.order_id : ''} · {fmtWhen(r.created_at)}</div>
            </div>
          ))}
        </div>
      )}

      {tab === 'customers' && (
        <div style={css("padding:14px 16px 40px;display:flex;flex-direction:column;gap:10px")}>
          {/* สรุปภาพรวม */}
          <div style={css("display:flex;gap:8px")}>
            <div style={css("flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center")}>
              <div style={css("font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600")}>{customers.length}</div>
              <div style={css("font-size:10.5px;color:var(--sub)")}>{FI.users(11)} ลูกค้าทั้งหมด</div>
            </div>
            <div style={css("flex:1;background:#fff3bf;border:1px solid #ffd43b;border-radius:12px;padding:10px 12px;text-align:center")}>
              <div style={css("font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:#e8590c")}>{customers.filter(c => c.tier === 2).length}</div>
              <div style={css("font-size:10.5px;color:#e8590c")}>{FI.star(11)} ลูกค้าประจำ (5 ครั้งขึ้น)</div>
            </div>
            <div style={css("flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center")}>
              <div style={css("font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:#1971c2")}>{customers.filter(c => c.tier === 1).length}</div>
              <div style={css("font-size:10.5px;color:var(--sub)")}>{FI.repeat(11)} กลับมาซ้ำ (2-4 ครั้ง)</div>
            </div>
          </div>
          <input value={custQ} onChange={e => setCustQ(e.target.value)} placeholder="ค้นหาชื่อหรือเบอร์โทร"
            style={css("height:42px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:13px;outline:none;font-family:inherit")}/>
          <div style={css("display:flex;gap:6px")}>
            {[['count', 'สั่งบ่อยสุด'], ['total', 'ยอดสูงสุด'], ['last', 'มาล่าสุด']].map(([k, label]) => (
              <button key={k} onClick={() => setCustSort(k)} style={{ flex: 1, height: '36px', borderRadius: '10px', fontSize: '11.5px', fontWeight: 700, cursor: 'pointer',
                border: custSort === k ? '1.5px solid var(--acc)' : '1px solid var(--line)',
                background: custSort === k ? 'var(--accSoft)' : 'var(--card)', color: custSort === k ? 'var(--acc)' : 'var(--sub)' }}>{label}</button>
            ))}
          </div>
          {custShown.length === 0 && <div style={css("text-align:center;color:var(--sub);font-size:14px;padding:40px 0")}>ยังไม่มีข้อมูลลูกค้า</div>}
          {custShown.map((cst, i) => (
            <div key={i} style={css("background:var(--card);border:1px solid " + (cst.tier === 2 ? "#ffd43b" : "var(--line)") + ";border-radius:14px;padding:13px 16px;box-shadow:var(--shadow)")}>
              <div style={css("display:flex;align-items:center;gap:12px")}>
                <div style={css("width:40px;height:40px;border-radius:50%;background:var(--accSoft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:" + (i < 3 && custSort !== 'last' && !custQ.trim() ? "20px" : "15px") + ";flex:none")}>
                  {i < 3 && custSort !== 'last' && !custQ.trim() ? (i + 1) : (cst.name.replace('คุณ', '') || '?').trim().charAt(0)}
                </div>
                <div style={css("flex:1;min-width:0")}>
                  <div style={css("display:flex;align-items:center;gap:6px;min-width:0")}>
                    <div style={css("font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap")}>{cst.name || 'ไม่ระบุชื่อ'}</div>
                    {cst.tier === 2 && <span style={css("flex:none;font-size:9.5px;font-weight:700;background:#fff3bf;color:#e8590c;border-radius:99px;padding:2px 8px")}>{FI.star(9)} ลูกค้าประจำ</span>}
                    {cst.tier === 1 && <span style={css("flex:none;font-size:9.5px;font-weight:700;background:#e7f5ff;color:#1971c2;border-radius:99px;padding:2px 8px")}>{FI.repeat(9)} กลับมาซ้ำ</span>}
                    {cst.tier === 0 && <span style={css("flex:none;font-size:9.5px;font-weight:700;background:var(--soft);color:var(--sub);border-radius:99px;padding:2px 8px")}>🆕 ใหม่</span>}
                  </div>
                  <div style={css("margin-top:2px;font-size:11.5px;color:var(--sub)")}><a href={'tel:' + cst.phone.replace(/[^0-9+]/g,'')} style={css("font-family:'IBM Plex Mono',monospace")}>{cst.phone}</a> · ล่าสุด {fmtWhen(cst.last)}</div>
                </div>
                <div style={css("text-align:right;flex:none")}>
                  <div style={css("font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--acc)")}>฿{cst.total}</div>
                  <div style={css("font-size:10.5px;color:var(--sub)")}>{cst.count} ออเดอร์</div>
                </div>
              </div>
              {/* งานที่ลูกค้าคนนี้สั่งบ่อยสุด */}
              {cst.topJobs.length > 0 && (
                <div style={css("margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:6px;flex-wrap:wrap")}>
                  <span style={css("font-size:10px;color:var(--sub)")}>สั่งบ่อย:</span>
                  {cst.topJobs.map(([label, n], j) => (
                    <span key={j} style={css("font-size:10.5px;font-weight:600;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 9px")}>{label} ×{n}</span>
                  ))}
                </div>
              )}
            </div>
          ))}
          <div style={css("font-size:10.5px;color:var(--sub);text-align:center;line-height:1.6")}>เฉพาะงาน Standard ไม่นับออเดอร์ที่ยกเลิก · จัดกลุ่มตามเบอร์โทรลูกค้า · ลูกค้าประจำงาน Pro ดูที่ งาน PRO</div>
        </div>
      )}
    </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp/>);
</script>
</body>
</html>
