<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORE PRINT — ค่าคอมงาน PRO</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;zoom:1.15;background:var(--bg);font-family:'IBM Plex Sans Thai',sans-serif;
  --bg:#faf7f0;--card:#ffffff;--ink:#111111;--sub:#93876f;--line:#eee5d4;--soft:#f5efe2;
  --acc:#a16207;--accSoft:#fff3d6;--green:#00b368;--purple:#7048e8;--shadow:0 2px 10px rgba(0,0,0,.06)}
  input,button{font-family:'IBM Plex Sans Thai',sans-serif}
  table{border-collapse:collapse;width:100%}
  @media print{ .no-print{display:none!important} body{background:#fff} }
  .mp-side{position:fixed;top:0;left:0;bottom:0;width:212px;background:#2b2413;z-index:60;display:flex;flex-direction:column;padding:18px 12px 14px;box-sizing:border-box;transition:transform .22s ease;overflow-y:auto}
  .mp-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:none}
  .mp-main{min-width:0}
  .mp-burger{display:none}
  @media(min-width:901px){ .mp-main{margin-left:212px} .mp-close{display:none} }
  @media(max-width:900px){ .mp-side{transform:translateX(-105%)} .mp-side.open{transform:translateX(0)} .mp-scrim.show{display:block} .mp-burger{display:flex} }
</style>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const CFG = window.MP_CONFIG || {};
const DB = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { storageKey: 'mp-comm' } }) : null;

const COMMISSION = 0.33; // ค่าคอม MORE PRINT — ต้องตรงกับ pro.html
const PARTNER_NAME = 'ร้านอุดมสุขปริ้นติ้ง';
const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

function css(str){
  const o = {};
  String(str).split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if (i < 0) return;
    const prop = decl.slice(0, i).trim();
    if (!prop) return;
    o[prop.startsWith('--') ? prop : prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = decl.slice(i + 1).trim();
  });
  return o;
}
const baht = (n) => '฿' + (Math.round((n || 0) * 100) / 100).toLocaleString('th-TH');
const jobValue = (o) => (o.print_cost || 0) + (o.bind_cost || 0);
const fmtDate = (iso) => { const d = new Date(iso); return d.getDate() + ' ' + TH_MONTHS[d.getMonth()] + ' ' + ((d.getFullYear() + 543) % 100); };
const fmtHM = (d) => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
const fileUrl = (path) => path && CFG.SUPABASE_URL ? CFG.SUPABASE_URL + '/storage/v1/object/public/uploads/' + path : null;
// ขั้นสถานะตามวิธีรับงาน (มารับเอง = จบที่ร้านอุดมสุข)
const stepsOf = (o) => o && o.pickup
  ? ['รับออเดอร์', 'กำลังผลิตสินค้า', 'เสร็จแล้ว รอมารับ', 'ลูกค้ารับสินค้าแล้ว']
  : ['รับออเดอร์', 'กำลังผลิตสินค้า', 'กำลังจัดส่ง', 'ส่งแล้ว'];

const DEMO = [
  { id: '#MP-PRO101', created_at: new Date().toISOString(), status: 4, print_cost: 600, bind_cost: 0, delivery_cost: 69, night_fee: 0, slip_path: 'x/slip.jpg', payout_at: new Date().toISOString(), customer_fname: 'สมชาย', paper: 'A1', copies: 2 },
  { id: '#MP-PRO102', created_at: new Date(Date.now() - 20*3600000).toISOString(), status: 4, print_cost: 250, bind_cost: 0, delivery_cost: 37, night_fee: 10, slip_path: 'x/slip.jpg', payout_at: null, customer_fname: 'มินตรา', paper: 'A2', copies: 1 },
  { id: '#MP-PRO103', created_at: new Date(Date.now() - 3*3600000).toISOString(), status: 2, print_cost: 1000, bind_cost: 0, slip_path: 'x/slip.jpg', payout_at: null, customer_fname: 'ต้นกล้า', paper: 'A0', copies: 1 },
  { id: '#MP-PRO104', created_at: new Date(Date.now() - 40*24*3600000).toISOString(), status: 4, print_cost: 480, bind_cost: 0, delivery_cost: 89, night_fee: 0, slip_path: 'x/slip.jpg', payout_at: new Date().toISOString(), customer_fname: 'boat', paper: 'A2', copies: 3 }
];

function Login({ onOk }){
  const [email, setEmail] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const verify = async () => {
    const a = await DB.rpc('is_admin');
    if (a.data) { onOk(); return; }
    const p = await DB.rpc('is_partner');
    setMsg(p.data ? 'หน้านี้สำหรับเจ้าของ MORE PRINT เท่านั้น — ร้านพาร์ทเนอร์ใช้หน้า pro.html ครับ' : 'บัญชีนี้ไม่ใช่เจ้าของร้าน');
    setBusy(false);
  };
  React.useEffect(() => {
    if (!DB) { onOk(); return; }
    DB.auth.getSession().then(({ data }) => { if (data.session) { setBusy(true); verify(); } });
  }, []);
  const submit = async () => {
    if (!DB) return onOk();
    if (!email.trim() || !pass) return setMsg('กรอกอีเมลและรหัสผ่านก่อนครับ');
    setBusy(true); setMsg('');
    const { error } = await DB.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: pass });
    if (error) { setBusy(false); return setMsg('อีเมลหรือรหัสผ่านไม่ถูกต้อง ❌'); }
    await verify();
  };
  return (
    <div style={css("min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px")}>
      <div style={css("background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:320px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:center")}>
        <div style={css("font-size:34px")}>💰</div>
        <div style={css("font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;letter-spacing:1px")}><span style={css("color:var(--acc)")}>MORE</span> PRINT <span style={css("color:var(--acc)")}>COMMISSION</span></div>
        <div style={css("font-size:13px;color:var(--sub);text-align:center")}>🔐 รายได้ค่าคอมจากงาน PRO — เจ้าของเท่านั้น</div>
        <input value={email} onChange={e => setEmail(e.target.value)} placeholder="อีเมลเจ้าของร้าน" inputMode="email" autoComplete="email"
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>
        <input type="password" value={pass} onChange={e => setPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} placeholder="รหัสผ่าน" autoComplete="current-password"
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>
        {msg && <div style={css("font-size:12px;color:#d9480f;text-align:center;line-height:1.5")}>{msg}</div>}
        <button onClick={submit} disabled={busy} style={css("width:100%;height:46px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:14px;font-weight:700;cursor:pointer" + (busy ? ";opacity:.6" : ""))}>{busy ? 'กำลังตรวจสอบ…' : 'ดูรายได้ค่าคอม →'}</button>
      </div>
    </div>
  );
}

const fmtWhen = (iso) => { const d = new Date(iso); const sameDay = d.toDateString() === new Date().toDateString(); return (sameDay ? 'วันนี้ ' : d.getDate() + '/' + (d.getMonth() + 1) + ' ') + fmtHM(d); };
const DEMO_MSGS = [
  { id: 1, sender: 'customer', body: 'งาน A1 ขอกรอบสีดำนะครับ', created_at: new Date(Date.now() - 9*60000).toISOString() },
  { id: 2, sender: 'shop', body: 'รับทราบครับ 🙏', created_at: new Date(Date.now() - 7*60000).toISOString() }
];

// ── กล่องแชทกับลูกค้า (ตาราง messages — ห้องเดียวกับที่ลูกค้าเห็นในเว็บ) ──
function Chat({ o }){
  const [msgs, setMsgs] = React.useState(null);
  const [text, setText] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [upBusy, setUpBusy] = React.useState(false);
  const [missing, setMissing] = React.useState(false);
  const boxRef = React.useRef(null);
  const camRef = React.useRef(null);
  const load = React.useCallback(async () => {
    if (!DB) { setMsgs(DEMO_MSGS); return; }
    const { data, error } = await DB.from('messages').select('*').eq('order_id', o.id).order('id');
    if (error) { setMissing(true); return; }
    setMsgs(data || []);
    const unseen = (data || []).filter(m => m.sender === 'customer' && !m.seen_by_shop);
    if (unseen.length) await DB.from('messages').update({ seen_by_shop: true }).eq('order_id', o.id).eq('sender', 'customer');
  }, [o.id]);
  React.useEffect(() => { load(); const t = setInterval(load, 8000); return () => clearInterval(t); }, [load]);
  React.useEffect(() => { if (boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight; }, [msgs]);
  const send = async () => {
    const body = text.trim();
    if (!body || busy) return;
    setBusy(true);
    if (!DB) { setMsgs(l => [...(l || []), { id: Date.now(), sender: 'shop', body, created_at: new Date().toISOString() }]); setText(''); setBusy(false); return; }
    const { error } = await DB.from('messages').insert({ order_id: o.id, sender: 'shop', body, seen_by_shop: true });
    setBusy(false);
    if (error) return alert('ส่งไม่สำเร็จ: ' + error.message);
    setText(''); load();
  };
  const sendPhoto = async (file) => {
    if (!file || upBusy) return;
    setUpBusy(true);
    const caption = text.trim() || '📸 รูปหลักฐานการจัดส่ง';
    if (!DB) { setMsgs(l => [...(l || []), { id: Date.now(), sender: 'shop', body: caption, img_url: URL.createObjectURL(file), created_at: new Date().toISOString() }]); setText(''); setUpBusy(false); return; }
    const ext = (file.name.split('.').pop() || 'jpg').replace(/[^a-zA-Z0-9]/g, '').slice(0, 5) || 'jpg';
    const path = 'chat/' + o.id.replace(/[^A-Za-z0-9-]/g, '') + '/' + Date.now() + '.' + ext;
    const up = await DB.storage.from('uploads').upload(path, file);
    if (up.error) { setUpBusy(false); return alert('อัปโหลดรูปไม่สำเร็จ: ' + up.error.message); }
    const { error } = await DB.from('messages').insert({ order_id: o.id, sender: 'shop', body: caption, img: path, seen_by_shop: true });
    setUpBusy(false);
    if (error) return alert('ส่งรูปไม่สำเร็จ: ' + error.message);
    setText(''); load();
  };
  if (missing) return null;
  return (
    <div style={css("margin-top:9px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px")}>
      <div style={css("font-size:11px;font-weight:700;color:var(--sub)")}>💬 แชทกับลูกค้า</div>
      <div ref={boxRef} style={css("margin-top:8px;max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:7px")}>
        {msgs === null && <div style={css("font-size:12px;color:var(--sub)")}>กำลังโหลด…</div>}
        {msgs !== null && msgs.length === 0 && <div style={css("font-size:11.5px;color:var(--sub)")}>ยังไม่มีข้อความ — ทักแจ้งราคา/ความคืบหน้าได้เลย</div>}
        {(msgs || []).map(m => {
          const mine = m.sender === 'shop';
          return (
            <div key={m.id} style={{ display: 'flex', justifyContent: mine ? 'flex-end' : 'flex-start' }}>
              <div style={{ maxWidth: '78%', background: mine ? 'var(--acc)' : 'var(--card)', color: mine ? '#fff' : 'var(--ink)',
                border: mine ? 'none' : '1px solid var(--line)', borderRadius: '12px', padding: '7px 11px', fontSize: '12.5px', lineHeight: 1.5, whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                {(m.img || m.img_url) && (
                  <a href={m.img_url || fileUrl(m.img)} target="_blank" rel="noreferrer" style={{ display: 'block', marginBottom: '5px' }}>
                    <img src={m.img_url || fileUrl(m.img)} alt="" style={{ maxWidth: '180px', maxHeight: '210px', borderRadius: '9px', display: 'block', background: 'var(--soft)' }}/>
                  </a>
                )}
                {m.body}
                <div style={{ marginTop: '3px', fontSize: '9.5px', opacity: .7, fontFamily: "'IBM Plex Mono',monospace" }}>{fmtWhen(m.created_at)}</div>
              </div>
            </div>
          );
        })}
      </div>
      <input ref={camRef} type="file" accept="image/*" capture="environment" onChange={e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; sendPhoto(f); }} style={css("display:none")}/>
      <button onClick={() => camRef.current && camRef.current.click()} disabled={upBusy}
        style={css("margin-top:8px;width:100%;height:36px;border:1.5px solid var(--acc);border-radius:10px;background:var(--accSoft);color:var(--acc);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit" + (upBusy ? ";opacity:.6" : ""))}>
        {upBusy ? 'กำลังส่งรูป…' : '📸 ถ่ายรูป/แนบรูปหลักฐานการจัดส่ง'}
      </button>
      <div style={css("margin-top:7px;display:flex;gap:6px")}>
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} maxLength={500} placeholder="พิมพ์ข้อความถึงลูกค้า…"
          style={css("flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 12px;font-size:12.5px;outline:none;font-family:inherit")}/>
        <button onClick={send} disabled={busy || !text.trim()} style={css("flex:none;height:38px;padding:0 15px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer" + (busy || !text.trim() ? ";opacity:.5" : ""))}>ส่ง</button>
      </div>
    </div>
  );
}

// ไทม์ไลน์ของแต่ละงาน: ชำระ → ผลิต → ส่งถึงมือ → โอนส่วนแบ่งแล้ว
function Pipeline({ o }){
  const steps = [
    ['💰', 'ชำระแล้ว', !!o.slip_path],
    ['🖨️', 'ผลิต', o.status >= 2],
    ['✅', o.pickup ? 'ลูกค้ารับแล้ว' : 'ถึงมือลูกค้า', o.status >= 4],
    ['💸', 'โอนส่วนแบ่งแล้ว', !!o.payout_at]
  ];
  return (
    <div style={css("display:flex;gap:6px;flex-wrap:wrap")}>
      {steps.map(([ic, label, on], i) => (
        <span key={i} style={css("font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;" + (on ? "background:var(--accSoft);color:var(--acc)" : "background:var(--soft);color:#c8bfa8"))}>{ic} {label}</span>
      ))}
    </div>
  );
}

// แผงจัดการต่อออเดอร์ (เจ้าของ): ไฟล์ / ตั้งราคา / บันทึกโอน / อัปเดตสถานะ / ยกเลิก
function Manage({ o, onPrice, onPayout, onAdvance, onCancel, onRemove }){
  const [confirmDel, setConfirmDel] = React.useState(false);
  const [edit, setEdit] = React.useState(false);
  const [price, setPriceV] = React.useState('');
  const [confirmPay, setConfirmPay] = React.useState(false);
  const [cancelOpen, setCancelOpen] = React.useState(false);
  const [reason, setReason] = React.useState('');
  const priced = jobValue(o) > 0;
  const save = () => { const n = Math.round(Number(price)); if (!n || n <= 0) return; onPrice(o, n); setEdit(false); setPriceV(''); };
  const askPayout = () => { if (!confirmPay) { setConfirmPay(true); setTimeout(() => setConfirmPay(false), 4000); return; } setConfirmPay(false); onPayout(o); };
  return (
    <div style={css("margin-top:9px;display:flex;flex-direction:column;gap:8px")}>
      {(o.files || []).length > 0 && (
        <div style={css("display:flex;gap:6px;flex-wrap:wrap")}>
          {(o.files || []).map((f, i) => {
            const u = f.drive_url || fileUrl(f.path);
            return u
              ? <a key={i} href={u} target="_blank" rel="noreferrer" style={css("font-size:11px;font-weight:700;color:var(--acc);background:var(--accSoft);padding:4px 10px;border-radius:8px;text-decoration:none")}>⬇ {f.name} · {f.pages} หน้า</a>
              : <span key={i} style={css("font-size:11px;color:var(--sub)")}>{f.name}</span>;
          })}
        </div>
      )}
      {o.status !== 0 && (!priced || edit) && (
        <div style={css("display:flex;gap:8px;align-items:center")}>
          <input value={price} onChange={e => setPriceV(e.target.value.replace(/[^0-9]/g, ''))} onKeyDown={e => e.key === 'Enter' && save()} placeholder="ราคางานที่ตกลงกับลูกค้า (บาท)" inputMode="numeric"
            style={css("flex:1;box-sizing:border-box;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:12.5px;outline:none")}/>
          <button onClick={save} disabled={!price} style={css("height:38px;padding:0 14px;border:none;border-radius:10px;background:" + (price ? "var(--acc)" : "#dcc9a0") + ";color:#fff;font-size:12px;font-weight:700;cursor:pointer")}>บันทึกราคา</button>
          {edit && <button onClick={() => { setEdit(false); setPriceV(''); }} style={css("height:38px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font-size:12px;cursor:pointer")}>ยกเลิก</button>}
        </div>
      )}
      {priced && !edit && (
        <div style={css("display:flex;gap:10px;align-items:center;flex-wrap:wrap")}>
          <span style={css("font-size:11.5px;color:var(--sub)")}>ราคางาน <b style={css("font-family:'IBM Plex Mono',monospace;color:var(--ink)")}>{baht(jobValue(o))}</b> <span onClick={() => { setEdit(true); setPriceV(String(jobValue(o))); }} style={css("color:var(--acc);font-size:11px;cursor:pointer;text-decoration:underline")}>แก้</span></span>
          {o.status !== 0 && !o.payout_at && <button onClick={askPayout} style={css("height:34px;padding:0 14px;border:none;border-radius:9px;background:" + (confirmPay ? "#0b7285" : "var(--acc)") + ";color:#fff;font-size:11.5px;font-weight:700;cursor:pointer")}>{confirmPay ? 'กดอีกครั้ง — โอนแล้วจริงๆ' : '💸 โอนส่วนแบ่งให้ร้านแล้ว'}</button>}
          {o.payout_at && <span style={css("font-size:11px;font-weight:700;color:#0b7285;background:#e3fafc;padding:3px 10px;border-radius:99px")}>💸 โอนแล้ว</span>}
        </div>
      )}
      {o.status > 0 && o.status < 4 && (
        <div style={css("display:flex;gap:8px")}>
          <button onClick={() => onAdvance(o)} style={css("flex:1;height:38px;border:none;border-radius:10px;background:var(--purple);color:#fff;font-size:12px;font-weight:700;cursor:pointer")}>→ อัปเดตเป็น "{stepsOf(o)[Math.min(o.status, 3)]}"</button>
          <button onClick={() => setCancelOpen(v => !v)} style={css("height:38px;padding:0 12px;border:1px solid #ffa8a8;border-radius:10px;background:none;color:#c92a2a;font-size:11.5px;font-weight:600;cursor:pointer")}>✕ ยกเลิก</button>
        </div>
      )}
      {cancelOpen && (
        <div style={css("display:flex;gap:8px")}>
          <input value={reason} onChange={e => setReason(e.target.value)} placeholder="เหตุผลที่ยกเลิก (ลูกค้าจะเห็น)"
            style={css("flex:1;box-sizing:border-box;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:12px;outline:none")}/>
          <button onClick={() => { if (reason.trim()) { onCancel(o, reason.trim()); setCancelOpen(false); setReason(''); } }} disabled={!reason.trim()}
            style={css("height:36px;padding:0 12px;border:none;border-radius:10px;background:" + (reason.trim() ? "#c92a2a" : "#f1b5b5") + ";color:#fff;font-size:11.5px;font-weight:700;cursor:pointer")}>ยืนยันยกเลิก</button>
        </div>
      )}
      {o.status === 0 && o.cancel_reason && <div style={css("font-size:11px;color:#c92a2a")}>เหตุผลที่ยกเลิก: {o.cancel_reason}</div>}
      {/* ที่อยู่จัดส่ง + นำทาง + สลิป (เท่าหลังบ้าน Standard) */}
      {!o.pickup && (o.addr || o.point) && (
        <div style={css("font-size:11.5px;color:var(--sub);line-height:1.6")}>📍 {o.addr || o.point}
          <a href={o.lat != null && o.lng != null
              ? 'https://www.google.com/maps?q=' + o.lat + ',' + o.lng
              : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(String(o.addr || o.point || '').replace(/^(🚗|🏍️)\s*/, ''))}
            target="_blank" rel="noreferrer" style={css("margin-left:8px;font-weight:700;color:var(--acc)")}>🧭 นำทาง</a>
        </div>
      )}
      {o.slip_path && fileUrl(o.slip_path) && (
        <a href={fileUrl(o.slip_path)} target="_blank" rel="noreferrer" style={css("text-decoration:none")}>
          <img src={fileUrl(o.slip_path)} alt="สลิป" style={css("max-width:130px;max-height:170px;border-radius:9px;border:1px solid var(--line);display:block;background:var(--soft)")} onError={(e) => { e.target.style.display = 'none'; }}/>
          <span style={css("font-size:10.5px;color:var(--acc);font-weight:600")}>🔍 สลิปโอนเงิน — แตะดูเต็ม</span>
        </a>
      )}
      {o.status === 0 && (
        <button onClick={() => { if (!confirmDel) { setConfirmDel(true); setTimeout(() => setConfirmDel(false), 4000); return; } setConfirmDel(false); onRemove(o); }}
          style={{ height: '36px', border: 'none', borderRadius: '10px', fontSize: '12px', fontWeight: 700, cursor: 'pointer',
            background: confirmDel ? '#c92a2a' : '#ffe3e3', color: confirmDel ? '#fff' : '#c92a2a' }}>
          {confirmDel ? '⚠️ แน่ใจนะ? กดอีกครั้งเพื่อลบถาวร' : '🗑️ ลบออเดอร์นี้ถาวร (รวมไฟล์+สลิป)'}
        </button>
      )}
    </div>
  );
}

function Dash(){
  const [orders, setOrders] = React.useState(DB ? [] : DEMO);
  const [loading, setLoading] = React.useState(!!DB);
  const [bill, setBill] = React.useState(null); // {y, m} = เปิดหน้าบิลของเดือนนั้น
  const [period, setPeriod] = React.useState('day');
  const [filter, setFilter] = React.useState('active');
  const [chartMode, setChartMode] = React.useState('d'); // กราฟรายได้: d รายวัน · m รายเดือน · y รายปี
  const [page, setPage] = React.useState('home');      // เมนูซ้าย: home/orders/income/bills/customers
  const [navOpen, setNavOpen] = React.useState(false);
  const [billListOpen, setBillListOpen] = React.useState(false); // กดปุ่มก่อน ระบบถึงสร้างรอบบิลให้
  const [billMode, setBillMode] = React.useState('w'); // ตัดบิลโอนให้พาร์ทเนอร์: w รายสัปดาห์ (ตัด อา. 23:59) · d รายวัน (ตัดเที่ยงคืน)
  // ออเดอร์ที่ยกเลิกเกิน 15 นาที = ลบถาวรอัตโนมัติจากทุกที่ (นโยบายร้าน)
  const cancelledExpired = (o) => o.status === 0 && o.cancelled_at && (Date.now() - new Date(o.cancelled_at).getTime() > 15 * 60 * 1000);
  const purgeCancelled = (rows) => {
    rows.filter(cancelledExpired).slice(0, 6).forEach(async (o) => {
      try {
        const paths = (o.files || []).map(f => f.path).filter(Boolean);
        if (o.slip_path) paths.push(o.slip_path);
        if (paths.length) await DB.storage.from('uploads').remove(paths);
        await DB.from('orders').delete().eq('id', o.id);
      } catch (e) {}
    });
  };
  const load = React.useCallback(async () => {
    if (!DB) return;
    setLoading(true);
    const cols = 'id,created_at,status,print_cost,bind_cost,slip_path,customer_fname,paper,copies';
    const colsFull = cols + ',payout_at,pickup,sides,customer_lname,customer_phone,delivery_cost,night_fee,times,cancel_reason,files,total,addr,point,lat,lng';
    let r = await DB.from('orders').select(colsFull + ',cancelled_at').eq('ptype', 'pro').order('created_at', { ascending: false }).limit(3000);
    if (r.error) r = await DB.from('orders').select(colsFull).eq('ptype', 'pro').order('created_at', { ascending: false }).limit(3000); // ยังไม่รัน SQL ลบอัตโนมัติ
    if (r.error) r = await DB.from('orders').select(cols).eq('ptype', 'pro').order('created_at', { ascending: false }).limit(3000);
    if (!r.error && r.data) { setOrders(r.data.filter(o => !cancelledExpired(o))); purgeCancelled(r.data); }
    setLoading(false);
  }, []);

  // ── เครื่องมือจัดการของเจ้าของ (ย้ายมาจาก pro.html — หน้านั้นเป็นของร้านอุดมสุขล้วนๆ แล้ว) ──
  const setPrice = async (o, n) => {
    const total = n + (o.bind_cost || 0) + (o.delivery_cost || 0) + (o.night_fee || 0);
    if (DB) { await DB.from('orders').update({ print_cost: n, total }).eq('id', o.id); await load(); }
    else setOrders(l => l.map(x => x.id === o.id ? { ...x, print_cost: n, total } : x));
  };
  const markPayout = async (o) => {
    const ts = new Date().toISOString();
    if (DB) { await DB.from('orders').update({ payout_at: ts }).eq('id', o.id); await load(); }
    else setOrders(l => l.map(x => x.id === o.id ? { ...x, payout_at: ts } : x));
  };
  const advance = async (o) => {
    const next = Math.min((o.status || 1) + 1, 4);
    const times = (o.times || ['', '', '', '']).slice();
    times[next - 1] = fmtHM(new Date());
    if (DB) {
      await DB.from('orders').update({ status: next, times }).eq('id', o.id);
      if (next >= 3) { try { fetch(CFG.SUPABASE_URL + '/functions/v1/notify-order?action=done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id }) }); } catch (e) {} }
      await load();
    }
    else setOrders(l => l.map(x => x.id === o.id ? { ...x, status: next, times } : x));
  };
  const cancelOrder = async (o, reason) => {
    if (DB) {
      await DB.from('orders').update({ status: 0, cancel_reason: reason }).eq('id', o.id);
      // แจ้งลูกค้าทาง LINE (ล้มเหลวไม่กระทบการยกเลิก)
      try { fetch(CFG.SUPABASE_URL + '/functions/v1/notify-order?action=cancelled', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id }) }); } catch (e) {}
      await load();
    }
    else setOrders(l => l.map(x => x.id === o.id ? { ...x, status: 0, cancel_reason: reason } : x));
  };
  const removeOrder = async (o) => {
    if (DB) {
      try {
        const paths = [];
        (o.files || []).forEach(f => { if (f.path) paths.push(f.path); });
        if (o.slip_path) paths.push(o.slip_path);
        if (paths.length) await DB.storage.from('uploads').remove(paths);
        await DB.from('orders').delete().eq('id', o.id);
        await load();
      } catch (e) { alert('ลบไม่สำเร็จ: ' + e.message); }
    } else setOrders(l => l.filter(x => x.id !== o.id));
  };
  React.useEffect(() => { load(); }, [load]);

  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const month = new Date(now.getFullYear(), now.getMonth(), 1);
  const year = new Date(now.getFullYear(), 0, 1);
  // รับรู้รายได้เมื่องานจบ (ส่งถึงมือลูกค้า = สถานะ 4) — งานระหว่างทางแยกเป็น "คอมรอรับ"
  const done = orders.filter(o => o.status === 4 && jobValue(o) > 0);
  // ค่าส่ง = รายได้ของ MORE PRINT เต็มจำนวน (เราวิ่งส่งเอง) — ไม่เข้าสูตรหารคอมกับร้านพาร์ทเนอร์
  // นับจากงานที่จบทุกใบ แม้ยังไม่ได้ตั้งราคาปริ้น เพราะค่าส่งลูกค้าจ่ายมาแล้วตั้งแต่ต้น
  const doneAll = orders.filter(o => o.status === 4);
  const shipOf = (o) => (o.delivery_cost || 0) + (o.night_fee || 0);
  const pending = orders.filter(o => o.status > 0 && o.status < 4);
  const pendingComm = pending.reduce((a, o) => a + jobValue(o) * COMMISSION, 0);
  const agg = (since) => {
    const rows = done.filter(o => new Date(o.created_at) >= since);
    const job = rows.reduce((a, o) => a + jobValue(o), 0);
    const ship = doneAll.filter(o => new Date(o.created_at) >= since).reduce((a, o) => a + shipOf(o), 0);
    return { n: rows.length, job, comm: job * COMMISSION, partner: job * (1 - COMMISSION), ship };
  };
  // ── ข้อมูลกราฟรายได้ของเรา (คอม 33% + ค่าส่ง จากงานที่จบแล้ว) ──
  const chartData = (() => {
    const income = (d0, d1) => {
      const inB = (o) => { const t = new Date(o.created_at); return t >= d0 && t < d1; };
      return done.filter(inB).reduce((a, o) => a + jobValue(o) * COMMISSION, 0)
           + doneAll.filter(inB).reduce((a, o) => a + shipOf(o), 0);
    };
    const out = [];
    if (chartMode === 'd') {
      for (let i = 6; i >= 0; i--) {
        const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        const d1 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i + 1);
        out.push({ label: i === 0 ? 'วันนี้' : d0.getDate() + '/' + (d0.getMonth() + 1), v: income(d0, d1) });
      }
    } else if (chartMode === 'm') {
      for (let i = 5; i >= 0; i--) {
        const d0 = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const d1 = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
        out.push({ label: TH_MONTHS[d0.getMonth()], v: income(d0, d1) });
      }
    } else {
      const ys = new Set();
      doneAll.forEach(o => ys.add(new Date(o.created_at).getFullYear()));
      [...ys].sort().slice(-5).forEach(y => out.push({ label: 'ปี ' + ((y + 543) % 100), v: income(new Date(y, 0, 1), new Date(y + 1, 0, 1)) }));
      if (!out.length) out.push({ label: 'ปี ' + ((now.getFullYear() + 543) % 100), v: 0 });
    }
    const max = Math.max(1, ...out.map(b => b.v));
    return out.map(b => ({ ...b, v: Math.round(b.v * 100) / 100, h: Math.round(b.v / max * 100) }));
  })();
  const PERIODS = [['day', 'วันนี้', today], ['month', 'เดือนนี้', month], ['year', 'ปีนี้', year]];
  const curP = PERIODS.find(x => x[0] === period) || PERIODS[0];
  const curAgg = agg(curP[2]);
  // สรุปรายเดือน
  const byMonth = {};
  const mk = (d) => d.getFullYear() * 100 + d.getMonth();
  const ensureM = (d) => { const k = mk(d); if (!byMonth[k]) byMonth[k] = { y: d.getFullYear(), m: d.getMonth(), n: 0, job: 0, ship: 0 }; return byMonth[k]; };
  done.forEach(o => { const b = ensureM(new Date(o.created_at)); b.n++; b.job += jobValue(o); });
  doneAll.forEach(o => { ensureM(new Date(o.created_at)).ship += shipOf(o); });
  const months = Object.keys(byMonth).sort((a, b) => b - a).map(k => byMonth[k]);

  // ── รอบตัดบิลโอนให้ร้านอุดมสุข: รายสัปดาห์ (จันทร์ 00:00 – อาทิตย์ 23:59) หรือรายวัน (ตัดเที่ยงคืน) ──
  const billPeriods = (() => {
    const map = {};
    done.forEach(o => {
      const d = new Date(o.created_at);
      let from;
      if (billMode === 'd') from = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      else { const dow = (d.getDay() + 6) % 7; from = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow); }
      const key = from.getTime();
      if (!map[key]) map[key] = { from,
        to: billMode === 'd' ? new Date(from.getFullYear(), from.getMonth(), from.getDate() + 1)
                             : new Date(from.getFullYear(), from.getMonth(), from.getDate() + 7),
        n: 0, job: 0, unpaid: 0 };
      const b = map[key];
      b.n++; b.job += jobValue(o);
      if (!o.payout_at) b.unpaid++;
    });
    const fmtD = (d) => d.getDate() + ' ' + TH_MONTHS[d.getMonth()];
    return Object.keys(map).sort((a, b) => b - a).slice(0, 12).map(k => {
      const b = map[k];
      const endShow = new Date(b.to.getTime() - 1);
      const label = billMode === 'd'
        ? 'วันที่ ' + fmtD(b.from) + ' ' + ((b.from.getFullYear() + 543) % 100)
        : fmtD(b.from) + ' – ' + fmtD(endShow) + ' ' + ((endShow.getFullYear() + 543) % 100);
      return { ...b, label, comm: b.job * COMMISSION, net: b.job * (1 - COMMISSION), current: now < b.to };
    });
  })();

  // ── ลูกค้าประจำงาน PRO (เห็นเฉพาะเจ้าของที่นี่ — pro.html ของพาร์ทเนอร์ไม่มีข้อมูลลูกค้า) ──
  // จัดกลุ่มตามเบอร์โทร ไม่นับที่ยกเลิก · ยอด = ค่างานจริง (ปริ้น+เข้าเล่ม ไม่รวมค่าส่ง)
  const custMap = {};
  orders.forEach(o => {
    if (o.status === 0) return;
    const k = o.customer_phone || o.customer_fname || '?';
    if (!custMap[k]) custMap[k] = { name: ('คุณ' + (o.customer_fname || '') + ' ' + (o.customer_lname || '')).trim(), phone: o.customer_phone || '', count: 0, job: 0, last: o.created_at, jobs: {} };
    const c = custMap[k];
    c.count++; c.job += jobValue(o);
    const jl = o.paper || 'PRO';
    c.jobs[jl] = (c.jobs[jl] || 0) + 1;
    if (o.created_at > c.last) c.last = o.created_at;
  });
  const customers = Object.values(custMap).map(c => ({
    ...c,
    topJobs: Object.entries(c.jobs).sort((a, b) => b[1] - a[1]).slice(0, 2), // งานที่สั่งบ่อยสุด 2 อันดับ
    tier: c.count >= 5 ? 2 : c.count >= 2 ? 1 : 0
  })).sort((a, b) => b.count - a.count || b.job - a.job);

  // ── ใบสรุปยอดประจำเดือน (บิลส่งให้ร้านพาร์ทเนอร์) ──
  if (bill) {
    const rows = done.filter(o => { const d = new Date(o.created_at);
      return bill.from ? (d >= bill.from && d < bill.to) : (d.getFullYear() === bill.y && d.getMonth() === bill.m); });
    const job = rows.reduce((a, o) => a + jobValue(o), 0);
    const comm = job * COMMISSION, net = job - comm;
    const unpaid = rows.filter(o => !o.payout_at);
    const unpaidNet = unpaid.reduce((a, o) => a + jobValue(o) * (1 - COMMISSION), 0);
    const monthLabel = bill.label || (TH_MONTHS[bill.m] + ' ' + (bill.y + 543));
    const d0 = new Date();
    return (
      <div style={css("min-height:100vh;background:#fff;color:#111")}>
        <div className="no-print" style={css("padding:12px 16px;display:flex;gap:10px;background:var(--soft);position:sticky;top:0")}>
          <button onClick={() => setBill(null)} style={css("height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer")}>← กลับ</button>
          <button onClick={() => window.print()} style={css("flex:1;height:38px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;cursor:pointer")}>🖨️ พิมพ์ / บันทึกเป็น PDF (ส่งให้ร้านทาง LINE ได้)</button>
        </div>
        <div style={css("max-width:640px;margin:0 auto;padding:28px 24px 60px")}>
          <div style={css("display:flex;justify-content:space-between;align-items:flex-start;gap:12px")}>
            <div>
              <div style={css("font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;letter-spacing:1px")}><span style={css("color:#00b368")}>MORE</span> PRINT</div>
              <div style={css("font-size:11px;color:#888;margin-top:2px")}>บริการปริ้นเอกสารพร้อมส่ง 24 ชม. รอบ มข.</div>
            </div>
            <div style={css("text-align:right")}>
              <div style={css("font-size:16px;font-weight:800")}>ใบสรุปยอดงาน PRO</div>
              <div style={css("font-size:12px;color:#666")}>{bill.from ? 'รอบ ' : 'ประจำเดือน '}{monthLabel}</div>
            </div>
          </div>
          <div style={css("margin-top:18px;display:flex;justify-content:space-between;gap:12px;font-size:12.5px;line-height:1.7")}>
            <div><span style={css("color:#888")}>เรียน</span><br/><b>{PARTNER_NAME}</b></div>
            <div style={css("text-align:right")}><span style={css("color:#888")}>วันที่ออกเอกสาร</span><br/><b>{d0.getDate()} {TH_MONTHS[d0.getMonth()]} {d0.getFullYear() + 543}</b></div>
          </div>
          <table style={css("margin-top:18px")}>
            <thead><tr>
              {['#', 'วันที่', 'รหัสออเดอร์', 'งาน', 'ยอด (บาท)'].map((h, i) => (
                <th key={i} style={css("text-align:" + (i === 4 ? "right" : "left") + ";font-size:11px;color:#888;font-weight:600;padding:7px 8px;border-bottom:1.5px solid #111;white-space:nowrap")}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {rows.length === 0 && <tr><td colSpan="5" style={css("padding:18px;text-align:center;font-size:12px;color:#888")}>เดือนนี้ยังไม่มีงานที่จบ</td></tr>}
              {rows.map((o, i) => (
                <tr key={o.id}>
                  <td style={css("padding:7px 8px;font-size:12px;color:#888;border-bottom:1px solid #eee")}>{i + 1}</td>
                  <td style={css("padding:7px 8px;font-size:12px;border-bottom:1px solid #eee;white-space:nowrap")}>{fmtDate(o.created_at)}</td>
                  <td style={css("padding:7px 8px;font-size:12px;font-family:'IBM Plex Mono',monospace;border-bottom:1px solid #eee")}>{o.id}</td>
                  <td style={css("padding:7px 8px;font-size:12px;border-bottom:1px solid #eee")}>{o.paper} × {o.copies || 1}</td>
                  <td style={css("padding:7px 8px;font-size:12px;text-align:right;font-family:'IBM Plex Mono',monospace;border-bottom:1px solid #eee")}>{(Math.round(jobValue(o) * 100) / 100).toLocaleString('th-TH')}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={css("margin-top:16px;margin-left:auto;max-width:330px;display:flex;flex-direction:column;gap:6px;font-size:13px")}>
            <div style={css("display:flex;justify-content:space-between")}><span style={css("color:#666")}>ยอดงานรวมทั้งหมด ({rows.length} งาน)</span><span style={css("font-family:'IBM Plex Mono',monospace;font-weight:600")}>{baht(job)}</span></div>
            <div style={css("display:flex;justify-content:space-between")}><span style={css("color:#666")}>หักค่าคอมมิชชั่น MORE PRINT ({Math.round(COMMISSION * 100)}%)</span><span style={css("font-family:'IBM Plex Mono',monospace;font-weight:600;color:#c92a2a")}>−{baht(comm)}</span></div>
            <div style={css("display:flex;justify-content:space-between;border-top:2px solid #111;padding-top:8px;font-size:15px;font-weight:800")}><span>ยอดสุทธิที่{PARTNER_NAME}ได้รับ</span><span style={css("font-family:'IBM Plex Mono',monospace;color:#00744a")}>{baht(net)}</span></div>
            {unpaid.length > 0
              ? <div style={css("font-size:11px;color:#a16207;text-align:right")}>ในจำนวนนี้ยังค้างโอน {unpaid.length} งาน รวม {baht(unpaidNet)}</div>

        {page === 'orders' && (() => {
          // งานตามช่วงเวลาที่เลือกด้านบน — "กำลังทำ" โชว์ทุกใบเสมอ กันงานค้างตกหล่น
          const inPeriod = (o) => new Date(o.created_at) >= curP[2];
          const inWork = orders.filter(o => o.status > 0 && o.status < 4);
          const doneL = orders.filter(o => o.status === 4 && inPeriod(o));
          const cancelL = orders.filter(o => o.status === 0 && inPeriod(o));
          const TABS = [['active', '🖨️ กำลังทำ', inWork], ['done', '✅ เสร็จแล้ว', doneL], ['cancel', '❌ ยกเลิก', cancelL]];
          const cur = TABS.find(t => t[0] === filter) || TABS[0];
          return (
            <React.Fragment>
              <div style={css("font-size:13px;font-weight:700")}>📋 งาน PRO {curP[1]} <span style={css("font-size:10.5px;font-weight:400;color:var(--sub)")}>· เปลี่ยนช่วงเวลาได้ที่แถบบนสุด · งานที่ยังไม่เสร็จแสดงทุกช่วงเสมอ</span></div>
              <div style={css("display:flex;gap:7px")}>
                {TABS.map(([k, label, list]) => (
                  <button key={k} onClick={() => setFilter(k)} style={{ flex: 1, height: '42px', borderRadius: '12px', cursor: 'pointer', fontSize: '11.5px', fontWeight: 700, fontFamily: 'inherit',
                    border: filter === k ? '1.5px solid var(--acc)' : '1px solid var(--line)',
                    background: filter === k ? 'var(--accSoft)' : 'var(--card)', color: filter === k ? 'var(--acc)' : 'var(--sub)' }}>
                    {label} ({list.length})
                  </button>
                ))}
              </div>
              {loading && <div style={css("text-align:center;color:var(--sub);font-size:13px;padding:16px 0")}>กำลังโหลด…</div>}
              {!loading && cur[2].length === 0 && <div style={css("text-align:center;color:var(--sub);font-size:13px;padding:28px 0")}>ไม่มีงานในหมวดนี้</div>}
              {cur[2].map(o => (
          <div key={o.id} style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 16px" + (o.status === 0 ? ";opacity:.5" : ""))}>
            <div style={css("display:flex;align-items:center;gap:8px;flex-wrap:wrap")}>
              <span style={css("font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600")}>{o.id}</span>
              <span style={css("font-size:11px;color:var(--sub)")}>{fmtDate(o.created_at)} · คุณ{o.customer_fname} {o.customer_lname || ''}{o.customer_phone ? <span> · <a href={'tel:' + String(o.customer_phone).replace(/[^0-9+]/g, '')}>{o.customer_phone}</a></span> : null} · {o.paper} × {o.copies || 1}</span>
              <span style={css("font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:99px;" + (o.pickup ? "background:var(--accSoft);color:var(--acc)" : "background:#f0ebff;color:var(--purple)"))}>{o.pickup ? '🏪 มารับเอง' : '🛵 ส่ง'}</span>
              {o.status === 0 && <span style={css("font-size:10.5px;font-weight:700;color:#c92a2a;background:#ffe3e3;padding:2px 9px;border-radius:99px")}>ยกเลิก</span>}
            </div>
            <div style={css("margin-top:7px")}><Pipeline o={o}/></div>
            <div style={css("margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px")}>
              {jobValue(o) > 0 && <React.Fragment>
                <span style={css("color:var(--sub)")}>ค่างานปริ้น <b style={css("font-family:'IBM Plex Mono',monospace;color:var(--ink)")}>{baht(jobValue(o))}</b></span>
                <span style={css("color:var(--sub)")}>คอมเรา <b style={css("font-family:'IBM Plex Mono',monospace;color:var(--acc)")}>{baht(jobValue(o) * COMMISSION)}</b></span>
                <span style={css("color:var(--sub)")}>ให้ร้านอุดมสุข <b style={css("font-family:'IBM Plex Mono',monospace;color:var(--purple)")}>{baht(jobValue(o) * (1 - COMMISSION))}</b></span>
              </React.Fragment>}
              {shipOf(o) > 0 && <span style={css("color:var(--sub)")}>🛵 ค่าส่ง (ของเราเต็ม) <b style={css("font-family:'IBM Plex Mono',monospace;color:var(--green)")}>{baht(shipOf(o))}</b></span>}
            </div>
            <Manage o={o} onPrice={setPrice} onPayout={markPayout} onAdvance={advance} onCancel={cancelOrder} onRemove={removeOrder}/>
            <Chat o={o}/>
          </div>
              ))}
            </React.Fragment>
          );
        })()}
      </div>
    </div>
      </div>
    </div>
  );
}

function App(){
  const [authed, setAuthed] = React.useState(false);
  if (!authed) return <Login onOk={() => setAuthed(true)}/>;
  return <Dash/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
