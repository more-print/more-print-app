<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORE PRINT — เว็บปริ้นเอกสาร มข.</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--bg);font-family:'IBM Plex Sans Thai',sans-serif;
  --bg:#f4f4f2;--card:#ffffff;--ink:#111111;--sub:#8a8a84;--line:#e4e4e0;--soft:#efefec;
  --acc:#00b368;--accBright:#00d97e;--accSoft:#e6f7ef;--head:#111111;--warnBg:#fff7e0;--warnLine:#f0dfa6;--warnInk:#8a6d1a;--shadow:0 2px 10px rgba(0,0,0,.06)}
  body.night{--bg:#0f0f0d;--card:#1a1a18;--ink:#f2f2ee;--sub:#96968c;--line:#2b2b27;--soft:#232320;
  --acc:#00d97e;--accBright:#00d97e;--accSoft:#123324;--head:#000000;--warnBg:#26200e;--warnLine:#4a3d16;--warnInk:#f0cd6e;--shadow:0 2px 12px rgba(0,0,0,.5)}
  a{color:#00b368}a:hover{color:#008a50}
  input,button{font-family:'IBM Plex Sans Thai',sans-serif}
  @keyframes mpPulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
// ── Config (mirrors the design's editable props) ──────────────────────────
const CONFIG = { nightOverride: 'auto', nightFee: 25, expressFee: 20, deliveryBase: 10 };

// Copy an inline CSS string verbatim into a React style object.
function css(str){
  const o = {};
  String(str).split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if (i < 0) return;
    const prop = decl.slice(0, i).trim();
    if (!prop) return;
    o[prop.startsWith('--') ? prop : prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = decl.slice(i + 1).trim();
  });
  return o;
}

class App extends React.Component {
  constructor(props){
    super(props);
    this.fileRef = React.createRef();
    this.state = {
      screen: 'home', files: [], color: false, paper: 'A4', sides: 1, bind: 'none', copies: 1,
      point: '', addr: '', phone: '', time: '', express: false,
      order: null, trackStep: 1, toast: '', now: new Date(),
      user: null, fname: '', lname: '', phoneIn: '', emailIn: ''
    };
  }

  componentDidMount(){
    try {
      const u = JSON.parse(localStorage.getItem('mp_user') || 'null');
      if (u && u.fname) this.setState({ user: u, phone: u.phone || '' });
      else this.setState({ screen: 'login' });
    } catch (e) { this.setState({ screen: 'login' }); }
    const t = new Date(Date.now() + 90 * 60000);
    this.setState({ time: String(t.getHours()).padStart(2, '0') + ':' + String(Math.floor(t.getMinutes() / 15) * 15).padStart(2, '0') });
    this.clockTimer = setInterval(() => this.setState({ now: new Date() }), 30000);
    this.syncNight();
  }
  componentDidUpdate(){ this.syncNight(); }
  componentWillUnmount(){ clearInterval(this.clockTimer); clearInterval(this.trackTimer); clearTimeout(this.toastTimer); }

  syncNight(){ document.body.classList.toggle('night', this.isNight()); }

  isNight(){
    const ov = CONFIG.nightOverride ?? 'auto';
    if (ov === 'day') return false;
    if (ov === 'night') return true;
    const h = this.state.now.getHours();
    return h >= 22 || h < 6;
  }

  showToast(msg){
    clearTimeout(this.toastTimer);
    this.setState({ toast: msg });
    this.toastTimer = setTimeout(() => this.setState({ toast: '' }), 2200);
  }

  calc(){
    const s = this.state;
    const nightFee = this.isNight() ? (CONFIG.nightFee ?? 25) : 0;
    const expressFee = s.express ? (CONFIG.expressFee ?? 20) : 0;
    const base = CONFIG.deliveryBase ?? 10;
    const pages = s.files.reduce((a, f) => a + f.pages, 0);
    const perPage = (s.color ? 5 : 1) * (s.paper === 'A3' ? 2 : 1);
    const printCost = pages * perPage * s.copies;
    const bindCost = (s.bind === 'corner' ? 5 : s.bind === 'book' ? 40 : 0) * s.copies;
    const deliveryCost = base + expressFee;
    return { pages, printCost, bindCost, printTotal: printCost + bindCost, deliveryCost, nightFee, grandTotal: printCost + bindCost + deliveryCost + nightFee };
  }

  seg(label, on, pick, grow){
    return { label, pick, st: {
      flex: grow ? '1' : 'none', padding: '9px 14px', borderRadius: '10px', fontSize: '12.5px', fontWeight: 600, cursor: 'pointer',
      border: on ? '1.5px solid var(--acc)' : '1px solid var(--line)',
      background: on ? 'var(--accSoft)' : 'var(--soft)', color: on ? 'var(--acc)' : 'var(--ink)'
    } };
  }

  fmtTime(d){ return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  vals(){
    const s = this.state, c = this.calc(), night = this.isNight();
    const set = (k) => (v) => this.setState({ [k]: v });
    const STEPS = ['รับออเดอร์', 'กำลังปริ้น', 'กำลังจัดส่ง', 'ส่งแล้ว'];
    const points = ['โรงชาย มข.', 'คณะบริหารธุรกิจฯ', 'คณะวิศวกรรมฯ', 'คณะศึกษาศาสตร์', 'คณะวิทยาศาสตร์', 'คณะมนุษยศาสตร์ฯ', 'คณะแพทยศาสตร์', 'หอใน มข.', 'คอมเพล็กซ์', 'อื่น ๆ'];
    const step = s.order ? s.trackStep : 0;
    return {
      night, clock: this.fmtTime(s.now),
      rootSt: Object.assign(
        { maxWidth: '430px', margin: '0 auto', minHeight: '100vh', background: 'var(--bg)', display: 'flex', flexDirection: 'column', color: 'var(--ink)' },
        night ? { '--bg': '#0f0f0d', '--card': '#1a1a18', '--ink': '#f2f2ee', '--sub': '#96968c', '--line': '#2b2b27', '--soft': '#232320', '--acc': '#00d97e', '--accBright': '#00d97e', '--accSoft': '#123324', '--warnBg': '#26200e', '--warnLine': '#4a3d16', '--warnInk': '#f0cd6e', '--shadow': '0 2px 12px rgba(0,0,0,.5)' } : {}
      ),
      headStatus: night ? 'NIGHT MODE 22–06' : 'เปิด 24 ชม.',
      nightFee: CONFIG.nightFee ?? 25, expressFee: CONFIG.expressFee ?? 20, deliveryBase: CONFIG.deliveryBase ?? 10,
      isLogin: s.screen === 'login',
      notLogin: s.screen !== 'login',
      fname: s.fname, setFname: (e) => set('fname')(e.target.value),
      lname: s.lname, setLname: (e) => set('lname')(e.target.value),
      phoneIn: s.phoneIn, setPhoneIn: (e) => set('phoneIn')(e.target.value),
      emailIn: s.emailIn, setEmailIn: (e) => set('emailIn')(e.target.value),
      doLogin: () => {
        if (!s.fname.trim() || !s.lname.trim()) return this.showToast('กรอกชื่อ-นามสกุลก่อนนะครับ ✏️');
        if (!s.phoneIn.trim()) return this.showToast('กรอกเบอร์โทรด้วยครับ 📞');
        const user = { fname: s.fname.trim(), lname: s.lname.trim(), phone: s.phoneIn.trim(), email: s.emailIn.trim() };
        try { localStorage.setItem('mp_user', JSON.stringify(user)); } catch (e) {}
        this.setState({ user, phone: user.phone, screen: 'home' });
        this.showToast('ยินดีต้อนรับ คุณ' + user.fname + ' 🎉');
      },
      doLogout: () => this.setState({ user: null, fname: '', lname: '', phoneIn: '', emailIn: '', screen: 'login' }),
      userName: s.user ? s.user.fname + ' ' + s.user.lname : '',
      isHome: s.screen === 'home', isOrder: s.screen === 'order', isDelivery: s.screen === 'delivery', isPay: s.screen === 'pay', isTrack: s.screen === 'track',
      showBack: s.screen === 'order' || s.screen === 'delivery' || s.screen === 'pay',
      goBack: () => this.setState({ screen: s.screen === 'pay' ? 'delivery' : s.screen === 'delivery' ? 'order' : 'home' }),
      startOrder: () => this.setState({ screen: 'order' }),
      goTrack: () => this.setState({ screen: 'track' }),
      pickFiles: () => this.fileRef.current && this.fileRef.current.click(),
      onFiles: (e) => {
        const add = Array.from(e.target.files || []).map(f => ({ name: f.name, pages: 10 }));
        if (add.length) this.setState(st => ({ files: st.files.concat(add) }));
        e.target.value = '';
      },
      files: s.files.map((f, i) => ({
        name: f.name, pages: f.pages,
        inc: () => this.setState(st => ({ files: st.files.map((x, j) => j === i ? { ...x, pages: x.pages + 1 } : x) })),
        dec: () => this.setState(st => ({ files: st.files.map((x, j) => j === i ? { ...x, pages: Math.max(1, x.pages - 1) } : x) })),
        del: () => this.setState(st => ({ files: st.files.filter((_, j) => j !== i) }))
      })),
      colorOpts: [this.seg('ขาวดำ ฿1/หน้า', !s.color, () => this.setState({ color: false }), true), this.seg('สี ฿5/หน้า', s.color, () => this.setState({ color: true }), true)],
      paperOpts: [this.seg('A4', s.paper === 'A4', () => this.setState({ paper: 'A4' }), true), this.seg('A3 (×2)', s.paper === 'A3', () => this.setState({ paper: 'A3' }), true)],
      sidesOpts: [this.seg('หน้าเดียว', s.sides === 1, () => this.setState({ sides: 1 }), true), this.seg('สองหน้า', s.sides === 2, () => this.setState({ sides: 2 }), true)],
      bindOpts: [this.seg('ไม่เข้าเล่ม', s.bind === 'none', () => this.setState({ bind: 'none' })), this.seg('เย็บมุม +฿5', s.bind === 'corner', () => this.setState({ bind: 'corner' })), this.seg('เข้าเล่ม +฿40', s.bind === 'book', () => this.setState({ bind: 'book' }))],
      copies: s.copies,
      copyInc: () => this.setState(st => ({ copies: st.copies + 1 })),
      copyDec: () => this.setState(st => ({ copies: Math.max(1, st.copies - 1) })),
      pageSummary: c.pages + ' หน้า × ' + s.copies + ' ชุด' + (s.color ? ' (สี)' : ' (ขาวดำ)') + (s.paper === 'A3' ? ' A3' : ''),
      printCost: c.printCost, bindCost: c.bindCost, printTotal: c.printTotal,
      deliveryCost: c.deliveryCost, grandTotal: c.grandTotal,
      toDelivery: () => { if (!s.files.length) return this.showToast('เพิ่มไฟล์ก่อนนะครับ 📄'); this.setState({ screen: 'delivery' }); },
      pointOpts: points.map(p => this.seg(p, s.point === p, () => this.setState({ point: p }))),
      addr: s.addr, setAddr: (e) => set('addr')(e.target.value),
      phone: s.phone, setPhone: (e) => set('phone')(e.target.value),
      time: s.time, setTime: (e) => set('time')(e.target.value),
      express: s.express, toggleExpress: () => this.setState(st => ({ express: !st.express })),
      expressTrack: { width: '46px', height: '27px', borderRadius: '99px', background: s.express ? 'var(--acc)' : 'var(--line)', position: 'relative', transition: 'background .2s', flex: 'none' },
      expressKnob: { width: '21px', height: '21px', borderRadius: '50%', background: '#fff', position: 'absolute', top: '3px', left: s.express ? '22px' : '3px', transition: 'left .2s', boxShadow: '0 1px 3px rgba(0,0,0,.3)' },
      deliveryWarn: '',
      toPay: () => {
        if (!s.point) return this.showToast('เลือกจุดส่งก่อนนะครับ 📍');
        if (!s.phone) return this.showToast('ใส่เบอร์โทรผู้รับด้วยครับ 📞');
        this.setState({ screen: 'pay' });
      },
      destLabel: s.point + (s.addr ? ' · ' + s.addr : ''),
      timeLabel: (s.express ? 'ด่วน ~45 นาที' : s.time + ' น.'),
      deliveryLabel: s.express ? '(ด่วน)' : '',
      confirmPay: () => {
        const id = '#MP-' + (1000 + Math.floor(Math.random() * 9000));
        const t0 = this.fmtTime(new Date());
        this.setState({ order: { id, total: c.grandTotal, times: [t0, '', '', ''] }, trackStep: 1, screen: 'track' });
        clearInterval(this.trackTimer);
        this.trackTimer = setInterval(() => {
          this.setState(st => {
            if (!st.order || st.trackStep >= 4) { clearInterval(this.trackTimer); return null; }
            const times = st.order.times.slice(); times[st.trackStep] = this.fmtTime(new Date());
            return { trackStep: st.trackStep + 1, order: { ...st.order, times } };
          });
        }, 7000);
        this.showToast('รับออเดอร์แล้ว! 🎉');
      },
      hasOrder: !!s.order, noOrder: !s.order,
      orderId: s.order ? s.order.id : '', paidTotal: s.order ? s.order.total : 0,
      trackLabel: s.order ? STEPS[Math.min(step, 4) - 1] : '',
      trackBarSt: { height: '100%', background: 'var(--acc)', borderRadius: '99px', width: (step / 4 * 100) + '%' },
      etaLabel: step >= 4 ? 'ส่งแล้ว เรียบร้อย ✓' : step === 3 ? 'ไรเดอร์กำลังไปหาคุณ · อีก ~12 นาที' : step === 2 ? 'กำลังปริ้นเอกสารของคุณ' : 'ร้านรับออเดอร์แล้ว',
      trackSteps: STEPS.map((label, i) => {
        const done = step > i, active = step === i + 1, last = i === 3;
        return {
          label, mark: done ? '✓' : String(i + 1),
          time: s.order && s.order.times[i] ? s.order.times[i] + ' น.' : '',
          dot: { width: '26px', height: '26px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '12px', fontWeight: 700, flex: 'none', background: done ? 'var(--acc)' : 'var(--soft)', color: done ? '#fff' : 'var(--sub)', border: active ? '2px solid var(--acc)' : '2px solid transparent', animation: active ? 'mpPulse 1.6s infinite' : 'none' },
          bar: { width: '3px', flex: '1', minHeight: last ? '0' : '18px', background: step > i + 1 ? 'var(--acc)' : 'var(--line)', display: last ? 'none' : 'block' },
          tt: { fontSize: '13px', fontWeight: done || active ? 700 : 500, color: done || active ? 'var(--ink)' : 'var(--sub)' }
        };
      }),
      newOrder: () => this.setState({ screen: 'order', files: [], copies: 1 }),
      toast: s.toast,
      navItems: [
        { icon: '🏠', label: 'หน้าแรก', k: 'home' }, { icon: '🧾', label: 'สั่งปริ้น', k: 'order' },
        { icon: '🛵', label: 'ติดตาม', k: 'track' }, { icon: '💬', label: 'LINE', k: 'line' }
      ].map(n => ({
        ...n,
        pick: () => n.k === 'line' ? this.showToast('เปิด LINE @moreprint 💬') : this.setState({ screen: n.k }),
        st: { textAlign: 'center', cursor: 'pointer', minWidth: '58px', padding: '4px 0', color: this.state.screen === n.k ? 'var(--acc)' : 'var(--sub)' }
      }))
    };
  }

  render(){
    const v = this.vals();
    return (
      <div style={v.rootSt}>

        {/* ── Header ── */}
        <div style={css("background:var(--head);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10")}>
          <div style={css("display:flex;align-items:center;gap:10px")}>
            {v.showBack && <button onClick={v.goBack} style={css("background:#2a2a2a;border:none;color:#fff;width:30px;height:30px;border-radius:8px;font-size:15px;cursor:pointer")}>‹</button>}
            <div style={css("width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.15)")}><img src="assets/logo-icon.png" alt="" style={css("width:32px;height:auto;display:block")}/></div>
            <div style={css("font-family:'Montserrat',sans-serif;font-weight:800;font-size:19px;letter-spacing:1.5px;line-height:1")}><span style={css("color:var(--accBright)")}>MORE</span> <span style={css("color:#fff")}>PRINT</span></div>
          </div>
          <div style={css("font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--accBright);display:flex;align-items:center;gap:6px")}><span style={css("animation:mpPulse 2s infinite")}>●</span>{v.headStatus}</div>
        </div>

        {/* ── Night banner ── */}
        {v.night && (
          <div style={css("margin:14px 20px 0;background:var(--warnBg);border:1px solid var(--warnLine);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center")}>
            <span style={css("font-size:16px")}>🌙</span><div style={css("font-size:12px;color:var(--warnInk);line-height:1.45")}>ตอนนี้ {v.clock} — ช่วงกลางคืน (22:00–06:00) คิดค่าบริการเพิ่ม <b>+{v.nightFee} บาท</b>/ออเดอร์</div>
          </div>
        )}

        {/* ── Login ── */}
        {v.isLogin && (
          <div style={css("padding:36px 24px;display:flex;flex-direction:column;gap:14px;align-items:stretch")}>
            <div style={css("display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px")}>
              <img src="assets/logo-full.png" alt="MORE PRINT" style={css("width:170px;height:auto;display:block;background:#fff;border-radius:16px")}/>
              <div style={css("font-size:14px;color:var(--sub);text-align:center")}>ลงทะเบียนก่อนสั่งปริ้น ใช้แค่ชื่อกับเบอร์โทร</div>
            </div>
            <div style={css("background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)")}>
              <div><div style={css("font-size:12px;font-weight:600;color:var(--sub)")}>ชื่อจริง</div>
              <input value={v.fname} onChange={v.setFname} placeholder="เช่น สมชาย" style={css("margin-top:6px;width:100%;box-sizing:border-box;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:14px;outline:none")}/></div>
              <div><div style={css("font-size:12px;font-weight:600;color:var(--sub)")}>นามสกุล</div>
              <input value={v.lname} onChange={v.setLname} placeholder="เช่น ใจดี" style={css("margin-top:6px;width:100%;box-sizing:border-box;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:14px;outline:none")}/></div>
              <div><div style={css("font-size:12px;font-weight:600;color:var(--sub)")}>เบอร์โทร</div>
              <input value={v.phoneIn} onChange={v.setPhoneIn} placeholder="08x-xxx-xxxx" inputMode="tel" style={css("margin-top:6px;width:100%;box-sizing:border-box;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:14px;outline:none")}/></div>
              <div><div style={css("font-size:12px;font-weight:600;color:var(--sub)")}>อีเมล <span style={css("font-weight:400")}>(ไม่บังคับ)</span></div>
              <input value={v.emailIn} onChange={v.setEmailIn} placeholder="you@email.com (ถ้ามี)" inputMode="email" style={css("margin-top:6px;width:100%;box-sizing:border-box;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:14px;outline:none")}/></div>
              <button onClick={v.doLogin} style={css("margin-top:4px;height:50px;border:none;border-radius:14px;background:var(--acc);color:#fff;font-size:15px;font-weight:700;cursor:pointer")}>เข้าสู่ระบบ →</button>
            </div>
            <div style={css("font-size:11.5px;color:var(--sub);text-align:center")}>ข้อมูลใช้สำหรับติดต่อรับ–ส่งเอกสารเท่านั้น</div>
          </div>
        )}

        {/* ── Home ── */}
        {v.isHome && (
          <React.Fragment>
            {v.userName && (
              <div style={css("margin:14px 20px 0;display:flex;justify-content:space-between;align-items:center")}>
                <div style={css("font-size:13px;color:var(--sub)")}>สวัสดี, <b style={css("color:var(--ink)")}>คุณ{v.userName}</b> 👋</div>
                <button onClick={v.doLogout} style={css("border:none;background:none;color:var(--sub);font-size:11px;text-decoration:underline;cursor:pointer")}>เปลี่ยนบัญชี</button>
              </div>
            )}
            <div style={css("padding:20px 20px 0")}>
              <div style={css("font-size:23px;font-weight:700;line-height:1.35;text-wrap:pretty")}>ส่งไฟล์ตอนนี้<br/>เอกสารถึงมือ ทุกคณะใน มข.</div>
              <div style={css("margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sub)")}>B/W ฿1 · COLOR ฿5 · DELIVERY ฿{v.deliveryBase}+</div>
              <div onClick={v.startOrder} style={css("margin-top:16px;border:2px dashed var(--line);border-radius:16px;background:var(--card);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;box-shadow:var(--shadow)")}>

                  <div style={css("display:flex;justify-content:space-between")}><span style={css("color:var(--sub)")}>ส่งที่</span><span style={css("text-align:right;max-width:60%")}>{v.destLabel}</span></div>
                  <div style={css("display:flex;justify-content:space-between")}><span style={css("color:var(--sub)")}>เวลารับ</span><span style={css("font-family:'IBM Plex Mono',monospace")}>{v.timeLabel}</span></div>
                  <div style={css("display:flex;justify-content:space-between;font-weight:700;border-top:1px dashed var(--line);padding-top:6px")}><span>ชำระแล้ว</span><span style={css("font-family:'IBM Plex Mono',monospace;color:var(--acc)")}>฿{v.paidTotal}</span></div>
                </div>
                <button onClick={v.newOrder} style={css("width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer")}>+ สั่งปริ้นใหม่</button>
              </React.Fragment>
            )}
            {v.noOrder && (
              <div style={css("text-align:center;padding:50px 20px;color:var(--sub)")}><div style={css("font-size:36px")}>🗒️</div><div style={css("margin-top:10px;font-size:14px")}>ยังไม่มีออเดอร์ — เริ่มสั่งปริ้นได้เลย</div><button onClick={v.startOrder} style={css("margin-top:16px;height:44px;padding:0 22px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:14px;font-weight:700;cursor:pointer")}>เริ่มสั่งปริ้น</button></div>
            )}
          </div>
        )}

        {/* ── Toast ── */}
        {v.toast && (
          <div style={css("position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;font-size:12.5px;padding:10px 18px;border-radius:99px;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap")}>{v.toast}</div>
        )}

        {/* ── Bottom nav ── */}
        {v.notLogin && (
          <div style={css("position:sticky;bottom:0;margin-top:auto;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 8px 14px;z-index:20")}>
            {v.navItems.map((n, i) => (
              <div key={i} onClick={n.pick} style={n.st}><div style={css("font-size:18px")}>{n.icon}</div><div style={css("font-size:10px;font-weight:600;margin-top:2px")}>{n.label}</div></div>
            ))}
          </div>
        )}
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
