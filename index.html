            {/* ใบเสร็จรับเงิน (ออนไลน์ — ลูกค้าเปิดปริ้นเองได้จากหน้าติดตาม) */}
            <div style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px")}>
              <div style={css("font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px")}><span style={css("display:flex;color:var(--acc)")}>{fi('receipt', 14)}</span>ใบเสร็จรับเงิน</div>
              <div style={css("margin-top:8px;display:flex;gap:8px")}>
                <button onClick={v.rcToggle(false)} style={css("flex:1;height:40px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;" + (!v.rcOn ? "border:1.5px solid var(--acc);background:var(--accSoft);color:var(--acc)" : "border:1px solid var(--line);background:var(--soft);color:var(--sub)"))}>ไม่รับใบเสร็จ</button>
                <button onClick={v.rcToggle(true)} style={css("flex:1;height:40px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;" + (v.rcOn ? "border:1.5px solid var(--acc);background:var(--accSoft);color:var(--acc)" : "border:1px solid var(--line);background:var(--soft);color:var(--sub)"))}>ขอใบเสร็จรับเงิน</button>
              </div>
              {v.rcOn && (
                <div style={css("margin-top:10px;display:flex;flex-direction:column;gap:8px")}>
                  <input value={v.rcName} onChange={v.setRc('rcName')} placeholder="ชื่อผู้ซื้อ (ชื่อ-นามสกุล หรือชื่อบริษัท) *" maxLength={120} style={css("width:100%;box-sizing:border-box;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:13px;outline:none")}/>
                  <textarea value={v.rcAddr} onChange={v.setRc('rcAddr')} placeholder="ที่อยู่ *" rows={2} maxLength={300} style={css("width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:10px 12px;font-size:13px;outline:none;resize:none;font-family:inherit;line-height:1.5")}></textarea>
                  <input value={v.rcTax} onChange={v.setRc('rcTax')} placeholder="เลขประจำตัวผู้เสียภาษี (13 หลัก) *" inputMode="numeric" maxLength={17} style={css("width:100%;box-sizing:border-box;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:13px;outline:none;font-family:'IBM Plex Mono',monospace")}/>
                  <input value={v.rcPhone} onChange={v.setRc('rcPhone')} placeholder="โทรศัพท์ *" inputMode="tel" maxLength={12} style={css("width:100%;box-sizing:border-box;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:13px;outline:none;font-family:'IBM Plex Mono',monospace")}/>
                  <div style={css("font-size:10.5px;color:var(--sub);line-height:1.6")}>ข้อมูลนี้จะขึ้นในใบเสร็จอัตโนมัติ · หลังยืนยันออเดอร์ เปิดดู/สั่งพิมพ์ใบเสร็จได้ที่หน้า "ติดตาม" ครับ</div>
                </div>
              )}
            </div>
            <div style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px")}>
              {/* QR พร้อมเพย์จริงของร้าน (Make by KBank) — กดค้างที่รูปเพื่อบันทึก/สแกนจากอัลบั้มได้ */}
              <img src="assets/promptpay-qr.jpg" alt="PromptPay QR ของร้าน MORE PRINT" style={css("width:250px;max-width:100%;border-radius:12px;border:1px solid var(--line);display:block")} onError={(e) => { e.target.style.display = 'none'; }}/>
              <div style={css("font-size:12px;color:var(--sub);text-align:center;line-height:1.6")}>สแกนด้วยแอปธนาคารไหนก็ได้ · โอนตามยอดด้านบน<br/>แล้วแนบสลิปด้านล่างเพื่อยืนยัน</div>
            </div>
            <input type="file" accept="image/*" ref={this.slipRef} onChange={v.onSlip} style={css("display:none")}/>
            <div onClick={v.pickSlip} style={css("border:2px dashed " + (v.slipName ? "var(--acc)" : "var(--line)") + ";border-radius:14px;background:var(--card);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer")}>
              <div style={css("width:42px;height:42px;border-radius:10px;background:var(--accSoft);display:flex;align-items:center;justify-content:center;font-size:20px")}>🧾</div>
              {v.slipChecking
                ? <div style={css("flex:1;min-width:0")}><div style={css("font-weight:600;font-size:13.5px;color:var(--sub)")}>⏳ กำลังตรวจสลิป…</div></div>
                : v.slipName
                ? <div style={css("flex:1;min-width:0")}><div style={css("font-weight:600;font-size:13.5px;color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap")}>✓ แนบแล้ว: {v.slipName}</div><div style={css("font-size:11px;color:var(--sub)")}>แตะเพื่อเปลี่ยนรูป</div></div>
                : <div><div style={css("font-weight:600;font-size:14px;color:var(--acc)")}>แนบสลิปโอนเงิน *</div><div style={css("font-size:11px;color:var(--sub)")}>ถ่ายรูป / เลือกรูปสลิปจากแอปธนาคาร</div></div>}
            </div>
            <button onClick={v.confirmPay} style={css("width:100%;height:50px;border:none;border-radius:14px;background:var(--acc);color:#fff;font-size:15px;font-weight:700;cursor:pointer")}>✓ โอนแล้ว — ยืนยันออเดอร์</button>
          </div>
        )}

        {/* ── Track ── */}
        {v.isTrack && (
          <div style={css("padding:18px 20px 110px;display:flex;flex-direction:column;gap:14px")}>
            {/* ลูกค้าสั่งหลายใบไล่เลี่ยกัน — ลิสต์ทุกออเดอร์ แตะใบไหนก็สลับไปดูใบนั้น */}
            {v.otherOrders.length > 0 && (
              <div style={css("display:flex;flex-direction:column;gap:8px")}>

                    {h.rc && <button onClick={() => v.openReceipt(h)} style={css("margin-top:11px;width:100%;height:42px;border:1.5px solid var(--acc);border-radius:12px;background:var(--accSoft);color:var(--acc);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px")}>{fi('receipt', 14)} เปิดใบเสร็จรับเงิน{h.rc.no ? ' (เลขที่ ' + h.rc.no + ')' : ''}</button>}
                    <div onClick={() => v.openHistChat(h)} style={css("margin-top:11px;background:var(--acc);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer")}>
                      <span style={css("display:flex;color:#fff")}>{fi('chat', 17)}</span>
                      <div style={css("flex:1;color:#fff")}>
                        <div style={css("font-size:12.5px;font-weight:800;letter-spacing:.5px")}>LIVE CHAT</div>
                        <div style={css("font-size:10.5px;opacity:.9")}>แชทกับร้านเรื่องออเดอร์นี้ — ประวัติแชทยังอยู่ครบ</div>
                      </div>
                      <span style={css("color:#fff")}>›</span>
                    </div>
                    <div onClick={() => v.histDel(h.id)} style={css("margin-top:9px;text-align:center;font-size:11.5px;color:#c92a2a;font-weight:700;cursor:pointer;padding:6px")}>ลบรายการนี้ออกจากประวัติในเครื่อง</div>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}

        {/* ── เกี่ยวกับเรา: ข้อมูลร้าน + ช่องทางติดต่อ/ติดตามทุกช่องทาง ── */}
        {v.isAbout && (
          <div style={css("padding:18px 20px 110px;display:flex;flex-direction:column;gap:12px")}>
            <div style={css("background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 18px;text-align:center;box-shadow:var(--shadow)")}>
              <div style={css("width:66px;height:66px;border-radius:50%;background:#fff;margin:0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--accSoft)")}><img src="assets/logo-icon.png" alt="" style={css("width:46px;height:auto;display:block")}/></div>
              <div style={css("margin-top:12px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:21px;letter-spacing:1.5px")}><span style={css("color:var(--acc)")}>MORE</span> <span>PRINT</span></div>
              <div style={css("margin-top:6px;font-size:12.5px;color:var(--sub);line-height:1.65")}>เว็บปริ้นเอกสารออนไลน์ พร้อมส่งถึงที่ 24 ชม.<br/>รอบมหาวิทยาลัยขอนแก่น (มข.)</div>
              {v.revCount > 0 && <div style={css("margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:var(--accSoft);border-radius:99px;padding:6px 15px;font-size:12px;font-weight:700;color:var(--acc)")}>⭐ {v.revAvg} · {v.revCount} รีวิวจากลูกค้าจริง</div>}
              <div style={css("margin-top:14px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--sub)")}>
                <span style={css("background:var(--soft);border-radius:99px;padding:5px 11px")}>🕐 เปิด 24 ชม.</span>
                <span style={css("background:var(--soft);border-radius:99px;padding:5px 11px")}>🛵 ส่งถึงหอ</span>
                <span style={css("background:var(--soft);border-radius:99px;padding:5px 11px")}>🏪 มารับเองได้</span>
              </div>
            </div>
            <div style={css("margin:6px 2px -4px;font-size:12px;font-weight:700;color:var(--sub)")}>ติดต่อ & ติดตามเรา 👇</div>
            {v.aboutLinks.map((l, i) => (
              <div key={i} onClick={l.go} style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:var(--shadow)")}>
                <div style={css("width:42px;height:42px;flex:none;line-height:0")}>{l.logo}</div>
                <div style={css("flex:1;min-width:0")}>
                  <div style={css("font-size:13.5px;font-weight:700")}>{l.name}</div>
                  <div style={css("margin-top:2px;font-size:11px;color:var(--sub);line-height:1.45")}>{l.sub}</div>
                </div>
                <span style={css("color:var(--sub);font-size:15px")}>›</span>
              </div>
            ))}
          </div>
        )}

        {/* ── ป๊อปอัพประกาศแจ้งปัญหา/ล่าช้า — ถามลูกค้าก่อนเข้าหน้าสั่ง ── */}
        {v.alertPrompt && v.alertBn && (
          <div style={css("position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px")}>
            <div style={css("background:var(--card);border-radius:18px;max-width:340px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.4)")}>
              <div style={css("font-size:36px;text-align:center")}>⚠️</div>
              <div style={css("margin-top:8px;font-size:15px;font-weight:800;text-align:center")}>แจ้งจากทางร้าน</div>
              <div style={css("margin-top:8px;font-size:13.5px;font-weight:600;line-height:1.6;text-align:center;color:#c92a2a")}>{v.alertBn.title}</div>
              {v.alertBn.subtitle && <div style={css("margin-top:4px;font-size:12px;color:var(--sub);line-height:1.55;text-align:center")}>{v.alertBn.subtitle}</div>}
              <div style={css("margin-top:10px;font-size:12.5px;color:var(--sub);text-align:center")}>ยังต้องการสั่งปริ้นต่อไหมครับ?</div>
              <div style={css("margin-top:14px;display:flex;gap:10px")}>
                <button onClick={v.alertStay} style={css("flex:1;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer")}>ไว้ทีหลัง</button>
                <button onClick={v.alertGo} style={css("flex:1;height:44px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer")}>รับทราบ สั่งต่อ</button>
              </div>
            </div>
          </div>
        )}

        {/* ── ใบเสร็จรับเงิน (ป๊อปอัพ — สั่งพิมพ์แล้วเห็นเฉพาะใบเสร็จ) ── */}
        {v.rcView && (() => {
          const rc = v.rcView, money = Number(rc.amount || 0).toLocaleString('en-US');
          // บรรทัดส่วนลด: เขียนเองตามชนิดโค้ด — percent = "ส่วนลด 10% (โค้ด X)" · freeship = "ส่วนลดค่าจัดส่ง — ส่งฟรี" · อื่น ๆ = "ส่วนลด (โค้ด X)"
          const cp = rc.cp && rc.cp.amt > 0 ? rc.cp : null;
          const gross = Number((rc.amount || 0) + (cp ? cp.amt : 0)).toLocaleString('en-US');
          const cpLabel = cp ? (cp.kind === 'percent' ? 'ส่วนลด ' + cp.value + '% (โค้ด ' + cp.code + ')'
            : cp.kind === 'freeship' ? 'ส่วนลดค่าจัดส่ง — ส่งฟรี (โค้ด ' + cp.code + ')'
            : 'ส่วนลด (โค้ด ' + cp.code + ')') : null;
          const line = { borderBottom: '1px dotted #999', flex: 1, minWidth: 0, padding: '0 6px 2px', wordBreak: 'break-word' };
          const row = (label, val, mono) => (
            <div style={{ display: 'flex', alignItems: 'baseline', gap: '6px', fontSize: '13px', lineHeight: 1.9 }}>
              <span style={{ flex: 'none', color: '#333' }}>{label}</span>
              <span style={{ ...line, fontFamily: mono ? "'IBM Plex Mono',monospace" : 'inherit' }}>{val}</span>
            </div>
          );
          return (
            <div style={css("position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;overflow-y:auto;padding:14px")}>
              <div style={css("max-width:560px;margin:0 auto")}>
                <div id="rcSheet" style={{ background: '#fff', color: '#111', borderRadius: '10px', padding: '26px 22px', boxShadow: '0 10px 40px rgba(0,0,0,.35)' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                    <img src="assets/logo-black.png" alt="" onError={(e) => { e.target.style.display = 'none'; }} style={{ height: '34px', width: 'auto', display: 'block' }}/>
                    <div style={{ fontFamily: "'Montserrat',sans-serif", fontSize: '17px', fontWeight: 800, letterSpacing: '.5px', flex: 1 }}>MORE <span style={{ color: '#00b368' }}>PRINT</span></div>
                    <div style={{ fontSize: '17px', fontWeight: 800, flex: 'none' }}>ใบเสร็จรับเงิน</div>
                  </div>
                  <div style={{ marginTop: '16px', display: 'flex', gap: '14px', fontSize: '13px' }}>
                    <div style={{ flex: 1, display: 'flex', alignItems: 'baseline', gap: '6px' }}><span style={{ flex: 'none' }}>วันที่</span><span style={{ ...line, fontFamily: "'IBM Plex Mono',monospace" }}>{rc.date}</span></div>
                    <div style={{ flex: 1, display: 'flex', alignItems: 'baseline', gap: '6px' }}><span style={{ flex: 'none' }}>เลขที่</span><span style={{ ...line, fontFamily: "'IBM Plex Mono',monospace", fontWeight: 700 }}>{rc.no}</span></div>
                  </div>
                  <div style={{ marginTop: '16px' }}>
                    {row('ชื่อผู้ซื้อ', rc.name)}
                    {row('ที่อยู่', rc.addr)}
                    <div style={{ display: 'flex', gap: '0 14px', flexWrap: 'wrap' }}>
                      <div style={{ flex: '1 1 250px', minWidth: 0 }}>{row('เลขประจำตัวผู้เสียภาษี', rc.tax, true)}</div>
                      <div style={{ flex: '1 1 170px', minWidth: 0 }}>{row('โทรศัพท์', rc.phone, true)}</div>
                    </div>
                  </div>
                  <table style={{ marginTop: '18px', width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                    <thead><tr>
                      <th style={{ border: '1px solid #444', padding: '8px 6px', width: '52px', fontWeight: 700 }}>ลำดับ</th>
                      <th style={{ border: '1px solid #444', padding: '8px 6px', fontWeight: 700 }}>รายการ</th>
                      <th style={{ border: '1px solid #444', padding: '8px 6px', width: '110px', fontWeight: 700 }}>จำนวนเงิน (บาท)</th>
                    </tr></thead>
                    <tbody>
                      <tr>
                        <td style={{ border: '1px solid #444', padding: '10px 6px', textAlign: 'center', verticalAlign: 'top' }}>1</td>
                        <td style={{ border: '1px solid #444', padding: '10px 8px', verticalAlign: 'top', lineHeight: 1.6 }}>
                          <span style={{ fontFamily: "'IBM Plex Mono',monospace", fontWeight: 700 }}>{rc.oid}</span><br/>{rc.detail}
                        </td>
                        <td style={{ border: '1px solid #444', padding: '10px 8px', textAlign: 'right', verticalAlign: 'top', fontFamily: "'IBM Plex Mono',monospace" }}>{gross}</td>
                      </tr>
                      <tr><td style={{ border: '1px solid #444', height: '90px' }} colSpan={3}></td></tr>
                      <tr>
                        <td colSpan={2} style={{ border: '1px solid #444', padding: '8px', textAlign: 'right', color: '#333' }}>ราคาสุทธิ</td>
                        <td style={{ border: '1px solid #444', padding: '8px', textAlign: 'right', fontFamily: "'IBM Plex Mono',monospace" }}>{gross}</td>
                      </tr>
                      {cpLabel && (
                        <tr>
                          <td colSpan={2} style={{ border: '1px solid #444', padding: '8px', textAlign: 'right', color: '#c2255c', fontWeight: 700 }}>{cpLabel}</td>
                          <td style={{ border: '1px solid #444', padding: '8px', textAlign: 'right', fontFamily: "'IBM Plex Mono',monospace", color: '#c2255c', fontWeight: 700 }}>−{Number(cp.amt).toLocaleString('en-US')}</td>
                        </tr>
                      )}
                      <tr>
                        <td colSpan={2} style={{ border: '1px solid #444', padding: '8px', textAlign: 'right', fontWeight: 800 }}>ยอดรวม</td>
                        <td style={{ border: '1px solid #444', padding: '8px', textAlign: 'right', fontFamily: "'IBM Plex Mono',monospace", fontWeight: 800, fontSize: '15px' }}>{money}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div style={{ marginTop: '10px', fontSize: '11px', color: '#555' }}>หน่วยเงิน: บาท · ใบเสร็จออนไลน์ ออกโดยระบบ MORE PRINT — ลูกค้าสั่งพิมพ์ได้เอง</div>
                </div>
                <div style={css("margin-top:12px;display:flex;gap:8px")}>
                  <button onClick={v.printRc} style={css("flex:1;height:46px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:14px;font-weight:700;cursor:pointer")}>🖨️ พิมพ์ / บันทึก PDF</button>
                  <button onClick={v.closeRc} style={css("flex:none;height:46px;padding:0 20px;border:none;border-radius:12px;background:#fff;color:#111;font-size:14px;font-weight:700;cursor:pointer")}>ปิด</button>
                </div>
              </div>
            </div>
          );
        })()}

        {/* ── ขยายรูปตัวอย่างงาน Pro ── */}
        {v.prevOpen && (
          <div onClick={v.closePrev} style={css("position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;cursor:pointer")}>
            <img src={'assets/pro/' + v.prevOpen + '.jpg'} alt="" style={css("max-width:100%;max-height:82vh;border-radius:12px;object-fit:contain")}/>
            <div style={css("margin-top:12px;color:#fff;font-size:12.5px;font-weight:600")}>ตัวอย่างงาน{v.prevLabel ? ' ' + v.prevLabel : ''} · แตะที่ไหนก็ได้เพื่อปิด</div>
          </div>
        )}

        {/* ── Toast ── */}
        {v.toast && (
          <div style={css("position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;font-size:12.5px;padding:10px 18px;border-radius:18px;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:86vw;width:max-content;text-align:center;line-height:1.5")}>{v.toast}</div>
        )}

        {/* ── Bottom nav ── */}
        {v.notLogin && (
          <div style={css("position:sticky;bottom:0;margin-top:auto;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 8px 14px;z-index:20")}>
            {v.navItems.map((n, i) => (
              <div key={i} onClick={n.pick} style={n.st}>
                {n.k === 'track'
                  ? /* ปุ่มกลาง "ติดตาม" — วงกลมเขียวนูนเด่นสุดแบบแอปเดลิเวอรี่ */
                    <div style={{ width: '48px', height: '48px', borderRadius: '50%', background: 'var(--acc)', color: '#fff',
                      display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '-22px auto 0',
                      boxShadow: n.on ? '0 0 0 4px var(--accSoft), 0 4px 12px rgba(0,0,0,.25)' : '0 4px 12px rgba(0,0,0,.22)',
                      border: '3px solid var(--card)', boxSizing: 'border-box' }}>{NAV_ICON.track}</div>
                  : <div style={css("height:23px;display:flex;align-items:center;justify-content:center")}>
                      {n.k === 'about'
                        ? <img src="assets/logo-icon.png" alt="" style={Object.assign(
                            { height: '21px', width: 'auto', display: 'block', opacity: n.on ? 1 : .45 },
                            // ไฟล์โลโก้เป็นพื้นขาวทึบ — โหมดกลางคืนกลับสี+ผสมแบบ screen เพื่อคัดพื้นขาวออก เหลือแต่ตัวโลโก้สีขาว
                            v.night ? { filter: 'invert(1) hue-rotate(180deg)', mixBlendMode: 'screen' } : {}
                          )}/>
                        : NAV_ICON[n.k]}
                    </div>}
                <div style={css("font-size:10px;font-weight:600;margin-top:3px")}>{n.label}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
