const POSTER_PRICE = { A5: 10, A4: 15, A3: 30, A2: 130, A1: 250, A0: 500 };
// เรทขาวดำ คิดต่อแผ่นกระดาษ ตามจำนวนแผ่นรวมทั้งงาน: ≤30 แผ่น ฿1 · 31–100 ฿0.75 · >100 ฿0.50
// หน้า-หลัง (1 แผ่น = 2 หน้าเอกสาร): ราคาแผ่นละ = เรทฐาน + ครึ่งหนึ่งของเรทฐาน (×1.5)
function bwSheetRate(totalSheets, sides){
  const base = totalSheets > 100 ? 0.50 : totalSheets > 30 ? 0.75 : 1.00;
  return sides === 2 ? base * 1.5 : base;
}
function pageRate(ptype, size, sides, totalPages){
  if (ptype === 'bw') return bwSheetRate(totalPages, sides);
  if (ptype === 'laser') return 2;
  if (ptype === 'color') return 5;
  if (ptype === 'portfolio') return size === 'A5' ? 8 : 12;
  if (ptype === 'poster') return POSTER_PRICE[size] || 15;
  return 1;
}

// Copy an inline CSS string verbatim into a React style object.
function css(str){
  const o = {};
  String(str).split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if (i < 0) return;
    const prop = decl.slice(0, i).trim();
    if (!prop) return;
    o[prop.startsWith('--') ? prop : prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = decl.slice(i + 1).trim();
  });
  return o;
}

  // วัดระยะทางถนนจริงจากร้าน → จุดส่ง (OSRM ฟรี) — ถ้าเซิร์ฟเวอร์ล่มใช้เส้นตรง ×1.3 ประมาณแทน
  updateDistance(lat, lng){

    this._distTimer = setTimeout(async () => {
      const seq = (this._distSeq = (this._distSeq || 0) + 1);

        const j = await r.json();
        const m = j && j.routes && j.routes[0] && j.routes[0].distance;
        if (seq !== this._distSeq) return;
        this.setState({ distKm: m ? m / 1000 : est, distSrc: m ? 'road' : 'est' });

  async reverseGeocode(lat, lng){

      const j = await r.json();
      const a = j.address || {};
      const label = [a.amenity || a.building || a.shop || a.office, a.road, a.suburb || a.village || a.neighbourhood]
        .filter(Boolean).slice(0, 2).join(' · ') || (j.display_name || '').split(',').slice(0, 2).join(',');

  // Safari เก็บสิทธิ์ตำแหน่งคนละที่กับ Chrome (ไม่มีไอคอนกุญแจข้าง URL)
  geoHelpKind(){
    const ua = navigator.userAgent || '';
    const iOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const safari = /Safari/.test(ua) && !/Chrome|CriOS|Chromium|Edg|FxiOS/.test(ua);
    if (iOS) return 'ios';
    if (safari) return 'safari';     // Safari บน Mac
    return 'other';                   // Chrome / Edge / Firefox

  // เบอร์โทร: รับเฉพาะตัวเลข 10 หลัก + ใส่ขีด 083-xxx-xxxx ให้เองตอนพิมพ์ (พิมพ์ตัวอักษรมา = ตัดทิ้งทันที)
  fmtPhone(v){
    const d = String(v || '').replace(/\D/g, '').slice(0, 10);

    if (d.length <= 6) return d.slice(0, 3) + '-' + d.slice(3);

  locateMe(silent){

  // ── แกะพิกัดจากลิงก์ Google Maps ──
  extractLatLng(s){
    let m = s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/);          // หมุดสถานที่ (แม่นสุด)
    if (!m) m = s.match(/[?&]q=(-?\d{1,2}\.\d+)(?:,|%2C)(-?\d{1,3}\.\d+)/);
    if (!m) m = s.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);          // จุดกลางแผนที่
    if (!m) m = s.match(/center=(-?\d{1,2}\.\d+)(?:%2C|,)(-?\d{1,3}\.\d+)/);
    // รูปแบบ "แชร์ตำแหน่งปัจจุบัน": /maps/search/16.485104,+102.816614
    if (!m) m = s.match(/(-?\d{1,2}\.\d{4,})(?:,|%2C)\s*\+?\s*(-?\d{1,3}\.\d{4,})/);
    if (!m) return null;
    const lat = +m[1], lng = +m[2];
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat, lng };
  }
  async useGmapLink(){
    const pinAtStart = this._pinSeq || 0; // จำสถานะหมุดตอนกดปุ่ม
    const raw = (this.state.gmapLink || '').trim();
    const urlm = raw.match(/https?:\/\/\S+/);
    if (!urlm) return this.showToast('วางลิงก์จาก Google Maps ก่อนนะครับ 🔗');
    const url = urlm[0];
    let pt = this.extractLatLng(url);
    if (!pt) {
      // ลิงก์สั้นจากปุ่มแชร์ (maps.app.goo.gl) — ให้ตัวแกะลิงก์ของร้าน (Edge Function) ตามไปอ่าน URL ปลายทาง
      this.setState({ gmapBusy: true });
      const cfg = window.MP_CONFIG || {};
      try {
        const r = await fetch(cfg.SUPABASE_URL + '/functions/v1/smart-handler?u=' + encodeURIComponent(url));
        if (r.ok) {
          const j = await r.json();
          if (j.final) pt = this.extractLatLng(j.final);
        }
      } catch (e) {}
      if (!pt) {
        // ตัวกลางสำรอง
        try {
          const r2 = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
          if (r2.ok) pt = this.extractLatLng(await r2.text());
        } catch (e) {}
      }
      this.setState({ gmapBusy: false });
    }
    if (!pt) return this.showToast('อ่านพิกัดจากลิงก์ไม่สำเร็จ 🙏 ลองค้นหาชื่อสถานที่หรือปักหมุดเองแทนครับ');
    // ระหว่างรอแกะลิงก์ ถ้าลูกค้าขยับหมุดเอง = ถือว่าอันหลังสุดคือสิ่งที่ลูกค้าต้องการ ไม่ทับทิ้ง
    if ((this._pinSeq || 0) !== pinAtStart) {
      this.setState({ gmapLink: '' });
      return this.showToast('คุณย้ายหมุดหลังวางลิงก์ — ระบบใช้ตำแหน่งหมุดล่าสุดที่คุณเลือกครับ 📍');
    }
    this.setState({ gmapLink: '', pinSrc: 'link', mapLocked: true });
    this.setPin(pt.lat, pt.lng, true);
    this.showToast('📍 ปักหมุดตามลิงก์แล้ว — ล็อกไว้กันเลื่อนพลาด 🔒');
  }

  // ── นับจำนวนหน้าอัตโนมัติ ──
  loadPdfJs(){
    if (this._pdfjsP) return this._pdfjsP;
    this._pdfjsP = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      sc.onload = () => {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        res(window.pdfjsLib);
      };
      sc.onerror = rej;
      document.head.appendChild(sc);
    });
    return this._pdfjsP;
  }
  async countPages(f){
    const name = (f.name || '').toLowerCase();
    if ((f.type || '').startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|heic|bmp)$/.test(name)) return { pages: 1, auto: true, heavy: 0, scanned: false };
    if (f.type === 'application/pdf' || /\.pdf$/.test(name)) {
      if (f.size > 250 * 1024 * 1024) return { pages: 1, auto: false, heavy: 0, scanned: false }; // ใหญ่มาก อ่านในมือถือไม่ไหว
      try {
        const lib = await this.loadPdfJs();
        const buf = await f.arrayBuffer();
        const doc = await lib.getDocument({ data: buf }).promise;
        const n = doc.numPages;
        const cs = await this.scanColor(doc);
        doc.destroy();
        return { pages: Math.max(1, n), auto: true, heavy: cs.heavy, scanned: cs.scanned, thumb: cs.thumb };
      } catch (e) { console.error('pdf count:', e); return { pages: 1, auto: false, heavy: 0, scanned: false }; }
    }
    return { pages: 1, auto: false, heavy: 0, scanned: false }; // DOCX/PPTX ฯลฯ — เว็บนับแม่นไม่ได้ ให้ลูกค้าระบุเอง
  }

  // สแกนปริมาณสีทีละหน้า: วาดหน้าเป็นภาพย่อเล็กๆ แล้ววัดสัดส่วนพื้นที่ที่เป็นหมึกสี
  // แถมเก็บภาพหน้าแรกไว้เป็นรูปตัวอย่าง (thumb) ให้ลูกค้าเช็คไฟล์ในหน้าตรวจสอบออเดอร์
  async scanColor(doc){
    if (doc.numPages > 400) return { heavy: 0, scanned: false, thumb: null }; // ไฟล์หนามาก ข้ามกันมือถือค้าง — ร้านตรวจเอง
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let heavy = 0, thumb = null;
    for (let i = 1; i <= doc.numPages; i++) {
      try {
        const page = await doc.getPage(i);
        // หน้าแรกวาดใหญ่หน่อยเพื่อใช้เป็นรูปตัวอย่าง หน้าอื่นวาดเล็กพอสำหรับวัดสี
        const w = i === 1 ? 220 : 140;
        const vp = page.getViewport({ scale: w / page.getViewport({ scale: 1 }).width });
        canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        // intent:'print' = วาดรวดเดียวไม่รอ animation frame (แท็บพื้นหลัง/เบราว์เซอร์บางตัวไม่ยิง rAF)
        await page.render({ canvasContext: ctx, viewport: vp, intent: 'print' }).promise;
        if (i === 1) { try { thumb = canvas.toDataURL('image/jpeg', 0.8); } catch (e) {} }
        const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let total = 0, ink = 0, color = 0;
        for (let p = 0; p < d.length; p += 4) {
          const r = d[p], g = d[p + 1], b = d[p + 2];
          total++;
          const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          if (!(mx >= 245 && mn >= 245)) ink++; // ไม่ใช่กระดาษขาว = มีหมึก
          if (mx - mn > 25) color++;            // ต่างช่องสีมาก = หมึกสี
        }
        const colorPct = color / total * 100, inkPct = ink / total * 100;
        // สีเยอะเมื่อ (1) พื้นที่สีสดเกินเกณฑ์ หรือ (2) เป็นหน้ารูปภาพ/กราฟิกเกือบเต็มหน้าที่มีสีจริง
        // — ภาพถ่ายมีพิกเซลโทนหม่น/เทาปนเยอะ วัดแบบ (1) อย่างเดียวจะหลุดทั้งที่กินหมึกสีมาก
        if (colorPct > (CONFIG.colorHeavyPct ?? 50) || (inkPct > (CONFIG.photoInkPct ?? 80) && colorPct > (CONFIG.photoMinColorPct ?? 15))) heavy++;
      } catch (e) { /* หน้าที่วาดไม่ได้ นับเป็นสีน้อย */ }
    }
    return { heavy, scanned: true, thumb };
  }

  // อัปโหลดไฟล์ใหญ่ (>50MB) ตรงขึ้นคลัง B2 — ขอตั๋วจาก Edge Function b2-upload แล้วยิงตรง มีแถบ %
  async uploadBig(it){
    const cfg = window.MP_CONFIG || {};
    const setF = (patch) => this.setState(st => ({ files: st.files.map(x => x.uid === it.uid ? { ...x, ...patch } : x) }));
    if (!cfg.SUPABASE_URL) { setF({ upErr: true, up: 0 }); return; }
    try {
      setF({ up: 1, upErr: false, upDone: false });
      const r = await fetch(cfg.SUPABASE_URL + '/functions/v1/b2-upload?action=upload-url');
      const j = await r.json();
      if (!r.ok || !j.uploadUrl) throw new Error('no-ticket');
      const safe = it.name.replace(/[^\w.\-ก-๙เ-ไ]/g, '_');
      const path = 'big/' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + '/' + safe;
      await new Promise((resolve, reject) => {
        const x = new XMLHttpRequest();
        x.open('POST', j.uploadUrl);
        x.setRequestHeader('Authorization', j.token);
        x.setRequestHeader('X-Bz-File-Name', encodeURIComponent(path).replace(/%2F/gi, '/'));
        x.setRequestHeader('Content-Type', 'application/pdf');
        x.setRequestHeader('X-Bz-Content-Sha1', 'do_not_verify');
        x.upload.onprogress = (ev) => { if (ev.total) setF({ up: Math.max(1, Math.round(ev.loaded / ev.total * 100)) }); };
        x.onload = () => x.status === 200 ? resolve() : reject(new Error('up-' + x.status));
        x.onerror = () => reject(new Error('net'));
        x.send(it.file);
      });
      setF({ up: 100, upDone: true, b2Url: j.downloadBase + path });
    } catch (e) { console.error('b2 upload:', e); setF({ upErr: true, up: 0 }); }
  }

  syncNight(){ document.body.classList.toggle('night', this.isNight()); }

  isNight(){
    const ov = CONFIG.nightOverride ?? 'auto';
    if (ov === 'day') return false;
    if (ov === 'night') return true;
    const h = this.state.now.getHours();
    return h >= 22 || h < 6;
  }

  showToast(msg){
    clearTimeout(this.toastTimer);
    this.setState({ toast: msg });
    this.toastTimer = setTimeout(() => this.setState({ toast: '' }), 2200);
  }

  calc(){
    const s = this.state;
    const nightFee = this.isNight() ? (CONFIG.nightFee ?? 10) : 0;
    const expressFee = (CONFIG.expressEnabled !== false && s.express) ? (CONFIG.expressFee ?? 20) : 0;
    // ค่าส่ง 2 ชั้นตามระยะถนนจริง — ลูกค้าเลือกพาหนะเอง (ยังไม่ปักหมุด = โชว์ราคาเริ่มต้น)
    const km = s.distKm;
    const carJob = s.vehicle === 'car';
    const tiers = CONFIG.carTiers || [[2, 69], [4, 89], [6, 129]];
    let deliveryFee, farNote = false, outOfArea = false;
    if (carJob) {
      deliveryFee = tiers[0][1];
      if (km != null) {
        const t = tiers.find(x => km <= x[0]);
        if (t) { deliveryFee = t[1]; farNote = km > tiers[tiers.length - 2][0]; } // ช่วงไกลสุด = นัดเวลาล่วงหน้า
        else { deliveryFee = tiers[tiers.length - 1][1]; outOfArea = true; }
      }
    } else {
      deliveryFee = CONFIG.deliveryBase ?? 19;
      if (km != null) deliveryFee = (CONFIG.deliveryBase ?? 19) + (CONFIG.bikePerKm ?? 6) * (Math.max(1, Math.ceil(km)) - 1);
    }
    const pages = s.files.reduce((a, f) => a + f.pages, 0);
    const totalPages = pages * s.copies;
    let rate = pageRate(s.ptype, s.paper, s.sides, totalPages);
    let printCost = Math.ceil(totalPages * rate);
    // ขาวดำ: คิดต่อแผ่นกระดาษจริง — หน้า-หลัง 1 แผ่นจุ 2 หน้า (เศษหน้าคี่ปัดขึ้นเป็นแผ่นเต็มรายไฟล์)
    let sheets = totalPages;
    if (s.ptype === 'bw') {
      const perCopy = s.sides === 2 ? s.files.reduce((a, f) => a + Math.ceil(f.pages / 2), 0) : pages;
      sheets = perCopy * s.copies;
      rate = bwSheetRate(sheets, s.sides);
      printCost = Math.ceil(sheets * rate);
    }
    // ปริ้นสี: คิดทีละหน้าตามผลสแกนปริมาณสี (หน้า/ไฟล์ที่สแกนไม่ได้ = คิดเรทสีน้อยไว้ก่อน ร้านตรวจยืนยัน)
    let heavyPages = 0, lightPages = 0;
    if (s.ptype === 'color') {
      const heavy = s.files.reduce((a, f) => a + Math.min(f.heavy || 0, f.pages), 0);
      heavyPages = heavy * s.copies;
      lightPages = totalPages - heavyPages;
      printCost = Math.ceil(lightPages * (CONFIG.colorLightPrice ?? 5) + heavyPages * (CONFIG.colorHeavyPrice ?? 7));
    }
    // งาน Pro: ยังไม่กำหนดราคา — คิดค่าปริ้น ฿0 ไว้ก่อน (ลูกค้าชำระค่าส่ง) ร้านยืนยันราคาจริงทาง LINE
    if (s.tier === 'pro') { rate = 0; printCost = 0; heavyPages = 0; lightPages = 0; }
    // งาน Pro เลือกมารับเองที่ร้านอุดมสุข = ไม่มีค่าส่ง ไม่ต้องปักหมุด
    const proPickupOn = s.tier === 'pro' && s.proPickup;
    if (proPickupOn) { deliveryFee = 0; farNote = false; outOfArea = false; }
    // 'landscape' (เล่มแนวนอน) ถูกตัดออกจากตัวเลือกแล้ว — เก็บสูตรราคาไว้ให้ออเดอร์เก่าที่เคยเลือกยังแสดงถูก
    const bindCost = s.tier === 'pro' ? 0 : (s.bind === 'corner' ? 5 : s.bind === 'book' ? 40 : s.bind === 'landscape' ? 60 : 0) * s.copies;
    const deliveryCost = proPickupOn ? 0 : deliveryFee + expressFee;
    const nightFee2 = proPickupOn ? 0 : nightFee; // มารับเอง ไม่มีค่าบริการกลางคืน/ด่วน
    return { pages, totalPages, sheets, rate, heavyPages, lightPages, printCost, bindCost, printTotal: printCost + bindCost,
      deliveryFee, carJob, farNote, outOfArea, proPickupOn, deliveryPending: !proPickupOn && km == null,
      deliveryCost, nightFee: nightFee2, grandTotal: printCost + bindCost + deliveryCost + nightFee2 };
  }

  // เวลาผลิต+ส่งโดยประมาณของงานปัจจุบัน (นาที ยังไม่รวมคิว)
  etaMinutes(){
    const s = this.state;
    if (s.tier !== 'pro') return CONFIG.etaStandardMin ?? 45;
    const m = CONFIG.etaProMin || {};
    if (s.proType === 'plate') return ['A2', 'A1', 'A0'].includes(s.proSize) ? (m.plateBig ?? 180) : (m.plate ?? 90);
    return m[s.proType] ?? 90;
  }

  // งานใหญ่ (Standy / เพลท A3 ขึ้นไป) — ไม่บังคับรถยนต์แล้ว แค่ใช้ "แนะนำ" ให้ลูกค้าเห็นตอนเลือกพาหนะ
  bigJob(){
    const s = this.state;
    return s.tier === 'pro' && (s.proType === 'standee' || (s.proType === 'plate' && ['A0', 'A1', 'A2', 'A3'].includes(s.proSize)));
  }

  // ป้ายสรุปงาน Pro เช่น "เพลท A2" / "พับครึ่ง A3" — ใช้แสดงผลและบันทึกลงช่อง paper
  proLabel(){
    const s = this.state;
    const t = PRO_TYPES.find(x => x.k === s.proType) || PRO_TYPES[0];
    return t.k === 'plate' ? 'เพลท ' + s.proSize
      : t.k === 'poster' ? 'โปสเตอร์ ' + s.proSize
      : t.k === 'foldbook' ? 'พับครึ่ง ' + s.proSize
      : t.k === 'namecard' ? 'นามบัตร ' + s.proQty + ' ชิ้น'
      : t.label;
  }

  seg(label, on, pick, grow){
    return { label, pick, st: {
      flex: grow ? '1' : 'none', padding: '9px 14px', borderRadius: '10px', fontSize: '12.5px', fontWeight: 600, cursor: 'pointer',
      border: on ? '1.5px solid var(--acc)' : '1px solid var(--line)',
      background: on ? 'var(--accSoft)' : 'var(--soft)', color: on ? 'var(--acc)' : 'var(--ink)'
    } };

  fmtTime(d){ return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  // บันทึกออเดอร์ + อัปโหลดไฟล์ขึ้นฐานข้อมูลกลาง (ให้เจ้าของเห็นในหน้าหลังบ้าน)
  async saveOrder(id, c, t0){
    const s = this.state;
    try {
      const files = [];
      for (let i = 0; i < s.files.length; i++) {
        const f = s.files[i];
        let path = null;
        if (f.file && !f.big) {
          const safe = f.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          path = id.replace('#', '') + '/f' + i + '_' + safe;
          const { error } = await this.db.storage.from('uploads').upload(path, f.file);
          if (error) { console.error('upload:', error); path = null; }
        }
        files.push({ name: f.name, pages: f.pages, path, drive_url: f.big ? (f.b2Url || null) : null, auto: !!f.auto, heavy: f.heavy || 0, scanned: !!f.scanned });
      }
      // อัปโหลดสลิปโอนเงิน
      let slip_path = null;
      if (s.slip) {
        const ext = (s.slip.name.split('.').pop() || 'jpg').replace(/[^a-zA-Z0-9]/g, '').slice(0, 5) || 'jpg';
        slip_path = id.replace('#', '') + '/slip.' + ext;
        const { error: se } = await this.db.storage.from('uploads').upload(slip_path, s.slip);
        if (se) { console.error('slip:', se); slip_path = null; }
      }
      const u = s.user || {};
      const payload = {
        id, slip_path,
        customer_fname: u.fname || '', customer_lname: u.lname || '',
        customer_phone: u.phone || s.phone || '', customer_email: u.email || '',
        files, ptype: s.tier === 'pro' ? 'pro' : s.ptype, color: s.tier !== 'pro' && s.ptype === 'color',
        paper: s.tier === 'pro' ? this.proLabel() : s.paper, sides: s.sides,
        bind: s.tier === 'pro' ? (s.proType === 'foldbook' ? s.proBind : 'none') : s.bind, copies: s.copies,
        point: s.geoLabel || '', lat: s.lat, lng: s.lng,
        pickup: s.tier === 'pro' && s.proPickup,
        line_uid: (s.user && s.user.line_uid) || null, // ไว้แจ้งเตือนลูกค้าทาง LINE (เฉพาะคนล็อกอินด้วย LINE)
        // นำหน้าที่อยู่ด้วยพาหนะที่ลูกค้าเลือก — ไรเดอร์/หลังบ้านเห็นทันทีว่าต้องใช้รถอะไร (ไม่ต้องเพิ่มคอลัมน์ใหม่)
        addr: (s.tier === 'pro' && s.proPickup) ? '🏪 มารับเองที่ร้านอุดมสุขปริ้นติ้ง' : (s.vehicle === 'car' ? '🚗 ' : '🏍️ ') + s.addr,
        phone: s.phone, time: '', express: s.express, night: this.isNight(),
        print_cost: c.printCost, bind_cost: c.bindCost, delivery_cost: c.deliveryCost,
        night_fee: this.isNight() ? (CONFIG.nightFee ?? 10) : 0,
        total: c.grandTotal, status: 1, times: [t0, '', '', '']
      };
      let { error } = await this.db.from('orders').insert(payload);
      if (error && (error.message || '').includes('line_uid')) {
        // ฐานข้อมูลยังไม่มีคอลัมน์ line_uid — บันทึกแบบไม่มีไปก่อน ออเดอร์ต้องไม่หาย
        const { line_uid, ...restL } = payload;
        ({ error } = await this.db.from('orders').insert(restL));
      }
      if (error && (error.message || '').includes('pickup')) {
        // ฐานข้อมูลยังไม่มีคอลัมน์ pickup — บันทึกแบบไม่มีไปก่อน ออเดอร์ต้องไม่หาย
        const { pickup, ...restP } = payload;
        ({ error } = await this.db.from('orders').insert(restP));
      }
      if (error && (error.message || '').includes('ptype')) {
        // ฐานข้อมูลยังไม่มีคอลัมน์ ptype — บันทึกแบบไม่มีไปก่อน ออเดอร์ต้องไม่หาย
        const { ptype, ...rest } = payload;
        ({ error } = await this.db.from('orders').insert(rest));
      }
      if (error) throw error;
      // แจ้งเตือน LINE ทีมงาน (ยิงทิ้งไว้ — ถ้าระบบแจ้งเตือนยังไม่ตั้งค่า ออเดอร์ไม่กระทบ)
      try { fetch((window.MP_CONFIG || {}).SUPABASE_URL + '/functions/v1/notify-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) }); } catch (e) {}
    } catch (e) {
      console.error('saveOrder:', e);
      this.showToast('⚠️ บันทึกออนไลน์ไม่สำเร็จ — ติดต่อร้านทาง LINE');
    }
  }

  // เช็คสถานะจากฐานข้อมูลผ่านช่องมองเฉพาะใบ (ต้องรู้รหัสออเดอร์เป๊ะ ๆ เท่านั้น)
  async fetchOrderStatus(id){
    try {
      let row = null;
      const r1 = await this.db.rpc('get_order_status', { oid: id });
      if (!r1.error && r1.data) row = Array.isArray(r1.data) ? r1.data[0] : r1.data;
      if (r1.error) {
        const r2 = await this.db.from('orders').select('status,times,cancel_reason').eq('id', id).single();
        if (!r2.error) row = r2.data;
      }
      if (row) {
        this.setState(st => st.order && st.order.id === id
          ? { trackStep: row.status, cancelReason: row.cancel_reason || '', order: { ...st.order, times: row.times || st.order.times } }
          : null);
        // อัปเดตสำเนาออเดอร์ที่จำไว้ในเครื่อง ให้เปิดเว็บใหม่แล้วเห็นสถานะล่าสุดทันที
        try {
          const od = JSON.parse(localStorage.getItem('mp_order') || 'null');
          if (od && od.id === id) {
            od.step = row.status;
            od.times = row.times || od.times;
            od.cancelReason = row.cancel_reason || '';
            localStorage.setItem('mp_order', JSON.stringify(od));
          }
        } catch (e) {}
        if (row.status === 0 || row.status >= 4) clearInterval(this.trackTimer);
        if (row.status >= 4) this.maybeAutoReview(id);
      }
    } catch (e) {}
  }
  // ── รีวิวจากลูกค้า (ตาราง reviews: anon อ่าน+เพิ่มได้เท่านั้น) ──
  loadReviews(){
    if (!this.db) return;
    this.db.from('reviews').select('id,order_id,name,stars,comment,ptype,auto,created_at').order('id', { ascending: false }).limit(40)
      .then(({ data, error }) => {
        if (error || !data) return; // ตารางยังไม่ถูกสร้าง — ซ่อนส่วนรีวิวไปเงียบๆ
        // ออเดอร์เดียวกันแสดงรีวิวเดียว: แถวใหม่สุดชนะ (รีวิวที่ลูกค้าเขียนเองมาแทน 5 ดาวอัตโนมัติ)
        const seen = {}; const out = [];
        for (const r of data) {
          if (r.order_id) { if (seen[r.order_id]) continue; seen[r.order_id] = 1; }
          out.push(r);
        }
        this.setState({ reviews: out, reviewsReady: true });
      });
  }
  // ออเดอร์ถึงมือลูกค้าแล้ว (ส่งแล้ว) แต่ลูกค้ายังไม่รีวิวเอง → ให้ 5 ดาวอัตโนมัติหนึ่งครั้ง
  maybeAutoReview(id){
    try {
      if (!this.db || !id) return;
      const k = 'mp_review_' + id;
      if (localStorage.getItem(k)) return;
      localStorage.setItem(k, 'auto'); // กันยิงซ้ำจากการเช็คสถานะหลายรอบ
      const od = (() => { try { return JSON.parse(localStorage.getItem('mp_order') || 'null'); } catch (e) { return null; } })();
      const u = this.state.user || {};
      this.db.from('reviews').insert({ order_id: id, name: u.fname || 'ลูกค้า', stars: 5, comment: null, ptype: (od && od.plabel) || null, auto: true })
        .then(({ error }) => {
          if (error) { console.error('auto review:', error); try { localStorage.removeItem(k); } catch (e) {} }
          else this.loadReviews();
        });
      this.setState({});
    } catch (e) {}
  }
  // ติดตามสถานะจริงจากฐานข้อมูล (เจ้าของกดอัปเดต/ยกเลิกจากหน้าหลังบ้าน)
  startPolling(id){
    clearInterval(this.trackTimer);
    this.fetchOrderStatus(id); // เช็คทันทีหนึ่งครั้งก่อน แล้วค่อยวนเช็คทุก 8 วิ
    this.trackTimer = setInterval(() => this.fetchOrderStatus(id), 8000);
  }

  // ── ลูกค้ายกเลิกออเดอร์เอง: ทำได้เฉพาะตอนร้านยังไม่เริ่มปริ้น (สถานะ 1) และไม่เกิน cancelWindowMin นาทีหลังชำระ
  // เงื่อนไขจริงตัดสินที่ SQL customer_cancel (SECURITY DEFINER) — ฝั่งเว็บเป็นแค่หน้าจอ เดาเวลา/สถานะเองไม่ได้
  async selfCancel(){
    const s = this.state;
    if (!s.order || s.selfCancelBusy) return;
    const reason = 'ลูกค้ายกเลิกเอง (ภายใน ' + (CONFIG.cancelWindowMin ?? 10) + ' นาทีหลังชำระเงิน)';
    const markCancelled = () => {
      clearInterval(this.trackTimer);
      this.setState({ trackStep: 0, cancelReason: reason, selfCancelArm: false, selfCancelBusy: false });
      try { const od = JSON.parse(localStorage.getItem('mp_order') || 'null');
        if (od && od.id === s.order.id) { od.step = 0; od.cancelReason = reason; localStorage.setItem('mp_order', JSON.stringify(od)); } } catch (e) {}
      this.showToast('ยกเลิกออเดอร์เรียบร้อยครับ ↩️');
    };
    if (!this.db) return markCancelled(); // โหมดตัวอย่าง: จำลองยกเลิกในเครื่อง
    this.setState({ selfCancelBusy: true });
    const fail = (msg) => { this.setState({ selfCancelBusy: false, selfCancelArm: false }); this.showToast(msg); };
    try {
      const { data, error } = await this.db.rpc('customer_cancel', { oid: s.order.id });
      if (error) return fail('ยกเลิกไม่สำเร็จ ลองอีกครั้ง หรือทักแชทร้านทาง LINE ครับ 🙏');
      if (data === 'printing') { fail('ร้านเริ่มทำงานนี้แล้ว ยกเลิกจากหน้าเว็บไม่ได้ — รีบทักแชทร้านเลยครับ 💬'); return this.fetchOrderStatus(s.order.id); }
      if (data === 'timeout') return fail('เลยช่วงยกเลิก ' + (CONFIG.cancelWindowMin ?? 10) + ' นาทีแล้ว — ทักแชทร้านทาง LINE ครับ 💬');
      if (data !== 'ok') return fail('ยกเลิกไม่สำเร็จ — ทักแชทร้านทาง LINE ครับ 🙏');
      // แจ้งร้านทาง LINE ว่าลูกค้ายกเลิกเอง จะได้ไม่ปริ้นทิ้ง (ยิงแบบไม่รอผล)
      try { fetch((window.MP_CONFIG || {}).SUPABASE_URL + '/functions/v1/notify-order?action=customer-cancelled', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: s.order.id }) }); } catch (e) {}
      markCancelled();
    } catch (e) { fail('ยกเลิกไม่สำเร็จ ลองอีกครั้งครับ 🙏'); }
  }

  // ── แชทกับร้าน (ต้องรู้รหัสออเดอร์ของตัวเอง — ผ่าน RPC เท่านั้น) ──
  loadChat(){
    const s = this.state;
    if (!this.db || !s.order || s.chatOff) return;
    this.db.rpc('get_messages', { oid: s.order.id }).then(({ data, error }) => {
      if (error) { this.setState({ chatOff: true }); return; } // ยังไม่ได้สร้างตาราง — ซ่อนไปเงียบ ๆ
      this.setState({ chat: data || [] });
      // นับว่าอ่านแล้วเฉพาะตอนกล่องแชทโผล่ให้เห็น (ออเดอร์ที่ย่อไว้ยังไม่นับว่าอ่าน)
      const st = this.state;
      if (st.screen === 'chat' && (data || []).some(m => m.sender === 'shop' && !m.seen_by_customer)) {
        this.db.rpc('mark_read', { oid: s.order.id }).then(() => this.setState({ chat: (data || []).map(m => ({ ...m, seen_by_customer: true })) }));
      }
    });
  }
  sendChat(){
    const s = this.state, body = (s.chatText || '').trim();
    if (!body || s.chatBusy || !s.order) return;
    if (!this.db) { // โหมดตัวอย่าง
      this.setState({ chat: [...(s.chat || []), { id: Date.now(), sender: 'customer', body, created_at: new Date().toISOString() }], chatText: '' });
      return;
    }
    this.setState({ chatBusy: true });
    this.db.rpc('post_message', { oid: s.order.id, body }).then(({ error }) => {
      this.setState({ chatBusy: false });
      if (error) return this.showToast('ส่งข้อความไม่สำเร็จ ลองอีกครั้งครับ 🙏');
      this.setState({ chatText: '' });
      // แจ้งทีมทาง LINE ว่ามีแชทใหม่ (ยิงแบบไม่รอผล — ฝั่งเซิร์ฟเวอร์กันแจ้งซ้ำเอง)
      try { fetch((window.MP_CONFIG || {}).SUPABASE_URL + '/functions/v1/notify-order?action=chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: s.order.id }) }); } catch (e) {}
      this.loadChat();
    });
  }

      },
      doEmailLogin: async () => {

        if (!s.passIn) return this.showToast('กรอกรหัสผ่านด้วยครับ 🔑');

        this.setState({ authBusy: true });

        if (error) return this.showToast('อีเมลหรือรหัสผ่านไม่ถูกต้อง ❌');

        if (!fname || !lname) return this.showToast('กรอกชื่อ-นามสกุลก่อนนะครับ ✏️');
        if (!EMAIL_RE.test(email)) return this.showToast('รูปแบบอีเมลไม่ถูกต้อง ❌');
        if (s.regPass1.length < 6) return this.showToast('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร 🔑');
        if (s.regPass1 !== s.regPass2) return this.showToast('รหัสผ่าน 2 ช่องไม่เหมือนกัน ❌');
        if (!this.auth) {

      showBack: s.screen === 'order' || s.screen === 'delivery' || s.screen === 'review' || s.screen === 'pay' || s.screen === 'chat',

      startOrder: () => {

        // มีประกาศแจ้งปัญหา/ล่าช้า → ถามลูกค้าก่อนหนึ่งครั้งว่ายังจะสั่งต่อไหม

      onFiles: (e) => {
        const MAX_MB = 50; // เพดานอัปโหลดของระบบไฟล์
        const list = Array.from(e.target.files || []);
        e.target.value = '';
        const isPdf = (f) => f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');
        const notPdf = list.filter(f => !isPdf(f));
        if (notPdf.length) this.showToast('❌ รับเฉพาะไฟล์ PDF นะครับ — ไฟล์แบบอื่นสั่งทาง LINE ' + ((window.MP_CONFIG || {}).LINE_OA_ID || '@346kifvy') + ' 💬');
        const pdfs = list.filter(isPdf);
        if (!pdfs.length) return;
        // ไฟล์ใหญ่เกิน 50MB → อัปโหลดตรงขึ้นคลังไฟล์ใหญ่ (B2) ทันทีแบบเบื้องหลัง มีแถบ % ให้ดู
        // (นับหน้า+สแกนสีจากไฟล์ในเครื่องลูกค้าได้ตามปกติ ไม่ต้องรออัปโหลด)
        const ok = pdfs.map(f => ({
          uid: Date.now() + '-' + Math.random().toString(36).slice(2),
          name: f.name, pages: 1, file: f, counting: true, auto: false,
          big: f.size > MAX_MB * 1024 * 1024,
          sizeMB: Math.round(f.size / 1048576),
          up: 0, upDone: false, upErr: false, b2Url: ''
        }));
        if (ok.some(x => x.big)) this.showToast('📁 ไฟล์ใหญ่ — ระบบกำลังอัปโหลดให้อัตโนมัติ อยู่ในหน้านี้จนขึ้น ✓ นะครับ');
        const items = ok;
        this.setState(st => ({ files: st.files.concat(items) }));
        items.forEach(async (it) => {
          if (it.big) this.uploadBig(it);
          const r = await this.countPages(it.file);
          this.setState(st => ({ files: st.files.map(x => x.uid === it.uid ? { ...x, pages: r.pages, auto: r.auto, heavy: r.heavy || 0, scanned: !!r.scanned, thumb: r.thumb || null, counting: false } : x) }));

        pick: () => {

        st: { textAlign: 'center', cursor: 'pointer', minWidth: '58px', padding: '4px 0', color: this.state.screen === n.k ? 'var(--acc)' : 'var(--sub)' }
      }))

                  </div>
                  <div style={css("margin-top:11px;display:flex;flex-direction:column;gap:6px;font-size:11.5px")}>
                    <div style={css("display:flex;gap:10px")}><span style={css("color:var(--sub);flex:none;white-space:nowrap")}>หมายเลขออเดอร์</span><span style={css("flex:1;text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600")}>{v.chatOrder.id}</span></div>
                    {v.chatOrder.phone && <div style={css("display:flex;gap:10px")}><span style={css("color:var(--sub);flex:none;white-space:nowrap")}>เบอร์ผู้รับ</span><span style={css("flex:1;text-align:right;font-family:'IBM Plex Mono',monospace")}>{v.chatOrder.phone}</span></div>}
                    {v.chatOrder.veh && <div style={css("display:flex;gap:10px")}><span style={css("color:var(--sub);flex:none;white-space:nowrap")}>จัดส่งโดย</span><span style={css("flex:1;text-align:right")}>{v.chatOrder.veh}</span></div>}
                    {v.chatOrder.addr && <div style={css("display:flex;gap:10px")}><span style={css("color:var(--sub);flex:none;white-space:nowrap")}>ที่อยู่</span><span style={css("flex:1;text-align:right;line-height:1.5")}>{v.chatOrder.addr}</span></div>}
                  </div>
                </div>
              )}
              {v.chatEmpty && (
                <div style={css("text-align:center;color:var(--sub);padding:14px 20px")}>
                  <div style={css("font-size:12.5px;line-height:1.7")}>เลือกหัวข้อด้านล่าง หรือพิมพ์ข้อความถึงร้านได้เลยครับ</div>
                </div>
              )}
              {v.chatMsgs.map(m => (
                <div key={m.id} style={{ display: 'flex', justifyContent: m.mine ? 'flex-end' : 'flex-start' }}>
                  <div style={{ maxWidth: '80%', background: m.mine ? 'var(--acc)' : 'var(--card)', color: m.mine ? '#fff' : 'var(--ink)',
                    border: m.mine ? 'none' : '1px solid var(--line)', borderRadius: '15px', padding: '9px 13px', fontSize: '13px', lineHeight: 1.55, whiteSpace: 'pre-wrap', wordBreak: 'break-word', boxShadow: 'var(--shadow)' }}>
                    {m.img && (
                      <a href={m.img} target="_blank" rel="noreferrer" style={{ display: 'block', marginBottom: '6px' }}>
                        <img src={m.img} alt="รูปจากร้าน" style={{ maxWidth: '100%', maxHeight: '280px', borderRadius: '10px', display: 'block', background: 'var(--soft)' }}/>
                      </a>
                    )}
                    {m.body}
                    <div style={{ marginTop: '3px', fontSize: '9.5px', opacity: .75, fontFamily: "'IBM Plex Mono',monospace" }}>{m.time}</div>
                  </div>
                </div>
              ))}
            </div>
            <div style={css("border-top:1px solid var(--line);background:var(--card);padding:9px 12px 0;display:flex;gap:7px;overflow-x:auto")}>
              {v.chatQuick.map((q, i) => (
                <button key={i} onClick={q.pick} disabled={v.chatBusy} style={css("flex:none;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--soft);color:var(--ink);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit")}>{q.icon} {q.label}</button>
              ))}
            </div>
            <div style={css("padding:10px 16px 14px;background:var(--card);display:flex;gap:8px")}>
              <input value={v.chatText} onChange={v.setChatText} onKeyDown={v.chatKey} maxLength={500} placeholder="พิมพ์ข้อความ…"
                style={css("flex:1;min-width:0;box-sizing:border-box;height:44px;border:1px solid var(--line);border-radius:22px;background:var(--soft);color:var(--ink);padding:0 16px;font-size:13.5px;outline:none;font-family:inherit")}/>
              <button onClick={v.sendChat} disabled={v.chatBusy || !v.chatText.trim()} style={css("flex:none;width:44px;height:44px;border:none;border-radius:50%;background:var(--acc);color:#fff;font-size:17px;font-weight:700;cursor:pointer" + (v.chatBusy || !v.chatText.trim() ? ";opacity:.45" : ""))}>➤</button>
            </div>
          </div>
        )}

        {/* ── เกี่ยวกับเรา: ข้อมูลร้าน + ช่องทางติดต่อ/ติดตามทุกช่องทาง ── */}
        {v.isAbout && (
          <div style={css("padding:18px 20px 110px;display:flex;flex-direction:column;gap:12px")}>
            <div style={css("background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 18px;text-align:center;box-shadow:var(--shadow)")}>
              <div style={css("width:66px;height:66px;border-radius:50%;background:#fff;margin:0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--accSoft)")}><img src="assets/logo-icon.png" alt="" style={css("width:46px;height:auto;display:block")}/></div>
              <div style={css("margin-top:12px;font-family:'Montserrat',sans-serif;font-weight:800;font-size:21px;letter-spacing:1.5px")}><span style={css("color:var(--acc)")}>MORE</span> <span>PRINT</span></div>
              <div style={css("margin-top:6px;font-size:12.5px;color:var(--sub);line-height:1.65")}>เว็บปริ้นเอกสารออนไลน์ พร้อมส่งถึงที่ 24 ชม.<br/>รอบมหาวิทยาลัยขอนแก่น (มข.)</div>
              {v.revCount > 0 && <div style={css("margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:var(--accSoft);border-radius:99px;padding:6px 15px;font-size:12px;font-weight:700;color:var(--acc)")}>⭐ {v.revAvg} · {v.revCount} รีวิวจากลูกค้าจริง</div>}
              <div style={css("margin-top:14px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--sub)")}>
                <span style={css("background:var(--soft);border-radius:99px;padding:5px 11px")}>🕐 เปิด 24 ชม.</span>
                <span style={css("background:var(--soft);border-radius:99px;padding:5px 11px")}>🛵 ส่งถึงหอ</span>
                <span style={css("background:var(--soft);border-radius:99px;padding:5px 11px")}>🏪 มารับเองได้</span>
              </div>
            </div>
            <div style={css("margin:6px 2px -4px;font-size:12px;font-weight:700;color:var(--sub)")}>ติดต่อ & ติดตามเรา 👇</div>
            {v.aboutLinks.map((l, i) => (
              <div key={i} onClick={l.go} style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:var(--shadow)")}>
                <div style={css("width:42px;height:42px;flex:none;line-height:0")}>{l.logo}</div>
                <div style={css("flex:1;min-width:0")}>
                  <div style={css("font-size:13.5px;font-weight:700")}>{l.name}</div>
                  <div style={css("margin-top:2px;font-size:11px;color:var(--sub);line-height:1.45")}>{l.sub}</div>
                </div>
                <span style={css("color:var(--sub);font-size:15px")}>›</span>
              </div>
            ))}
          </div>
        )}

        {/* ── ป๊อปอัพประกาศแจ้งปัญหา/ล่าช้า — ถามลูกค้าก่อนเข้าหน้าสั่ง ── */}
        {v.alertPrompt && v.alertBn && (
          <div style={css("position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px")}>
            <div style={css("background:var(--card);border-radius:18px;max-width:340px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.4)")}>
              <div style={css("font-size:36px;text-align:center")}>⚠️</div>
              <div style={css("margin-top:8px;font-size:15px;font-weight:800;text-align:center")}>แจ้งจากทางร้าน</div>
              <div style={css("margin-top:8px;font-size:13.5px;font-weight:600;line-height:1.6;text-align:center;color:#c92a2a")}>{v.alertBn.title}</div>
              {v.alertBn.subtitle && <div style={css("margin-top:4px;font-size:12px;color:var(--sub);line-height:1.55;text-align:center")}>{v.alertBn.subtitle}</div>}
              <div style={css("margin-top:10px;font-size:12.5px;color:var(--sub);text-align:center")}>ยังต้องการสั่งปริ้นต่อไหมครับ?</div>
              <div style={css("margin-top:14px;display:flex;gap:10px")}>
                <button onClick={v.alertStay} style={css("flex:1;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer")}>ไว้ทีหลัง</button>
                <button onClick={v.alertGo} style={css("flex:1;height:44px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer")}>รับทราบ สั่งต่อ</button>
              </div>
            </div>
          </div>
        )}

        {/* ── Toast ── */}
        {v.toast && (
          <div style={css("position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;font-size:12.5px;padding:10px 18px;border-radius:18px;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:86vw;width:max-content;text-align:center;line-height:1.5")}>{v.toast}</div>
        )}

        {/* ── Bottom nav ── */}
        {v.notLogin && (
          <div style={css("position:sticky;bottom:0;margin-top:auto;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 8px 14px;z-index:20")}>
            {v.navItems.map((n, i) => (
              <div key={i} onClick={n.pick} style={n.st}>
                <div style={css("height:23px;display:flex;align-items:center;justify-content:center")}>
                  {n.k === 'about'
                    ? <img src="assets/logo-icon.png" alt="" style={Object.assign(
                        { height: '21px', width: 'auto', display: 'block', opacity: n.on ? 1 : .45 },
                        // ไฟล์โลโก้เป็นพื้นขาวทึบ — โหมดกลางคืนกลับสี+ผสมแบบ screen เพื่อคัดพื้นขาวออก เหลือแต่ตัวโลโก้สีขาว
                        v.night ? { filter: 'invert(1) hue-rotate(180deg)', mixBlendMode: 'screen' } : {}
                      )}/>
                    : NAV_ICON[n.k]}
                </div>
                <div style={css("font-size:10px;font-weight:600;margin-top:3px")}>{n.label}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
