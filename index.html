// Copy an inline CSS string verbatim into a React style object.
function css(str){
  const o = {};
  String(str).split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if (i < 0) return;
    const prop = decl.slice(0, i).trim();
    if (!prop) return;
    o[prop.startsWith('--') ? prop : prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = decl.slice(i + 1).trim();
  });
  return o;
}

    // เช็คเงียบ ๆ ว่าประเภทงาน Pro ไหนมีรูปตัวอย่าง (assets/pro/<ประเภท>.jpg) — มีถึงโชว์ป้าย "กดดูตัวอย่างงาน"
    PRO_TYPES.forEach(t => { try { const im = new Image(); im.onload = () => this.setState(st => ({ prevOk: { ...st.prevOk, [t.k]: true } })); im.src = 'assets/pro/' + t.k + '.jpg'; } catch (e) {} });
    // นโยบายใหม่ (2026-09-02 จากรีวิวลูกค้า): ลูกค้าใหม่ชมหน้าเว็บได้เลยไม่ต้องล็อกอิน — ด่านล็อกอินอยู่ตอนกดสั่งปริ้น/ติดตาม
    // LINE Login (LIFF) — เชื่อมกับ LINE OA ของร้าน
    // ถ้าเปิดจากเบราว์เซอร์ในแอป LINE (ไม่ใช่ LIFF) → เด้งไปเปิดแบบ LIFF จะได้ล็อกอินอัตโนมัติ
    if (cfg.LIFF_ID && window.liff && /Line\//i.test(navigator.userAgent) && !window.liff.isInClient()) {
      location.replace('https://liff.line.me/' + cfg.LIFF_ID);
      return;
    }
    if (cfg.LIFF_ID && window.liff) {
      window.liff.init({ liffId: cfg.LIFF_ID })
        .then(() => {
          this._liffReady = true;
          // กลับมาจากหน้า authorize ของ LINE → ล็อกอินอัตโนมัติ
          const hasUser = (() => { try { return !!JSON.parse(localStorage.getItem('mp_user') || 'null'); } catch (e) { return false; } })();
          if (window.liff.isLoggedIn() && !hasUser) this.finishLineLogin();
        })
        .catch((e) => { console.error('liff init:', e); });
    }
    try {
      let u = null; try { u = JSON.parse(localStorage.getItem('mp_user') || 'null'); } catch (e2) {}
      if (!u || !u.fname) u = this.userFromCookie(); // localStorage โดนล้าง — กู้จากคุกกี้สำรอง ไม่เด้ง login
      if (u && u.fname) {
        try { localStorage.setItem('mp_user', JSON.stringify(u)); } catch (e2) {}
        this.backupUser(u);
        this.setState({ user: u, phone: this.fmtPhone(u.phone || '') });
      } // ไม่มีบัญชี = ชมเว็บแบบแขกไปก่อน ล็อกอินตอนจะสั่งจริง
    } catch (e) {}
    // กู้คืนออเดอร์ล่าสุดที่จำไว้ในเครื่อง (เผื่อลูกค้าปิดเว็บแล้วกลับเข้ามา)
    try {
      const od = JSON.parse(localStorage.getItem('mp_order') || 'null');
      if (od && od.id) {
        this.setState({
          order: { id: od.id, total: od.total || 0, times: od.times || ['', '', '', ''], plabel: od.plabel || '', eta: od.eta || null, pickup: !!od.pickup, ts: od.ts || null,
            addr: od.addr || '', phone: od.phone || '', veh: od.veh || '', copies: od.copies || 0, pages: od.pages || 0, fails: od.fails || [], dist: od.dist ?? null, rc: od.rc || null, cp: od.cp || null },
          trackStep: od.step == null ? 1 : od.step, // step 0 (ยกเลิก) เป็น falsy — ห้ามใช้ || 1
          cancelReason: od.cancelReason || ''
        });
        if (this.db) setTimeout(() => this.loadChat(), 400);
        if (this.db && od.step !== 0 && (od.step || 1) < 4) this.startPolling(od.id);
        else if (this.db) this.fetchOrderStatus(od.id);
        // ย้ายเข้าระบบลิสต์หลายออเดอร์ (mp_orders) — ใบที่จบแล้วส่งเข้าประวัติแทน
        if (!this.readOrderList().some(x => x.id === od.id)) {
          if ((od.step || 1) >= 4) this.addHistory(od);
          else this.upsertOrderList(od);
        }
      }
    } catch (e) {}
    if (this.db) setTimeout(() => this.refreshOrderList(), 1200);
    const t = new Date(Date.now() + 90 * 60000);
    this.setState({ time: String(t.getHours()).padStart(2, '0') + ':' + String(Math.floor(t.getMinutes() / 15) * 15).padStart(2, '0') });
    this.clockTimer = setInterval(() => { this.setState({ now: new Date() }); this.purgeCancelledLocal(); this.refreshOrderList(); }, 30000);
    this.purgeCancelledLocal();
    // โหลดข้อความใหม่จากร้านขณะเปิดหน้าติดตาม (ทำงานต่อแม้ออเดอร์ส่งแล้ว)
    this.chatTimer = setInterval(() => { if ((this.state.screen === 'track' || this.state.screen === 'chat') && (this.state.chatFor || this.state.order)) this.loadChat(); }, 8000);
    this.syncNight();
  }
  componentDidUpdate(){ this.syncNight(); this.syncMap(); }
  componentWillUnmount(){
    clearInterval(this.clockTimer); clearInterval(this.trackTimer);
    clearTimeout(this.toastTimer); clearTimeout(this._revTimer); clearTimeout(this._distTimer); clearInterval(this._shopTimer);
    if (this._map) { this._map.remove(); this._map = null; }
  }

  // ── แผนที่เลือกจุดส่ง (สไตล์แอปเรียกรถ: หมุดอยู่กลางจอ เลื่อนแผนที่ใต้หมุดแทนการลากหมุด) ──
  syncMap(){
    const onDelivery = this.state.screen === 'delivery';
    if (onDelivery && !this._map && window.L && document.getElementById('mpMap')) {
      const start = [this.state.lat ?? 16.4746, this.state.lng ?? 102.8235]; // มข.
      const m = window.L.map('mpMap', { zoomControl: false }).setView(start, this.state.lat != null ? 17 : 15);
      window.L.control.zoom({ position: 'bottomleft' }).addTo(m);
      // แผนที่โทนสะอาดอ่านง่ายใกล้เคียง Google Maps (Carto Voyager — ฟรี ไม่ต้องมีคีย์)
      window.L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
        { attribution: '© OpenStreetMap © CARTO', subdomains: 'abcd', maxZoom: 20 }).addTo(m);
      // หมุดกลางจอ: ระหว่างเลื่อนหมุดยกตัวขึ้นเล็กน้อย ปล่อยแล้ววางลง (ฟีลเดียวกับ Grab/Google)
      m.on('movestart', () => { const el = document.getElementById('mpPin'); if (el) el.style.transform = 'translate(-50%,-125%)'; });
      m.on('moveend', () => {
        const el = document.getElementById('mpPin'); if (el) el.style.transform = 'translate(-50%,-100%)';
        if (this._progMove) { this._progMove = false; clearTimeout(this._progTimer); return; } // ระบบเลื่อนเอง ไม่ใช่ลูกค้า
        if (this.state.mapLocked) return; // ล็อกหมุดอยู่ ห้ามเปลี่ยนจุดส่ง
        const c = m.getCenter();
        this._pinSeq = (this._pinSeq || 0) + 1;
        this.setState({ lat: c.lat, lng: c.lng, pinSrc: 'map', gpsConfirm: false });
        clearTimeout(this._revTimer);
        this._revTimer = setTimeout(() => this.reverseGeocode(c.lat, c.lng), 600);
        this.updateDistance(c.lat, c.lng);
      });
      m.on('click', (e) => { if (!this.state.mapLocked) m.panTo(e.latlng); }); // แตะตรงไหน หมุดวิ่งไป (ยกเว้นตอนล็อก)
      this._map = m;
      if (this.state.lat == null && this.state.pinMode === 'map') this.locateMe(true);
    } else if (!onDelivery && this._map) {
      this._map.remove(); this._map = null; this._marker = null;
    }
    // ล็อก/ปลดล็อกการเลื่อนแผนที่จริง ๆ (กันนิ้วปัดโดนแล้วจุดส่งเปลี่ยน)
    if (this._map) {
      const lock = !!this.state.mapLocked;
      ['dragging', 'touchZoom', 'doubleClickZoom', 'scrollWheelZoom', 'boxZoom', 'keyboard'].forEach(h => {
        if (this._map[h]) lock ? this._map[h].disable() : this._map[h].enable();
      });
    }
  }
  setPin(lat, lng, move){
    this._pinSeq = (this._pinSeq || 0) + 1; // นับทุกครั้งที่จุดส่งเปลี่ยน (ใช้กันลิงก์ที่แกะเสร็จช้าทับของใหม่)
    this.setState({ lat, lng });
    if (this._map) {
      // ธงบอกว่าการเลื่อนครั้งนี้ระบบสั่งเอง ไม่ใช่ลูกค้าลาก — moveend จะได้ไม่เปลี่ยนป้ายที่มาของหมุด
      this._progMove = true;
      clearTimeout(this._progTimer);
      this._progTimer = setTimeout(() => { this._progMove = false; }, 900);
      this._map.setView([lat, lng], 17); // เลื่อนแผนที่มาที่จุด (หมุดอยู่กลางจออยู่แล้ว)
    }
    clearTimeout(this._revTimer);
    this._revTimer = setTimeout(() => this.reverseGeocode(lat, lng), 600);
    this.updateDistance(lat, lng);
  }
  // วัดระยะทางถนนจริงจากร้าน → จุดส่ง (OSRM ฟรี) — ถ้าเซิร์ฟเวอร์ล่มใช้เส้นตรง ×1.3 ประมาณแทน
  updateDistance(lat, lng){
    clearTimeout(this._distTimer);
    this.setState({ distKm: null, distSrc: '' });
    this._distTimer = setTimeout(async () => {
      const seq = (this._distSeq = (this._distSeq || 0) + 1);
      const est = Math.hypot((lat - CONFIG.shopLat) * 111, (lng - CONFIG.shopLng) * 105) * 1.3;
      try {
        const r = await fetch('https://router.project-osrm.org/route/v1/driving/' + CONFIG.shopLng + ',' + CONFIG.shopLat + ';' + lng + ',' + lat + '?overview=false');
        const j = await r.json();
        const m = j && j.routes && j.routes[0] && j.routes[0].distance;
        if (seq !== this._distSeq) return;
        this.setState({ distKm: m ? m / 1000 : est, distSrc: m ? 'road' : 'est' });
      } catch (e) {
        if (seq !== this._distSeq) return;
        this.setState({ distKm: est, distSrc: 'est' });
      }
    }, 450);
  }
  async reverseGeocode(lat, lng){
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&accept-language=th&lat=' + lat + '&lon=' + lng);
      const j = await r.json();
      const a = j.address || {};
      const label = [a.amenity || a.building || a.shop || a.office, a.road, a.suburb || a.village || a.neighbourhood]
        .filter(Boolean).slice(0, 2).join(' · ') || (j.display_name || '').split(',').slice(0, 2).join(',');
      this.setState({ geoLabel: label });
    } catch (e) {}
  }
  // Safari เก็บสิทธิ์ตำแหน่งคนละที่กับ Chrome (ไม่มีไอคอนกุญแจข้าง URL)
  geoHelpKind(){
    const ua = navigator.userAgent || '';
    const iOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const safari = /Safari/.test(ua) && !/Chrome|CriOS|Chromium|Edg|FxiOS/.test(ua);
    if (iOS) return 'ios';
    if (safari) return 'safari';     // Safari บน Mac
    return 'other';                   // Chrome / Edge / Firefox
  }
  // ── โค้ดส่วนลด: ตรวจกับฐานข้อมูลผ่าน RPC check_coupon (ปลอมฝั่งเว็บไม่ได้ ราคาจริงคิดจากผลตรวจ) ──
  // รหัสประจำตัวลูกค้าไว้เช็คสิทธิ์คูปอง 1 คน/โค้ด — LINE ID ก่อน รองลงมาอีเมล ท้ายสุดรหัสประจำเครื่อง
  couponUid(){
    const u = this.state.user || {};
    let id = String(u.line_uid || u.email || '').trim().toLowerCase();
    if (!id) {
      try {
        id = localStorage.getItem('mp_did') || '';
        if (!id) { id = 'dev-' + Math.random().toString(36).slice(2, 12); localStorage.setItem('mp_did', id); }
      } catch (e) { id = 'dev-anon'; }
    }
    return id;
  }
  async applyCoupon(){
    const s = this.state, code = (s.couponCode || '').trim().toUpperCase();
    if (!code) return this.showToast('พิมพ์โค้ดส่วนลดก่อนนะครับ 🎟️');
    const usedMsg = 'คุณใช้โค้ดนี้ไปแล้ว ใช้อีกไม่ได้แล้วครับ ❌ (โค้ดใช้ได้ 1 ครั้งต่อ 1 บัญชี)';
    if (!this.db) { // โหมดตัวอย่าง — จำการใช้ในเครื่อง
      let used = []; try { used = JSON.parse(localStorage.getItem('mp_used_demo') || '[]'); } catch (e) {}
      if (used.includes(code)) return this.showToast(usedMsg);
      if (code === 'KKBS5555') { this.setState({ couponOk: { code, kind: 'percent', value: 10 } }); return this.showToast('ใช้โค้ดสำเร็จ! ลด 10% 🎉'); }
      return this.showToast('โค้ดไม่ถูกต้องหรือหมดอายุ ❌');
    }
    this.setState({ couponBusy: true });
    // ส่ง uid ไปเช็คด้วย — ฐานข้อมูลเวอร์ชันเก่า (ไม่รู้จัก uid_in) ให้ถอยไปเช็คแบบเดิม · ห้ามใช้ .catch กับตัวเรียกตรง ๆ (ไลบรารีไม่มีเมธอดนี้ — เคยทำปุ่มค้าง ⏳)
    let res = null;
    try { res = await this.db.rpc('check_coupon', { code_in: code, uid_in: this.couponUid() }); } catch (e) { res = { error: { message: String((e && e.message) || 'network') } }; }
    if (res && res.error && /PGRST202|not find the function|does not exist/i.test(String(res.error.message || '') + String(res.error.code || ''))) {
      try { res = await this.db.rpc('check_coupon', { code_in: code }); } catch (e) { res = { error: { message: 'network' } }; }
    }
    this.setState({ couponBusy: false });
    if (!res) return this.showToast('เช็คโค้ดไม่สำเร็จ ลองอีกครั้งครับ 🙏');
    if (res.error) return this.showToast('ระบบคูปองยังไม่เปิดใช้งานครับ');
    const c = Array.isArray(res.data) ? res.data[0] : res.data;
    if (!c || !c.code) { this.setState({ couponOk: null }); return this.showToast('โค้ดไม่ถูกต้อง หมดอายุ หรือถูกใช้ครบแล้ว ❌'); }
    if (c.kind === 'used') { this.setState({ couponOk: null }); return this.showToast(usedMsg); }
    this.setState({ couponOk: { code: c.code, kind: c.kind, value: Number(c.value), min_total: Number(c.min_total || 0) } });
    this.showToast('ใช้โค้ดสำเร็จ! 🎉 ' + (c.kind === 'percent' ? 'ลด ' + c.value + '%' : c.kind === 'freeship' ? 'ส่งฟรีออเดอร์นี้เลย' : 'ลด ฿' + c.value));
  }

  // ── กันเด้งหลุดล็อกอินเอง: กู้บัญชีจาก localStorage หรือคุกกี้สำรอง (เบราว์เซอร์ในแอป LINE/iOS ชอบล้าง storage เอง) ──
  userFromCookie(){
    try { const m = document.cookie.match(/(?:^|;\s*)mp_user_bk=([^;]+)/); const u = m ? JSON.parse(decodeURIComponent(m[1])) : null; return (u && u.fname) ? u : null; } catch (e) { return null; }
  }
  backupUser(u){
    try { document.cookie = 'mp_user_bk=' + encodeURIComponent(JSON.stringify(u)) + ';max-age=31536000;path=/;SameSite=Lax'; } catch (e) {}
  }
  ensureUser(){
    if (this.state.user) return true;
    let u = null;
    try { u = JSON.parse(localStorage.getItem('mp_user') || 'null'); } catch (e) {}
    if (!u || !u.fname) u = this.userFromCookie();
    if (u && u.fname) {
      try { localStorage.setItem('mp_user', JSON.stringify(u)); } catch (e) {}
      this.setState({ user: u, phone: this.fmtPhone(u.phone || '') });
      return true;
    }
    // ด่านสุดท้าย: เครื่องล้างทั้ง storage และคุกกี้ แต่ session LINE ยังอยู่ — ดึงโปรไฟล์กลับมาเองเงียบ ๆ ไม่เด้งหน้า login
    try { if (this._liffReady && window.liff && window.liff.isLoggedIn()) { this.finishLineLogin(); return true; } } catch (e) {}
    return false;
  }

  // ── ใบเสร็จรับเงิน: ขอเลขรันจากฐานข้อมูล (MP001, MP002, … คนแรกที่ขอได้เลขแรก) แล้วบันทึกเลขกลับทุกที่ที่จำออเดอร์ไว้ ──
  async issueReceipt(o){
    if (!o || !o.rc) return null;
    if (o.rc.no) return o.rc.no;
    let no = null;
    if (!this.db) { // โหมดตัวอย่าง: รันเลขในเครื่อง
      let n = 0; try { n = parseInt(localStorage.getItem('mp_rc_demo') || '0', 10) || 0; } catch (e) {}
      no = 'MP' + String(n + 1).padStart(3, '0');
      try { localStorage.setItem('mp_rc_demo', String(n + 1)); } catch (e) {}
    } else {
      try {
        const { data, error } = await this.db.rpc('issue_receipt', { oid: o.id, bname: o.rc.name, baddr: o.rc.addr, btax: o.rc.tax, bphone: o.rc.phone });
        if (error || !/^MP\d/.test(String(data || ''))) return null; // ยังไม่รัน SQL / ออเดอร์ยังไม่ลงฐาน — ค่อยลองใหม่ตอนลูกค้ากดเปิด
        no = data;
      } catch (e) { return null; }
    }
    const at = Date.now();
    const fix = (od) => od && od.rc && od.id === o.id ? { ...od, rc: { ...od.rc, no, at } } : od;
    this.setState(st => ({ order: fix(st.order), history: (st.history || []).map(fix) }));
    try {
      const od = JSON.parse(localStorage.getItem('mp_order') || 'null'); if (od && od.id === o.id) localStorage.setItem('mp_order', JSON.stringify(fix(od)));
      const list = JSON.parse(localStorage.getItem('mp_orders') || '[]'); localStorage.setItem('mp_orders', JSON.stringify(list.map(fix)));
      const h = JSON.parse(localStorage.getItem('mp_history') || '[]'); localStorage.setItem('mp_history', JSON.stringify(h.map(fix)));
    } catch (e) {}
    return no;
  }

  // ── ที่อยู่จัดส่งประจำ (จำจากออเดอร์ที่สั่งสำเร็จ เก็บในเครื่องลูกค้า สูงสุด 4 ที่) ──
  loadAddrs(){ try { return JSON.parse(localStorage.getItem('mp_addrs') || '[]'); } catch (e) { return []; } }
  saveAddr(a){
    try {
      const list = this.loadAddrs().filter(x => x.addr !== a.addr);
      list.unshift(a);
      localStorage.setItem('mp_addrs', JSON.stringify(list.slice(0, 4)));
    } catch (e) {}
  }
  removeAddr(addr){
    try { localStorage.setItem('mp_addrs', JSON.stringify(this.loadAddrs().filter(x => x.addr !== addr))); } catch (e) {}
    this.setState({});
  }
  pickAddr(a){
    this.setState({ addr: a.addr, vehicle: this.forceCar() ? 'car' : (a.veh || 'bike'), pinMode: 'map', pinSrc: 'saved', mapLocked: true }); // ที่อยู่เคยใช้จริง — ล็อกหมุดให้เลย · งานแข็ง/ฝนตกบังคับรถยนต์
    if (a.lat != null) this.setPin(a.lat, a.lng, true);
    this.showToast('ใช้ที่อยู่ประจำแล้ว 🏠 เช็คหมุดบนแผนที่อีกทีนะครับ');
  }

  // เบอร์โทร: รับเฉพาะตัวเลข 10 หลัก + ใส่ขีด 083-xxx-xxxx ให้เองตอนพิมพ์ (พิมพ์ตัวอักษรมา = ตัดทิ้งทันที)
  fmtPhone(v){
    const d = String(v || '').replace(/\D/g, '').slice(0, 10);
    if (d.length <= 3) return d;
    if (d.length <= 6) return d.slice(0, 3) + '-' + d.slice(3);
    return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
  }
  locateMe(silent){
    if (!navigator.geolocation) { if (!silent) this.showToast('เบราว์เซอร์ไม่รองรับระบุตำแหน่ง — ค้นหาชื่อสถานที่หรือลากหมุดแทนได้ครับ 📍'); return; }
    this.setState({ locating: true });
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        // acc = รัศมีความคลาดเคลื่อน (เมตร) — บนคอม/โน้ตบุ๊กมักหลักร้อยถึงหลักพัน เพราะใช้ WiFi/IP ไม่ใช่ GPS
        const acc = Math.round(pos.coords.accuracy || 0);
        this.setState({ locating: false, pinSrc: 'gps', gpsAcc: acc, gpsConfirm: true });
        this.setPin(pos.coords.latitude, pos.coords.longitude, true);
      },
      (err) => {
        const code = err && err.code;
        // code 1 = ผู้ใช้/เบราว์เซอร์ปิดสิทธิ์ → โชว์กล่องบอกวิธีเปิดตามเบราว์เซอร์จริง (ไม่ใช่ toast ที่หายไป)
        this.setState({ locating: false, geoHelp: code === 1 ? this.geoHelpKind() : '' });
        if (silent || code === 1) return;
        this.showToast('หาตำแหน่งไม่สำเร็จ (คอมพิวเตอร์มักหาไม่เจอ) — ค้นหาชื่อหอ หรือเลื่อนแผนที่ปักหมุดเองได้เลยครับ 📍');
      },
      // คอมหาตำแหน่งช้ากว่ามือถือ ให้เวลามากขึ้นและไม่ใช้ค่าที่จำไว้เก่า
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  }
  async doSearch(){
    const q = this.state.searchQ.trim();
    if (!q) return;
    const seq = (this._searchSeq = (this._searchSeq || 0) + 1);
    this.setState({ searching: true });
    try {
      // Photon: พิมพ์แค่บางส่วนก็เจอ + จัดอันดับผลใกล้ มข. ขึ้นก่อน
      const r = await fetch('https://photon.komoot.io/api/?q=' + encodeURIComponent(q) + '&lat=16.4746&lon=102.8235&limit=6&lang=default');
      const j = await r.json();
      let results = (j.features || []).map(f => ({
        name: [f.properties.name, f.properties.street, f.properties.district || f.properties.city].filter(Boolean).slice(0, 3).join(' · '),
        lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0]
      })).filter(x => x.name && isFinite(x.lat) && isFinite(x.lng));
      if (!results.length) {
        // สำรอง: Nominatim
        const r2 = await fetch('https://nominatim.openstreetmap.org/search?format=json&accept-language=th&countrycodes=th&limit=5&q=' + encodeURIComponent(q));
        const j2 = await r2.json();
        results = j2.map(x => ({ name: x.display_name.split(',').slice(0, 3).join(','), lat: +x.lat, lng: +x.lon }));
      }
      if (seq !== this._searchSeq) return; // มีคำค้นใหม่กว่ากำลังทำงานอยู่
      this.setState({ searching: false, searchResults: results });
      if (!results.length) this.showToast('ไม่พบในแผนที่ 🔍 ปักหมุดเองตรงที่พัก แล้วพิมพ์ชื่อหอในช่องที่อยู่ได้เลยครับ');
    } catch (e) {
      if (seq !== this._searchSeq) return;
      this.setState({ searching: false });
      this.showToast('ค้นหาไม่สำเร็จ ลองอีกครั้งครับ');
    }
  }

  // ── แกะพิกัดจากลิงก์ Google Maps ──
  extractLatLng(s){
    let m = s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/);          // หมุดสถานที่ (แม่นสุด)
    if (!m) m = s.match(/[?&]q=(-?\d{1,2}\.\d+)(?:,|%2C)(-?\d{1,3}\.\d+)/);
    if (!m) m = s.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);          // จุดกลางแผนที่
    if (!m) m = s.match(/center=(-?\d{1,2}\.\d+)(?:%2C|,)(-?\d{1,3}\.\d+)/);
    // รูปแบบ "แชร์ตำแหน่งปัจจุบัน": /maps/search/16.485104,+102.816614
    if (!m) m = s.match(/(-?\d{1,2}\.\d{4,})(?:,|%2C)\s*\+?\s*(-?\d{1,3}\.\d{4,})/);
    if (!m) return null;
    const lat = +m[1], lng = +m[2];
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat, lng };
  }
  async useGmapLink(){
    const pinAtStart = this._pinSeq || 0; // จำสถานะหมุดตอนกดปุ่ม
    const raw = (this.state.gmapLink || '').trim();
    const urlm = raw.match(/https?:\/\/\S+/);
    if (!urlm) return this.showToast('วางลิงก์จาก Google Maps ก่อนนะครับ 🔗');
    const url = urlm[0];
    let pt = this.extractLatLng(url);
    let finalUrl = url;
    if (!pt) {
      // ลิงก์สั้นจากปุ่มแชร์ (maps.app.goo.gl) — ให้ตัวแกะลิงก์ของร้าน (Edge Function) ตามไปอ่าน URL ปลายทาง
      this.setState({ gmapBusy: true });
      const cfg = window.MP_CONFIG || {};
      // fetch พร้อมเวลาหมดอายุ — เน็ตช้า/ตัวกลางล่มต้องไม่ค้างนาฬิกาทรายไม่จบ
      const tfetch = (u, ms) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return fetch(u, { signal: c.signal }).finally(() => clearTimeout(t)); };
      try {
        const r = await tfetch(cfg.SUPABASE_URL + '/functions/v1/smart-handler?u=' + encodeURIComponent(url), 10000);
        if (r.ok) {
          const j = await r.json();
          if (j.final) { finalUrl = j.final; pt = this.extractLatLng(j.final); }
        }
      } catch (e) {}
      if (!pt && finalUrl === url) {
        // ตัวกลางสำรอง (เฉพาะกรณีตัวแกะลิงก์หลักไม่ตอบ)
        try {
          const r2 = await tfetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url), 8000);
          if (r2.ok) {
            const tx = await r2.text();
            pt = this.extractLatLng(tx);
            const mm = tx.match(/https:\/\/www\.google\.com\/maps\?q=[^"'\\\s]+/);
            if (!pt && mm) finalUrl = mm[0];
          }
        } catch (e) {}
      }
      this.setState({ gmapBusy: false });
    }
    if (!pt) {
      // ลิงก์แชร์ "ร้าน/สถานที่" แบบใหม่ของ Google ไม่มีตัวเลขพิกัดใน URL แล้ว (มีแต่ชื่อ+ที่อยู่ใน q=)
      // → ดึงชื่อไปค้นหาในแผนที่ให้เลย ลูกค้าแตะผลที่ตรงหรือเลื่อนหมุดเองต่อได้ทันที
      const qm = finalUrl.match(/[?&]q=([^&]+)/);
      let name = '';
      try { name = qm ? decodeURIComponent(qm[1].replace(/\+/g, ' ')) : ''; } catch (e) {}
      if (name && !/^-?\d/.test(name.trim())) {
        const short = name.split(',')[0].trim().slice(0, 60);
        this.setState({ gmapLink: '', pinMode: 'map', mapLocked: false, searchQ: short }, () => this.doSearch());
        return this.showToast('ลิงก์แบบใหม่ของ Google ไม่บอกพิกัด 🙏 ค้นหา "' + short + '" ให้แล้ว — แตะผลที่ตรง หรือเลื่อนแผนที่ปักหมุดเองครับ');
      }
      if (/share\.google/i.test(url)) return this.showToast('ลิงก์จากแอป Google อ่านพิกัดไม่ได้ 🙏 เปิดแอป Google Maps กดค้างปักหมุดจุดส่ง แล้วแชร์ลิงก์มาวางใหม่ หรือปักหมุดเองครับ');
      return this.showToast('อ่านพิกัดจากลิงก์ไม่สำเร็จ 🙏 ลองค้นหาชื่อสถานที่หรือปักหมุดเองแทนครับ');
    }
    // ระหว่างรอแกะลิงก์ ถ้าลูกค้าขยับหมุดเอง = ถือว่าอันหลังสุดคือสิ่งที่ลูกค้าต้องการ ไม่ทับทิ้ง
    if ((this._pinSeq || 0) !== pinAtStart) {
      this.setState({ gmapLink: '' });
      return this.showToast('คุณย้ายหมุดหลังวางลิงก์ — ระบบใช้ตำแหน่งหมุดล่าสุดที่คุณเลือกครับ 📍');
    }
    this.setState({ gmapLink: '', pinSrc: 'link', mapLocked: true });
    this.setPin(pt.lat, pt.lng, true);
    this.showToast('📍 ปักหมุดตามลิงก์แล้ว — ล็อกไว้กันเลื่อนพลาด 🔒');
  }

  // ── ตรวจสลิปเบื้องต้น: สลิปโอนเงินไทยทุกธนาคารมี QR เสมอ — รูปที่ไม่มี QR = ไม่ใช่สลิป ปฏิเสธก่อนสร้างออเดอร์ ──
  loadJsQR(){
    if (this._jsqrP) return this._jsqrP;
    this._jsqrP = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
      sc.onload = () => res(window.jsQR);
      sc.onerror = rej;
      document.head.appendChild(sc);
    });
    return this._jsqrP;
  }
  // คืนค่า: true = เจอ QR · false = ไม่เจอ (ไม่ใช่สลิป) · null = ตรวจไม่ได้ (ปล่อยผ่าน — ห้ามบล็อกลูกค้าจริงเพราะระบบตรวจล่ม)
  async slipHasQR(file){
    let jsqr;
    try { jsqr = await this.loadJsQR(); } catch (e) { return null; }
    let img, url;
    try {
      url = URL.createObjectURL(file);
      img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    } catch (e) { try { URL.revokeObjectURL(url); } catch (e2) {} return null; }
    try {
      // ลองหลายขนาด — QR ในสลิปบางแอปเล็ก/บางรูปใหญ่มาก ย่อ-ขยายช่วยให้อ่านเจอ
      for (const maxW of [1000, 1600, 640]) {
        const sc = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d', { willReadFrequently: true });
        cx.drawImage(img, 0, 0, w, h);
        const d = cx.getImageData(0, 0, w, h);
        if (jsqr(d.data, w, h, { inversionAttempts: 'attemptBoth' })) return true;
      }
      return false;
    } catch (e) { return null; }
    finally { try { URL.revokeObjectURL(url); } catch (e) {} }
  }

  // ── นับจำนวนหน้าอัตโนมัติ ──
  loadPdfJs(){
    if (this._pdfjsP) return this._pdfjsP;
    this._pdfjsP = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      sc.onload = () => {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        res(window.pdfjsLib);
      };
      sc.onerror = rej;
      document.head.appendChild(sc);
    });
    return this._pdfjsP;
  }
  async countPages(f){
    const name = (f.name || '').toLowerCase();
    if ((f.type || '').startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|heic|bmp)$/.test(name)) return { pages: 1, auto: true, heavy: 0, scanned: false };
    if (f.type === 'application/pdf' || /\.pdf$/.test(name)) {
      if (f.size > 250 * 1024 * 1024) return { pages: 1, auto: false, heavy: 0, scanned: false }; // ใหญ่มาก อ่านในมือถือไม่ไหว
      try {
        const lib = await this.loadPdfJs();
        const buf = await f.arrayBuffer();
        const doc = await lib.getDocument({ data: buf }).promise;
        const n = doc.numPages;
        const cs = await this.scanColor(doc);
        doc.destroy();
        return { pages: Math.max(1, n), auto: true, heavy: cs.heavy, scanned: cs.scanned, thumb: cs.thumb };
      } catch (e) { console.error('pdf count:', e); return { pages: 1, auto: false, heavy: 0, scanned: false }; }
    }
    return { pages: 1, auto: false, heavy: 0, scanned: false }; // DOCX/PPTX ฯลฯ — เว็บนับแม่นไม่ได้ ให้ลูกค้าระบุเอง
  }

  // สแกนปริมาณสีทีละหน้า: วาดหน้าเป็นภาพย่อเล็กๆ แล้ววัดสัดส่วนพื้นที่ที่เป็นหมึกสี
  // แถมเก็บภาพหน้าแรกไว้เป็นรูปตัวอย่าง (thumb) ให้ลูกค้าเช็คไฟล์ในหน้าตรวจสอบออเดอร์
  async scanColor(doc){
    if (doc.numPages > 400) return { heavy: 0, scanned: false, thumb: null }; // ไฟล์หนามาก ข้ามกันมือถือค้าง — ร้านตรวจเอง
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let heavy = 0, thumb = null;
    for (let i = 1; i <= doc.numPages; i++) {
      try {
        const page = await doc.getPage(i);
        // หน้าแรกวาดใหญ่หน่อยเพื่อใช้เป็นรูปตัวอย่าง หน้าอื่นวาดเล็กพอสำหรับวัดสี
        const w = i === 1 ? 220 : 140;
        const vp = page.getViewport({ scale: w / page.getViewport({ scale: 1 }).width });
        canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        // intent:'print' = วาดรวดเดียวไม่รอ animation frame (แท็บพื้นหลัง/เบราว์เซอร์บางตัวไม่ยิง rAF)
        await page.render({ canvasContext: ctx, viewport: vp, intent: 'print' }).promise;
        if (i === 1) { try { thumb = canvas.toDataURL('image/jpeg', 0.8); } catch (e) {} }
        const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let total = 0, ink = 0, color = 0;
        for (let p = 0; p < d.length; p += 4) {
          const r = d[p], g = d[p + 1], b = d[p + 2];
          total++;
          const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          if (!(mx >= 245 && mn >= 245)) ink++; // ไม่ใช่กระดาษขาว = มีหมึก
          if (mx - mn > 25) color++;            // ต่างช่องสีมาก = หมึกสี
        }
        const colorPct = color / total * 100, inkPct = ink / total * 100;
        // สีเยอะเมื่อ (1) พื้นที่สีสดเกินเกณฑ์ หรือ (2) เป็นหน้ารูปภาพ/กราฟิกเกือบเต็มหน้าที่มีสีจริง
        // — ภาพถ่ายมีพิกเซลโทนหม่น/เทาปนเยอะ วัดแบบ (1) อย่างเดียวจะหลุดทั้งที่กินหมึกสีมาก
        if (colorPct > (CONFIG.colorHeavyPct ?? 50) || (inkPct > (CONFIG.photoInkPct ?? 80) && colorPct > (CONFIG.photoMinColorPct ?? 15))) heavy++;
      } catch (e) { /* หน้าที่วาดไม่ได้ นับเป็นสีน้อย */ }
    }
    return { heavy, scanned: true, thumb };
  }

  // อัปโหลดไฟล์ใหญ่ (>50MB) ตรงขึ้นคลัง B2 — ขอตั๋วจาก Edge Function b2-upload แล้วยิงตรง มีแถบ %
  async uploadBig(it){
    const cfg = window.MP_CONFIG || {};
    const setF = (patch) => this.setState(st => ({ files: st.files.map(x => x.uid === it.uid ? { ...x, ...patch } : x) }));
    if (!cfg.SUPABASE_URL) { setF({ upErr: true, up: 0 }); return; }
    try {
      setF({ up: 1, upErr: false, upDone: false });
      const r = await fetch(cfg.SUPABASE_URL + '/functions/v1/b2-upload?action=upload-url');
      const j = await r.json();
      if (!r.ok || !j.uploadUrl) throw new Error('no-ticket');
      const safe = it.name.replace(/[^\w.\-ก-๙เ-ไ]/g, '_');
      const path = 'big/' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + '/' + safe;
      await new Promise((resolve, reject) => {
        const x = new XMLHttpRequest();
        x.open('POST', j.uploadUrl);
        x.setRequestHeader('Authorization', j.token);
        x.setRequestHeader('X-Bz-File-Name', encodeURIComponent(path).replace(/%2F/gi, '/'));
        x.setRequestHeader('Content-Type', 'application/pdf');
        x.setRequestHeader('X-Bz-Content-Sha1', 'do_not_verify');
        x.upload.onprogress = (ev) => { if (ev.total) setF({ up: Math.max(1, Math.round(ev.loaded / ev.total * 100)) }); };
        x.onload = () => x.status === 200 ? resolve() : reject(new Error('up-' + x.status));
        x.onerror = () => reject(new Error('net'));
        x.send(it.file);
      });
      setF({ up: 100, upDone: true, b2Url: j.downloadBase + path });
    } catch (e) { console.error('b2 upload:', e); setF({ upErr: true, up: 0 }); }
  }

  syncNight(){ document.body.classList.toggle('night', this.isNight()); }

  isNight(){
    const ov = CONFIG.nightOverride ?? 'auto';
    if (ov === 'day') return false;
    if (ov === 'night') return true;
    const h = this.state.now.getHours();
    return h >= 22 || h < 6;
  }

  showToast(msg){
    clearTimeout(this.toastTimer);
    this.setState({ toast: msg });
    this.toastTimer = setTimeout(() => this.setState({ toast: '' }), 2200);
  }

  calc(){
    const s = this.state;
    const nightFee = this.isNight() ? (CONFIG.nightFee ?? 10) : 0;
    const expressFee = (CONFIG.expressEnabled !== false && s.express) ? (CONFIG.expressFee ?? 20) : 0;
    // ค่าส่ง 2 ชั้นตามระยะถนนจริง — ลูกค้าเลือกพาหนะเอง (ยังไม่ปักหมุด = โชว์ราคาเริ่มต้น)
    const km = s.distKm;
    const carJob = s.vehicle === 'car' || this.forceCar(); // งานแข็ง/โหมดฝนตก บังคับเรทรถยนต์เสมอ
    const tiers = CONFIG.carTiers || [[2, 69], [4, 89], [6, 129]];
    let deliveryFee, farNote = false, outOfArea = false;
    if (carJob) {
      deliveryFee = tiers[0][1];
      if (km != null) {
        const t = tiers.find(x => km <= x[0]);
        if (t) { deliveryFee = t[1]; farNote = km > tiers[tiers.length - 2][0]; } // ช่วงไกลสุด = นัดเวลาล่วงหน้า
        else { deliveryFee = tiers[tiers.length - 1][1]; outOfArea = true; }
      }
    } else {
      deliveryFee = CONFIG.deliveryBase ?? 19;
      if (km != null) deliveryFee = (CONFIG.deliveryBase ?? 19) + (CONFIG.bikePerKm ?? 6) * Math.max(0, Math.ceil(km) - 2); // 2 กม.แรกเหมา ฿19
    }
    const pages = s.files.reduce((a, f) => a + f.pages, 0);
    const totalPages = pages * s.copies;
    let rate = pageRate(s.ptype, s.paper, s.sides, totalPages);
    let printCost = Math.ceil(totalPages * rate);
    // ขาวดำ: คิดต่อ "หน้าที่พิมพ์จริง" — หน้า-หลังพิมพ์ทั้ง 2 ด้านก็คิดทั้ง 2 ด้าน (ด้านหลังไม่ฟรี — นโยบาย 2026-08-27)
    let sheets = totalPages; // = จำนวนหน้าพิมพ์ที่คิดเงิน
    if (s.ptype === 'bw') {
      // การกำหนดหน้า (nup): รวมหลายหน้าเอกสารลงหน้าพิมพ์เดียว = จำนวนหน้าพิมพ์ลดลง ราคาลดตามจริง (เศษปัดขึ้นรายไฟล์)
      const nupC = (s.tier !== 'pro' && (s.nup || 1) > 1) ? s.nup : 1;
      const perCopy = nupC > 1 ? s.files.reduce((a, f) => a + Math.ceil(f.pages / nupC), 0) : pages;
      sheets = perCopy * s.copies;
      rate = bwSheetRate(sheets, s.sides);
      printCost = Math.ceil(sheets * rate);
    }
    // ปริ้นสี: คิดทีละหน้าตามผลสแกนปริมาณสี (หน้า/ไฟล์ที่สแกนไม่ได้ = คิดเรทสีน้อยไว้ก่อน ร้านตรวจยืนยัน)
    let heavyPages = 0, lightPages = 0;
    if (s.ptype === 'color') {
      const heavy = s.files.reduce((a, f) => a + Math.min(f.heavy || 0, f.pages), 0);
      heavyPages = heavy * s.copies;
      lightPages = totalPages - heavyPages;
      // การกำหนดหน้า (nup): หลายหน้าลงแผ่นเดียว = ราคาหารตามจำนวนหน้าต่อแผ่นที่ลูกค้าเลือก
      const nupC = (s.tier !== 'pro' && (s.nup || 1) > 1) ? s.nup : 1;
      // หน้าเดียว: สีน้อย 5 · สีเยอะ 7 ต่อหน้า — หน้า-หลัง: สีน้อยแผ่นละ 7 (หน้าละ 3.5) · สีเยอะแผ่นละ 10 (หน้าละ 5)
      const lpC = s.sides === 2 ? (CONFIG.colorLightDuplex ?? 3.5) : (CONFIG.colorLightPrice ?? 5);
      const hpC = s.sides === 2 ? (CONFIG.colorHeavyDuplex ?? 5) : (CONFIG.colorHeavyPrice ?? 7);
      printCost = Math.ceil((lightPages * lpC + heavyPages * hpC) / nupC);
    }
    // งาน Pro: ราคาจริงตามเรทเจ้าของ (แผ่นรวม = หน้าไฟล์ × ชุด) — ยกเว้น "พับครึ่ง เข้าเล่ม/เมนู" ที่ร้านยังยืนยันราคาทาง LINE
    if (s.tier === 'pro') {
      heavyPages = 0; lightPages = 0; rate = 0;
      const shPro = pages * s.copies;
      let pc = 0;
      if (s.proType === 'plate' || s.proType === 'poster') {
        // โปสเตอร์: ด้านหน้าเดียวตามตาราง หน้า-หลัง ×2 · เพลท: ราคารวมติดบอร์ดแล้ว พิมพ์หน้าเดียวเท่านั้น · เคลือบบวกต่อแผ่น (ไม่คูณ)
        const base = s.proType === 'poster' ? (POSTER_SHEET[s.proSize] ?? 0) * (s.sides === 2 ? 2 : 1) : (PLATE_SHEET[s.proSize] ?? 0);
        rate = base + (s.proLam === 'two' ? PRO_LAM_TWO : s.proLam === 'one' ? PRO_LAM_ONE : 0) + (s.proSpecial ? PRO_SPECIAL_PAPER : 0);
        pc = rate * shPro;
      } else if (s.proType === 'postcard') { rate = PRO_POSTCARD_SHEET; pc = rate * shPro; }
      else if (s.proType === 'sticker') { rate = PRO_STICKER_SHEET; pc = rate * shPro; }
      else if (s.proType === 'blueprint') { rate = BLUEPRINT_PRICE[s.proSize] ?? 0; pc = rate * shPro; }
      else if (s.proType === 'foldbook') {
        // พับครึ่ง เข้าเล่ม/เมนู: แผ่นตามตารางโปสเตอร์ (หน้า-หลัง ×2) + เคลือบ/กระดาษพิเศษต่อแผ่น + เข้าเล่ม 20/ชุด ทุกแบบ
        rate = (POSTER_SHEET[s.proSize] ?? 0) * (s.sides === 2 ? 2 : 1)
          + (s.proLam === 'two' ? PRO_LAM_TWO : s.proLam === 'one' ? PRO_LAM_ONE : 0)
          + (s.proSpecial ? PRO_SPECIAL_PAPER : 0);
        pc = rate * shPro + PRO_FOLDBOOK_BIND * s.copies;
      }
      else if (s.proType === 'portfolio') { rate = s.sides === 2 ? PRO_PORTFOLIO.two : PRO_PORTFOLIO.one; pc = rate * shPro + (s.proStaple ? PRO_PORTFOLIO.staple * s.copies : 0); }
      else if (s.proType === 'namecard') { pc = (s.sides === 2 ? PRO_NAMECARD.two : PRO_NAMECARD.one) * (s.proQty / 100); }
      else if (s.proType === 'standee') { pc = (s.proStand ? PRO_STANDEE.stand : PRO_STANDEE.base) * s.copies; }
      printCost = Math.ceil(pc);
    }
    // งาน Pro เลือกมารับเองที่ร้านอุดมสุข = ไม่มีค่าส่ง ไม่ต้องปักหมุด
    const proPickupOn = s.tier === 'pro' ? s.proPickup : s.stdPickup; // รับเองที่ร้าน: Pro = อุดมสุข · Standard = หน้าร้าน MORE PRINT
    if (proPickupOn) { deliveryFee = 0; farNote = false; outOfArea = false; }
    // 'landscape' (เล่มแนวนอน) ถูกตัดออกจากตัวเลือกแล้ว — เก็บสูตรราคาไว้ให้ออเดอร์เก่าที่เคยเลือกยังแสดงถูก
    const bindCost = s.tier === 'pro' ? 0 : (s.bind === 'corner' ? 0 : s.bind === 'book' ? 40 : s.bind === 'landscape' ? 60 : 0) * s.copies; // เย็บมุมฟรี (2026-08-24)
    const deliveryCost = proPickupOn ? 0 : deliveryFee + expressFee;
    const nightFee2 = (s.tier === 'pro' || proPickupOn) ? 0 : nightFee; // งาน Pro ทุกแบบ + มารับเอง = ไม่มีค่าบริการกลางคืน (นโยบาย 2026-08-27)
    // ── โค้ดส่วนลด: หักจากยอดรวมท้ายสุด (ไม่ติดลบ) ──
    const beforeDiscount = printCost + bindCost + deliveryCost + nightFee2;
    let discount = 0;
    const cp = s.couponOk;
    if (cp && beforeDiscount >= (cp.min_total || 0)) {
      discount = cp.kind === 'percent' ? Math.floor((beforeDiscount - deliveryCost) * cp.value / 100) // ส่วนลด % ไม่รวมค่าส่ง
        : cp.kind === 'freeship' ? deliveryCost // โค้ดส่งฟรี — หักเท่าค่าส่งของออเดอร์นี้
        : Math.min(cp.value, beforeDiscount);
    }
    return { pages, totalPages, sheets, rate, heavyPages, lightPages, printCost, bindCost, printTotal: printCost + bindCost,
      deliveryFee, carJob, farNote, outOfArea, proPickupOn, deliveryPending: !proPickupOn && km == null,
      deliveryCost, nightFee: nightFee2, discount, coupon: discount > 0 ? cp.code : null,
      grandTotal: Math.max(0, beforeDiscount - discount) };
  }

  // ── ตารางรับงาน Pro (นโยบาย 2026-08-27): จ. 08:30 – ส. 17:00 เปิดสั่งตลอด (หลัง 17:00 จ.-ศ. เริ่มผลิตวันถัดไป 08:30)
  //    ปิดรับ: เสาร์ 17:00 → จันทร์ 08:30 (รวมอาทิตย์ทั้งวัน) — คืนข้อความเวลาที่จะเปิด หรือ null = เปิดรับอยู่
  // ช่วงวันหยุดผลิตงาน Pro: เสาร์ 17:00 → จันทร์ 08:30 (รวมอาทิตย์ทั้งวัน) — รับออเดอร์ได้ตามปกติ แต่เริ่มผลิตวันจันทร์ 08:30 (นโยบาย 2026-08-30)
  proWeekendHold(){
    const n = this.state.now || new Date(), d = n.getDay(), h = n.getHours(), m = n.getMinutes();
    const before830 = h < 8 || (h === 8 && m < 30);
    return d === 0 || (d === 6 && h >= 17) || (d === 1 && before830);
  }

  // เวลาผลิต+ส่งโดยประมาณของงานปัจจุบัน (นาที ยังไม่รวมคิว)
  etaMinutes(){
    const s = this.state;
    if (s.tier !== 'pro') {
      // งาน Standard: 1-150 หน้า = 1 ชม. · 151-300 = 2 ชม. · ทุก ๆ 150 หน้าถัดไป +1 ชม. (นับรวมทุกไฟล์ × จำนวนชุด — นโยบาย 2026-08-27)
      const tp = (s.files || []).reduce((a, f) => a + (f.pages || 1), 0) * Math.max(1, s.copies || 1);
      return Math.max(60, Math.ceil(tp / 150) * 60);
    }
    const m = CONFIG.etaProMin || {};
    if (s.proType === 'plate') return ['A2', 'A1', 'A0'].includes(s.proSize) ? (m.plateBig ?? 90) : (m.plate ?? 60);
    return m[s.proType] ?? 90; // ประเภทที่ไม่ได้ระบุใน etaProMin = 90 นาที
  }

  // โหมดฝนตกถูกเปิดระหว่างลูกค้าค้างอยู่กลางขั้นตอนสั่ง — สลับเป็นรถยนต์ให้ทันที (ป้าย/ราคา/ข้อมูลบันทึกจะได้ตรงกันหมด)
  syncForcedVehicle(){
    const s = this.state;
    if (s.vehicle !== 'car' && this.forceCar() && ['order', 'delivery', 'review', 'pay'].includes(s.screen)) {
      this.setState({ vehicle: 'car' });
      if (s.screen !== 'order') this.showToast('🌧️ งานนี้ต้องจัดส่งด้วยรถยนต์ครับ — ระบบปรับวิธีส่งและค่าส่งให้แล้ว');
    }
  }

  // บังคับรถยนต์ไหม: งานแข็ง (เพลท A3-A0/Standy — บังคับตลอด) หรือ โหมดฝนตกเฉพาะงานแผ่นใหญ่ (นโยบาย 2026-09-01):
  // ฝนตก → เพลททุกขนาด · โปสเตอร์ A2-A0 · แบบแปลน A2/A1 — งานอื่น (โปสเตอร์ A3 ลงมา/พับครึ่ง/สติ๊กเกอร์ ฯลฯ) และ Standard ยังส่งมอไซค์ได้
  forceCar(){
    if (this.bigJob()) return true;
    const s = this.state;
    if (s.shopRain !== true || s.tier !== 'pro') return false;
    if (s.proType === 'plate') return true;
    if (s.proType === 'poster' && ['A0', 'A1', 'A2'].includes(s.proSize)) return true; // โปสเตอร์ A3 ยังม้วนใส่มอไซค์ได้
    if (s.proType === 'blueprint' && ['A1', 'A2'].includes(s.proSize)) return true;
    return false;
  }

  // งานแข็ง = บังคับส่งรถยนต์เท่านั้น (นโยบาย 2026-09-01): เพลท A3-A0 (ติดบอร์ดแข็ง) + Standy — งานกระดาษอื่นม้วนใส่มอไซค์ได้ ไม่บังคับ
  bigJob(){
    const s = this.state;
    if (s.tier !== 'pro') return false;
    if (s.proType === 'standee') return true; // 60×120 ซม. แข็ง
    return s.proType === 'plate' && ['A0', 'A1', 'A2', 'A3'].includes(s.proSize);
  }

  // ป้ายสรุปงาน Pro เช่น "เพลท A2" / "พับครึ่ง A3" — ใช้แสดงผลและบันทึกลงช่อง paper
  proLabel(){
    const s = this.state;
    const t = PRO_TYPES.find(x => x.k === s.proType) || PRO_TYPES[0];
    const base = t.k === 'plate' ? 'เพลท ' + s.proSize
      : t.k === 'poster' ? 'โปสเตอร์ ' + s.proSize
      : t.k === 'postcard' ? 'Postcard A3 (9 ใบ/แผ่น)'
      : t.k === 'foldbook' ? 'พับครึ่ง ' + s.proSize
      : t.k === 'namecard' ? 'นามบัตร ' + s.proQty + ' ใบ' + (s.sides === 2 ? ' หน้า-หลัง' : ' หน้าเดียว')
      : t.k === 'blueprint' ? 'ปริ้นขาวดำขนาดใหญ่ (แบบแปลน) ' + s.proSize
      : t.k === 'sticker' ? 'สติ๊กเกอร์ A3'
      : t.label;
    // ตัวเลือกเสริมพ่วงเข้าไปในป้าย — หลังบ้านทุกที่จะเห็นครบว่าลูกค้าเลือกอะไร (บันทึกลงช่อง paper)
    const ex = [];
    if (s.proType === 'foldbook') {
      ex.push(s.sides === 2 ? 'หน้า-หลัง' : 'หน้าเดียว');
      if (s.proSpecial) ex.push('กระดาษพิเศษ');
      if (s.proLam === 'one') ex.push('เคลือบหน้าเดียว');
      if (s.proLam === 'two') ex.push('เคลือบหน้า-หลัง');
    }
    if ((s.proType === 'plate' || s.proType === 'poster')) {
      if (s.proType === 'plate') ex.push('ติดบอร์ด');
      if (s.proSpecial) ex.push('กระดาษพิเศษ');
      if (s.proType === 'poster' && s.sides === 2) ex.push('หน้า-หลัง');
      if (s.proLam === 'one') ex.push('เคลือบหน้าเดียว');
      if (s.proLam === 'two') ex.push('เคลือบหน้า-หลัง');
    }
    if (s.proType === 'portfolio' && s.proStaple) ex.push('เย็บ');
    if (s.proType === 'standee') ex.push(s.proStand ? 'มีขาตั้ง' : 'ไม่มีขาตั้ง');
    return base + (ex.length ? ' · ' + ex.join(' · ') : '');
  }

  seg(label, on, pick, grow){
    return { label, pick, st: {
      flex: grow ? '1' : 'none', padding: '9px 14px', borderRadius: '10px', fontSize: '12.5px', fontWeight: 600, cursor: 'pointer',
      border: on ? '1.5px solid var(--acc)' : '1px solid var(--line)',
      background: on ? 'var(--accSoft)' : 'var(--soft)', color: on ? 'var(--acc)' : 'var(--ink)'
    } };
  }

  fmtTime(d){ return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  // บันทึกออเดอร์ + อัปโหลดไฟล์ขึ้นฐานข้อมูลกลาง (ให้เจ้าของเห็นในหน้าหลังบ้าน)
  async saveOrder(id, c, t0){
    this._savingOrder = id; // ระหว่างอัปไฟล์+บันทึก — หน้าติดตามห้ามตีความว่าออเดอร์ถูกลบ
    try { await this._saveOrderInner(id, c, t0); } finally { if (this._savingOrder === id) this._savingOrder = null; }
  }
  async _saveOrderInner(id, c, t0){
    const s = this.state;
    try {
      // อัปโหลดพลาดครั้งแรก (เน็ตสะดุด) ให้ลองซ้ำอีกรอบ — ถ้าไฟล์ขึ้นไปแล้วเจอ "already exists" ถือว่าสำเร็จ
      const uploadRetry = async (path, file) => {
        let { error } = await this.db.storage.from('uploads').upload(path, file);
        if (error) {
          const r2 = await this.db.storage.from('uploads').upload(path, file);
          error = r2.error && !/exist|duplicate/i.test(String(r2.error.message || '')) ? r2.error : null;
        }
        return error;
      };
      const files = [];
      let upFail = 0;
      const failIdx = []; // ไฟล์ที่อัปไม่สำเร็จ — ให้ลูกค้าส่งใหม่ได้จากหน้าติดตาม
      for (let i = 0; i < s.files.length; i++) {
        const f = s.files[i];
        let path = null;
        if (f.file && !f.big) {
          const safe = f.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          path = id.replace('#', '') + '/f' + i + '_' + safe;
          const error = await uploadRetry(path, f.file);
          if (error) { console.error('upload:', error); path = null; upFail++; failIdx.push({ i, name: f.name }); }
        }
        files.push({ name: f.name, pages: f.pages, path, drive_url: f.big ? (f.b2Url || null) : null, auto: !!f.auto, heavy: f.heavy || 0, scanned: !!f.scanned });
      }
      if (upFail) {
        setTimeout(() => this.showToast('⚠️ ไฟล์แนบอัปโหลดไม่สำเร็จ ' + upFail + ' ไฟล์ — กดส่งใหม่ได้ที่หน้าติดตามเลยครับ'), 1200);
        try {
          const od = JSON.parse(localStorage.getItem('mp_order') || 'null');
          if (od && od.id === id) { od.fails = failIdx; localStorage.setItem('mp_order', JSON.stringify(od)); this.upsertOrderList(od); }
          this.setState(st => st.order && st.order.id === id ? { order: { ...st.order, fails: failIdx } } : null);
        } catch (e) {}
      }
      // อัปโหลดสลิปโอนเงิน
      let slip_path = null;
      if (s.slip) {
        const ext = (s.slip.name.split('.').pop() || 'jpg').replace(/[^a-zA-Z0-9]/g, '').slice(0, 5) || 'jpg';
        slip_path = id.replace('#', '') + '/slip.' + ext;
        const se = await uploadRetry(slip_path, s.slip);
        if (se) { console.error('slip:', se); slip_path = null; }
      }
      const u = s.user || {};
      const payload = {
        id, slip_path,
        customer_fname: u.fname || '', customer_lname: u.lname || '',
        customer_phone: u.phone || s.phone || '', customer_email: u.email || '',
        files, ptype: s.tier === 'pro' ? 'pro' : s.ptype, color: s.tier !== 'pro' && s.ptype === 'color',
        paper: s.tier === 'pro' ? this.proLabel() : s.paper, sides: s.sides,
        orient: s.tier === 'pro' ? null : (s.orient === 'landscape' ? 'landscape' : 'portrait'),
        nup: s.tier === 'pro' ? null : (s.nup || 1),
        bind: s.tier === 'pro' ? (s.proType === 'foldbook' ? s.proBind : 'none') : s.bind, copies: s.copies,
        point: s.geoLabel || '', lat: s.lat, lng: s.lng,
        pickup: s.tier === 'pro' ? s.proPickup : s.stdPickup,
        line_uid: (s.user && s.user.line_uid) || null, // ไว้แจ้งเตือนลูกค้าทาง LINE (เฉพาะคนล็อกอินด้วย LINE)
        // นำหน้าที่อยู่ด้วยพาหนะที่ลูกค้าเลือก — ไรเดอร์/หลังบ้านเห็นทันทีว่าต้องใช้รถอะไร (ไม่ต้องเพิ่มคอลัมน์ใหม่)
        addr: (s.tier === 'pro' && s.proPickup) ? '🏪 มารับเองที่ร้านอุดมสุขปริ้นติ้ง' : (s.tier !== 'pro' && s.stdPickup) ? '🏪 รับหน้าร้าน MORE PRINT (หอพักบริบูรณ์เพลส)' : ((s.vehicle === 'car' || this.forceCar()) ? '🚗 ' : '🏍️ ') + s.addr, // งานบังคับรถยนต์ป้ายต้องตรง
        phone: s.phone, time: '', express: s.express, night: this.isNight(),
        print_cost: c.printCost, bind_cost: c.bindCost, delivery_cost: c.deliveryCost,
        night_fee: c.nightFee || 0, // ตามสูตรจริง — งาน Pro/มารับเอง = 0
        total: c.grandTotal, status: 1, times: [t0, '', '', ''],
        coupon: c.coupon || null, discount: c.discount || 0,
        note: (s.note || '').trim().slice(0, 300) || null // หมายเหตุ/รายละเอียดงานจากลูกค้า
      };
      // คอลัมน์เสริมที่ฐานข้อมูลอาจยังไม่มี — เจอ error คอลัมน์ไหนก็ตัดกลุ่มนั้นออกแล้วลองใหม่ (ตัดสะสมได้หลายกลุ่ม ออเดอร์ต้องไม่หาย)
      const optionalCols = [['orient', 'nup'], ['coupon', 'discount'], ['line_uid'], ['pickup'], ['ptype'], ['note']];
      const body = { ...payload };
      let { error } = await this.db.from('orders').insert(body);
      for (let pass = 0; pass < 2 && error; pass++) { // สองรอบ — ฐานข้อมูลรายงานคอลัมน์หายทีละตัว ลำดับไม่แน่นอน
        for (const group of optionalCols) {
          if (error && group.some(k => (error.message || '').includes(k)) && group.some(k => k in body)) {
            group.forEach(k => { delete body[k]; });
            ({ error } = await this.db.from('orders').insert(body));
          }
        }
      }
      if (error) throw error;
      // แจ้งเตือน LINE ทีมงาน (ยิงทิ้งไว้ — ถ้าระบบแจ้งเตือนยังไม่ตั้งค่า ออเดอร์ไม่กระทบ)
      try { fetch((window.MP_CONFIG || {}).SUPABASE_URL + '/functions/v1/notify-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) }); } catch (e) {}
      if (c.coupon) { try {
        this.db.rpc('use_coupon', { code_in: c.coupon, uid_in: this.couponUid() }).then(r => {
          if (r && r.error && /PGRST202|not find the function|does not exist/i.test(String(r.error.message || '') + String(r.error.code || ''))) this.db.rpc('use_coupon', { code_in: c.coupon }).then(() => {}); // ต้อง .then ไม่งั้น builder ไม่ยิงคำขอจริง
        });
      } catch (e) {} }
    } catch (e) {
      console.error('saveOrder:', e);
      this.showToast('⚠️ บันทึกออนไลน์ไม่สำเร็จ — ติดต่อร้านทาง LINE');
    }
  }

  // เช็คสถานะจากฐานข้อมูลผ่านช่องมองเฉพาะใบ (ต้องรู้รหัสออเดอร์เป๊ะ ๆ เท่านั้น)
  async fetchOrderStatus(id){
    try {
      let row = null;
      const r1 = await this.db.rpc('get_order_status', { oid: id });
      if (!r1.error && r1.data) row = Array.isArray(r1.data) ? r1.data[0] : r1.data;
      if (r1.error) {
        const r2 = await this.db.from('orders').select('status,times,cancel_reason').eq('id', id).single();
        if (!r2.error) row = r2.data;
      }
      if (!r1.error && Array.isArray(r1.data) && r1.data.length === 0) {
        // ฐานข้อมูลตอบชัดว่า "ไม่มีออเดอร์นี้แล้ว" = ร้านยกเลิกแล้วลบถาวร — ห้ามปล่อยหน้าติดตามค้างสถานะเดิม
        // (เว้นออเดอร์อายุ < 5 นาที กันชนกับเคสบันทึกออนไลน์ไม่สำเร็จ)
        const od = (() => { try { return JSON.parse(localStorage.getItem('mp_order') || 'null'); } catch (e) { return null; } })();
        const ageMin = od && od.ts ? (Date.now() - od.ts) / 60000 : 999;
        if (this._savingOrder === id) return; // ออเดอร์กำลังอัปไฟล์/บันทึกอยู่ ยังไม่ลงฐานข้อมูล — ไม่ใช่ถูกร้านลบ
        if (ageMin > 5 && this.state.trackStep !== 0 && this.state.trackStep < 4) { // ใบที่ส่งสำเร็จแล้วโดนร้านลบทีหลัง = งานจบปกติ ไม่ใช่ถูกยกเลิก
          if (this.state.order && this.state.order.id === id) clearInterval(this.trackTimer);
          const rsn = 'ออเดอร์นี้ถูกยกเลิกและลบออกจากระบบโดยร้านแล้ว — ถ้าโอนเงินไปแล้ว ทักแชทร้านทาง LINE เพื่อขอคืนได้เลยครับ';
          this.setState(st => st.order && st.order.id === id ? { trackStep: 0, cancelReason: rsn } : null);
          try { if (od && od.id === id) { od.step = 0; od.cancelReason = rsn; if (!od.cancelledAt) od.cancelledAt = Date.now(); localStorage.setItem('mp_order', JSON.stringify(od)); this.upsertOrderList(od); } } catch (e) {}
        }
        return;
      }
      if (row) {
        this.setState(st => st.order && st.order.id === id
          ? { trackStep: row.status, cancelReason: row.cancel_reason || '', order: { ...st.order, times: row.times || st.order.times } }
          : null);
        // อัปเดตสำเนาออเดอร์ที่จำไว้ในเครื่อง ให้เปิดเว็บใหม่แล้วเห็นสถานะล่าสุดทันที
        try {
          const od = JSON.parse(localStorage.getItem('mp_order') || 'null');
          if (od && od.id === id) {
            od.step = row.status;
            od.times = row.times || od.times;
            od.cancelReason = row.cancel_reason || '';
            if (row.status === 0 && !od.cancelledAt) od.cancelledAt = Date.now(); // จดเวลายกเลิก — ครบกำหนดจะเก็บกวาดออกจากหน้าจอเอง
            localStorage.setItem('mp_order', JSON.stringify(od));
            this.upsertOrderList(od);
          }
        } catch (e) {}
        const isCurrent = this.state.order && this.state.order.id === id; // ผลของออเดอร์อื่นที่มาช้า — ห้ามแตะ timer/ประวัติของใบที่เลือกอยู่
        if (isCurrent && (row.status === 0 || row.status >= 4)) clearInterval(this.trackTimer);
        if (row.status >= 4) {
          this.maybeAutoReview(id);
          if (isCurrent) this.addHistory();
          else { try { const rec = JSON.parse(localStorage.getItem('mp_orders') || '[]').find(x => x.id === id); if (rec) this.addHistory(rec); } catch (e) {} }
          this.dropFromOrderList(id);
        }
      }
    } catch (e) {}
  }
  // ── รีวิวจากลูกค้า (ตาราง reviews: anon อ่าน+เพิ่มได้เท่านั้น) ──
  loadReviews(){
    if (!this.db) return;
    this.db.from('reviews').select('id,order_id,name,stars,comment,ptype,auto,created_at').order('id', { ascending: false }).limit(40)
      .then(({ data, error }) => {
        if (error || !data) return; // ตารางยังไม่ถูกสร้าง — ซ่อนส่วนรีวิวไปเงียบๆ
        // ออเดอร์เดียวกันแสดงรีวิวเดียว: แถวใหม่สุดชนะ (รีวิวที่ลูกค้าเขียนเองมาแทน 5 ดาวอัตโนมัติ)
        const seen = {}; const out = [];
        for (const r of data) {
          if (r.order_id) { if (seen[r.order_id]) continue; seen[r.order_id] = 1; }
          out.push(r);
        }
        this.setState({ reviews: out, reviewsReady: true });
      });
  }
  // ออเดอร์ถึงมือลูกค้าแล้ว (ส่งแล้ว) แต่ลูกค้ายังไม่รีวิวเอง → ให้ 5 ดาวอัตโนมัติหนึ่งครั้ง
  maybeAutoReview(id){
    try {
      if (!this.db || !id) return;
      const k = 'mp_review_' + id;
      if (localStorage.getItem(k)) return;
      localStorage.setItem(k, 'auto'); // กันยิงซ้ำจากการเช็คสถานะหลายรอบ
      // ป้ายประเภทงาน: หาใบจริงจากลิสต์/ใบที่เลือก (กันใช้ป้ายของใบอื่นตอนมีหลายออเดอร์)
      const pl = (() => { try {
        const cur = this.state.order; if (cur && cur.id === id) return cur.plabel || null;
        const rec = JSON.parse(localStorage.getItem('mp_orders') || '[]').find(x => x.id === id); if (rec) return rec.plabel || null;
        const od0 = JSON.parse(localStorage.getItem('mp_order') || 'null'); return (od0 && od0.id === id && od0.plabel) || null;
      } catch (e) { return null; } })();
      const u = this.state.user || {};
      this.db.from('reviews').insert({ order_id: id, name: u.fname || 'ลูกค้า', stars: 5, comment: null, ptype: pl, auto: true })
        .then(({ error }) => {
          if (error) { console.error('auto review:', error); try { localStorage.removeItem(k); } catch (e) {} }
          else this.loadReviews();
        });
      this.setState({});
    } catch (e) {}
  }
  // ติดตามสถานะจริงจากฐานข้อมูล (เจ้าของกดอัปเดต/ยกเลิกจากหน้าหลังบ้าน)
  startPolling(id){
    clearInterval(this.trackTimer);
    this.fetchOrderStatus(id); // เช็คทันทีหนึ่งครั้งก่อน แล้วค่อยวนเช็คทุก 8 วิ
    this.trackTimer = setInterval(() => this.fetchOrderStatus(id), 8000);
  }

  // ── ลูกค้ายกเลิกออเดอร์เอง: ทำได้เฉพาะตอนร้านยังไม่เริ่มปริ้น (สถานะ 1) และไม่เกิน cancelWindowMin นาทีหลังชำระ
  // เงื่อนไขจริงตัดสินที่ SQL customer_cancel (SECURITY DEFINER) — ฝั่งเว็บเป็นแค่หน้าจอ เดาเวลา/สถานะเองไม่ได้
  async selfCancel(){
    const s = this.state;
    if (!s.order || s.selfCancelBusy) return;
    const reason = 'ลูกค้ายกเลิกเอง (ภายใน ' + (CONFIG.cancelWindowMin ?? 10) + ' นาทีหลังชำระเงิน)';
    const markCancelled = () => {
      clearInterval(this.trackTimer);
      this.setState({ trackStep: 0, cancelReason: reason, selfCancelArm: false, selfCancelBusy: false });
      try { const od = JSON.parse(localStorage.getItem('mp_order') || 'null');
        if (od && od.id === s.order.id) { od.step = 0; od.cancelReason = reason; od.cancelledAt = Date.now(); localStorage.setItem('mp_order', JSON.stringify(od)); this.upsertOrderList(od); } } catch (e) {}
      this.showToast('ยกเลิกออเดอร์เรียบร้อยครับ ↩️');
    };
    if (!this.db) return markCancelled(); // โหมดตัวอย่าง: จำลองยกเลิกในเครื่อง
    this.setState({ selfCancelBusy: true });
    const fail = (msg) => { this.setState({ selfCancelBusy: false, selfCancelArm: false }); this.showToast(msg); };
    try {
      const { data, error } = await this.db.rpc('customer_cancel', { oid: s.order.id });
      if (error) return fail('ยกเลิกไม่สำเร็จ ลองอีกครั้ง หรือทักแชทร้านทาง LINE ครับ 🙏');
      if (data === 'not-found') {
        // ออเดอร์ถูกร้านยกเลิกแล้วลบออกจากระบบไปก่อนหน้านี้ — เปลี่ยนหน้าจอเป็นยกเลิกให้เลย ไม่ใช่ขึ้นว่าล้มเหลว
        clearInterval(this.trackTimer);
        const rsn = 'ออเดอร์นี้ถูกยกเลิกและลบออกจากระบบโดยร้านแล้ว — ถ้าโอนเงินไปแล้ว ทักแชทร้านทาง LINE เพื่อขอคืนได้เลยครับ';
        this.setState({ trackStep: 0, cancelReason: rsn, selfCancelArm: false, selfCancelBusy: false });
        try { const od = JSON.parse(localStorage.getItem('mp_order') || 'null');
          if (od && od.id === s.order.id) { od.step = 0; od.cancelReason = rsn; if (!od.cancelledAt) od.cancelledAt = Date.now(); localStorage.setItem('mp_order', JSON.stringify(od)); this.upsertOrderList(od); } } catch (e) {}
        return this.showToast('ออเดอร์นี้ถูกยกเลิกโดยร้านไปแล้วครับ');
      }
      if (data === 'printing') { fail('ร้านเริ่มทำงานนี้แล้ว ยกเลิกจากหน้าเว็บไม่ได้ — รีบทักแชทร้านเลยครับ 💬'); return this.fetchOrderStatus(s.order.id); }
      if (data === 'timeout') return fail('เลยช่วงยกเลิก ' + (CONFIG.cancelWindowMin ?? 10) + ' นาทีแล้ว — ทักแชทร้านทาง LINE ครับ 💬');
      if (data !== 'ok') return fail('ยกเลิกไม่สำเร็จ — ทักแชทร้านทาง LINE ครับ 🙏');
      // แจ้งร้านทาง LINE ว่าลูกค้ายกเลิกเอง จะได้ไม่ปริ้นทิ้ง (ยิงแบบไม่รอผล)
      try { fetch((window.MP_CONFIG || {}).SUPABASE_URL + '/functions/v1/notify-order?action=customer-cancelled', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: s.order.id }) }); } catch (e) {}
      markCancelled();
    } catch (e) { fail('ยกเลิกไม่สำเร็จ ลองอีกครั้งครับ 🙏'); }
  }

  // ── แชทกับร้าน (ต้องรู้รหัสออเดอร์ของตัวเอง — ผ่าน RPC เท่านั้น) ──
  // ── รายการออเดอร์ทั้งหมดของลูกค้า (mp_orders): สั่งหลายใบไล่เลี่ยกัน ติดตามได้ครบทุกใบ ──
  readOrderList(){ try { return JSON.parse(localStorage.getItem('mp_orders') || '[]'); } catch (e) { return []; } }
  upsertOrderList(od){
    try {
      if (!od || !od.id) return;
      const l = this.readOrderList();
      const i = l.findIndex(x => x.id === od.id);
      if (i >= 0) l[i] = { ...l[i], ...od }; else l.unshift(od);
      const cut = l.slice(0, 10);
      localStorage.setItem('mp_orders', JSON.stringify(cut));
      this.setState({ orderList: cut });
    } catch (e) {}
  }
  dropFromOrderList(id){
    try {
      const l = this.readOrderList().filter(x => x.id !== id);
      localStorage.setItem('mp_orders', JSON.stringify(l));
      this.setState({ orderList: l });
    } catch (e) {}
  }
  // เช็คสถานะออเดอร์ใบอื่นๆ ในลิสต์ (ตัวที่เลือกดูมี startPolling ทุก 8 วิดูแลอยู่แล้ว) — เรียกทุก 30 วิ
  refreshOrderList(){
    if (!this.db) return;
    const sel = (this.state.order || {}).id;
    (this.state.orderList || []).forEach(o => {
      if (o.id === sel || o.step === 0 || (o.step || 1) >= 4) return;
      this.db.rpc('get_order_status', { oid: o.id }).then(({ data, error }) => {
        if (error) return;
        const row = Array.isArray(data) ? data[0] : data;
        if (!row) {
          // ออเดอร์หายจากฐานข้อมูล (ร้านยกเลิกแล้วลบ) — เว้นใบที่เพิ่งสั่งไม่เกิน 5 นาที
          if (Date.now() - (o.ts || 0) > 5 * 60000) this.upsertOrderList({ ...o, step: 0, cancelReason: 'ออเดอร์นี้ถูกยกเลิกและลบออกจากระบบโดยร้านแล้ว — ถ้าโอนเงินไปแล้ว ทักแชทร้านทาง LINE เพื่อขอคืนได้เลยครับ', cancelledAt: o.cancelledAt || Date.now() });
          return;
        }
        const nd = { ...o, step: row.status, times: row.times || o.times, cancelReason: row.cancel_reason || '' };
        if (row.status === 0 && !nd.cancelledAt) nd.cancelledAt = Date.now();
        if (row.status >= 4) { this.addHistory(nd); this.maybeAutoReview(o.id); this.dropFromOrderList(o.id); return; } // จบแล้ว → ย้ายไปหน้าประวัติ
        this.upsertOrderList(nd);
      });
    });
  }
  // ลูกค้าแตะเลือกออเดอร์ใบอื่นจากลิสต์ → สลับหน้าติดตาม+แชทมาที่ใบนั้น
  pickOrder(o){
    try { localStorage.setItem('mp_order', JSON.stringify(o)); } catch (e) {}
    clearInterval(this.trackTimer);
    this.setState({
      order: { id: o.id, total: o.total || 0, times: o.times || ['', '', '', ''], plabel: o.plabel || '', eta: o.eta || null, pickup: !!o.pickup, ts: o.ts || null, addr: o.addr || '', phone: o.phone || '', veh: o.veh || '', copies: o.copies || 0, pages: o.pages || 0, fails: o.fails || [], dist: o.dist ?? null, rc: o.rc || null, cp: o.cp || null },
      trackStep: o.step == null ? 1 : o.step, cancelReason: o.cancelReason || '', chat: [], trackOpen: true, trackMin: false, selfCancelArm: false // ระวัง: step 0 (ยกเลิก) เป็น falsy ห้ามใช้ || 1 · trackOpen true = ใบที่เพิ่งแตะเลือกกางให้เห็นทันทีเสมอ
    }, () => {
      if (this.db && o.step !== 0 && (o.step || 1) < 4) this.startPolling(o.id);
      else if (this.db) this.fetchOrderStatus(o.id);
      if (this.db) this.loadChat();
    });
  }
  // ส่งไฟล์ที่อัปพลาดใหม่: อัปเข้าคลัง แล้วให้ RPC reattach_file (SECURITY DEFINER) เขียน path เข้าออเดอร์เดิม
  async reupFile(idx, file){
    const o = this.state.order;
    if (!o || !this.db || !file) return;
    this.setState({ reupBusy: true });
    const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = o.id.replace('#', '') + '/re' + idx + '_' + Date.now().toString(36) + '_' + safe;
    const { error } = await this.db.storage.from('uploads').upload(path, file);
    if (error) { this.setState({ reupBusy: false }); return this.showToast('อัปโหลดไม่สำเร็จ ลองอีกครั้งครับ 🙏'); }
    const { data, error: e2 } = await this.db.rpc('reattach_file', { oid: o.id, idx, new_path: path });
    this.setState({ reupBusy: false });
    if (e2) return this.showToast('ระบบรับไฟล์ใหม่ยังไม่เปิดใช้ — ส่งไฟล์ให้ร้านทาง LINE @346kifvy แทนนะครับ 🙏');
    if (data === 'too-late') return this.showToast('ร้านทำงานถึงขั้นถัดไปแล้ว — ส่งไฟล์ทาง LINE/แชทนะครับ 💬');
    if (data !== 'ok' && data !== 'already-has-file') return this.showToast('ส่งไฟล์ไม่สำเร็จ — ทักแชทร้านนะครับ 🙏');
    const fails = (o.fails || []).filter(x => x.i !== idx);
    this.setState({ order: { ...o, fails } });
    try {
      const od = JSON.parse(localStorage.getItem('mp_order') || 'null');
      if (od && od.id === o.id) { od.fails = fails; localStorage.setItem('mp_order', JSON.stringify(od)); this.upsertOrderList(od); }
    } catch (e) {}
    this.showToast('✓ ส่งไฟล์ใหม่เรียบร้อย ร้านเปิดไฟล์ได้แล้วครับ 🎉');
  }
  // ออเดอร์ที่ยกเลิกแล้ว: โชว์ให้ลูกค้าเห็นเหตุผล 2 ชั่วโมง แล้วเก็บกวาดออกจากหน้าจอเอง (นโยบายร้าน — ของเก่าที่ไม่มีเวลายกเลิก = ลบทันที)
  purgeCancelledLocal(){
    const gone = (step, at) => step === 0 && Date.now() - (at || 0) > 2 * 60 * 60 * 1000;
    try {
      // ตัวกวาดเก็บตก: ใบไหนสถานะถึง "ส่งแล้ว/รับแล้ว" ไม่ว่ามาจากเส้นทางไหน ต้องเข้าประวัติเสมอ (addHistory กันซ้ำเองด้วยรหัส)
      const l0 = this.readOrderList();
      const done = l0.filter(o => (o.step || 1) >= 4);
      if (done.length) {
        done.forEach(o => this.addHistory(o));
        const keep0 = l0.filter(o => (o.step || 1) < 4);
        localStorage.setItem('mp_orders', JSON.stringify(keep0));
        this.setState({ orderList: keep0 });
      }
      const odD = JSON.parse(localStorage.getItem('mp_order') || 'null');
      if (odD && (odD.step || 1) >= 4) this.addHistory(odD);
    } catch (e) {}
    try {
      // กวาดในลิสต์รวมทุกออเดอร์
      const l = this.readOrderList();
      const keep = l.filter(o => !gone(o.step, o.cancelledAt));
      if (keep.length !== l.length) {
        localStorage.setItem('mp_orders', JSON.stringify(keep));
        this.setState({ orderList: keep });
      }
    } catch (e) {}
    try {
      const od = JSON.parse(localStorage.getItem('mp_order') || 'null');
      if (!od || od.step !== 0) return;
      if (gone(od.step, od.cancelledAt)) {
        localStorage.removeItem('mp_order');
        clearInterval(this.trackTimer);
        this.setState(st => (st.order && st.trackStep === 0) ? { order: null, cancelReason: '', chat: [], trackOpen: false, selfCancelArm: false } : null);
      }

  // ── ระบบเปลี่ยนที่อยู่จัดส่งจากใน Live Chat (ลิงก์ Google Maps / ตำแหน่งปัจจุบัน) ──
  chatBot(text){ // ข้อความตอบอัตโนมัติฝั่งร้าน (โชว์เฉพาะหน้าจอนี้ ไม่บันทึกลงฐาน)
    this.setState(st => ({ chatBots: [...(st.chatBots || []), { id: 'bot' + Date.now(), sender: 'shop', bot: true, body: text, created_at: new Date().toISOString() }] }));
  }
  async chAdResolve(url){ // แกะพิกัดจากลิงก์ (ใช้ตัวแกะเดียวกับหน้าจัดส่ง)
    let pt = this.extractLatLng(url);
    if (!pt) {
      const cfg = window.MP_CONFIG || {};
      const tf = (u, ms) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return fetch(u, { signal: c.signal }).finally(() => clearTimeout(t)); };
      try { const r = await tf(cfg.SUPABASE_URL + '/functions/v1/smart-handler?u=' + encodeURIComponent(url), 10000);
        if (r.ok) { const j = await r.json(); if (j.final) pt = this.extractLatLng(j.final); } } catch (e) {}
    }
    return pt;
  }
  async chAdFee(lat, lng){ // ระยะถนนจริงจากร้าน + ค่าส่งตามพาหนะเดิมของออเดอร์ (สูตรเดียวกับหน้าจัดส่ง)
    let km = null;
    try {
      const r = await fetch('https://router.project-osrm.org/route/v1/driving/' + CONFIG.shopLng + ',' + CONFIG.shopLat + ';' + lng + ',' + lat + '?overview=false');
      const j = await r.json();
      if (j.routes && j.routes[0]) km = j.routes[0].distance / 1000;
    } catch (e) {}
    if (km == null) { // OSRM ล่ม → เส้นตรง ×1.3
      const R = 6371, dLa = (lat - CONFIG.shopLat) * Math.PI / 180, dLo = (lng - CONFIG.shopLng) * Math.PI / 180;
      const a = Math.sin(dLa / 2) ** 2 + Math.cos(CONFIG.shopLat * Math.PI / 180) * Math.cos(lat * Math.PI / 180) * Math.sin(dLo / 2) ** 2;
      km = 2 * R * Math.asin(Math.sqrt(a)) * 1.3;
    }
    const o = this.state.order || {};
    const car = /รถยนต์|🚗/.test(o.veh || '');
    let fee = null, err = '';
    if (car) {
      const tiers = CONFIG.carTiers || [[2, 69], [4, 89], [6, 129]];
      const t = tiers.find(x => km <= x[0]);
      if (t) fee = t[1]; else err = 'ที่อยู่ใหม่ไกลเกิน 6 กม. รถยนต์ส่งไม่ได้ครับ';
    } else fee = (CONFIG.deliveryBase ?? 19) + (CONFIG.bikePerKm ?? 6) * Math.max(0, Math.ceil(km) - 2);
    return { km: Math.round(km * 10) / 10, fee, err };
  }
  async chAdConfirm(){
    const s = this.state, o = s.order, pt = s.chAdPt;
    if (!o || !pt || !this.db) return;
    const txt = (s.chAdText || '').trim();
    if (txt.length < 4) return this.showToast('พิมพ์รายละเอียดที่อยู่ใหม่ด้วยครับ (ตึก/ห้อง/จุดสังเกต) 🏠');
    this.setState({ chAdBusy: true });
    const { data, error } = await this.db.rpc('customer_update_addr', { oid: o.id, new_addr: txt, new_lat: pt.lat, new_lng: pt.lng, new_km: pt.km, new_fee: pt.fee });
    this.setState({ chAdBusy: false });
    if (error) { this.chatBot('ระบบเปลี่ยนที่อยู่อัตโนมัติยังไม่เปิดใช้ครับ 🙏 พิมพ์ที่อยู่ใหม่บอกร้านในแชทนี้ได้เลย เดี๋ยวทีมงานแก้ให้'); return this.setState({ chAdOpen: false }); }
    if (data === 'too-late') { this.chatBot('ออเดอร์นี้กำลังจัดส่งแล้ว เปลี่ยนที่อยู่ไม่ทันแล้วครับ 🙏 โทรหาไรเดอร์/ร้านด่วนได้เลย'); return this.setState({ chAdOpen: false }); }
    if (!/^ok/.test(String(data || ''))) { this.chatBot('เปลี่ยนที่อยู่ไม่สำเร็จ (' + data + ') — พิมพ์บอกร้านในแชทนะครับ'); return this.setState({ chAdOpen: false }); }
    // สำเร็จ: RPC คืน 'ok:<ค่าส่งเดิม>' → คิดส่วนต่างตามนโยบายร้าน (เกณฑ์ราคาเดิม แค่คิดตามระยะใหม่)
    const oldFee = parseFloat(String(data).split(':')[1] || '') || 0;
    const diff = Math.round((pt.fee - oldFee) * 100) / 100;
    const veh = (o.addr || '').match(/^(🚗|🏍️)/); const na = (veh ? veh[1] + ' ' : '') + txt;
    this.setState({ order: { ...o, addr: na, total: Math.max(0, (o.total || 0) - oldFee + pt.fee) }, chAdOpen: false, chAdMode: '', chAdLink: '', chAdText: '', chAdPt: null });
    try { const od = JSON.parse(localStorage.getItem('mp_order') || 'null');
      if (od && od.id === o.id) { od.addr = na; od.dist = pt.km; od.total = Math.max(0, (od.total || 0) - oldFee + pt.fee); localStorage.setItem('mp_order', JSON.stringify(od)); this.upsertOrderList(od); } } catch (e) {}
    this.showToast('✓ เปลี่ยนที่อยู่จัดส่งเรียบร้อยครับ 🎉');
    if (diff > 0) this.chatBot('🤖 ที่อยู่ใหม่ไกลขึ้น ค่าส่งเพิ่มเป็น ฿' + pt.fee + ' (เพิ่มจากเดิม ฿' + diff + ') — รบกวนโอนส่วนต่าง ฿' + diff + ' มาที่พร้อมเพย์เดิมของร้าน แล้วแนบสลิปในแชทนี้ได้เลยครับ 🙏');
    else if (diff < 0) this.chatBot('🤖 ที่อยู่ใหม่ใกล้ขึ้น ค่าส่งลดเหลือ ฿' + pt.fee + ' (ลดลง ฿' + (-diff) + ') 🎉 ร้านจะโอนส่วนต่างคืนให้ — พิมพ์เลขพร้อมเพย์/บัญชีของคุณในแชทนี้ได้เลย เดี๋ยวร้านโอนคืนพร้อมส่งสลิปให้ครับ');
    else this.chatBot('🤖 ค่าส่งที่อยู่ใหม่เท่าเดิม (฿' + pt.fee + ') — ไม่ต้องโอนเพิ่ม และร้านไม่ต้องโอนคืนครับ ✓');
    this.loadChat();
  }
  // เก็บออเดอร์ที่จบแล้ว (ส่งสำเร็จ/ลูกค้ารับแล้ว) เข้าประวัติในเครื่อง — กันซ้ำด้วยรหัสออเดอร์
  addHistory(src){
    try {
      const o = src || this.state.order;
      if (!o || !o.id) return;
      const h = JSON.parse(localStorage.getItem('mp_history') || '[]');
      if (h.some(x => x.id === o.id)) return;
      h.unshift({ id: o.id, ts: o.ts || Date.now(), doneAt: Date.now(), total: o.total || 0,
        plabel: o.plabel || 'งานปริ้น', pages: o.pages || 0, copies: o.copies || 1,
        pickup: !!o.pickup, veh: o.veh || '', addr: o.addr || '', rc: o.rc || null, cp: o.cp || null }); // rc+cp ต้องติดไปด้วย — ใบเสร็จ (พร้อมบรรทัดส่วนลด) เปิดจากประวัติได้
      const cut = h.slice(0, 30);

  loadChat(){
    const s = this.state, co = s.chatFor || s.order; // chatFor = แชทของออเดอร์ในประวัติ
    if (!this.db || !co || s.chatOff) return;
    const cid = co.id; // จำห้องที่ขอไว้ — ผลที่มาช้าหลังสลับห้องต้องถูกทิ้ง (กันโชว์/mark อ่านผิดออเดอร์)
    this.db.rpc('get_messages', { oid: cid }).then(({ data, error }) => {
      if (error) {
        // ปิดแชทถาวรเฉพาะ "ระบบยังไม่ติดตั้ง" (ไม่มีฟังก์ชัน/ตาราง) — เน็ตสะดุดชั่วคราวแค่ข้ามรอบนี้ รอบหน้าลองใหม่
        const m = String(error.message || '') + String(error.code || '');
        if (/42883|PGRST202|does not exist|not find the function/i.test(m)) this.setState({ chatOff: true });
        return;
      }
      const cur = this.state.chatFor || this.state.order;
      if (!cur || cur.id !== cid) return; // สลับห้องไปแล้ว — ทิ้งผลเก่า
      this.setState({ chat: Array.isArray(data) ? data : [] }); // กันข้อมูลเพี้ยนทำจอพัง
      // นับว่าอ่านแล้วเฉพาะตอนกล่องแชทโผล่ให้เห็น (ออเดอร์ที่ย่อไว้ยังไม่นับว่าอ่าน)
      const st = this.state;
      if (st.screen === 'chat' && (data || []).some(m => m.sender === 'shop' && !m.seen_by_customer)) {
        this.db.rpc('mark_read', { oid: cid }).then(() => { const c2 = this.state.chatFor || this.state.order; if (c2 && c2.id === cid) this.setState({ chat: (data || []).map(m => ({ ...m, seen_by_customer: true })) }); });
      }
    });
  }
  sendChat(){
    const s = this.state, body = (s.chatText || '').trim(), co = s.chatFor || s.order;
    if (!body || s.chatBusy || !co) return;
    if (!this.db) { // โหมดตัวอย่าง
      this.setState({ chat: [...(s.chat || []), { id: Date.now(), sender: 'customer', body, created_at: new Date().toISOString() }], chatText: '' });
      return;
    }
    this.setState({ chatBusy: true });
    this.db.rpc('post_message', { oid: co.id, body }).then(({ error }) => {
      this.setState({ chatBusy: false });
      if (error) return this.showToast('ส่งข้อความไม่สำเร็จ ลองอีกครั้งครับ 🙏');

          const hasLocal = !!s.order || (s.orderList || []).length > 0 || (s.history || []).length > 0;
          if (n.k === 'order' && s.shopOpen === false) { return this.showToast('ขออภัยครับ ตอนนี้ร้านปิดรับออเดอร์ชั่วคราว 🙏'); }
          if (n.k === 'order' && !this.ensureUser()) { this.setState({ screen: 'login' }); return this.showToast('เข้าสู่ระบบก่อนนะครับ 🙏'); }
          if ((n.k === 'track' || n.k === 'history') && !hasLocal && !this.ensureUser()) { this.setState({ screen: 'login' }); return this.showToast('เข้าสู่ระบบก่อนนะครับ 🙏'); }

          </div>
        )}

        {/* ── Review (Step 3) — ตรวจสอบสเปกก่อนจ่าย ลดออเดอร์ผิด ── */}
        {v.isReview && (
          <div style={css("padding:18px 20px 110px;display:flex;flex-direction:column;gap:14px")}>
            <div style={css("font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sub);letter-spacing:1px")}>STEP 03 / 04 — ตรวจสอบออเดอร์</div>
            <div style={css("background:var(--accSoft);border:1px solid var(--acc);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--acc);font-weight:600;line-height:1.5")}>🔎 เช็คให้ชัวร์ก่อนจ่ายเงิน — ถ้าไม่ตรงกดแก้ไขได้เลย ยังไม่เสียเงินนะครับ</div>

                <div key={i} style={css("display:flex;align-items:center;gap:12px;padding:10px 0" + (i < v.files.length - 1 ? ";border-bottom:1px dashed var(--line)" : ""))}>

                    ? <img src={f.thumb} alt="" style={css("width:46px;height:62px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:6px;background:#fff;flex:none")}/>
                    : <div style={css("width:46px;height:62px;border:1px solid var(--line);border-radius:6px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none")}>{f.big ? '🗂️' : '📄'}</div>}

                    <div style={css("font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap")}>{f.name}</div>

                    {f.thumb && <div style={css("font-size:10px;color:var(--sub)")}>↑ รูปตัวอย่างหน้าแรกจากไฟล์จริง</div>}
                  </div>
                </div>
              ))}
            </div>

            <div style={css("background:var(--accSoft);border:1.5px solid var(--acc);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)")}>

              <div style={css("margin-top:10px;display:flex;flex-direction:column;gap:9px")}>
                {[['ประเภทงาน', v.typeLabel], ['ขนาดกระดาษ', v.paperLabel], ['ด้านที่พิมพ์', v.sidesLabel], ...(v.isPro ? [] : [['ทิศทางกระดาษ', v.orientLabel], ['การกำหนดหน้า', v.nupLabel]]), [v.isPro ? 'การเข้าเล่ม' : 'การเย็บมุม', v.bindLabel], ['จำนวน', v.copies + ' ชุด']].map((p, i) => (
                  <div key={i} style={css("display:flex;align-items:center;gap:10px")}>
                    <div style={css("width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none")}>✓</div>
                    <span style={css("font-size:12.5px;color:var(--sub);min-width:88px")}>{p[0]}</span>
                    <span style={css("font-size:13.5px;font-weight:700")}>{p[1]}</span>
                  </div>
                ))}
              </div>
              <div style={css("margin-top:10px;border-top:1px dashed var(--acc);padding-top:8px;font-size:11.5px;color:var(--acc);font-weight:600")}>💡 {v.rateHint}</div>
            </div>

            <div style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)")}>
              <div style={css("font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.5px")}>📍 จัดส่ง</div>
              <div style={css("margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:12.5px")}>

                <div><span style={css("color:var(--sub)")}>ที่อยู่: </span>{v.destLabel}</div>
                <div><span style={css("color:var(--sub)")}>เบอร์ผู้รับ: </span><span style={css("font-family:'IBM Plex Mono',monospace")}>{v.phone}</span></div>
              </div>
            </div>

            <div style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)")}>
              <div style={css("display:flex;flex-direction:column;gap:6px;font-size:12.5px")}>
                <div style={css("display:flex;justify-content:space-between")}><span style={css("color:var(--sub)")}>ค่าปริ้น {v.pageSummary}</span><span style={css("font-family:'IBM Plex Mono',monospace")}>฿{v.printCost}</span></div>
                {v.colorBreak && <div style={css("font-size:10.5px;color:var(--sub);margin-top:-4px")}>{v.colorBreak}</div>}

                <div style={css("display:flex;justify-content:space-between")}><span style={css("color:var(--sub)")}>เข้าเล่ม</span><span style={css("font-family:'IBM Plex Mono',monospace")}>฿{v.bindCost}</span></div>

            <div style={css("display:flex;gap:10px")}>
              <button onClick={v.goEditOrder} style={css("flex:1;height:44px;border:1.5px solid var(--acc);border-radius:12px;background:var(--card);color:var(--acc);font-size:13px;font-weight:700;cursor:pointer")}>✏️ แก้ไฟล์/สเปก</button>

            </div>
            <button onClick={v.goPay} style={css("width:100%;height:50px;border:none;border-radius:14px;background:var(--acc);color:#fff;font-size:15px;font-weight:700;cursor:pointer")}>✓ ถูกต้องทั้งหมด — ไปชำระเงิน →</button>
          </div>
        )}

        {/* ── Pay (Step 4) ── */}
        {v.isPay && (
          <div style={css("padding:18px 20px 110px;display:flex;flex-direction:column;gap:14px")}>
            <div style={css("font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sub);letter-spacing:1px")}>STEP 04 / 04 — ชำระเงิน PROMPTPAY</div>
            <div style={css("background:var(--card);border-radius:4px;box-shadow:var(--shadow);padding:16px;position:relative")}>
              <div style={css("font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sub);text-align:center;letter-spacing:2px")}>*** MORE PRINT — ORDER SUMMARY ***</div>

                <div style={css("display:flex;justify-content:space-between")}><span style={css("color:var(--sub)")}>ค่าส่ง {v.deliveryLabel}</span><span style={css("font-family:'IBM Plex Mono',monospace")}>฿{v.deliveryCost}</span></div>
                {v.nightCharged && <div style={css("display:flex;justify-content:space-between")}><span style={css("color:var(--warnInk)")}>ค่าบริการกลางคืน</span><span style={css("font-family:'IBM Plex Mono',monospace;color:var(--warnInk)")}>฿{v.nightFee}</span></div>}

                <div style={css("display:flex;justify-content:space-between;font-size:12px")}><span style={css("color:var(--sub)")}>ส่งที่</span><span style={css("text-align:right;max-width:60%")}>{v.destLabel}</span></div>
              </div>
              <div style={css("margin-top:12px;border-top:2px dashed var(--line);padding-top:10px;display:flex;justify-content:space-between;align-items:baseline")}><span style={css("font-weight:700;font-size:14px")}>ยอดชำระ</span><span style={css("font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--acc)")}>฿{v.grandTotal}</span></div>
            </div>

            {/* โค้ดส่วนลด */}

                ? <div style={css("display:flex;align-items:center;gap:10px")}>
                    <span style={css("flex:none;display:flex;color:var(--acc)")}>{fi('tag', 17)}</span>
                    <div style={css("flex:1;min-width:0")}>
                      <div style={css("font-size:12.5px;font-weight:700;color:var(--acc)")}>ใช้โค้ด {v.couponOk.code} แล้ว</div>
                      <div style={css("font-size:11px;color:var(--sub)")}>{v.discount > 0 ? 'ลดไป ฿' + v.discount : (v.couponOk.kind === 'freeship' ? 'ออเดอร์นี้ไม่มีค่าส่ง (รับหน้าร้าน) — โค้ดส่งฟรีจึงไม่ลด และสิทธิ์ยังไม่ถูกนับครับ' : 'ยอดยังไม่ถึงขั้นต่ำของโค้ดนี้')}</div>
                    </div>
                    <span onClick={v.clearCoupon} style={css("flex:none;font-size:11.5px;color:#c92a2a;font-weight:700;cursor:pointer")}>ยกเลิกโค้ด</span>
                  </div>
                : <React.Fragment>
                    <div style={css("font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px")}><span style={css("display:flex;color:var(--acc)")}>{fi('tag', 14)}</span>มีโค้ดส่วนลด?</div>
                    <div style={css("margin-top:8px;display:flex;gap:8px")}>
                      <input value={v.couponCode} onChange={v.setCouponCode} placeholder="กรอกโค้ดส่วนลดตรงนี้เลย" maxLength={20}
                        style={css("flex:1;min-width:0;box-sizing:border-box;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:13px;outline:none;text-transform:uppercase;font-family:'IBM Plex Mono',monospace")}/>
                      <button onClick={v.applyCoupon} disabled={v.couponBusy} style={css("flex:none;height:42px;padding:0 16px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;cursor:pointer" + (v.couponBusy ? ";opacity:.6" : ""))}>{v.couponBusy ? '⏳' : 'ใช้โค้ด'}</button>
                    </div>
                  </React.Fragment>}
