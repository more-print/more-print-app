function css(str){
  const o = {};
  String(str).split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if (i < 0) return;
    const prop = decl.slice(0, i).trim();
    if (!prop) return;
    o[prop.startsWith('--') ? prop : prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = decl.slice(i + 1).trim();
  });
  return o;
}

};

const jobValue = (o) => (o.print_cost || 0) + (o.bind_cost || 0); // มูลค่างานปริ้นราคาเต็ม (ก่อนส่วนลด)
// ส่วนลดที่กินค่างานปริ้น — โค้ดส่งฟรี (ยอดลดเท่าค่าส่งพอดี) ลดค่าส่งฝั่ง MORE PRINT ไม่แตะส่วนแบ่งร้าน
const printDisc = (o) => { const d = o.discount || 0; if (d <= 0) return 0; if ((o.delivery_cost || 0) > 0 && d === o.delivery_cost) return 0; return Math.min(d, jobValue(o)); };
// ฐานคิดส่วนแบ่ง 80/20 = ราคาหลังหักส่วนลด (เจ้าของเคาะ 2026-09-15: ส่วนลดหารตามสัดส่วน ร้าน 80 เรา 20) — ต้องตรงกับ commission.html
// รายการปรับจากแผงแก้ไขออเดอร์ที่เป็น "เนื้องานปริ้น" เข้าฐานแบ่ง 80/20 ด้วย (เจ้าของแจ้ง 2026-09-15 ยอดการ์ดไม่อัปเดต)
// ส่วนรายการฝั่งค่าส่ง/เปลี่ยนการรับงาน (kind:'ship' หรือ label ขึ้นต้นตามระบบ) ไม่เข้าฐาน — ค่าส่งเป็นของ MORE PRINT
const shipAdj = (a) => a && (a.kind === 'ship' || /^(เปลี่ยนเป็นจัดส่งถึงที่|เปลี่ยนเป็นมารับเองที่ร้าน|แก้จุดส่ง)/.test(String(a.label || '')));
const adjJob = (o) => (o.adjustments || []).reduce((sm, a) => sm + (shipAdj(a) ? 0 : (Number(a.amt) || 0)), 0);
const jobNet = (o) => Math.max(0, jobValue(o) + adjJob(o) - printDisc(o));
// เรทคอมรายออเดอร์ (ใบดีลพิเศษ 2026-10-09): orders.comm_rate มีค่า (0-1) = ใช้เรทนั้น · ไม่มีค่า = ดีลปกติ 20/80 — ต้องตรงกับ commission.html
const commRateOf = (o) => { const r = Number(o && o.comm_rate); return isFinite(r) && r > 0 && r < 1 ? r : COMMISSION; };
const commOf = (o) => jobNet(o) * commRateOf(o);
const partnerOf = (o) => jobNet(o) - commOf(o);

const PRO_SPEC_KEYS = [
  [/บอร์ด/, 'บอร์ด'],
  [/^(พีพีฟิล์ม|ไวนิล|กระดาษโฟโต้|กระดาษอาร์ต)$/, 'กระดาษ'],
  [/^กระดาษพิเศษ$/, 'ตัวเลือกเสริม'],
  [/เคลือบ/, 'การเคลือบ'],
  [/^(พิมพ์)?(หน้า-หลัง|หน้าเดียว)$/, 'ด้านที่พิมพ์'],
  [/^แนว(ตั้ง|นอน)$/, 'แนวกระดาษ'],
  [/^\d+ หน้า$/, 'จำนวนหน้า'],
  [/เย็บ/, 'การเย็บเล่ม'],
  [/ขาตั้ง/, 'ขาตั้ง'],
  [/ซม\.|ชิ้น|ลาย/, 'ขนาด/จำนวน']
];
function proSpecRows(o){
  const parts = String(o.paper || '').split(' · ').map(x => x.trim()).filter(Boolean);
  const base = parts.shift() || '';
  const rows = [];
  let m;
  if ((m = base.match(/^(เพลท|โปสเตอร์) (\S+)$/))) rows.push(['ประเภทงาน', m[1]], ['ขนาด', m[2]]);
  else if ((m = base.match(/^Postcard (\S+) \((.+)\)$/))) rows.push(['ประเภทงาน', 'Postcard'], ['ขนาด', m[1] + ' (' + m[2] + ')']);
  else if ((m = base.match(/^พับครึ่ง เล่ม (\S+) \(กระดาษ (\S+)\)$/))) rows.push(['ประเภทงาน', 'พับครึ่ง (เข้าเล่ม/เมนู)'], ['ขนาดเล่ม', m[1]], ['ขนาดกระดาษ', m[2]]);
  else if ((m = base.match(/^นามบัตร (\d+) ใบ ?(หน้า-หลัง|หน้าเดียว)?$/))) { rows.push(['ประเภทงาน', 'นามบัตร'], ['จำนวนใบ', m[1] + ' ใบ']); if (m[2]) rows.push(['ด้านที่พิมพ์', m[2]]); }
  else if ((m = base.match(/^(ปริ้นสีขาวดำขนาดใหญ่.*) (A\d)$/))) rows.push(['ประเภทงาน', m[1]], ['ขนาด', m[2]]);
  else if ((m = base.match(/^สติ๊กเกอร์ ?(.*)$/))) { rows.push(['ประเภทงาน', 'สติ๊กเกอร์']); if (m[1]) rows.push(['เนื้อสติ๊กเกอร์', m[1]]); }
  else if (/^A\d$/.test(base)) rows.push(['ขนาด', base]); // ออเดอร์รุ่นแรกเก็บแค่ขนาดกระดาษ
  else rows.push(['ประเภทงาน', base || 'งาน PRO']);
  parts.forEach(p => { const k = PRO_SPEC_KEYS.find(([re]) => re.test(p)); rows.push([k ? k[1] : 'รายละเอียด', p]); });
  if (!rows.some(r => r[0] === 'ด้านที่พิมพ์')) rows.push(['ด้านที่พิมพ์', o.sides === 2 ? 'หน้า-หลัง' : 'หน้าเดียว']); // เดิมเป็นชิปบนหัวการ์ด (ลบ 2026-10-12)
  if (o.bind && o.bind !== 'none') rows.push(['เข้าเล่ม', o.bind]);
  rows.push(['จำนวนชุด', (o.copies || 1) + ' ชุด']);
  return rows;
}
// Pro หลายไฟล์ (2026-10-12): ลูกค้าเลือกประเภทงาน+สเปก+จำนวนชุดทีละไฟล์ → files[].paper/copies/sides/bind · ออเดอร์เก่า/ไฟล์เดียวใช้ค่าทั้งออเดอร์
const proPerFile = (o) => (o.files || []).length > 1 && (o.files || []).some(f => f.paper);
const proFileRows = (o, f) => proSpecRows({ paper: f.paper || o.paper, copies: f.copies || 1, sides: f.sides || o.sides, bind: f.paper ? (f.bind || 'none') : o.bind });
// กล่องสเปกรายไฟล์เรียงไปทางขวา (มือถือเลื่อนได้) — แบบเดียวกับหลังบ้าน Standard
function ProSpecs({ o }){
  if (!proPerFile(o)) return <SpecBox rows={proSpecRows(o)}/>;
  return (
    <React.Fragment>
      <div style={css("margin-bottom:5px;font-size:11px;font-weight:700;color:#00b368")}>สั่ง {o.files.length} ไฟล์ · แต่ละไฟล์คนละสเปก — เลื่อนไปทางขวาดูครบทุกไฟล์ →</div>
      <div style={css("display:flex;gap:8px;overflow-x:auto;padding-bottom:3px")}>
        {o.files.map((f, i) => <SpecBox key={i} grow title={'ไฟล์ ' + (i + 1)} sub={f.name} rows={proFileRows(o, f)}/>)}
      </div>
    </React.Fragment>
  );
}
// กล่องสเปก: หัวข้อสีเขียว · ค่าที่ลูกค้าเลือกสีดำ · กรอบเขียวแบบกล่องราคา — ใช้แบบเดียวกันทั้ง admin/pro/commission (แก้ต้องแก้ทั้ง 3 ไฟล์)
// title/sub = หัวกล่องรายไฟล์ (ไฟล์ 1 · ชื่อไฟล์) · grow = กล่องเรียงต่อกันไปทางขวา
function SpecBox({ rows, title, sub, grow }){
  return (
    <div style={css("border:1.5px solid #00b368;background:#fff;border-radius:12px;padding:9px 13px;box-sizing:border-box;font-size:12.5px;line-height:1.5" + (grow ? ";flex:1 0 220px" : ""))}>
      {title && (
        <div style={css("margin-bottom:6px;padding-bottom:5px;border-bottom:1px dashed #9fdcbf;display:flex;align-items:baseline;gap:7px")}>
          <b style={css("flex:none;color:#00b368;font-size:13px")}>{title}</b>
          {sub && <span style={css("flex:1;min-width:0;font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap")}>{sub}</span>}
        </div>
      )}
      <div style={css("display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:5px")}>
        {rows.map(([k, v], i) => (
          <React.Fragment key={i}>
            <span style={css("color:#00b368;font-weight:700;white-space:nowrap")}>{k}:</span>
            <span style={css("color:var(--ink);font-weight:600;overflow-wrap:anywhere")}>{v}</span>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

function ProLogin({ onOk }){
  const [email, setEmail] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [pass2, setPass2] = React.useState('');
  const [reg, setReg] = React.useState(false);
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [uuid, setUuid] = React.useState('');
  // หน้านี้เป็นของร้านพาร์ทเนอร์เท่านั้น — บัญชีเจ้าของ MORE PRINT จัดการงาน Pro ที่หน้า commission.html
  const verify = async () => {
    const a = await DB.rpc('is_admin');
    if (a.data) { setMsg('หน้านี้แยกเป็นของร้านพาร์ทเนอร์ (อุดมสุข) แล้ว — เจ้าของร้านจัดการงาน Pro ทั้งหมดได้ที่หน้า ค่าคอม (commission.html) ครับ'); setBusy(false); return; }
    const p = await DB.rpc('is_partner');
    if (p.data) { onOk('partner'); return; }
    const { data } = await DB.auth.getUser();
    setUuid((data && data.user && data.user.id) || '');
    setMsg(p.error
      ? 'ระบบสิทธิ์พาร์ทเนอร์ยังไม่พร้อม — เจ้าของร้านต้องรัน SQL เปิดระบบก่อน'
      : 'บัญชีนี้ยังไม่ได้รับสิทธิ์เข้าหลังบ้าน PRO — ส่งอีเมลที่สมัครให้เจ้าของร้าน MORE PRINT เปิดสิทธิ์ให้ครับ');
    setBusy(false);
  };
  React.useEffect(() => {
    if (!DB) { onOk('partner'); return; }
    DB.auth.getSession().then(({ data }) => { if (data.session) { setBusy(true); verify(); } });
  }, []);
  const submit = async () => {
    if (!DB) return onOk('partner');
    if (!email.trim() || !pass) return setMsg('กรอกอีเมลและรหัสผ่านก่อนครับ');
    if (reg && pass !== pass2) return setMsg('รหัสผ่านสองช่องไม่เหมือนกัน ❌');
    if (reg && pass.length < 6) return setMsg('รหัสผ่านอย่างน้อย 6 ตัวอักษรครับ');
    setBusy(true); setMsg('');
    if (reg) {
      const { error } = await DB.auth.signUp({ email: email.trim().toLowerCase(), password: pass });
      if (error) {
        setBusy(false);
        const m = error.message || '';
        return setMsg(/already/i.test(m) ? 'อีเมลนี้มีบัญชีแล้ว — สลับไปเข้าสู่ระบบด้านล่างแทนครับ'
          : /rate limit|too many|security purposes/i.test(m) ? '⏳ ลองสมัครถี่เกินไป ระบบล็อกกันสแปมชั่วคราว — พักประมาณ 1 ชั่วโมงแล้วค่อยลองใหม่ครับ'
          : /password/i.test(m) ? 'รหัสผ่านสั้นหรือเดาง่ายเกินไป — ตั้งใหม่ให้ยาวขึ้นครับ'
          : /invalid.*email|email.*invalid/i.test(m) ? 'รูปแบบอีเมลไม่ถูกต้อง เช็คตัวสะกดอีกทีครับ'
          : 'สมัครไม่สำเร็จ — ระบบแจ้งว่า: ' + m);
      }
    } else {
      const { error } = await DB.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: pass });
      if (error) { setBusy(false); return setMsg('อีเมลหรือรหัสผ่านไม่ถูกต้อง ❌'); }
    }
    await verify();
  };
  return (
    <div style={css("min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px")}>
      <div style={css("background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:320px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:center")}>
        <img src="assets/logo-black.png" alt="MORE PRINT" style={css("width:74px;height:auto;display:block")}/>
        <div style={css("font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px;letter-spacing:1px")}><span style={css("color:var(--acc)")}>MORE</span> PRINT <span style={css("color:var(--acc)")}>PRO</span></div>
        <div style={css("font-size:13px;color:var(--sub)")}>{reg ? 'สมัครบัญชีร้านพาร์ทเนอร์' : 'หลังบ้านร้านพาร์ทเนอร์ — อุดมสุขปริ้นติ้ง'}</div>
        <input value={email} onChange={e => setEmail(e.target.value)} placeholder="อีเมล" inputMode="email" autoComplete="email"
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>
        <input type="password" value={pass} onChange={e => setPass(e.target.value)} onKeyDown={e => !reg && e.key === 'Enter' && submit()} placeholder="รหัสผ่าน" autoComplete={reg ? 'new-password' : 'current-password'}
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>
        {reg && <input type="password" value={pass2} onChange={e => setPass2(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} placeholder="รหัสผ่านอีกครั้ง" autoComplete="new-password"
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>}
        {msg && <div style={css("font-size:12px;color:#d9480f;text-align:center;line-height:1.5")}>{msg}</div>}
        {uuid && <div style={css("font-size:10.5px;color:var(--sub);word-break:break-all;text-align:center")}>รหัสบัญชี (แจ้งเจ้าของร้าน): <span style={css("font-family:'IBM Plex Mono',monospace")}>{uuid}</span></div>}
        <button onClick={submit} disabled={busy} style={css("width:100%;height:46px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:14px;font-weight:700;cursor:pointer" + (busy ? ";opacity:.6" : ""))}>{busy ? 'กำลังตรวจสอบ…' : reg ? 'สมัครบัญชีพาร์ทเนอร์' : 'เข้าสู่หลังบ้าน PRO →'}</button>
        <div onClick={() => { setReg(r => !r); setMsg(''); }} style={css("font-size:11.5px;color:var(--acc);font-weight:600;cursor:pointer;text-decoration:underline")}>{reg ? '← มีบัญชีแล้ว เข้าสู่ระบบ' : 'ร้านพาร์ทเนอร์ยังไม่มีบัญชี? สมัครที่นี่'}</div>
      </div>
    </div>
  );
}

function Badge({ status, labels }){
  if (status === 0) return <span style={css("font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#c92a2a;background:#ffe3e3;padding:3px 10px;border-radius:99px;white-space:nowrap")}>ยกเลิกแล้ว</span>;
  const i = Math.min(Math.max(status, 1), 4) - 1;
  // กำลังทำ (รับออเดอร์/กำลังผลิต) = เหลือง · ปริ้นเสร็จแล้ว (ไรเดอร์มารับ/รอมารับ/ส่งสำเร็จ) = เขียว
  const done = status >= 3;
  return <span style={css("font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;color:" + (done ? "#0b7a3e;background:#d3f9d8" : "#a16207;background:#fff3bf"))}>{(labels || STEPS)[i]}</span>;
}


// ── แชทภายใน ร้านอุดมสุข ↔ MORE PRINT ต่อออเดอร์ (คนละช่องกับแชทลูกค้า: sender = partner/moreprint) ──
function MpChat({ o, me, title }){
  const [open, setOpen] = React.useState(false);
  const [msgs, setMsgs] = React.useState([]);
  const [text, setText] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const seqRef = React.useRef(0);
  const load = React.useCallback(async () => {
    if (!DB) return;
    const seq = ++seqRef.current; // ผลรอบเก่าที่มาช้ากว่ารอบใหม่ = ทิ้ง (กันข้อความที่เพิ่งส่งหายวูบชั่วคราว)
    const { data } = await DB.from('messages').select('*').eq('order_id', o.id).in('sender', ['partner', 'moreprint']).order('id', { ascending: true }).limit(200);
    if (data && seq === seqRef.current) setMsgs(data);
  }, [o.id]);
  React.useEffect(() => { if (!open) return; load(); const t = setInterval(load, 10000); return () => clearInterval(t); }, [open, load]);
  const send = async () => {
    const b = text.trim(); if (!b || busy) return;
    if (!DB) { setMsgs(m => [...m, { id: Date.now(), sender: me, body: b, created_at: new Date().toISOString() }]); setText(''); return; }
    setBusy(true);
    const { error } = await DB.from('messages').insert({ order_id: o.id, sender: me, body: b });
    setBusy(false);
    if (error) return alert('ส่งไม่สำเร็จ — ต้องรัน SQL เปิดสิทธิ์แชทภายในก่อนครับ');
    setText(''); load();
  };
  return (
    <div style={css("margin-top:10px;border:1.5px solid #f0c36d;border-radius:12px;overflow:hidden;background:var(--card)")}>
      <div onClick={() => setOpen(v => !v)} style={css("padding:10px 13px;background:#fff7e0;display:flex;align-items:center;gap:8px;cursor:pointer")}>
        <span style={css("flex:1;font-size:12px;font-weight:800;color:#8a6d1a")}>{title}</span>
        <span style={css("flex:none;color:#8a6d1a;font-size:11px;font-weight:700")}>{open ? 'ย่อ ▲' : 'เปิด ▼'}</span>
      </div>
      {open && (
        <div style={css("padding:10px 13px")}>
          <div style={css("max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px")}>
            {msgs.length === 0 && <div style={css("font-size:11.5px;color:var(--sub);text-align:center;padding:8px 0")}>ยังไม่มีข้อความ — แจ้งปัญหาไฟล์ / การผลิต / การปริ้นของออเดอร์นี้ได้เลย</div>}
            {msgs.map(m => (
              <div key={m.id} style={{ display: 'flex', justifyContent: m.sender === me ? 'flex-end' : 'flex-start' }}>
                <div style={{ maxWidth: '82%', borderRadius: '11px', padding: '7px 11px', fontSize: '12px', lineHeight: 1.5, whiteSpace: 'pre-wrap', wordBreak: 'break-word',
                  background: m.sender === me ? 'var(--acc)' : 'var(--soft)', color: m.sender === me ? '#fff' : 'var(--ink)' }}>
                  <div style={{ fontSize: '9.5px', opacity: .75, marginBottom: '2px' }}>{m.sender === 'partner' ? 'ร้านอุดมสุข' : 'MORE PRINT'} · {fmtWhen(m.created_at)}</div>
                  {m.body}
                </div>
              </div>
            ))}
          </div>
          <div style={css("margin-top:8px;display:flex;gap:7px")}>
            <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} maxLength={500} placeholder="พิมพ์แจ้งปัญหา/ประสานงาน…"
              style={css("flex:1;min-width:0;box-sizing:border-box;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:12.5px;outline:none")}/>
            <button onClick={send} disabled={busy} style={css("flex:none;height:38px;padding:0 14px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer" + (busy ? ";opacity:.6" : ""))}>ส่ง</button>
          </div>
        </div>
      )}
    </div>
  );
}

function ProOrder({ o, idx, isOwner, payoutReady, onPrice, onPayout, onAdvance, onRetreat, onApplyEdits, onCancel, onPartnerAdvance, onPartnerRetreat, onPartnerCancel, onPartnerRemove }){
  // การรับงาน/จุดส่ง ในแผงแก้ไขออเดอร์ (มารับเอง ↔ จัดส่ง / แก้ที่อยู่-ค่าส่ง — 2026-09-15)
  const [sdMode, setSdMode] = React.useState(o.pickup ? 'pickup' : 'delivery');

  const [sdFee, setSdFee] = React.useState('');
  const [sdVeh, setSdVeh] = React.useState((o.addr || '').startsWith('🚗') ? 'car' : 'bike');
  // บิลแก้ไขรวม (เจ้าของสั่ง 2026-09-15): พักรายการไว้ก่อน กดยืนยันครั้งเดียว → อัปเดต+แชทแจ้งยอดสุทธิ+QR ทีเดียว (แก้รายการเดียวก็ใช้ทางเดียวกัน)
  const [drafts, setDrafts] = React.useState([]);      // รายการเนื้องาน {label, amt(±)}
  const [sdDraft, setSdDraft] = React.useState(null);  // เปลี่ยนการรับงาน/จุดส่ง {mode, addr, fee, veh}
  const sdGo = () => {
    if (sdMode === 'pickup') {
      if (o.pickup) return alert('ออเดอร์นี้เป็น "มารับเองที่ร้าน" อยู่แล้วครับ');
      return setSdDraft({ mode: 'pickup', addr: '', fee: 0, veh: sdVeh });
    }
    const fee = Math.round(Number(sdFee) || 0);
    if (!sdAddr.trim()) return alert('กรอกที่อยู่/จุดส่ง หรือวางลิงก์แผนที่ที่ลูกค้าส่งมาก่อนครับ');
    if (sdFee === '') return alert('กรอกค่าส่งใหม่ก่อนครับ (0 = ส่งฟรี)');
    setSdDraft({ mode: 'delivery', addr: sdAddr.trim(), fee, veh: sdVeh });

    setAdjLabel(''); setAdjAmt('');

  const sdDiffOf = (sd) => !sd ? 0 : (sd.mode === 'pickup' ? -(Number(o.delivery_cost) || 0) : sd.fee - (Number(o.delivery_cost) || 0));
  const draftNet = drafts.reduce((s, d) => s + d.amt, 0) + sdDiffOf(sdDraft);
  const editGo = () => {
    if (!drafts.length && !sdDraft) return;
    onApplyEdits(o, drafts, sdDraft);
    setDrafts([]); setSdDraft(null); setAdjOpen(false);
  };
  const [open, setOpen] = React.useState(false);  // กางการ์ด (หุบ = โชว์แค่ เลข·เวลา·ชนิดงาน·สถานะ)
  const [full, setFull] = React.useState(false);  // ใบออเดอร์เต็ม (ที่อยู่·สลิป·ยอดเงิน)

  const [price, setPrice] = React.useState('');
  const [confirmPay, setConfirmPay] = React.useState(false);
  const [cancelOpen, setCancelOpen] = React.useState(false);
  const [reason, setReason] = React.useState('');
  const priced = jobValue(o) > 0;
  const save = () => {
    const n = Math.round(Number(price));
    if (!n || n <= 0) return;
    onPrice(o, n);
    setPrice('');

  return (

          <div style={css("font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700")}>{o.id}</div>
          <div style={css("margin-top:2px;font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap")}>{FI.clock(11)} {fmtWhen(o.created_at)}</div>

        </div>

      <MpChat o={o} me={isOwner ? 'moreprint' : 'partner'} title={isOwner ? 'ช่องแชทกับร้านอุดมสุขปริ้นติ้ง (แจ้งปัญหา)' : 'แชทกับ MOREPRINT (แจ้งปัญหา)'}/>

    </div>

// ═══ เสียงเรียกออเดอร์ใหม่แบบแอปร้านค้า (เจ้าของขอ 2026-10-12 "เหมือนร้านในแอป Grab") ═══
// ดังวนจนกว่าจะกด "รับทราบ" · Android สั่นด้วย · เปิดเสียงแล้วจอไม่ดับเอง (Wake Lock) ตราบที่หน้านี้เปิดอยู่
// ข้อจำกัดของเว็บ: ต้องเปิดหน้านี้ค้างไว้บนจอ — ล็อกจอ/สลับไปแอปอื่น เบราว์เซอร์จะพักหน้าเว็บ (ช่วงนั้นพึ่งแจ้งเตือน LINE)
const OrderAlarm = {
  audio: null, ctx: null, buf: null, src: null, vib: null, wake: null, ringing: false,
  // สังเคราะห์ริงโทนในเครื่อง ไม่ต้องโหลดไฟล์เสียง: ติ๊ง-ต่อง-ติ๊ง 2 ชุด แล้วเว้น วนทุก 2 วินาที
  pcm() {
    if (this._pcm) return this._pcm;
    const sr = 22050, len = sr * 2, d = new Float32Array(len);
    [[0, 1319], [0.16, 1047], [0.32, 1568], [0.8, 1319], [0.96, 1047], [1.12, 1568]].forEach(([t0, f]) => {

    const jobs = Object.values(jm);

    const heat = [...Array(7)].map(() => Array(24).fill(0));

    const heatMax = Math.max(1, ...heat.flat());

function Dash({ role }){
  const isOwner = role === 'owner'; // พาร์ทเนอร์ = ดูอย่างเดียว (ฐานข้อมูลก็บังคับไว้อีกชั้น)
  const [orders, setOrders] = React.useState(DB ? [] : DEMO);
  const [payoutReady, setPayoutReady] = React.useState(!DB);
  const [loading, setLoading] = React.useState(!!DB);
  const [loadedAt, setLoadedAt] = React.useState(null); // เวลาโหลดล่าสุด (โชว์บนแดชบอร์ดยอดขาย)
  const [page, setPage] = React.useState('home');      // เมนูซ้าย: home/orders/sales/payouts/customers
  // ── บิลโอนจาก MORE PRINT (ตาราง payouts): บิลรอบสัปดาห์/เดือน + สลิปการโอน ──
  const [payouts, setPayouts] = React.useState(null);
  React.useEffect(() => {
    if (page !== 'payouts') return;
    if (!DB) { setPayouts([{ id: 1, label: '18 ส.ค. – 24 ส.ค. 69', ptype: 'w', amount: 536, n: 5, slip_path: null, created_at: new Date().toISOString() }]); return; }
    DB.from('payouts').select('*').order('id', { ascending: false }).limit(24)
      .then(({ data, error }) => setPayouts(error ? 'missing' : (data || [])));
  }, [page]);
  const [navOpen, setNavOpen] = React.useState(false);
  const [period, setPeriod] = React.useState('day');   // ช่วงเวลาที่เลือกดู
  const [chartMode, setChartMode] = React.useState('d'); // กราฟ: d รายวัน · m รายเดือน · y รายปี
  const [filter, setFilter] = React.useState('active'); // ตัวกรองสถานะออเดอร์
  // เลขคิวรายวัน: งานแรกของแต่ละวัน = 1 แล้วรันขึ้น รีเซ็ตใหม่ทุกวัน — ลิสต์เรียงใหม่สุดอยู่บน เลขมากจึงอยู่บน เลข 1 อยู่ล่างสุด
  const dayNum = React.useMemo(() => {
    const m = {}, byDay = {};
    orders.forEach(o => { const k = new Date(o.created_at).toDateString(); (byDay[k] = byDay[k] || []).push(o); });
    Object.values(byDay).forEach(list => list.slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).forEach((o, i) => { m[o.id] = i + 1; }));
    return m;
  }, [orders]);

  // ออเดอร์ที่ยกเลิกเกิน 2 ชั่วโมง = ลบถาวรอัตโนมัติ (นโยบายร้าน) — พาร์ทเนอร์ลบผ่าน RPC, เจ้าของลบตรง
  const cancelledExpired = (o) => o.status === 0 && o.cancelled_at && (Date.now() - new Date(o.cancelled_at).getTime() > 2 * 60 * 60 * 1000);
  const purgeCancelled = (rows) => {
    rows.filter(cancelledExpired).slice(0, 6).forEach(async (o) => {
      try {
        const paths = (o.files || []).map(f => f.path).filter(Boolean);
        if (o.slip_path) paths.push(o.slip_path);
        if (paths.length) await DB.storage.from('uploads').remove(paths);
        if (isOwner) await DB.from('orders').delete().eq('id', o.id);
        else await DB.rpc('partner_delete', { oid: o.id });
      } catch (e) {}
    });
  };
  // ── เสียงเรียกออเดอร์ใหม่ (OrderAlarm) — เปิด/ปิดที่ปุ่มกระดิ่งบนแถบหัว จำค่าไว้ในเครื่องนี้ ──
  const [alarmOn, setAlarmOn] = React.useState(() => { try { return localStorage.getItem('mp_alarm') === '1'; } catch (e) { return false; } });
  const [alarmArmed, setAlarmArmed] = React.useState(false); // ปลดล็อกเสียงแล้วรอบนี้ (เปิดหน้าใหม่ต้องแตะจอ 1 ครั้ง)
  const [ringList, setRingList] = React.useState([]);
  const ringListRef = React.useRef([]);
  ringListRef.current = ringList;
  const ringRef = React.useRef(null);
  ringRef.current = (fresh) => {
    if (alarmOn) { setRingList(l => l.concat(fresh.filter(o => !l.some(x => x.id === o.id)))); OrderAlarm.start(); return; }
    // ยังไม่เปิดกระดิ่ง = ติ๊งสั้นครั้งเดียว + ชื่อแท็บกะพริบ แบบเดิม (ร้านเปิดแท็บทิ้งไว้ก็รู้ทันที)
    try { const C = window.AudioContext || window.webkitAudioContext; const ctx = new C(); const os = ctx.createOscillator(); const g = ctx.createGain();
      os.connect(g); g.connect(ctx.destination); os.frequency.value = 880; g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7); os.start(); os.stop(ctx.currentTime + 0.7);
      setTimeout(() => { try { ctx.close(); } catch (e2) {} }, 1000); } catch (e) {} // ปิด context ทุกครั้ง — เบราว์เซอร์จำกัดจำนวน เปิดค้างเสียงจะเงียบ
    try { const orig = document.title.replace(/^🔔.*?· /, ''); let n = 0;
      const iv = setInterval(() => { document.title = (n % 2 === 0) ? ('🔔 ออเดอร์ใหม่! · ' + orig) : orig; n++; if (n > 9) { clearInterval(iv); document.title = orig; } }, 900); } catch (e) {}
  };
  const load = React.useCallback(async () => {
    if (!DB) return;
    setLoading(true);
    const cols = 'id,created_at,status,times,cancel_reason,customer_fname,customer_lname,customer_phone,paper,sides,copies,print_cost,bind_cost,delivery_cost,night_fee,total,files,slip_path,addr,point,lat,lng';
    let r = await DB.from('orders').select(cols + ',payout_at,pickup,cancelled_at,note,coupon,discount,adjustments,comm_rate').eq('ptype', 'pro').order('created_at', { ascending: false }).limit(2000); // comm_rate = เรทคอมรายใบ (ยังไม่รัน SQL = ตกลง fallback ล่างเอง)
    if (r.error) r = await DB.from('orders').select(cols + ',payout_at,pickup').eq('ptype', 'pro').order('created_at', { ascending: false }).limit(2000); // ยังไม่รัน SQL ลบอัตโนมัติ
    if (r.error) {
      // ยังไม่มีคอลัมน์ payout_at — โหลดแบบไม่มีไปก่อน (ตั้งราคายังใช้ได้ แต่บันทึกการโอนยังไม่ได้)
      r = await DB.from('orders').select(cols).eq('ptype', 'pro').order('created_at', { ascending: false }).limit(2000);
      setPayoutReady(false);
    } else setPayoutReady(true);
    if (!r.error && r.data) {
      setOrders(r.data.filter(o => !cancelledExpired(o))); purgeCancelled(r.data);
      const fresh = takeNewOrders(r.data, 'mp_alarm_pro'); // ออเดอร์ Pro ใหม่ → เสียงเรียก
      if (fresh.length) ringRef.current(fresh);
    }
    setLoadedAt(new Date());

  React.useEffect(() => { load(); const t = setInterval(load, 15000); return () => clearInterval(t); }, [load]); // รีเฟรชออเดอร์เองทุก 15 วิ — ออเดอร์ใหม่ต้องโผล่เองไม่ต้องกดรีเฟรช
  React.useEffect(() => { // เปิดหน้าใหม่ทั้งที่เปิดเสียงค้างไว้ → แตะตรงไหนก็ได้ 1 ครั้ง = ปลดล็อกเสียง + ขอจอไม่ดับ

  React.useEffect(() => { // กลับมาที่หน้านี้ (ปลดล็อกจอ/สลับแอปกลับ) → ขอจอไม่ดับใหม่ + ดึงออเดอร์ทันที ไม่ต้องรอรอบ 15 วิ

    if (!DB) setTimeout(() => ringRef.current([{ id: '#MP-DEMO' + String(Date.now()).slice(-4), created_at: new Date().toISOString(), status: 1, customer_fname: 'ตัวอย่าง', paper: 'โปสเตอร์ A2', copies: 2, pickup: true }]), 4000);

  const setPrice = async (o, n) => {

    const total = n + (o.bind_cost || 0) + (o.delivery_cost || 0) + (o.night_fee || 0) + ((o.adjustments || []).reduce((s, a) => s + (Number(a.amt) || 0), 0));

  const markPayout = async (o) => {

  // สถานะงาน Pro จัดการที่นี่ (หลังบ้านหลักไม่แสดงงาน Pro แล้ว) — ลูกค้าเห็นสถานะวิ่งเหมือนเดิม
  const advance = async (o) => {
    if (o.status === 0 || o.status >= 4) return; // ใบยกเลิก/จบแล้ว ห้ามเลื่อนสถานะ (status 0 เป็นค่า falsy — เคยเสี่ยงชุบชีวิตใบยกเลิก)
    const next = Math.min((o.status || 1) + 1, 4);
    const times = (o.times || ['', '', '', '']).slice();
    times[next - 1] = fmtTime(new Date());
    if (DB) {

      // ปิดชั่วคราวเพื่อประหยัดโควตาไลน์ 300 ข้อความ/เดือน (นโยบายเจ้าของ 2026-08-24) — เปิดกลับได้โดยลบเครื่องหมายคอมเมนต์
      // if (next >= 3) { try { fetch(CFG.SUPABASE_URL + '/functions/v1/notify-order?action=done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id }) }); } catch (e) {} }

  // ย้อนสถานะกลับ 1 ขั้น (เจ้าของ — เผื่อกดผิด): ล้างเวลาของขั้นที่ถอยออกด้วย หน้าติดตามลูกค้ากลับไปตรงตามจริง
  const retreat = async (o) => {
    if (!o.status || o.status < 2 || o.status > 4) return;

  // บิลแก้ไขรวม (เจ้าของสั่ง 2026-09-15): เพิ่ม/ลดหลายรายการ + เปลี่ยนการรับงาน/จุดส่ง พร้อมกันได้ → อัปเดตฐานข้อมูลครั้งเดียว + แชทแจ้งยอดสุทธิ (พร้อม QR ถ้าต้องโอนเพิ่ม) ครั้งเดียว
  const applyEdits = async (o, items, sd) => {
    const now = new Date().toISOString();
    const adjs = [...(o.adjustments || []), ...items.map(it => ({ label: it.label, amt: it.amt, at: now }))];
    const lines = items.map(it => it.amt > 0 ? '• เพิ่ม "' + it.label + '" +฿' + it.amt : '• ลด "' + it.label + '" −฿' + (-it.amt));

      if (sdDiff !== 0) adjs.push({ label: adjLabel, amt: sdDiff, at: now, kind: 'ship' }); // kind:'ship' = ค่าส่ง ไม่เข้าฐานแบ่ง 80/20
      upd = { pickup: toPickup, addr: toPickup ? '🏪 มารับเองที่ร้านอุดมสุขปริ้นติ้ง (เปลี่ยนตามที่ลูกค้าแจ้ง)' : (sd.veh === 'car' ? '🚗 ' : '🏍️ ') + sd.addr, delivery_cost: toPickup ? 0 : sd.fee };
      lines.push(toPickup ? '• เปลี่ยนเป็นมารับเองที่ร้าน' + (oldFee > 0 ? ' — คืนค่าส่ง −฿' + oldFee : '')
        : '• ' + adjLabel + ' (' + (sd.veh === 'car' ? '🚗 รถยนต์' : '🏍️ มอเตอร์ไซค์') + ') ' + (sdDiff > 0 ? '+฿' + sdDiff : sdDiff < 0 ? '−฿' + (-sdDiff) : 'ค่าส่ง ฿' + sd.fee + ' เท่าเดิม') + '\n   จุดส่ง: ' + sd.addr);
    }
    const net = items.reduce((s, it) => s + it.amt, 0) + sdDiff;
    // ฐาน = บิลปัจจุบัน (o.total); เผื่อออเดอร์เก่าไม่มี total ค่อยคำนวณจากส่วนประกอบ
    const base = Number(o.total) || Math.max(0, (o.print_cost || 0) + (o.bind_cost || 0) + (o.delivery_cost || 0) + (o.night_fee || 0) + (o.adjustments || []).reduce((s, a) => s + (Number(a.amt) || 0), 0) - (o.discount || 0));
    const newTotal = Math.max(0, Math.round(base + net));

    const tail = net > 0 ? '\nยอดรวมล่าสุด ฿' + newTotal + '\nรบกวนสแกน QR นี้ชำระเพิ่ม ฿' + net + ' แล้วแนบสลิปในแชทนี้ได้เลยครับ 🙏'
    : net < 0 ? '\nยอดรวมล่าสุด ฿' + newTotal + ' — ร้านจะโอนคืน ฿' + (-net) + ' ครับ\nรบกวนพิมพ์เลขพร้อมเพย์/เลขบัญชี หรือส่งรูป QR ธนาคารของคุณในแชทนี้ เดี๋ยวร้านโอนคืนให้เร็วที่สุดครับ 🙏'
    : '\nยอดรวมเท่าเดิม ฿' + newTotal + ' — ไม่ต้องโอนเพิ่มครับ ✓';
    const text = '🛠️ ร้านแก้ไขออเดอร์ตามที่คุยกันครับ\n' + lines.join('\n') + tail;
    await DB.from('messages').insert({ order_id: o.id, sender: 'shop', body: text, seen_by_shop: true, ...(net > 0 ? { img: 'chat/shop/promptpay-qr.jpg' } : {}) });
    try { fetch(CFG.SUPABASE_URL + '/functions/v1/notify-order?action=msg', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id, text }) }); } catch (e) {}

  // ร้านพาร์ทเนอร์ย้อนสถานะ — ผ่านฟังก์ชันปลอดภัยฝั่งฐานข้อมูล (partner_retreat ตรวจสิทธิ์+เงื่อนไขอีกชั้น)
  const partnerRetreat = async (o) => {
    if (!DB) { setOrders(l => l.map(x => x.id === o.id ? { ...x, status: Math.max(1, (x.status || 1) - 1) } : x)); return; }
    const { data, error } = await DB.rpc('partner_retreat', { oid: o.id });
    if (error || data !== 'ok') { alert('ย้อนสถานะไม่สำเร็จ — เจ้าของ MORE PRINT อาจยังไม่ได้เปิดระบบ (รัน SQL partner_retreat) หรือออเดอร์อยู่ขั้นแรกแล้ว'); return; }

  const cancelOrder = async (o, reason) => {

  // ร้านพาร์ทเนอร์กดอัปเดตสถานะเอง — ผ่านฟังก์ชันปลอดภัยฝั่งฐานข้อมูล (partner_advance)
  const partnerAdvance = async (o) => {

    // ผลิตเสร็จ/ลูกค้ารับแล้ว → แจ้งกลุ่ม LINE (EF เช็คสถานะจริงเอง ไม่เข้าเงื่อนไขก็เงียบ)
    // ปิดชั่วคราวเพื่อประหยัดโควตาไลน์ 300 ข้อความ/เดือน (นโยบายเจ้าของ 2026-08-24) — เปิดกลับได้โดยลบเครื่องหมายคอมเมนต์
    // try { fetch(CFG.SUPABASE_URL + '/functions/v1/notify-order?action=done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id }) }); } catch (e) {}

  // ── พาร์ทเนอร์ยกเลิก/ลบออเดอร์เอง (RPC ฝั่งฐานข้อมูลตรวจสิทธิ์+เงื่อนไขซ้ำอีกชั้น) ──
  const partnerCancel = async (o, reason) => {

    const { data, error } = await DB.rpc('partner_cancel', { oid: o.id, reason });

    try { fetch(CFG.SUPABASE_URL + '/functions/v1/notify-order?action=cancelled', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id }) }); } catch (e) {}
    await load();
  };
  const partnerRemove = async (o) => {
    if (!DB) { setOrders(l => l.filter(x => x.id !== o.id)); return; }
    try {
      const paths = [];
      (o.files || []).forEach(f => { if (f.path) paths.push(f.path); });
      if (o.slip_path) paths.push(o.slip_path);
      if (paths.length) await DB.storage.from('uploads').remove(paths).catch(() => {});
      const { data, error } = await DB.rpc('partner_delete', { oid: o.id });
      if (error || !data) { alert('ลบไม่สำเร็จ — ต้องเป็นออเดอร์ที่ยกเลิกแล้ว และเจ้าของต้องรัน SQL partner_delete ก่อน'); return; }
      await load();
    } catch (e) { alert('ลบไม่สำเร็จ: ' + e.message); }
  };

  // ── สถิติราย วัน/สัปดาห์/เดือน/ปี (ไม่รวมออเดอร์ที่ยกเลิก) ──
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const week = new Date(today); week.setDate(today.getDate() - ((today.getDay() + 6) % 7)); // จันทร์นี้
  const month = new Date(now.getFullYear(), now.getMonth(), 1);
  const year = new Date(now.getFullYear(), 0, 1);
  const valid = orders.filter(o => o.status !== 0);
  const agg = (since) => {
    const rows = valid.filter(o => new Date(o.created_at) >= since);
    const job = rows.reduce((a, o) => a + jobNet(o), 0); // ฐานหลังหักส่วนลด (2026-09-15)
    // คอม/ส่วนแบ่งรวมแบบรายใบ (ไม่ใช่ job×เรทเดียว) — รองรับใบดีลพิเศษ comm_rate (2026-10-09)
    return { n: rows.length, job, comm: rows.reduce((a, o) => a + commOf(o), 0), partner: rows.reduce((a, o) => a + partnerOf(o), 0), unpriced: rows.filter(o => jobValue(o) === 0).length };
  };
  // ── ตัวเลขภาพรวมวันนี้ (การ์ดบนสุดแบบแดชบอร์ด) ──
  const ovToday = valid.filter(o => new Date(o.created_at) >= today);
  const ovActive = orders.filter(o => o.status > 0 && o.status < 4).length;
  const ovDoneToday = ovToday.filter(o => o.status === 4).length;
  const ovJobToday = ovToday.reduce((a, o) => a + jobNet(o), 0);
  const PERIODS = [['day', 'วันนี้', today], ['week', 'สัปดาห์นี้', week], ['month', 'เดือนนี้', month], ['year', 'ปีนี้', year]];
  const curP = PERIODS.find(x => x[0] === period) || PERIODS[0];
  const curAgg = agg(curP[2]);
  const owed = valid.filter(o => jobValue(o) > 0 && !o.payout_at);
  const owedSum = owed.reduce((a, o) => a + partnerOf(o), 0);
  // บันทึกข้อมูลออเดอร์รายเดือน (ดูย้อนหลังได้ตลอด — แถวออเดอร์เก็บถาวรในฐานข้อมูล)
  const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  // ── บิลรายได้รายสัปดาห์ (จ.–อา.) ย้อนหลัง 8 สัปดาห์ — ส่วนของร้าน 80% + สถานะโอน ──
  const fmtDM = (d) => d.getDate() + ' ' + TH_M[d.getMonth()];
  const weekBills = (() => {
    const out = [];
    for (let i = 0; i < 8; i++) {
      const from = new Date(week); from.setDate(week.getDate() - 7 * i);
      const to = new Date(from); to.setDate(from.getDate() + 7);
      const rows = valid.filter(o => { const t = new Date(o.created_at); return t >= from && t < to; });
      if (!rows.length) continue;
      // ฐานบิล = เฉพาะงานส่งสำเร็จ (ตรงกับรอบโอนจริงของ MORE PRINT) — งานที่ยังทำอยู่แยกโชว์ต่างหาก ไม่ปนยอด
      const done = rows.filter(o => o.status === 4 && jobValue(o) > 0);
      const job = done.reduce((a, o) => a + jobNet(o), 0);
      const inflight = rows.filter(o => o.status > 0 && o.status < 4).reduce((a, o) => a + jobNet(o), 0);
      // ส่วนแบ่งร้านรวมรายใบ (รองรับใบดีลพิเศษ comm_rate)
      out.push({ label: 'จ. ' + fmtDM(from) + ' – อา. ' + fmtDM(new Date(to.getTime() - 86400000)), job, mine: Math.round(done.reduce((a, o) => a + partnerOf(o), 0) * 100) / 100,
        n: done.length, inflight: Math.round(rows.filter(o => o.status > 0 && o.status < 4).reduce((a, o) => a + partnerOf(o), 0) * 100) / 100, paidAll: done.length > 0 && done.every(o => o.payout_at), cur: i === 0 });
    }
    return out;
  })();
  // ── ข้อมูลกราฟยอดขาย (ยอดค่างานปริ้นของออเดอร์ที่ไม่ถูกยกเลิก) ──
  const chartData = (() => {
    const out = [];
    if (chartMode === 'd') {
      for (let i = 6; i >= 0; i--) {
        const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        const d1 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i + 1);
        const sum = valid.filter(o => { const t = new Date(o.created_at); return t >= d0 && t < d1; }).reduce((a, o) => a + jobNet(o), 0);
        out.push({ label: i === 0 ? 'วันนี้' : d0.getDate() + '/' + (d0.getMonth() + 1), v: sum });
      }
    } else if (chartMode === 'm') {
      for (let i = 5; i >= 0; i--) {
        const d0 = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const d1 = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
        const sum = valid.filter(o => { const t = new Date(o.created_at); return t >= d0 && t < d1; }).reduce((a, o) => a + jobNet(o), 0);
        out.push({ label: TH_M[d0.getMonth()], v: sum });
      }

        {page === 'payouts' && (
          <React.Fragment>
            <div style={css("font-size:14px;font-weight:800")}>{FI.receipt(15)} บิลโอนส่วนแบ่งจาก MORE PRINT</div>
            <div style={css("margin-top:3px;font-size:11.5px;color:var(--sub)")}>ทุกครั้งที่ MORE PRINT โอนส่วนแบ่งให้ร้าน จะมีบิล+สลิปการโอนขึ้นที่นี่ พร้อมบอกว่าเป็นรอบสัปดาห์หรือรอบเดือน</div>
            {payouts === 'missing' && <div style={css("margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:12.5px;color:var(--sub)")}>ระบบบิลโอนยังไม่เปิดใช้ (ต้องรัน SQL สร้างตาราง payouts)</div>}
            {payouts === null && <div style={css("margin-top:10px;text-align:center;color:var(--sub);font-size:13px;padding:20px 0")}>กำลังโหลด…</div>}
            {Array.isArray(payouts) && payouts.length === 0 && <div style={css("margin-top:10px;text-align:center;color:var(--sub);font-size:13px;padding:26px 0")}>ยังไม่มีบิลโอน — เมื่อ MORE PRINT โอนส่วนแบ่งรอบแรก บิลจะขึ้นที่นี่ครับ</div>}
            {Array.isArray(payouts) && payouts.map(pv => (
              <div key={pv.id} style={css("margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow)")}>
                <div style={css("display:flex;align-items:center;gap:9px;flex-wrap:wrap")}>
                  <span style={css("font-size:13.5px;font-weight:800")}>รอบ {pv.label}</span>
                  <span style={css("flex:none;font-size:10px;font-weight:800;border-radius:99px;padding:3px 10px;" + (pv.ptype === 'm' ? "color:#7c2d9c;background:#f6e8fb" : "color:#0b7285;background:#e3fafc"))}>{pv.ptype === 'm' ? 'บิลรายเดือน' : 'บิลรายสัปดาห์'}</span>
                  <span style={css("flex:1")}/>
                  <span style={css("font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:800;color:#15803d")}>{baht(pv.amount)}</span>
                </div>
                <div style={css("margin-top:4px;font-size:11px;color:var(--sub)")}>{pv.n} งาน · โอนเมื่อ {fmtWhen(pv.created_at)}</div>
                {pv.slip_path && fileUrl(pv.slip_path)
                  ? <a href={fileUrl(pv.slip_path)} target="_blank" rel="noreferrer" style={css("text-decoration:none;display:inline-block;margin-top:8px")}>
                      <img src={fileUrl(pv.slip_path)} alt="สลิปการโอน" style={css("max-width:150px;max-height:190px;border-radius:10px;border:1px solid var(--line);display:block;background:var(--soft)")} onError={(e) => { e.target.parentElement.style.display = 'none'; }}/>
                      <span style={css("font-size:10.5px;color:var(--acc);font-weight:700")}>สลิปการโอน — แตะดูเต็ม</span>
                    </a>
                  : <div style={css("margin-top:6px;font-size:10.5px;color:var(--sub)")}>ไม่มีสลิปแนบในบิลนี้</div>}
              </div>
            ))}
          </React.Fragment>
        )}
        {page === 'customers' && customers.length === 0 && <div style={css("text-align:center;color:var(--sub);font-size:13px;padding:30px 0")}>ยังไม่มีลูกค้างาน Pro</div>}
        {page === 'customers' && customers.length > 0 && <div style={css("font-size:12.5px;font-weight:700;color:var(--sub);margin-top:6px")}>{FI.users(13)} ลูกค้าประจำงาน PRO ({customers.length} คน · ประจำ {customers.filter(c => c.tier === 2).length} คน)</div>}
        {page === 'customers' && customers.map((cst, i) => (
          <div key={i} style={css("background:var(--card);border:1px solid " + (cst.tier === 2 ? "#ffd43b" : "var(--line)") + ";border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)")}>
            <div style={css("width:36px;height:36px;border-radius:50%;background:var(--accSoft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:" + (i < 3 ? "17px" : "14px") + ";flex:none")}>{i < 3 ? (i + 1) : (cst.name || '?').trim().charAt(0)}</div>
            <div style={css("flex:1;min-width:0")}>
              <div style={css("display:flex;align-items:center;gap:6px;min-width:0")}>
                <span style={css("font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap")}>คุณ{cst.name || 'ไม่ระบุชื่อ'}</span>
                {cst.tier === 2 && <span style={css("flex:none;font-size:9px;font-weight:700;background:#fff3bf;color:#e8590c;border-radius:99px;padding:2px 7px")}>ประจำ</span>}
                {cst.tier === 1 && <span style={css("flex:none;font-size:9px;font-weight:700;background:#e7f5ff;color:#1971c2;border-radius:99px;padding:2px 7px")}>มาซ้ำ</span>}
                {cst.tier === 0 && <span style={css("flex:none;font-size:9px;font-weight:700;background:var(--soft);color:var(--sub);border-radius:99px;padding:2px 7px")}>🆕 ใหม่</span>}
              </div>
              <div style={css("margin-top:2px;font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap")}>
                {isOwner && cst.phone ? <span><a href={'tel:' + String(cst.phone).replace(/[^0-9+]/g, '')} style={css("font-family:'IBM Plex Mono',monospace")}>{cst.phone}</a> · </span> : null}สั่งบ่อย: {cst.topJobs.map(([l, n]) => l + ' ×' + n).join(' · ')}
              </div>
            </div>
            <div style={css("text-align:right;flex:none")}>
              <div style={css("font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--acc)")}>{baht(cst.spend)}</div>
              <div style={css("font-size:10.5px;color:var(--sub)")}>{cst.n} ออเดอร์</div>
            </div>
          </div>
        ))}
      </div>
    </div>
      </div>
    </div>
  );
}

function App(){
  const [role, setRole] = React.useState(null); // 'owner' | 'partner'
  if (!role) return <ProLogin onOk={(r) => setRole(r)}/>;
  return <Dash role={role}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
