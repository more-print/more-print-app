<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORE PRINT — หลังบ้านงาน PRO (Partner)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--bg);font-family:'IBM Plex Sans Thai',sans-serif;
  --bg:#f5f4f8;--card:#ffffff;--ink:#111111;--sub:#8a8a90;--line:#e5e3ec;--soft:#f0eef6;
  --acc:#7048e8;--accSoft:#f0ebff;--gold:#a16207;--goldBg:#fff7e0;--shadow:0 2px 10px rgba(0,0,0,.06)}
  input,button,select,textarea{font-family:'IBM Plex Sans Thai',sans-serif}
</style>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const CFG = window.MP_CONFIG || {};
const DB = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { storageKey: 'mp-pro' } }) : null;

// ── ค่าคอมมิชชั่น MORE PRINT ต่อออเดอร์ Pro — แก้ที่นี่จุดเดียว ──
const COMMISSION = 0.33; // 33% ของค่างานปริ้น (ไม่รวมค่าส่ง — ค่าส่งเป็นของ MORE PRINT อยู่แล้ว)

const STEPS = ['รับออเดอร์', 'กำลังผลิตสินค้า', 'กำลังจัดส่ง', 'ส่งแล้ว'];
// ขั้นสถานะตามวิธีรับงาน: ลูกค้ามารับเอง = จบที่ร้าน / ให้ส่ง = MORE PRINT รับช่วงขั้นจัดส่ง
const stepsOf = (o) => o && o.pickup
  ? ['รับออเดอร์', 'กำลังผลิตสินค้า', 'เสร็จแล้ว รอมารับ', 'ลูกค้ารับสินค้าแล้ว']
  : STEPS;
function css(str){
  const o = {};
  String(str).split(';').forEach(decl => {
    const i = decl.indexOf(':');
    if (i < 0) return;
    const prop = decl.slice(0, i).trim();
    if (!prop) return;
    o[prop.startsWith('--') ? prop : prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = decl.slice(i + 1).trim();
  });
  return o;
}
const fmtTime = (d) => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
const fmtWhen = (iso) => {
  const d = new Date(iso), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return (sameDay ? 'วันนี้ ' : d.getDate() + '/' + (d.getMonth()+1) + '/' + (d.getFullYear()+543).toString().slice(-2) + ' ') + fmtTime(d);
};
const baht = (n) => '฿' + (Math.round((n || 0) * 100) / 100).toLocaleString('th-TH');
const fileUrl = (path) => path && CFG.SUPABASE_URL ? CFG.SUPABASE_URL + '/storage/v1/object/public/uploads/' + path : null;
const jobValue = (o) => (o.print_cost || 0) + (o.bind_cost || 0); // มูลค่างานปริ้น (ฐานคิดคอม)
const commOf = (o) => jobValue(o) * COMMISSION;
const partnerOf = (o) => jobValue(o) - commOf(o);

const DEMO = [
  { id: '#MP-PRO001', created_at: new Date(Date.now() - 2*3600000).toISOString(), status: 2, customer_fname: 'สมชาย', customer_lname: 'ใจดี', customer_phone: '081-111-2222', paper: 'A1', sides: 1, copies: 2, print_cost: 600, bind_cost: 0, delivery_cost: 39, night_fee: 0, total: 639, payout_at: null, files: [{ name: 'โปสเตอร์งานวิจัย.pdf', pages: 1, path: null, drive_url: 'https://drive.google.com/file/d/demo' }] },
  { id: '#MP-PRO002', created_at: new Date(Date.now() - 26*3600000).toISOString(), status: 2, customer_fname: 'มินตรา', customer_lname: 'พาเพลิน', customer_phone: '095-333-4444', paper: 'A2', sides: 2, copies: 1, print_cost: 250, bind_cost: 0, delivery_cost: 0, night_fee: 0, total: 250, payout_at: null, pickup: true },
  { id: '#MP-PRO003', created_at: new Date(Date.now() - 30*3600000).toISOString(), status: 4, customer_fname: 'ต้นกล้า', customer_lname: 'เรียนดี', customer_phone: '062-555-6666', paper: 'A3', sides: 1, copies: 5, print_cost: 0, bind_cost: 0, delivery_cost: 39, night_fee: 0, total: 39, payout_at: null }
];

function ProLogin({ onOk }){
  const [email, setEmail] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [pass2, setPass2] = React.useState('');
  const [reg, setReg] = React.useState(false);
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [uuid, setUuid] = React.useState('');
  // เช็คสิทธิ์: เจ้าของ MORE PRINT = โหมดเต็ม / ร้านพาร์ทเนอร์ = เห็นเฉพาะงาน Pro (สิทธิ์คุมที่ฐานข้อมูล)
  const verify = async () => {
    const a = await DB.rpc('is_admin');
    if (a.data) { onOk('owner'); return; }
    const p = await DB.rpc('is_partner');
    if (p.data) { onOk('partner'); return; }
    const { data } = await DB.auth.getUser();
    setUuid((data && data.user && data.user.id) || '');
    setMsg(p.error
      ? 'ระบบสิทธิ์พาร์ทเนอร์ยังไม่พร้อม — เจ้าของร้านต้องรัน SQL เปิดระบบก่อน'
      : 'บัญชีนี้ยังไม่ได้รับสิทธิ์เข้าหลังบ้าน PRO — ส่งอีเมลที่สมัครให้เจ้าของร้าน MORE PRINT เปิดสิทธิ์ให้ครับ');
    setBusy(false);
  };
  React.useEffect(() => {
    if (!DB) { onOk('owner'); return; }
    DB.auth.getSession().then(({ data }) => { if (data.session) { setBusy(true); verify(); } });
  }, []);
  const submit = async () => {
    if (!DB) return onOk('owner');
    if (!email.trim() || !pass) return setMsg('กรอกอีเมลและรหัสผ่านก่อนครับ');
    if (reg && pass !== pass2) return setMsg('รหัสผ่านสองช่องไม่เหมือนกัน ❌');
    if (reg && pass.length < 6) return setMsg('รหัสผ่านอย่างน้อย 6 ตัวอักษรครับ');
    setBusy(true); setMsg('');
    if (reg) {
      const { error } = await DB.auth.signUp({ email: email.trim().toLowerCase(), password: pass });
      if (error) {
        setBusy(false);
        const m = error.message || '';
        return setMsg(/already/i.test(m) ? 'อีเมลนี้มีบัญชีแล้ว — สลับไปเข้าสู่ระบบด้านล่างแทนครับ'
          : /rate limit|too many|security purposes/i.test(m) ? '⏳ ลองสมัครถี่เกินไป ระบบล็อกกันสแปมชั่วคราว — พักประมาณ 1 ชั่วโมงแล้วค่อยลองใหม่ครับ'
          : /password/i.test(m) ? 'รหัสผ่านสั้นหรือเดาง่ายเกินไป — ตั้งใหม่ให้ยาวขึ้นครับ'
          : /invalid.*email|email.*invalid/i.test(m) ? 'รูปแบบอีเมลไม่ถูกต้อง เช็คตัวสะกดอีกทีครับ'
          : 'สมัครไม่สำเร็จ — ระบบแจ้งว่า: ' + m);
      }
    } else {
      const { error } = await DB.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: pass });
      if (error) { setBusy(false); return setMsg('อีเมลหรือรหัสผ่านไม่ถูกต้อง ❌'); }
    }
    await verify();
  };
  return (
    <div style={css("min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px")}>
      <div style={css("background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:320px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:center")}>
        <div style={css("font-size:34px")}>✨</div>
        <div style={css("font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px;letter-spacing:1px")}><span style={css("color:var(--acc)")}>MORE</span> PRINT <span style={css("color:var(--acc)")}>PRO</span></div>
        <div style={css("font-size:13px;color:var(--sub)")}>{reg ? '📝 สมัครบัญชีร้านพาร์ทเนอร์' : '🔐 หลังบ้านงาน PRO — เจ้าของร้าน / ร้านพาร์ทเนอร์'}</div>
        <input value={email} onChange={e => setEmail(e.target.value)} placeholder="อีเมล" inputMode="email" autoComplete="email"
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>
        <input type="password" value={pass} onChange={e => setPass(e.target.value)} onKeyDown={e => !reg && e.key === 'Enter' && submit()} placeholder="รหัสผ่าน" autoComplete={reg ? 'new-password' : 'current-password'}
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>
        {reg && <input type="password" value={pass2} onChange={e => setPass2(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} placeholder="รหัสผ่านอีกครั้ง" autoComplete="new-password"
          style={css("width:100%;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);padding:0 14px;font-size:14px;outline:none")}/>}
        {msg && <div style={css("font-size:12px;color:#d9480f;text-align:center;line-height:1.5")}>{msg}</div>}
        {uuid && <div style={css("font-size:10.5px;color:var(--sub);word-break:break-all;text-align:center")}>รหัสบัญชี (แจ้งเจ้าของร้าน): <span style={css("font-family:'IBM Plex Mono',monospace")}>{uuid}</span></div>}
        <button onClick={submit} disabled={busy} style={css("width:100%;height:46px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:14px;font-weight:700;cursor:pointer" + (busy ? ";opacity:.6" : ""))}>{busy ? 'กำลังตรวจสอบ…' : reg ? 'สมัครบัญชีพาร์ทเนอร์' : 'เข้าสู่หลังบ้าน PRO →'}</button>
        <div onClick={() => { setReg(r => !r); setMsg(''); }} style={css("font-size:11.5px;color:var(--acc);font-weight:600;cursor:pointer;text-decoration:underline")}>{reg ? '← มีบัญชีแล้ว เข้าสู่ระบบ' : 'ร้านพาร์ทเนอร์ยังไม่มีบัญชี? สมัครที่นี่'}</div>
      </div>
    </div>
  );
}

function Badge({ status, labels }){
  if (status === 0) return <span style={css("font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#c92a2a;background:#ffe3e3;padding:3px 10px;border-radius:99px;white-space:nowrap")}>ยกเลิกแล้ว</span>;
  const i = Math.min(Math.max(status, 1), 4) - 1;
  return <span style={css("font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--acc);background:var(--accSoft);padding:3px 10px;border-radius:99px;white-space:nowrap")}>{(labels || STEPS)[i]}</span>;
}

function ProOrder({ o, isOwner, payoutReady, onPrice, onPayout, onAdvance, onCancel, onPartnerAdvance }){
  const [edit, setEdit] = React.useState(false);
  const [price, setPrice] = React.useState('');
  const [confirmPay, setConfirmPay] = React.useState(false);
  const [cancelOpen, setCancelOpen] = React.useState(false);
  const [reason, setReason] = React.useState('');
  const priced = jobValue(o) > 0;
  const save = () => {
    const n = Math.round(Number(price));
    if (!n || n <= 0) return;
    onPrice(o, n);
    setEdit(false); setPrice('');
  };
  const askPayout = () => {
    if (!confirmPay) { setConfirmPay(true); setTimeout(() => setConfirmPay(false), 4000); return; }
    setConfirmPay(false);
    onPayout(o);
  };
  return (
    <div style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 16px" + (o.status === 0 ? ";opacity:.55" : ""))}>
      <div style={css("display:flex;align-items:center;gap:8px;flex-wrap:wrap")}>
        <span style={css("font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600")}>{o.id}</span>
        <Badge status={o.status} labels={stepsOf(o)}/>
        <span style={css("font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:99px;" + (o.pickup ? "background:var(--goldBg);color:var(--gold)" : "background:var(--accSoft);color:var(--acc)"))}>{o.pickup ? '🏪 ลูกค้ามารับเอง' : '🛵 MORE PRINT ส่ง'}</span>
        {priced && (o.payout_at
          ? <span style={css("font-size:10.5px;font-weight:700;color:#0b7285;background:#e3fafc;padding:2px 9px;border-radius:99px")}>💸 โอนให้ร้านแล้ว</span>
          : o.status !== 0 && <span style={css("font-size:10.5px;font-weight:700;color:var(--gold);background:var(--goldBg);padding:2px 9px;border-radius:99px")}>⏳ ค้างโอน</span>)}
      </div>
      <div style={css("margin-top:5px;font-size:12px;color:var(--sub)")}>
        {fmtWhen(o.created_at)} · คุณ{o.customer_fname} {o.customer_lname || ''}{isOwner && o.customer_phone ? <span> · <a href={'tel:' + String(o.customer_phone || '').replace(/[^0-9+]/g, '')}>{o.customer_phone}</a></span> : null}
      </div>
      <div style={css("margin-top:4px;font-size:12px;font-weight:600")}>✨ {o.paper} · {o.sides === 2 ? 'หน้า-หลัง' : 'หน้าเดียว'} · {o.copies || 1} ชุด <span style={css("color:var(--sub);font-weight:400")}>· ค่าส่ง {baht((o.delivery_cost || 0) + (o.night_fee || 0))} ({isOwner ? 'ของเรา ไม่คิดคอม' : 'MORE PRINT จัดส่งเอง'})</span></div>
      {(o.files || []).length > 0 && (
        <div style={css("margin-top:8px;display:flex;flex-direction:column;gap:5px")}>
          {(o.files || []).map((f, i) => (
            <div key={i} style={css("display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:9px;padding:7px 10px")}>
              <span>{f.drive_url ? '🗂️' : '📄'}</span>
              <span style={css("flex:1;min-width:0;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap")}>{f.name}</span>
              <span style={css("font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sub);flex:none")}>{f.pages} หน้า</span>
              {f.drive_url
                ? <a href={f.drive_url} target="_blank" rel="noreferrer" style={css("flex:none;font-size:11px;font-weight:700;color:var(--gold);text-decoration:none;background:var(--goldBg);padding:3px 9px;border-radius:8px")}>⬇ ไฟล์ใหญ่</a>
                : fileUrl(f.path)
                  ? <a href={fileUrl(f.path)} target="_blank" rel="noreferrer" style={css("flex:none;font-size:11px;font-weight:700;color:var(--acc);text-decoration:none;background:var(--accSoft);padding:3px 9px;border-radius:8px")}>⬇ เปิดไฟล์</a>
                  : <span style={css("flex:none;font-size:10.5px;color:var(--sub)")}>—</span>}
            </div>
          ))}
        </div>
      )}
      {priced && !edit ? (
        <div style={css("margin-top:10px;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:4px")}>
          <div style={css("display:flex;justify-content:space-between")}><span style={css("color:var(--sub)")}>ค่างานปริ้น (100%)</span><span style={css("font-family:'IBM Plex Mono',monospace;font-weight:600")}>{baht(jobValue(o))} {isOwner && <span onClick={() => { setEdit(true); setPrice(String(jobValue(o))); }} style={css("color:var(--acc);font-size:11px;cursor:pointer;text-decoration:underline")}>แก้</span>}</span></div>
          <div style={css("display:flex;justify-content:space-between")}><span style={css("color:var(--sub)")}>ค่าคอม MORE PRINT ({Math.round(COMMISSION * 100)}%)</span><span style={css("font-family:'IBM Plex Mono',monospace;color:var(--acc);font-weight:600")}>−{baht(commOf(o))}</span></div>
          <div style={css("display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:5px;font-weight:700")}><span>{isOwner ? 'ยอดโอนให้ร้านพาร์ทเนอร์' : 'ส่วนของร้านคุณ'}</span><span style={css("font-family:'IBM Plex Mono',monospace;color:var(--gold)")}>{baht(partnerOf(o))}</span></div>
          {isOwner && o.status !== 0 && !o.payout_at && (
            payoutReady
              ? <button onClick={askPayout} style={css("margin-top:6px;height:38px;border:none;border-radius:10px;background:" + (confirmPay ? "#0b7285" : "var(--gold)") + ";color:#fff;font-size:12.5px;font-weight:700;cursor:pointer")}>{confirmPay ? 'กดอีกครั้งเพื่อยืนยัน — โอนเงินแล้วจริงๆ' : '💸 โอนเงินให้ร้านแล้ว — บันทึก'}</button>
              : <div style={css("margin-top:6px;font-size:11px;color:#c92a2a;font-weight:600")}>⚠️ รัน SQL เพิ่มคอลัมน์ payout_at ก่อน จึงจะบันทึกการโอนได้</div>
          )}
          {o.payout_at && <div style={css("font-size:11px;color:#0b7285")}>บันทึกการโอนเมื่อ {fmtWhen(o.payout_at)}</div>}
        </div>
      ) : isOwner ? (
        <div style={css("margin-top:10px;display:flex;gap:8px;align-items:center")}>
          <input value={price} onChange={e => setPrice(e.target.value.replace(/[^0-9]/g, ''))} onKeyDown={e => e.key === 'Enter' && save()} placeholder="ราคางานที่ตกลงกับลูกค้า (บาท)" inputMode="numeric"
            style={css("flex:1;box-sizing:border-box;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:13px;outline:none")}/>
          <button onClick={save} disabled={!price} style={css("height:40px;padding:0 16px;border:none;border-radius:10px;background:" + (price ? "var(--acc)" : "#c8b8f5") + ";color:#fff;font-size:12.5px;font-weight:700;cursor:pointer")}>บันทึกราคา</button>
          {edit && <button onClick={() => { setEdit(false); setPrice(''); }} style={css("height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font-size:12.5px;cursor:pointer")}>ยกเลิก</button>}
        </div>
      ) : (
        <div style={css("margin-top:10px;background:var(--goldBg);border-radius:10px;padding:9px 12px;font-size:11.5px;color:var(--gold);font-weight:600")}>⏳ MORE PRINT กำลังตกลงราคากับลูกค้า — เดี๋ยวยอดจะขึ้นตรงนี้ครับ</div>
      )}
      {o.status === 0 && o.cancel_reason && <div style={css("margin-top:8px;font-size:11.5px;color:#c92a2a")}>เหตุผลที่ยกเลิก: {o.cancel_reason}</div>}
      {!isOwner && o.status > 0 && o.status < 4 && (
        (o.status < 3 || o.pickup)
          ? <button onClick={() => onPartnerAdvance(o)} style={css("margin-top:10px;width:100%;height:42px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer")}>→ อัปเดตสถานะเป็น "{stepsOf(o)[Math.min(o.status, 3)]}"</button>
          : <div style={css("margin-top:10px;background:var(--accSoft);border-radius:10px;padding:9px 12px;font-size:11.5px;color:var(--acc);font-weight:600")}>📦 งานอยู่ระหว่างจัดส่งโดย MORE PRINT — สถานะสุดท้ายทีมส่งเป็นคนกด</div>
      )}
      {isOwner && o.status > 0 && o.status < 4 && (
        <div style={css("margin-top:10px;display:flex;flex-direction:column;gap:8px")}>
          <div style={css("display:flex;gap:8px")}>
            <button onClick={() => onAdvance(o)} style={css("flex:1;height:40px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer")}>→ อัปเดตเป็น "{stepsOf(o)[Math.min(o.status, 3)]}"</button>
            <button onClick={() => setCancelOpen(v => !v)} style={css("height:40px;padding:0 12px;border:1px solid #ffa8a8;border-radius:10px;background:none;color:#c92a2a;font-size:12px;font-weight:600;cursor:pointer")}>✕ ยกเลิก</button>
          </div>
          {cancelOpen && (
            <div style={css("display:flex;gap:8px")}>
              <input value={reason} onChange={e => setReason(e.target.value)} placeholder="เหตุผลที่ยกเลิก (ลูกค้าจะเห็นข้อความนี้)"
                style={css("flex:1;box-sizing:border-box;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);padding:0 12px;font-size:12px;outline:none")}/>
              <button onClick={() => { if (reason.trim()) { onCancel(o, reason.trim()); setCancelOpen(false); setReason(''); } }} disabled={!reason.trim()}
                style={css("height:38px;padding:0 12px;border:none;border-radius:10px;background:" + (reason.trim() ? "#c92a2a" : "#f1b5b5") + ";color:#fff;font-size:12px;font-weight:700;cursor:pointer")}>ยืนยันยกเลิก</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function Dash({ role }){
  const isOwner = role === 'owner'; // พาร์ทเนอร์ = ดูอย่างเดียว (ฐานข้อมูลก็บังคับไว้อีกชั้น)
  const [orders, setOrders] = React.useState(DB ? [] : DEMO);
  const [payoutReady, setPayoutReady] = React.useState(!DB);
  const [loading, setLoading] = React.useState(!!DB);

  const load = React.useCallback(async () => {
    if (!DB) return;
    setLoading(true);
    const cols = 'id,created_at,status,times,cancel_reason,customer_fname,customer_lname,customer_phone,paper,sides,copies,print_cost,bind_cost,delivery_cost,night_fee,total,files';
    let r = await DB.from('orders').select(cols + ',payout_at,pickup').eq('ptype', 'pro').order('created_at', { ascending: false }).limit(2000);
    if (r.error) {
      // ยังไม่มีคอลัมน์ payout_at — โหลดแบบไม่มีไปก่อน (ตั้งราคายังใช้ได้ แต่บันทึกการโอนยังไม่ได้)
      r = await DB.from('orders').select(cols).eq('ptype', 'pro').order('created_at', { ascending: false }).limit(2000);
      setPayoutReady(false);
    } else setPayoutReady(true);
    if (!r.error && r.data) setOrders(r.data);
    setLoading(false);
  }, []);
  React.useEffect(() => { load(); }, [load]);

  const setPrice = async (o, n) => {
    const total = n + (o.bind_cost || 0) + (o.delivery_cost || 0) + (o.night_fee || 0);
    if (DB) { await DB.from('orders').update({ print_cost: n, total }).eq('id', o.id); await load(); }
    else setOrders(l => l.map(x => x.id === o.id ? { ...x, print_cost: n, total } : x));
  };
  const markPayout = async (o) => {
    const ts = new Date().toISOString();
    if (DB) { await DB.from('orders').update({ payout_at: ts }).eq('id', o.id); await load(); }
    else setOrders(l => l.map(x => x.id === o.id ? { ...x, payout_at: ts } : x));
  };
  // สถานะงาน Pro จัดการที่นี่ (หลังบ้านหลักไม่แสดงงาน Pro แล้ว) — ลูกค้าเห็นสถานะวิ่งเหมือนเดิม
  const advance = async (o) => {
    const next = Math.min((o.status || 1) + 1, 4);
    const times = (o.times || ['', '', '', '']).slice();
    times[next - 1] = fmtTime(new Date());
    if (DB) { await DB.from('orders').update({ status: next, times }).eq('id', o.id); await load(); }
    else setOrders(l => l.map(x => x.id === o.id ? { ...x, status: next, times } : x));
  };
  const cancelOrder = async (o, reason) => {
    if (DB) { await DB.from('orders').update({ status: 0, cancel_reason: reason }).eq('id', o.id); await load(); }
    else setOrders(l => l.map(x => x.id === o.id ? { ...x, status: 0, cancel_reason: reason } : x));
  };
  // ร้านพาร์ทเนอร์กดอัปเดตสถานะเอง — ผ่านฟังก์ชันปลอดภัยฝั่งฐานข้อมูล (partner_advance)
  const partnerAdvance = async (o) => {
    if (!DB) { // โหมดตัวอย่าง
      setOrders(l => l.map(x => x.id === o.id ? { ...x, status: Math.min(x.status + 1, 4) } : x));
      return;
    }
    const { data, error } = await DB.rpc('partner_advance', { oid: o.id });
    if (error || !data) { alert('อัปเดตไม่สำเร็จ — เจ้าของร้าน MORE PRINT อาจยังไม่ได้เปิดระบบ (รัน SQL partner_advance) หรือขั้นนี้เป็นหน้าที่ของ MORE PRINT'); return; }
    await load();
  };

  // ── สถิติราย วัน/สัปดาห์/เดือน/ปี (ไม่รวมออเดอร์ที่ยกเลิก) ──
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const week = new Date(today); week.setDate(today.getDate() - ((today.getDay() + 6) % 7)); // จันทร์นี้
  const month = new Date(now.getFullYear(), now.getMonth(), 1);
  const year = new Date(now.getFullYear(), 0, 1);
  const valid = orders.filter(o => o.status !== 0);
  const agg = (since) => {
    const rows = valid.filter(o => new Date(o.created_at) >= since);
    const job = rows.reduce((a, o) => a + jobValue(o), 0);
    return { n: rows.length, job, comm: job * COMMISSION, partner: job * (1 - COMMISSION), unpriced: rows.filter(o => jobValue(o) === 0).length };
  };
  const periods = [['วันนี้', agg(today)], ['สัปดาห์นี้', agg(week)], ['เดือนนี้', agg(month)], ['ปีนี้', agg(year)]];
  const owed = valid.filter(o => jobValue(o) > 0 && !o.payout_at);
  const owedSum = owed.reduce((a, o) => a + partnerOf(o), 0);
  // บันทึกข้อมูลออเดอร์รายเดือน (ดูย้อนหลังได้ตลอด — แถวออเดอร์เก็บถาวรในฐานข้อมูล)
  const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const byM = {};
  valid.forEach(o => {
    const d = new Date(o.created_at);
    const k = d.getFullYear() * 100 + d.getMonth();
    if (!byM[k]) byM[k] = { y: d.getFullYear(), m: d.getMonth(), n: 0, job: 0 };
    byM[k].n++; byM[k].job += jobValue(o);
  });
  const monthRows = Object.keys(byM).sort((a, b) => b - a).map(k => byM[k]);
  // ลูกค้างาน Pro
  const custMap = {};
  valid.forEach(o => {
    const k = o.customer_phone || (o.customer_fname + ' ' + (o.customer_lname || ''));
    if (!custMap[k]) custMap[k] = { name: (o.customer_fname + ' ' + (o.customer_lname || '')).trim(), phone: o.customer_phone || '', n: 0, spend: 0 };
    custMap[k].n++; custMap[k].spend += jobValue(o);
  });
  const customers = Object.values(custMap).sort((a, b) => b.spend - a.spend);

  return (
    <div style={css("min-height:100vh;background:var(--bg)")}>
      <div style={css("background:#1c1533;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10")}>
        <div style={css("font-size:22px")}>✨</div>
        <div style={css("flex:1;min-width:0")}>
          <div style={css("font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;letter-spacing:1px")}><span style={css("color:#b197fc")}>MORE</span> PRINT <span style={css("color:#b197fc")}>PRO</span></div>
          <div style={css("font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:2px;color:#b197fc")}>{isOwner ? 'PARTNER FINANCE · คอม ' + Math.round(COMMISSION * 100) + '%' : 'PARTNER VIEW · ส่วนแบ่งร้านคุณ ' + Math.round((1 - COMMISSION) * 100) + '%'}</div>
        </div>
        {!DB && <span style={css("font-size:10px;font-weight:700;background:#f59f00;color:#1c1533;padding:3px 10px;border-radius:99px")}>DEMO</span>}
        {isOwner && <a href="commission.html" style={css("color:#ffd43b;font-size:11.5px;font-weight:700;text-decoration:none")}>💰 ค่าคอม</a>}
        {isOwner && <a href="admin.html" style={css("color:#b197fc;font-size:11.5px;font-weight:700;text-decoration:none")}>← หลังบ้านหลัก</a>}
        <button onClick={load} style={css("height:32px;padding:0 12px;border:1px solid #4c3d80;border-radius:9px;background:none;color:#fff;font-size:11.5px;cursor:pointer")}>{loading ? '…' : '⟳ รีเฟรช'}</button>
        {DB && <button onClick={() => DB.auth.signOut().then(() => location.reload())} style={css("height:32px;padding:0 10px;border:1px solid #4c3d80;border-radius:9px;background:none;color:#b197fc;font-size:11px;cursor:pointer")}>ออก</button>}
      </div>

      <div style={css("padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto")}>
        {!DB && <div style={css("background:var(--goldBg);border:1px solid #f0dfa6;border-radius:12px;padding:10px 14px;font-size:12px;color:var(--gold);line-height:1.6")}>⚠️ โหมดตัวอย่าง — ข้อมูลด้านล่างเป็นเพียงตัวอย่าง</div>}

        {/* สถิติ 4 ช่วงเวลา */}
        <div style={css("display:grid;grid-template-columns:1fr 1fr;gap:10px")}>
          {periods.map(([label, a], i) => (
            <div key={i} style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)")}>
              <div style={css("font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.5px")}>{label}</div>
              <div style={css("margin-top:4px;font-size:20px;font-weight:800;font-family:'IBM Plex Mono',monospace;color:var(--acc)")}>{baht(a.job)}</div>
              <div style={css("font-size:11px;color:var(--sub)")}>{a.n} ออเดอร์{a.unpriced ? ' (รอตั้งราคา ' + a.unpriced + ')' : ''}</div>
              <div style={css("margin-top:6px;font-size:11px;line-height:1.7")}>
                <div style={css("display:flex;justify-content:space-between")}><span style={css("color:var(--sub)")}>{isOwner ? 'คอมเรา' : 'คอม MORE PRINT'} {Math.round(COMMISSION * 100)}%</span><span style={css("font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--acc)")}>{baht(a.comm)}</span></div>
                <div style={css("display:flex;justify-content:space-between")}><span style={css("color:var(--sub)")}>{isOwner ? 'ส่งร้านพาร์ทเนอร์' : 'ส่วนของร้านคุณ'}</span><span style={css("font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--gold)")}>{baht(a.partner)}</span></div>
              </div>
            </div>
          ))}
        </div>

        {/* ยอดค้างโอน */}
        <div style={css("background:var(--goldBg);border:1.5px solid #f0c36d;border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:12px")}>
          <div style={css("font-size:26px")}>💸</div>
          <div style={css("flex:1")}>
            <div style={css("font-size:12px;font-weight:700;color:var(--gold)")}>{isOwner ? 'ยอดค้างโอนให้ร้านพาร์ทเนอร์ (หักคอมแล้ว)' : 'ยอดที่ MORE PRINT เตรียมโอนให้ร้านคุณ (หักคอมแล้ว)'}</div>
            <div style={css("font-size:22px;font-weight:800;font-family:'IBM Plex Mono',monospace;color:var(--gold)")}>{baht(owedSum)}</div>
            <div style={css("font-size:11px;color:var(--gold)")}>จาก {owed.length} ออเดอร์ที่ตั้งราคาแล้วและยังไม่กดบันทึกการโอน</div>
          </div>
        </div>

        {/* บันทึกข้อมูลออเดอร์รายเดือน */}
        <div style={css("background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow-x:auto")}>
          <div style={css("padding:12px 16px 0;font-size:12.5px;font-weight:700;color:var(--sub)")}>📊 บันทึกออเดอร์รายเดือน</div>
          <table style={css("border-collapse:collapse;width:100%;margin-top:6px")}>
            <thead><tr>
              {['เดือน', 'ออเดอร์', 'ยอดงานรวม', isOwner ? 'คอมเรา' : 'ส่วนของร้านคุณ'].map((h, i) => (
                <th key={i} style={css("text-align:" + (i < 2 ? "left" : "right") + ";font-size:10.5px;color:var(--sub);font-weight:600;padding:6px 14px;border-bottom:1px solid var(--line);white-space:nowrap")}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {monthRows.length === 0 && <tr><td colSpan="4" style={css("padding:14px;text-align:center;font-size:12px;color:var(--sub)")}>ยังไม่มีออเดอร์</td></tr>}
              {monthRows.map((m, i) => (
                <tr key={i}>
                  <td style={css("padding:7px 14px;font-size:12px;font-weight:700;white-space:nowrap")}>{TH_M[m.m]} {(m.y + 543) % 100}</td>
                  <td style={css("padding:7px 14px;font-size:12px;color:var(--sub)")}>{m.n}</td>
                  <td style={css("padding:7px 14px;font-size:12px;text-align:right;font-family:'IBM Plex Mono',monospace")}>{baht(m.job)}</td>
                  <td style={css("padding:7px 14px;font-size:12px;text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:700;color:" + (isOwner ? "var(--acc)" : "var(--gold)"))}>{baht(m.job * (isOwner ? COMMISSION : 1 - COMMISSION))}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={css("padding:6px 16px 12px")}></div>
        </div>

        {/* รายการออเดอร์ Pro */}
        <div style={css("font-size:12.5px;font-weight:700;color:var(--sub)")}>📋 ออเดอร์งาน PRO ทั้งหมด ({orders.length})</div>
        {loading && <div style={css("text-align:center;color:var(--sub);font-size:13px;padding:16px 0")}>กำลังโหลด…</div>}
        {!loading && orders.length === 0 && <div style={css("text-align:center;color:var(--sub);font-size:13px;padding:24px 0")}>ยังไม่มีออเดอร์งาน Pro เข้ามา</div>}
        {orders.map(o => <ProOrder key={o.id} o={o} isOwner={isOwner} payoutReady={payoutReady} onPrice={setPrice} onPayout={markPayout} onAdvance={advance} onCancel={cancelOrder} onPartnerAdvance={partnerAdvance}/>)}

        {/* ลูกค้างาน Pro — เจ้าของเห็นคนเดียว (ข้อมูลลูกค้าไม่เปิดให้พาร์ทเนอร์) */}
        {isOwner && customers.length > 0 && <div style={css("font-size:12.5px;font-weight:700;color:var(--sub);margin-top:6px")}>👥 ลูกค้างาน PRO ({customers.length})</div>}
        {isOwner && customers.map((cst, i) => (
          <div key={i} style={css("background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)")}>
            <div style={css("width:36px;height:36px;border-radius:50%;background:var(--accSoft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none")}>{(cst.name || '?').trim().charAt(0)}</div>
            <div style={css("flex:1;min-width:0")}>
              <div style={css("font-size:13px;font-weight:700")}>คุณ{cst.name || 'ไม่ระบุชื่อ'}</div>
              <div style={css("font-size:11px;color:var(--sub)")}>{cst.phone}</div>
            </div>
            <div style={css("text-align:right")}>
              <div style={css("font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:var(--acc)")}>{baht(cst.spend)}</div>
              <div style={css("font-size:10.5px;color:var(--sub)")}>{cst.n} ออเดอร์</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [role, setRole] = React.useState(null); // 'owner' | 'partner'
  if (!role) return <ProLogin onOk={(r) => setRole(r)}/>;
  return <Dash role={role}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
